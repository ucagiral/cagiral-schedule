name: Cell stocks daily layout export

# Rebuilds the freezer's layout every morning and commits it, in the three shapes Umut
# asked for: an Excel workbook with a grid per box, a printable PDF map for the freezer
# door, and a one-row-per-box summary.
#
# 05:00 UTC, which is 08:00 in Istanbul: build, commit if anything changed, and mail.
#
# The file names never change. A dated file would mean a new link every morning and a
# directory nobody prunes; git already keeps every previous morning.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      skip_mail:
        description: "Build and commit, but do not send the mail"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cellstocks-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # xlsx.js needs CompressionStream, which node has had since 18. Pinned to 20 like
      # the rest of this repository's tooling.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build the layout exports
        run: node tools/cellstocks-export.mjs

      # Only commits when something actually changed. Most mornings nothing has: the
      # freezer is the same as it was, and a commit a day saying so would bury the
      # mornings when it is not.
      - name: Commit them if they changed
        run: |
          set -euo pipefail
          if git diff --quiet -- cellstocks/exports; then
            echo "the layout is unchanged since the last export -- nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cellstocks/exports
          git commit -m "Daily freezer layout export"
          # The app commits to main from people's phones all day; a push that raced one
          # of those saves would fail on a stale ref rather than lose it. Rebase and
          # retry rather than force anything.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) -- rebasing onto the newer main"
            git pull --rebase origin main
          done
          echo "::error::could not push the layout export after three attempts"
          exit 1

      # The mailer speaks SMTP itself (tools/cellstocks-mail.mjs) rather than going
      # through a third-party action: whatever sends this is handed the mailbox's app
      # password on every run, and this repository is public.
      #
      # Skipped, not failed, when the secret is not set -- the same way the worker deploy
      # skips without its token, so a fork and a lab that has not set this up yet both
      # still pass. It exits 0 by itself when nobody is on the recipients list.
      - name: Check for the mail credentials
        id: mail
        run: echo "configured=${{ secrets.MAIL_PASSWORD != '' && secrets.MAIL_USER != '' }}" >> "$GITHUB_OUTPUT"

      - name: Mail today's layout
        if: steps.mail.outputs.configured == 'true' && inputs.skip_mail != true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: node tools/cellstocks-mail.mjs

      - name: No mail credentials configured
        if: steps.mail.outputs.configured != 'true'
        run: |
          echo "::warning::MAIL_USER / MAIL_PASSWORD are not set, so today's layout was built and committed but not mailed."
          echo "::warning::Add them under Settings -> Secrets and variables -> Actions. MAIL_PASSWORD is a Gmail app password, not the account password."
