name: Cell stocks daily layout export

# Rebuilds the freezer's layout every morning and commits it, mails it, and mirrors
# grid-roster.xlsx to Google Drive: an Excel workbook with a grid per box, a printable PDF
# map for the freezer door, a one-row-per-box summary, a per-member roster, and a
# per-member/every-slot grid that also goes to a link-stable Drive file.
#
# This used to be a single "0 5 * * *" -- 08:00 in Istanbul -- and the very first morning
# it was due, nothing ran at all. The top of the hour is the most contended slot on
# GitHub's shared scheduler, and GitHub's own docs say runs there are delayed and may be
# dropped outright. A fixed delivery time is the wrong thing to hang on it.
#
# So the cron is a POLL now, every half hour, and tools/cellstocks-mail.mjs decides whether
# this particular poll is the day's send (shouldSendNow). Three things follow:
#
# GitHub's own scheduler then missed three consecutive polls of THAT cron too (08:35,
# 09:05, 09:35 on 7 Sep), and this repository has never had a single schedule-event run
# with either cron. So the schedule above is no longer trusted on its own: a Claude
# Routine dispatches this workflow with force=false, which runs the same --check and lets
# the app's own sendAt decide. Whichever arrives first sends; last-mailed.json stops the
# other from sending a second copy. The cron stays because if it ever does start firing
# it is the cheaper of the two.
#
#   * a delayed or dropped poll is covered by the next one -- a skipped morning heals
#     itself instead of being silently lost;
#   * the send time is data, in cellstocks/exports/recipients.json, which an admin edits
#     from inside the app. It is deliberately NOT a literal here: the app can write that
#     one file and must never be able to write a workflow;
#   * a poll that is not the send does nothing and costs about twenty seconds.
#
# The file names never change. A dated file would mean a new link every morning and a
# directory nobody prunes; git already keeps every previous morning.
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      skip_mail:
        description: "Build and commit, but do not send the mail"
        type: boolean
        default: false
      # A person pressing the button means "send now", so this defaults to true.
      # An automated caller standing in for the cron passes false, so the app's own
      # sendAt still decides and today's mail cannot go out twice.
      force:
        description: "Send now, ignoring the configured time and today's marker"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cellstocks-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # xlsx.js needs CompressionStream, which node has had since 18. Pinned to 20 like
      # the rest of this repository's tooling.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Is this poll the day's send? The rule lives in tools/cellstocks-mail.mjs, once,
      # and this asks it -- so the YAML never restates half of it. On a schedule it is
      # false for 47 of the 48 daily polls, and everything below is skipped in seconds.
      #
      # Pressing "Run workflow" is always a send: somebody has already decided.
      - name: Is this poll today's send?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            echo "run by hand -- building and sending now"
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            node tools/cellstocks-mail.mjs --check
          fi

      - name: Build the layout exports
        if: steps.due.outputs.send == 'true'
        run: node tools/cellstocks-export.mjs

      # Mirrors grid-roster.xlsx to a fixed file in Umut's Google Drive, view-only for
      # anyone with the link. Runs before the commit below so drive-file-id.txt (the one
      # piece of state this writes) lands in the same commit as the export it points at --
      # the same reason last-mailed.json is written before its own commit step.
      #
      # Skipped, not failed, when the two secrets are not set: tools/cellstocks-drive-upload.mjs
      # says so and exits 0, the same way the mailer skips without MAIL_USER/MAIL_PASSWORD.
      - name: Mirror grid-roster.xlsx to Google Drive
        if: steps.due.outputs.send == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node tools/cellstocks-drive-upload.mjs

      # Only commits when something actually changed. Most mornings nothing has: the
      # freezer is the same as it was, and a commit a day saying so would bury the
      # mornings when it is not.
      - name: Commit them if they changed
        if: steps.due.outputs.send == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- cellstocks/exports; then
            echo "the layout is unchanged since the last export -- nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cellstocks/exports
          git commit -m "Daily freezer layout export"
          # The app commits to main from people's phones all day; a push that raced one
          # of those saves would fail on a stale ref rather than lose it. Rebase and
          # retry rather than force anything.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) -- rebasing onto the newer main"
            git pull --rebase origin main
          done
          echo "::error::could not push the layout export after three attempts"
          exit 1

      # The mailer speaks SMTP itself (tools/cellstocks-mail.mjs) rather than going
      # through a third-party action: whatever sends this is handed the mailbox's app
      # password on every run, and this repository is public.
      #
      # Skipped, not failed, when the secret is not set -- the same way the worker deploy
      # skips without its token, so a fork and a lab that has not set this up yet both
      # still pass. It exits 0 by itself when nobody is on the recipients list.
      - name: Check for the mail credentials
        id: mail
        if: steps.due.outputs.send == 'true'
        run: echo "configured=${{ secrets.MAIL_PASSWORD != '' && secrets.MAIL_USER != '' }}" >> "$GITHUB_OUTPUT"

      - name: Mail today's layout
        if: steps.due.outputs.send == 'true' && steps.mail.outputs.configured == 'true' && inputs.skip_mail != true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        # --force only when a human pressed the button. A dispatch with force=false has
        # already been through --check above and must not re-send if it declined.
        run: |
          node tools/cellstocks-mail.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.force != false && '--force' || '' }}

      # Which day's mail has gone is the one thing this job has to remember, so the next
      # poll does not send a second copy. cellstocks-mail.mjs writes it only after the
      # server accepted the message -- a failed send leaves it alone, and the next poll
      # tries again. Only this job writes it; the app cannot reach the path, so an admin
      # editing the recipient list cannot race it.
      - name: Remember that today's mail went out
        if: steps.due.outputs.send == 'true' && steps.mail.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # `git status --porcelain`, not `git diff`: the very first time this runs the
          # marker does not exist in git yet, and `git diff` does not see an untracked
          # file, so it reported "nothing was sent" on the one run where recording
          # mattered most. The mail had gone out (the log above says so) and nothing was
          # written, which means every later poll that day sends another copy -- the
          # exact failure the marker exists to prevent. Reproduced in a scratch repo
          # before this line was changed, and covered by the mailer self-test.
          if [ -z "$(git status --porcelain -- cellstocks/exports/last-mailed.json)" ]; then
            echo "nothing was sent this run -- nothing to record"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cellstocks/exports/last-mailed.json
          git commit -m "Daily freezer layout mailed"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) -- rebasing onto the newer main"
            git pull --rebase origin main
          done
          # Left unrecorded, the next poll half an hour from now sends a second copy.
          echo "::error::could not record that today's mail went out"
          exit 1

      - name: No mail credentials configured
        if: steps.due.outputs.send == 'true' && steps.mail.outputs.configured != 'true'
        run: |
          echo "::warning::MAIL_USER / MAIL_PASSWORD are not set, so today's layout was built and committed but not mailed."
          echo "::warning::Add them under Settings -> Secrets and variables -> Actions. MAIL_PASSWORD is a Gmail app password, not the account password."

      - name: No Drive credentials configured
        if: steps.due.outputs.send == 'true' && (secrets.GOOGLE_SERVICE_ACCOUNT_KEY == '' || secrets.GOOGLE_DRIVE_FOLDER_ID == '')
        run: |
          echo "::warning::GOOGLE_SERVICE_ACCOUNT_KEY / GOOGLE_DRIVE_FOLDER_ID are not set, so today's grid-roster.xlsx was not mirrored to Drive."
          echo "::warning::Add them under Settings -> Secrets and variables -> Actions -- see the PR description for setup steps."
