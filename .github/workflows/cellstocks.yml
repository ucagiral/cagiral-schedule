name: Cell stocks checks

# The rules that decide where a vial goes -- and the inventory they run against --
# live in cellstocks/. tools/cellstocks-selftest.mjs is the only thing that proves
# they still hold, so run it on every change to either rather than on trust.
#
# Same reasoning the loops workflow gives for its own offline checks: a regression
# should show up on the branch, not the first time somebody stands in front of an
# open freezer door.
#
# No dependencies, no network, no secrets: the suite is plain node against files in
# the repo, and it takes a couple of seconds.
#
# Branches are covered by the pull_request trigger and main by the push one. They
# do not overlap on purpose: with push unfiltered, every commit on a branch with an
# open PR ran this twice on the same commit -- once for the push, once for the PR --
# and the two runs cannot even cancel each other, because github.ref is
# refs/heads/<branch> for one and refs/pull/<n>/merge for the other.
on:
  push:
    branches: [main]
    paths:
      - cellstocks/**
      - cellstocks-worker/**
      - tools/cellstocks-selftest.mjs
      - tools/cellstocks-worker-selftest.mjs
      - .github/workflows/cellstocks.yml
  pull_request:
    paths:
      - cellstocks/**
      - cellstocks-worker/**
      - tools/cellstocks-selftest.mjs
      - tools/cellstocks-worker-selftest.mjs
      - .github/workflows/cellstocks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellstocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The engine reads and writes .xlsx through DecompressionStream and
      # CompressionStream, which node has had since 18. Pinned to 20 like the rest
      # of this repository's tooling.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Self-test
        run: node tools/cellstocks-selftest.mjs

      # The worker is plain fetch/Request/Response/crypto.subtle, no build step, so it runs
      # in node exactly like the browser-side engine above -- see cellstocks-worker/README.md.
      - name: Worker self-test
        run: node tools/cellstocks-worker-selftest.mjs

      # The inventory is the app's source of truth and the workbook is generated
      # from it. If the two ever disagree, the sheet somebody downloads is wrong,
      # so check rather than assume.
      #
      # Compares LOGICAL content -- sheet names and cell values after decompressing
      # both -- never raw compressed bytes. Those legitimately differ: the app saves
      # from whatever browser is on hand (Safari's CompressionStream on Umut's
      # phone), this step regenerates with Node's zlib in GitHub's runner, and
      # DEFLATE has many valid encodings of the same bytes -- different compressors
      # choose different ones for identical input. A byte-equality version of this
      # check first found that out here, on this very PR, on a workbook nothing had
      # touched: two 9x9 boxes' worth of rows read back byte-for-byte identical, only
      # the zlib stream around them differed.
      - name: The committed workbook still matches the inventory
        run: |
          node -e '
            const fs = require("fs");
            new Function(fs.readFileSync("cellstocks/xlsx.js", "utf8"))();
            new Function(fs.readFileSync("cellstocks/engine.js", "utf8"))();
            const E = globalThis.CellStocksEngine, X = globalThis.XlsxLite;
            const state = E.mergeDefaults(JSON.parse(fs.readFileSync("cellstocks/data/umut.json", "utf8")));
            const flatten = (wb) => wb.sheets.map((s) => [s.name, s.rows.map((r) => r.map((c) => (c ? c.value : null)))]);
            Promise.all([
              X.writeWorkbookAsync(E.vialsToSheets(state)).then(X.readWorkbook),
              X.readWorkbook(fs.readFileSync("cellstocks/data/umut.xlsx"))
            ]).then(([fresh, onDisk]) => {
              const a = JSON.stringify(flatten(fresh)), b = JSON.stringify(flatten(onDisk));
              if (a !== b) {
                console.error("cellstocks/data/umut.xlsx does not match cellstocks/data/umut.json.");
                console.error("Regenerate it — the app writes it on every save, so a content mismatch");
                console.error("means it was committed by hand or the generator changed.");
                process.exit(1);
              }
              console.log("workbook content matches the inventory (" + onDisk.sheets.length + " sheets)");
            }).catch((err) => { console.error(err); process.exit(1); });
          '
