name: Cell stocks checks

# The rules that decide where a vial goes -- and the inventory they run against --
# live in cellstocks/. tools/cellstocks-selftest.mjs is the only thing that proves
# they still hold, so run it on every change to either rather than on trust.
#
# Same reasoning the loops workflow gives for its own offline checks: a regression
# should show up on the branch, not the first time somebody stands in front of an
# open freezer door.
#
# No dependencies, no network, no secrets: the suite is plain node against files in
# the repo, and it takes a couple of seconds.
#
# Branches are covered by the pull_request trigger and main by the push one. They
# do not overlap on purpose: with push unfiltered, every commit on a branch with an
# open PR ran this twice on the same commit -- once for the push, once for the PR --
# and the two runs cannot even cancel each other, because github.ref is
# refs/heads/<branch> for one and refs/pull/<n>/merge for the other.
on:
  push:
    branches: [main]
    paths:
      - cellstocks/**
      - cellstocks-worker/**
      - tools/cellstocks-selftest.mjs
      - tools/cellstocks-worker-selftest.mjs
      - tools/cellstocks-export.mjs
      - tools/cellstocks-export-selftest.mjs
      - tools/cellstocks-mail.mjs
      - tools/cellstocks-mail-selftest.mjs
      - tools/cellstocks-merge-rules.mjs
      - tools/cellstocks-browser-test.mjs
      - tools/cellstocks-admin-browser-test.mjs
      - .github/workflows/cellstocks.yml
  pull_request:
    paths:
      - cellstocks/**
      - cellstocks-worker/**
      - tools/cellstocks-selftest.mjs
      - tools/cellstocks-worker-selftest.mjs
      - tools/cellstocks-export.mjs
      - tools/cellstocks-export-selftest.mjs
      - tools/cellstocks-mail.mjs
      - tools/cellstocks-mail-selftest.mjs
      - tools/cellstocks-merge-rules.mjs
      - tools/cellstocks-browser-test.mjs
      - tools/cellstocks-admin-browser-test.mjs
      - .github/workflows/cellstocks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellstocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    # Raised from 5 for the browser suite: the checks themselves take about half a
    # minute, but a cold chromium download on a slow runner is the outlier that would
    # have hit the old limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The engine reads and writes .xlsx through DecompressionStream and
      # CompressionStream, which node has had since 18. Pinned to 20 like the rest
      # of this repository's tooling.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Self-test
        run: node tools/cellstocks-selftest.mjs

      # The worker is plain fetch/Request/Response/crypto.subtle, no build step, so it runs
      # in node exactly like the browser-side engine above -- see cellstocks-worker/README.md.
      - name: Worker self-test
        run: node tools/cellstocks-worker-selftest.mjs

      # The daily layout export: builds it over a fixture freezer and reads all three
      # files back. Reading them back is the point -- an .xlsx no reader accepts and a
      # PDF with a wrong cross-reference table both "write successfully", and neither is
      # worth mailing anybody.
      - name: Layout export self-test
        run: node tools/cellstocks-export-selftest.mjs

      # The mailer, against a fake SMTP server written in the test: the MIME message is
      # read back part by part, and the conversation is driven over a real socket. A body
      # no client can open and an exchange that stalls on a multi-line reply both look
      # like "it sent" from the outside.
      - name: Mailer self-test
        run: node tools/cellstocks-mail-selftest.mjs

      # The browser suites drive the real app in a real Chromium: the login gate, the
      # Structure tree, the merged admin views, and the export card's recipients and send
      # time. They had never run here on any commit -- not even in the paths filter -- so
      # 123 checks existed only on whoever's laptop last ran them.
      #
      # Pinned, because a floating playwright would silently change the browser under a
      # suite whose whole job is to be believed.
      - name: Cache the Chromium download
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1

      - name: Install playwright and Chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # These fail rather than skip when the browser is missing (see the CI guard in each
      # file): a step that goes green whether the checks ran or not looks like coverage
      # and is not.
      - name: Browser checks
        run: node tools/cellstocks-browser-test.mjs

      - name: Admin browser checks
        run: node tools/cellstocks-admin-browser-test.mjs

      # The inventory is the app's source of truth and the workbook is generated
      # from it. If the two ever disagree, the sheet somebody downloads is wrong,
      # so check rather than assume.
      #
      # Compares LOGICAL content -- sheet names and cell values after decompressing
      # both -- never raw compressed bytes. Those legitimately differ: the app saves
      # from whatever browser is on hand (Safari's CompressionStream on Umut's
      # phone), this step regenerates with Node's zlib in GitHub's runner, and
      # DEFLATE has many valid encodings of the same bytes -- different compressors
      # choose different ones for identical input. A byte-equality version of this
      # check first found that out here, on this very PR, on a workbook nothing had
      # touched: two 9x9 boxes' worth of rows read back byte-for-byte identical, only
      # the zlib stream around them differed.
      - name: Every committed workbook still matches its inventory
        run: |
          node -e '
            const fs = require("fs");
            new Function(fs.readFileSync("cellstocks/xlsx.js", "utf8"))();
            new Function(fs.readFileSync("cellstocks/engine.js", "utf8"))();
            const E = globalThis.CellStocksEngine, X = globalThis.XlsxLite;
            // The freezer belongs to the whole lab now rather than to one account: a
            // member file holds only vials, so it is hydrated with the shared
            // cellstocks/lab-storage.json exactly the way the app does before anything
            // reads a location out of it.
            const lab = E.mergeStorageDefaults(JSON.parse(fs.readFileSync("cellstocks/lab-storage.json", "utf8")));
            // Same story for the classification rules, which moved out of each account
            // into one shared set: the vials sheet spells every facet out, so reading a
            // member file without them would compare against the built-in defaults and
            // report a mismatch on a workbook nobody had touched.
            const labRules = E.mergeRulesDefaults(
              fs.existsSync("cellstocks/lab-rules.json")
                ? JSON.parse(fs.readFileSync("cellstocks/lab-rules.json", "utf8")) : null);
            // Every account, not one named one. Naming umut here meant this step died
            // with ENOENT the first time that account was deleted from the admin panel,
            // reporting a missing file as a workbook mismatch.
            const flatten = (wb) => wb.sheets.map((s) => [s.name, s.rows.map((r) => r.map((c) => (c ? c.value : null)))]);
            const names = fs.readdirSync("cellstocks/data")
              .filter((f) => f.endsWith(".json"))
              .map((f) => f.replace(/\.json$/, ""))
              .filter((n) => fs.existsSync("cellstocks/data/" + n + ".xlsx"));
            (async () => {
              for (const name of names) {
                const own = E.mergeDefaults(JSON.parse(fs.readFileSync("cellstocks/data/" + name + ".json", "utf8")));
                const state = E.hydrateRules(E.hydrateStorage(own, lab, name), labRules);
                const fresh = await X.readWorkbook(await X.writeWorkbookAsync(E.vialsToSheets(state)));
                const onDisk = await X.readWorkbook(fs.readFileSync("cellstocks/data/" + name + ".xlsx"));
                if (JSON.stringify(flatten(fresh)) !== JSON.stringify(flatten(onDisk))) {
                  console.error("cellstocks/data/" + name + ".xlsx does not match cellstocks/data/" + name + ".json.");
                  console.error("Regenerate it - the app writes it on every save, so a content mismatch");
                  console.error("means it was committed by hand or the generator changed.");
                  process.exit(1);
                }
                console.log(name + ": workbook content matches the inventory (" + onDisk.sheets.length + " sheets)");
              }
              if (!names.length) console.log("no member inventories committed yet - nothing to compare");
            })().catch((err) => { console.error(err); process.exit(1); });
          '

  # Merging worker.js used to only run the self-test above -- the live Cloudflare Worker
  # stayed on whatever someone last deployed by hand with `wrangler deploy`. That's why the
  # cascade-delete fix (deleteUserFiles(), merged earlier) sat live-but-inert: the code was
  # right, it just was never pushed to Cloudflare. This job closes that gap for every future
  # worker change. Requires a CLOUDFLARE_API_TOKEN repository secret (Cloudflare dashboard ->
  # create a token scoped to Workers -> GitHub repo Settings -> Secrets and variables ->
  # Actions) -- skipped entirely if that secret isn't set, so this workflow still passes on a
  # fork or before that one-time setup happens.
  deploy-worker:
    needs: selftest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check for CLOUDFLARE_API_TOKEN
        id: check
        run: echo "has-token=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.has-token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cellstocks-worker

      - name: No deploy token configured
        if: steps.check.outputs.has-token != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so cellstocks-worker/worker.js was NOT deployed."
          echo "::warning::Add it under Settings -> Secrets and variables -> Actions, or run 'wrangler deploy' by hand from cellstocks-worker/."
