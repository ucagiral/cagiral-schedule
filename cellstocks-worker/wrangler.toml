# Cloudflare Worker config for the Cell Stocks backend. See README.md in this directory for
# the one-time setup (KV namespace, secrets, first deploy).
#
# Nothing in this file is secret. GITHUB_TOKEN and BOOTSTRAP_SECRET are set with
# `wrangler secret put`, which stores them on Cloudflare, not here.

name = "cellstocks-worker"
main = "worker.js"
compatibility_date = "2024-09-01"

# `wrangler kv namespace create CST_KV` prints the id to put here.
kv_namespaces = [
  { binding = "CST_KV", id = "790f6073ce2748ac950649def52dcb88" }
]

# The app itself, served from this same Worker. One origin for the page and the API
# means the address no longer carries a GitHub username, and every call the page makes
# is same-origin, so CORS never enters into it. Requests that match one of the API's own
# routes are handled by worker.js; everything else falls through to these files (see the
# end of handleRequest).
#
# A deploy that fails -- an older wrangler that does not understand this, say -- leaves
# the previously deployed Worker running, so the backend cannot be taken down by it.
[assets]
directory = "../cellstocks"
binding = "ASSETS"
# The Worker runs FIRST, for every request, and hands anything that is not one of its own
# routes to env.ASSETS itself (see the end of handleRequest). Without this, Cloudflare's
# asset router answers before worker.js ever runs -- and it answers the CORS preflight
# (OPTIONS /login) that a browser on the GitHub Pages copy sends before logging in. That
# preflight came back without the Access-Control-Allow-* headers, so the browser refused
# the real request and the login failed with a bare "Failed to fetch". Same-origin logins
# (the app served from here) never send a preflight, which is why only the Pages copy broke.
run_worker_first = true

[vars]
GITHUB_OWNER = "ucagiral"
GITHUB_REPO = "cagiral-schedule"
GITHUB_BRANCH = "main"
# Kept for the GitHub Pages address, which still works and is still where anyone with
# the old link lands. The Worker-hosted copy needs no entry here: it is same-origin.
ALLOWED_ORIGIN = "https://ucagiral.github.io"
