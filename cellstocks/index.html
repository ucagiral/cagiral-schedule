  // =====================================================================
  // Import
  // =====================================================================

  function openImport(){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    input.onchange = function(){ if (input.files && input.files[0]) startImport(input.files[0]); };
    input.click();
  }

  async function startImport(file){
    var wb;
    setStatus("Reading…", "saving");
    try {
      wb = await X.readWorkbook(await file.arrayBuffer());
    } catch(err){
      setStatus("Ready", "");
      showBanner("Couldn't read that file: " + esc(err.message));
      return;
    }
    setStatus("Ready", "");
    if (!wb.sheets.length){ showBanner("That workbook has no sheets."); return; }

    // Sheet picker. Everything is listed, nothing is chosen for you when there is
    // more than one -- this is somebody's whole lab in one file.
    $("dlgTitle").textContent = "Which sheet?";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", file.name + " has " + wb.sheets.length + " sheet" +
      (wb.sheets.length === 1 ? "" : "s") + ". Only one is imported."));
    wb.sheets.forEach(function(sh){
      var rows = sh.rows.filter(function(r){ return r && r.some(function(c){ return c && c.text; }); }).length;
      var b = el("button", null, sh.name + " — " + rows + " rows");
      b.style.width = "100%"; b.style.textAlign = "left"; b.style.marginBottom = "6px";
      b.disabled = !rows;
      b.onclick = function(){ mapColumns(file.name, sh); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function mapColumns(fileName, sheet){
    $("dlgTitle").textContent = "What is in each column?";
    var body = clear($("dlgBody"));
    var guesses = E.guessColumns(sheet.rows, 0, sheet.merges);
    var map = {};
    // A returning member's own confirmed layout (from the last time they imported)
    // takes priority over a fresh guess -- but it is still only ever a pre-selection
    // on the same screen that shows and lets them override it, never applied silently.
    var customColumns = {};   // colIndex -> field name, for columns mapped to "New"
    var saved = state.settings && state.settings.columnMap;
    var savedCustom = state.settings && state.settings.customColumns;
    var usedSaved = false;
    if (saved && Object.keys(saved).length){
      Object.keys(saved).forEach(function(role){
        if (typeof saved[role] === "number") { map[role] = saved[role]; usedSaved = true; }
      });
    }
    // A saved "New" column is remembered by its header text, since a re-imported
    // sheet's column order can shift -- unlike the known roles above, matching by
    // index alone would silently point a name at the wrong column next time.
    var savedCustomByHeader = {};
    if (savedCustom) Object.keys(savedCustom).forEach(function(h){ savedCustomByHeader[h] = savedCustom[h]; });
    guesses.forEach(function(g){ if (g.role !== "ignore" && map[g.role] === undefined) map[g.role] = g.index; });
    guesses.forEach(function(g){
      if (g.role !== "ignore") return;
      var h = g.header || "";
      if (h && savedCustomByHeader[h]) { customColumns[g.index] = savedCustomByHeader[h]; usedSaved = true; }
    });

    body.appendChild(el("p", "note",
      (usedSaved ? "Pre-filled from how you mapped your last import, plus a fresh guess for anything new. " : "Guessed from the headers and the first rows. ") +
      "A column filled by a formula shows the " +
      "formula, so a value that was calculated from another column can be mapped to its source " +
      "instead of imported as if it had been typed."));

    guesses.forEach(function(g){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, g.letter + (g.header ? " — " + g.header : " — (no header)")));
      var sample = [];
      var formula = null;
      for (var r = 1; r < Math.min(sheet.rows.length, 30) && sample.length < 3; r++){
        var c = (sheet.rows[r] || [])[g.index];
        if (!c) continue;
        if (!formula && c.formula) formula = c.formula;
        if (c.text) sample.push(c.text);
      }
      grow.appendChild(el("div", "sub", sample.join(" · ") || "(empty)"));
      if (formula){
        var f = el("div", "sub mono", formula.length > 90 ? formula.slice(0, 90) + "…" : formula);
        f.style.color = "var(--guess)";
        grow.appendChild(f);
      }
      row.appendChild(grow);

      var isCustom = customColumns[g.index] !== undefined;
      var sel = document.createElement("select");
      sel.style.width = "auto";
      E.ROLES.forEach(function(role){
        var o = document.createElement("option");
        o.value = role; o.textContent = role;
        o.selected = !isCustom && (map[role] === g.index || (role === "ignore" && Object.keys(map).every(function(k){ return map[k] !== g.index; })));
        sel.appendChild(o);
      });
      // Anything the guesser and the known roles above can't place still gets a real
      // home: "New" turns it into its own named field on the vial, rather than being
      // dropped or stuffed into notes.
      var newOpt = document.createElement("option");
      newOpt.value = "__new__"; newOpt.textContent = "New…";
      newOpt.selected = isCustom;
      sel.appendChild(newOpt);
      var customLabel = el("div", "sub");
      customLabel.style.display = isCustom ? "" : "none";
      customLabel.textContent = isCustom ? ("→ " + customColumns[g.index]) : "";
      sel.onchange = function(){
        Object.keys(map).forEach(function(k){ if (map[k] === g.index) delete map[k]; });
        delete customColumns[g.index];
        customLabel.style.display = "none";
        if (sel.value === "__new__"){
          var name = prompt("Name this field:", g.header || "");
          if (name && name.trim()){
            customColumns[g.index] = name.trim();
            customLabel.textContent = "→ " + name.trim();
            customLabel.style.display = "";
          } else {
            sel.value = "ignore";
          }
        } else if (sel.value !== "ignore") {
          map[sel.value] = g.index;
        }
      };
      row.appendChild(sel);
      row.appendChild(customLabel);
      body.appendChild(row);
    });

    var headerByIndex = {};
    guesses.forEach(function(g){ headerByIndex[g.index] = g.header || ""; });

    var foot = clear($("dlgFoot"));
    var next = el("button", "primary", "Look at what it found");
    next.onclick = function(){
      if (map.name === undefined || map.position === undefined){
        showBanner("At least a name column and a position column are needed.");
        return;
      }
      previewImport(fileName, sheet, map, customColumns, headerByIndex);
    };
    foot.appendChild(next);
    $("dlg").showModal();
  }

  function previewImport(fileName, sheet, map, customColumns, headerByIndex){
    var out = E.importSheet(sheet, {
      headerRow: 1, columns: map, rules: state.rules, customFlags: state.settings.customFlags,
      unitId: "u-f80", rackId: "r-1", unitName: "-80 °C Freezer", unitType: "freezer",
      childLabel: "Rack", rackName: "Rack 1",
      sourceName: fileName, idPrefix: "v", unnamedBoxName: "Unnamed box",
      customColumns: customColumns
    });
    var rep = out.report;

    $("dlgTitle").textContent = "Before anything is written";
    var body = clear($("dlgBody"));
    function line(text, bad){
      var p = el("p", "note", text);
      if (bad) p.style.color = "var(--bad)";
      body.appendChild(p);
    }
    line(rep.imported + " vials out of " + rep.rows + " rows, in " + rep.boxes.length + " boxes.");
    rep.boxes.forEach(function(b){ line("　" + b.name + " — " + b.rows + " × " + b.cols); });
    if (rep.dateQueue) line(rep.dateQueue + " dates can't be read unambiguously and will wait in Review.");
    if (rep.facetDiffs) line(rep.facetDiffs + " rows where the corrected rules disagree with the sheet.");
    if (rep.gaps.length) line(rep.gaps.length + " rows whose name no rule covers.");
    if (rep.uncalculated) line(rep.uncalculated + " cells hold a formula with no calculated result — " +
      "those come in empty. Reopen and save the file in Excel or Sheets first.", true);
    if (rep.collisions.length) line(rep.collisions.length + " rows want a slot another row already took; " +
      "they will be dropped.", true);
    if (rep.skipped.length) line(rep.skipped.length + " rows couldn't be placed (no name, or a position " +
      "outside their box) — they'll come in with no location, waiting in Review instead of being guessed.", true);
    rep.skipped.slice(0, 5).forEach(function(s){ line("　row " + s.row + ": " + (s.name || "(no name)") + " — " + s.why, true); });
    var errs = E.errorsOnly(rep.problems);
    if (errs.length) line(errs.length + " problems that would make the inventory wrong.", true);

    var warn = el("p", "note");
    warn.style.color = "var(--warn-text)";
    warn.textContent = "This replaces the whole inventory — all " + state.vials.length +
      " vials currently here, and the boxes they live in.";
    body.appendChild(warn);

    var foot = clear($("dlgFoot"));
    var go3 = el("button", "primary", "Replace the inventory");
    go3.disabled = !canWrite() || !!errs.length;

    // Dropping a row outright is exactly the kind of quiet data loss this app exists
    // to stop, so a real collision still has to be agreed to out loud. A row that
    // couldn't be placed is no longer dropped -- it comes in and waits in Review --
    // so it doesn't need the same "are you sure" gate, just the note above.
    var lost = rep.collisions.length;
    if (lost){
      var agree = el("label", "toggle");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.onchange = function(){ go3.disabled = !canWrite() || !!errs.length || !cb.checked; };
      agree.appendChild(cb);
      agree.appendChild(el("span", null, "I know " + lost + " row(s) will be thrown away — check the " +
        "column mapping first, especially which column holds the box name."));
      body.appendChild(agree);
      go3.disabled = true;
    }
    go3.onclick = function(){
      var keptRules = state.rules;
      state = E.mergeDefaults(out.state);
      state.rules = keptRules;
      state.settings.columnMap = map;
      if (customColumns && Object.keys(customColumns).length){
        var byHeader = {};
        Object.keys(customColumns).forEach(function(idx){
          var h = headerByIndex && headerByIndex[idx];
          if (h) byHeader[h] = customColumns[idx];
        });
        state.settings.customColumns = byHeader;
      }
      $("dlg").close();
      markDirty("Import " + rep.imported + " vials from " + fileName);
      renderAll();
    };
    foot.appendChild(go3);
    $("dlg").showModal();
  }

  // =====================================================================
  // Admin -- the only place admin ever actually writes to a member's file. Find,
  // Boxes, Review and Log are read-only for admin (see ADMIN_MERGED above); every real
  // change -- adding, editing or withdrawing a vial, approving a request, renaming a
  // user -- happens on this one screen instead, each action naming exactly whose file
  // it commits to.
  // =====================================================================

  function adminAuth(){ return { Authorization: "Bearer " + getWorkerToken() }; }

  async function adminCommit(user, jsonState, message){
    var xlsxBytes = await X.writeWorkbookAsync(E.vialsToSheets(jsonState));
    return workerFetch("/commit", {
      method:"POST", headers: adminAuth(),
      body: JSON.stringify({
        files: [
          { path: DATA_PREFIX + user.toLowerCase() + ".json", content: E.serialise(jsonState) },
          { path: DATA_PREFIX + user.toLowerCase() + ".xlsx", content: bytesToBase64(xlsxBytes), base64: true }
        ],
        message: message || ("Admin change for " + user)
      })
    });
  }

  // A member's file plus the lab's shared structure, which is what every screen expects
  // a state to be. Admin edits one member's vials through this; the structure itself is
  // edited on the Structure screen and committed separately (see commitLabStorage).
  async function adminFetchState(user){
    var resp = await fetch(rawURL(DATA_PREFIX + user.toLowerCase() + ".json"), { cache:"no-store" });
    var text = resp.ok ? await resp.text() : "{}";
    if (!(labStorage.units || []).length) labStorage = await fetchLabStorage();
    return E.hydrateStorage(E.mergeDefaults(JSON.parse(text)), labStorage, user);
  }

  var adminTab = "manage";
  var adminUsersCache = null;
  async function adminUsers(){
    if (adminUsersCache) return adminUsersCache;
    var body = await workerFetch("/admin/users", { headers: adminAuth() });
    adminUsersCache = body.users;
    return adminUsersCache;
  }

  function renderAdmin(){
    Array.prototype.forEach.call(document.querySelectorAll("#adminTabs button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-admintab") === adminTab);
    });
    ["manage", "structure", "users", "types", "history", "handoff"].forEach(function(t){
      $("admin-" + t).hidden = t !== adminTab;
    });
    if (adminTab === "manage") renderAdminManage();
    else if (adminTab === "structure") renderAdminStructure();
    else if (adminTab === "users") renderAdminUsers();
    else if (adminTab === "types") renderAdminTypes();
    else if (adminTab === "history") renderAdminHistory();
    else if (adminTab === "handoff") renderAdminHandoff();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#adminTabs button"), function(b){
    b.onclick = function(){ adminTab = b.getAttribute("data-admintab"); renderAdmin(); };
  });

  // ---- Manage a box: the one place admin actually freezes, edits or withdraws a vial,
  // always straight into the real member's own file. ----
  var manageView = { user:null, state:null, unitId:null, boxId:null };

  async function renderAdminManage(){
    var c = clear($("admin-manage"));
    var users = await adminUsers().catch(function(err){ c.appendChild(el("p","note",err.message)); return []; });
    var visible = users.filter(function(u){ return !u.hidden; });

    var userSel = document.createElement("select");
    userSel.appendChild(el("option", null, "Choose a member…"));
    visible.forEach(function(u){
      var o = document.createElement("option"); o.value = u.name; o.textContent = u.name;
      if (u.name === manageView.user) o.selected = true;
      userSel.appendChild(o);
    });
    userSel.onchange = async function(){
      manageView.user = userSel.value || null;
      manageView.state = null; manageView.unitId = null; manageView.boxId = null;
      renderAdminManage();
    };
    var f = el("div", "field"); f.appendChild(el("label", null, "Member")); f.appendChild(userSel);
    c.appendChild(f);

    if (!manageView.user) return;
    if (!manageView.state){
      c.appendChild(el("p", "note", "Loading " + manageView.user + "'s boxes…"));
      manageView.state = await adminFetchState(manageView.user);
      renderAdminManage();
      return;
    }

    var s = manageView.state;
    var units = s.storage.units || [];
    if (!units.length){
      c.appendChild(el("p", "note", manageView.user + " has no freezer set up yet."));
    } else {
      if (!manageView.unitId || !E.findUnit(s, manageView.unitId)) manageView.unitId = units[0].id;
      var unitSel = document.createElement("select");
      units.forEach(function(u){
        var o = document.createElement("option"); o.value = u.id; o.textContent = u.name;
        o.selected = u.id === manageView.unitId; unitSel.appendChild(o);
      });
      unitSel.onchange = function(){ manageView.unitId = unitSel.value; manageView.boxId = null; renderAdminManage(); };
      var uf = el("div", "field"); uf.appendChild(el("label", null, "Unit")); uf.appendChild(unitSel);
      c.appendChild(uf);

      var boxSel = document.createElement("select");
      var first = null;
      E.eachBox(s, function(box, rack, unit){
        if (unit.id !== manageView.unitId) return;
        if (!first) first = box.id;
        var occ = E.occupancy(s, box.id);
        var o = document.createElement("option");
        o.value = box.id; o.textContent = box.name + " — " + occ.used + "/" + occ.capacity;
        boxSel.appendChild(o);
      });
      if (!manageView.boxId || !E.findBox(s, manageView.boxId) || E.findBox(s, manageView.boxId).unit.id !== manageView.unitId){
        manageView.boxId = first;
      }
      boxSel.value = manageView.boxId;
      boxSel.onchange = function(){ manageView.boxId = boxSel.value; renderAdminManage(); };
      var bf = el("div", "field"); bf.appendChild(el("label", null, "Box")); bf.appendChild(boxSel);
      c.appendChild(bf);

      if (manageView.boxId) renderAdminManageBox(c, s);
    }

    var addBox = el("button", null, "Add a box for " + manageView.user);
    addBox.style.marginTop = "10px";
    addBox.onclick = function(){ adminAddBoxDialog(); };
    c.appendChild(addBox);
  }

  // ---- Structure: the lab's freezer, as a folder tree ----
  //
  // One tree for the whole lab, not one per person: Umut's own picture of what he wanted
  // has no person level in it at all, and the -80 in the corridor is one freezer however
  // many people keep boxes in it. It lives in cellstocks/lab-storage.json; each box
  // records whose it is. Every folder is open at once, the way a file browser shows one,
  // so a box can be dragged to any rack in the lab rather than only to a sibling.
  //
  // Editing the structure is admin's; adding your own box is everyone's (the Boxes tab's
  // quick-add), which is why the worker lets any member write this file.
  var structureView = { expanded: null, dirtyIds: {} };

  // Desktop-only, per Umut's own answer -- dragging a box onto another rack is a mouse
  // gesture, not something to offer on a phone.
  function isDesktopPointer(){ return !("ontouchstart" in window); }

  var LEVEL_ICON = { lab: "🏢", unit: "🧊", rack: "📁", box: "📦" };
  var ICON_CHOICES = ["📁", "📂", "🗃️", "🧊", "❄️", "🥶",
                      "🧪", "🔬", "📦", "🗄️", "🌡️", "⭐"];

  // An icon is one string: an uploaded file name (rendered as an image from
  // cellstocks/icons/) or an emoji typed straight in. E.iconKind() is the only thing
  // that decides which, so the app and the engine can never disagree about it.
  function iconNode(value, level){
    var kind = E.iconKind(value);
    if (kind === "image"){
      var img = document.createElement("img");
      img.src = ICON_SRC_PREFIX + value;
      img.alt = "";
      img.className = "nodeIcon";
      return img;
    }
    var span = el("span", "nodeIcon", kind === "emoji" ? value : (LEVEL_ICON[level] || LEVEL_ICON.rack));
    return span;
  }

  async function renderAdminStructure(){
    var c = clear($("admin-structure"));
    if (!structureView.expanded){
      // Everything open the first time: a lab this size fits on a screen, and the point
      // of the tree is seeing the whole thing at once.
      structureView.expanded = {};
      (labStorage.units || []).forEach(function(u){
        structureView.expanded[u.id] = true;
        E.leafRacks(labStorage, u.id).forEach(function(leaf){
          leaf.chain.forEach(function(r){ structureView.expanded[r.id] = true; });
        });
      });
    }
    // Everyone's vials, so a count and a "this would strand N vials" refusal can be
    // honest about boxes that are not admin's own.
    if (!labCache.members){
      c.appendChild(el("p", "note", "Loading the lab…"));
      ensureLabCache().then(renderAdmin);
      return;
    }

    c.appendChild(el("p", "note",
      "The whole lab's storage, in one tree. Tap a folder to open or close it, ✎ to rename it, " +
      "give it an icon or set how many it holds. Drag a box onto any rack to move it."));

    var tree = el("div", "tree");
    tree.appendChild(structureRootRow());
    (labStorage.units || []).forEach(function(unit){ renderTreeNode(tree, unit, "unit", 1); });
    if (!(labStorage.units || []).length){
      tree.appendChild(el("p", "note", "No freezers yet — use ✎ on the lab row above to say how many."));
    }
    c.appendChild(tree);
  }

  // How many stored vials sit in a given box, lab-wide -- the owner's file is where they
  // live, so this reads every member's, not admin's own.
  function labVialCounts(){
    var counts = {};
    Object.keys(labCache.data || {}).forEach(function(name){
      (labCache.data[name].vials || []).forEach(function(v){
        if (v.status === "withdrawn" || !v.location || !v.location.boxId) return;
        counts[v.location.boxId] = (counts[v.location.boxId] || 0) + 1;
      });
    });
    return counts;
  }

  function structureRootRow(){
    var row = el("div", "treeRow");
    var body = el("div", "grow treeBody");
    body.dataset.title = labStorage.labName;
    body.appendChild(iconNode(labStorage.labIcon, "lab"));
    body.appendChild(el("span", "treeName", labStorage.labName));
    var n = (labStorage.units || []).length;
    body.appendChild(el("span", "sub", n + " freezer" + (n === 1 ? "" : "s") + " / tank" + (n === 1 ? "" : "s")));
    row.appendChild(body);
    var edit = el("button", "structRowEdit", "✎");
    edit.title = "Rename the lab, change its icon, or set how many freezers it has";
    edit.onclick = function(){ editLabDialog(); };
    row.appendChild(edit);
    return row;
  }

  function renderTreeNode(container, node, level, depth){
    var isUnit = level === "unit";
    var isBox = level === "box";
    var children = isBox ? [] : (isUnit ? (node.racks || []) : ((node.racks || []).length ? node.racks : (node.boxes || [])));
    var childLevel = isUnit ? "rack" : ((node.racks || []).length ? "rack" : "box");
    var open = !!structureView.expanded[node.id];

    var row = el("div", "treeRow");
    row.style.paddingLeft = (depth * 18) + "px";

    var twisty = el("button", "twisty", children.length ? (open ? "▾" : "▸") : "·");
    twisty.disabled = !children.length;
    twisty.onclick = function(){ structureView.expanded[node.id] = !open; renderAdmin(); };
    row.appendChild(twisty);

    var body = el("div", "grow treeBody");
    body.dataset.title = node.name;
    body.dataset.id = node.id;
    body.appendChild(iconNode(node.icon, level));
    body.appendChild(el("span", "treeName", node.name));
    body.appendChild(el("span", "sub", structureSubtitle(node, level)));
    body.onclick = function(){
      if (!children.length) return;
      structureView.expanded[node.id] = !open;
      renderAdmin();
    };
    row.appendChild(body);

    var edit = el("button", "structRowEdit", "✎");
    edit.onclick = function(){
      if (isBox) editStructureBoxDialog(node);
      else editNodeDialog(node, level);
    };
    row.appendChild(edit);

    // What can be dragged, and where it can land. A box goes into any rack that holds
    // boxes rather than child racks; a rack -- a shelf, a tower -- goes into any freezer
    // or any rack that is not already holding boxes directly. The engine refuses the
    // rest (a rack into itself or its own descendant, the leaf-or-group rule), so this
    // only has to say what is plausibly a target, not what is legal.
    if (!isUnit && isDesktopPointer()){
      row.draggable = true;
      row.ondragstart = function(ev){
        ev.dataTransfer.setData("text/plain", (isBox ? "box:" : "rack:") + node.id);
      };
    }
    var takesBox = !isBox && !isUnit && !(node.racks || []).length;
    var takesRack = isUnit || (!isBox && !(node.boxes || []).length);
    if (takesBox || takesRack){
      // What is being dragged cannot be read during dragover -- the payload is only
      // readable on drop -- so every plausible target highlights, and the drop handler
      // (and the engine behind it) decides.
      row.ondragover = function(ev){ ev.preventDefault(); row.classList.add("dropTarget"); };
      row.ondragleave = function(){ row.classList.remove("dropTarget"); };
      row.ondrop = function(ev){
        ev.preventDefault();
        row.classList.remove("dropTarget");
        var payload = String(ev.dataTransfer.getData("text/plain") || "");
        var id = payload.replace(/^(box|rack):/, "");
        if (payload.indexOf("rack:") === 0) moveRackTo(id, node.id);
        else moveBoxTo(id, node.id);
      };
    }
    container.appendChild(row);

    if (!open) return;
    children.forEach(function(child){ renderTreeNode(container, child, childLevel, depth + 1); });
  }

  function structureSubtitle(node, level){
    if (level === "box"){
      var counts = labVialCounts();
      var cap = (Number(node.rows) || 0) * (Number(node.cols) || 0);
      return (counts[node.id] || 0) + "/" + cap + (node.owner ? " · " + node.owner : " · unassigned");
    }
    var racks = (node.racks || []).length;
    var boxes = (node.boxes || []).length;
    var bits = [];
    if (level === "unit" && node.type) bits.push(node.type);
    if (racks) bits.push(racks + " " + ((node.childLabel || "level").toLowerCase()) + (racks === 1 ? "" : "s"));
    else if (boxes) bits.push(boxes + " box" + (boxes === 1 ? "" : "es"));
    else bits.push("empty");
    if (level === "unit" && node.note) bits.push(node.note);
    return bits.join(" · ");
  }

  async function moveBoxTo(boxId, rackId){
    if (!boxId) return;
    var r = E.moveBox(labStorage, boxId, rackId);
    if (!r.ok){ showBanner(r.reason); return; }
    try {
      await commitLabStorage(r.state, "Move a box");
      // The box's own vials record which unit and rack they are in, and those live in
      // the owner's file -- not here. Bring that file along, or validate() would call
      // every one of them a unit mismatch.
      var box = E.findBox(r.state, boxId);
      if (box && box.box.owner) await refreshVialLocations(box.box.owner, boxId, r.movedTo);
      showBanner("Moved <b>" + esc(box ? box.box.name : boxId) + "</b>.");
      renderAdmin();
    } catch(err){ showBanner("Couldn't save that: " + esc(err.message)); }
  }

  // A shelf or a tower moves the same way a box does, and takes everything under it.
  // Its boxes keep their own leaf rack, so only the unit on each vial needs refreshing --
  // and those vials are in their owners' files, which is where that has to be written.
  async function moveRackTo(rackId, targetId){
    if (!rackId) return;
    var r = E.moveRack(labStorage, rackId, targetId);
    if (!r.ok){ showBanner(r.reason); return; }
    var moved = E.findRackNode(labStorage, rackId);
    var boxes = E.boxesUnderRack(labStorage, rackId).map(function(b){ return b.box; });
    try {
      await commitLabStorage(r.state, "Move " + (moved ? moved.rack.name : "a rack"));
      var byOwner = {};
      boxes.forEach(function(b){ if (b.owner) (byOwner[b.owner] = byOwner[b.owner] || []).push(b.id); });
      var owners = Object.keys(byOwner);
      for (var i = 0; i < owners.length; i++){
        await refreshVialUnits(owners[i], byOwner[owners[i]], r.movedTo.unitId);
      }
      showBanner("Moved <b>" + esc(moved ? moved.rack.name : rackId) + "</b>.");
      renderAdmin();
    } catch(err){ showBanner("Couldn't save that: " + esc(err.message)); }
  }

  async function refreshVialUnits(owner, boxIds, unitId){
    var s = await adminFetchState(owner);
    var ids = {};
    boxIds.forEach(function(id){ ids[id] = true; });
    var touched = 0;
    (s.vials || []).forEach(function(v){
      if (v.location && ids[v.location.boxId] && v.location.unitId !== unitId){
        v.location.unitId = unitId;
        touched++;
      }
    });
    if (!touched) return;
    await adminCommit(owner, s, "Follow a rack that moved");
    labCache.members = null; labCache.data = {};
  }

  async function refreshVialLocations(owner, boxId, movedTo){
    var s = await adminFetchState(owner);
    var touched = 0;
    (s.vials || []).forEach(function(v){
      if (v.location && v.location.boxId === boxId){
        v.location.unitId = movedTo.unitId;
        v.location.rackId = movedTo.rackId;
        touched++;
      }
    });
    if (!touched) return;
    await adminCommit(owner, s, "Follow a box that moved");
    labCache.members = null; labCache.data = {};
  }

  // ---- the structure's own dialogs ----

  function iconField(body, current, onPick){
    var f = el("div", "field");
    f.appendChild(el("label", null, "Icon"));
    var picked = { value: current || "" };
    var preview = el("div", "iconPreview");
    function paintPreview(){
      clear(preview).appendChild(iconNode(picked.value, "rack"));
      preview.appendChild(el("span", "sub", picked.value ? picked.value : "default"));
    }
    var palette = el("div", "iconPalette");
    ICON_CHOICES.forEach(function(emoji){
      var b = el("button", "iconChoice", emoji);
      b.onclick = function(){ picked.value = emoji; onPick(picked.value); paintPreview(); };
      palette.appendChild(b);
    });
    var clearBtn = el("button", "iconChoice", "✕");
    clearBtn.title = "Back to the default icon";
    clearBtn.onclick = function(){ picked.value = ""; onPick(""); paintPreview(); };
    palette.appendChild(clearBtn);

    // An uploaded image, exactly the way the wardrobe app already does it: read as
    // base64 in the browser, committed as a real file, and only its name stored here.
    var upload = el("button", null, "Upload an image…");
    upload.onclick = function(){
      var input = document.createElement("input");
      input.type = "file";
      input.accept = "image/png,image/jpeg,image/webp";
      input.onchange = async function(){
        var file = input.files && input.files[0];
        if (!file) return;
        upload.disabled = true;
        upload.textContent = "Uploading…";
        try {
          var name = await uploadIcon(file);
          picked.value = name; onPick(name); paintPreview();
        } catch(err){ showBanner("Couldn't upload that: " + esc(err.message)); }
        upload.disabled = false;
        upload.textContent = "Upload an image…";
      };
      input.click();
    };

    paintPreview();
    f.appendChild(preview);
    f.appendChild(palette);
    f.appendChild(upload);
    body.appendChild(f);
  }

  async function uploadIcon(file){
    var ext = (/\.(png|jpe?g|webp)$/i.exec(file.name) || [])[0];
    if (!ext) throw new Error("only PNG, JPG or WEBP");
    var slug = file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    var fileName = (slug || "icon") + "-" + Date.now().toString(36) + ext.toLowerCase();
    var base64 = await blobToBase64(file);
    await workerCommit([{ path: ICON_PREFIX + fileName, content: base64, base64: true }], "Add a storage icon");
    return fileName;
  }

  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onerror = function(){ reject(new Error("couldn't read that file")); };
      r.onload = function(){ resolve(String(r.result).split(",")[1] || ""); };
      r.readAsDataURL(blob);
    });
  }

  // `remove`, when given, is {kind, id, name} and adds a Delete to the dialog's footer.
  // Deleting is deliberately in the edit dialog rather than on the row -- the row is what
  // you tap to open a folder, and a delete one pixel away from that is a trap.
  function structureDialog(title, build, remove){
    $("dlgTitle").textContent = title;
    var body = clear($("dlgBody"));
    var msg = el("p", "note");
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    var apply = build(body, msg);
    body.appendChild(msg);
    ok.onclick = async function(){
      ok.disabled = true;
      try {
        var r = apply();
        if (r && r.ok === false){ msg.textContent = r.reason; msg.style.color = "var(--bad)"; ok.disabled = false; return; }
        await commitLabStorage(r.state, r.message);
        $("dlg").close();
        renderAdmin();
      } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
      ok.disabled = false;
    };
    foot.appendChild(ok);

    if (remove){
      var del = el("button", "danger", "Delete");
      del.style.marginRight = "auto";       // pushed away from Save, so neither is a slip
      del.onclick = async function(){
        del.disabled = true; ok.disabled = true;
        try {
          await deleteStructureNode(remove, msg);
        } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
        del.disabled = false; ok.disabled = false;
      };
      foot.insertBefore(del, foot.firstChild);
    }
    $("dlg").showModal();
  }

  // Deleting a freezer, a rack or a box, as admin, without having to empty it by hand
  // first -- Umut asked for exactly that: "a feature admin can do, that needs no Handoff".
  //
  // What it will not do is make vials silently cease to exist. Any vial still inside is
  // WITHDRAWN first, in its own owner's file, with the same snapshot-of-where-it-was that
  // taking one out by hand writes -- so it leaves the active inventory, stays in the Log,
  // and stays searchable in history. That is this app's oldest rule (`withdraw` clears
  // the location and records `from`; nothing deletes a vial), and a structural edit is not
  // a reason to break it. The confirm says how many vials and whose, before anything runs.
  //
  // Order matters: the owners' files are written first, so the boxes really are empty by
  // the time the tree is written. If a member's commit fails, the tree still names their
  // box and nothing is lost -- the opposite order would strand the vials.
  function boxesUnderNode(spec){
    if (spec.kind === "box"){
      var one = E.findBox(labStorage, spec.id);
      return one ? [one.box] : [];
    }
    if (spec.kind === "unit"){
      var out = [];
      E.leafRacks(labStorage, spec.id).forEach(function(lr){
        (lr.rack.boxes || []).forEach(function(b){ out.push(b); });
      });
      return out;
    }
    return E.boxesUnderRack(labStorage, spec.id).map(function(b){ return b.box; });
  }

  async function deleteStructureNode(spec, msg){
    var boxes = boxesUnderNode(spec);
    var counts = labVialCounts();
    var byOwner = {};
    boxes.forEach(function(b){
      var n = counts[b.id] || 0;
      if (!n) return;
      var who = b.owner || "";
      byOwner[who] = (byOwner[who] || 0) + n;
    });
    var owners = Object.keys(byOwner);
    var vialTotal = owners.reduce(function(n, o){ return n + byOwner[o]; }, 0);

    var lines = ["Delete " + spec.name + "?"];
    if (boxes.length) lines.push(boxes.length + " box" + (boxes.length === 1 ? "" : "es") + " go with it.");
    if (vialTotal){
      lines.push(vialTotal + " vial" + (vialTotal === 1 ? "" : "s") + " still inside " +
                 (owners.length === 1 && owners[0]
                   ? "(" + owners[0] + "'s)"
                   : "(" + owners.map(function(o){ return (o || "unassigned") + ": " + byOwner[o]; }).join(", ") + ")") +
                 " will be taken out and logged, not erased — they stay in the Log and in history.");
    } else {
      lines.push("Nothing is inside it.");
    }
    lines.push("Every member sees the same freezer, so this goes for the whole lab.");
    if (!window.confirm(lines.join("\n\n"))) return;

    // 1. Empty the boxes, in each owner's own file.
    var emptied = {};
    boxes.forEach(function(b){ emptied[b.id] = 0; });
    for (var i = 0; i < owners.length; i++){
      var owner = owners[i];
      if (!owner) continue;                       // an unassigned box has no file to write
      var st = await adminFetchState(owner);
      var ids = (st.vials || []).filter(function(v){
        return v.status !== "withdrawn" && v.location && emptied.hasOwnProperty(v.location.boxId);
      }).map(function(v){ return v.id; });
      if (!ids.length) continue;
      var r = E.withdraw(st, ids, {
        date: new Date().toISOString().slice(0, 10),
        by: effectiveIdentity() || "admin",
        purpose: "discarded",
        notes: spec.name + " was removed from the freezer",
        ids: ids.map(function(id){ return adminNewId("w"); })
      });
      await adminCommit(owner, r.state, "Take out " + ids.length + " vial(s): " + spec.name + " was removed");
    }

    // 2. Now the structure, with those boxes counted as empty.
    var next = labStorage;
    for (var b = 0; b < boxes.length; b++){
      var rb = E.removeBox(next, boxes[b].id, emptied);
      if (!rb.ok){ msg.textContent = rb.reason; msg.style.color = "var(--bad)"; return; }
      next = rb.state;
    }
    if (spec.kind !== "box"){
      var rn = spec.kind === "unit" ? E.removeUnit(next, spec.id) : E.removeSubdivision(next, spec.id);
      if (!rn.ok){ msg.textContent = rn.reason; msg.style.color = "var(--bad)"; return; }
      next = rn.state;
    }
    await commitLabStorage(next, "Delete " + spec.name);
    $("dlg").close();
    showBanner("Deleted <b>" + esc(spec.name) + "</b>" +
               (vialTotal ? " — " + vialTotal + " vial(s) taken out and logged." : "."));
    renderAdmin();
  }

  function editLabDialog(){
    structureDialog("Edit " + labStorage.labName, function(body){
      var name = document.createElement("input"); name.value = labStorage.labName; name.autocomplete = "off";
      var f = el("div", "field"); f.appendChild(el("label", null, "Name")); f.appendChild(name); body.appendChild(f);
      var icon = { value: labStorage.labIcon || "" };
      iconField(body, icon.value, function(v){ icon.value = v; });
      var count = document.createElement("input");
      count.type = "number"; count.min = 0; count.value = (labStorage.units || []).length;
      count.id = "structureCountInput";
      var cf = el("div", "field");
      cf.appendChild(el("label", null, "How many freezers / tanks?"));
      cf.appendChild(count);
      body.appendChild(cf);
      return function(){
        if (!name.value.trim()) return { ok:false, reason:"A name is required." };
        var r = E.setUnitCount(labStorage, Number(count.value));
        if (!r.ok) return r;
        var next = r.state;
        next.labName = name.value.trim();
        next.labIcon = icon.value;
        return { state: next, message: "Edit the lab's structure" };
      };
    });
  }

  function editNodeDialog(node, level){
    structureDialog("Edit " + node.name, function(body){
      var name = document.createElement("input"); name.value = node.name; name.autocomplete = "off";
      var fields = [["Name", name]];
      var type = null, note = null;
      if (level === "unit"){
        type = document.createElement("input");
        type.value = node.type || ""; type.placeholder = "-80, LN2…"; type.autocomplete = "off";
        note = document.createElement("input");
        note.value = node.note || ""; note.placeholder = "back corner"; note.autocomplete = "off";
        fields.push(["Type / temperature", type], ["Note", note]);
      }
      fields.forEach(function(p){
        var f = el("div", "field"); f.appendChild(el("label", null, p[0])); f.appendChild(p[1]); body.appendChild(f);
      });
      var icon = { value: node.icon || "" };
      iconField(body, icon.value, function(v){ icon.value = v; });

      // A node holds either child racks or boxes, never both -- so it gets whichever
      // count applies, and a genuinely empty one gets both and becomes whichever is used.
      var hasBoxes = (node.boxes || []).length > 0;
      var hasRacks = (node.racks || []).length > 0;
      // Every level inside a unit is named after that unit's own childLabel -- a -80's
      // shelves and the racks inside them are all "Rack 3" style, set once on the unit.
      var childLabel = level === "unit"
        ? (node.childLabel || "Rack")
        : ((E.findRackNode(labStorage, node.id) || {}).unit || {}).childLabel || "Rack";
      var rackCount = null, boxCount = null;
      if (level === "unit" || !hasBoxes){
        rackCount = document.createElement("input");
        rackCount.type = "number"; rackCount.min = 0; rackCount.value = (node.racks || []).length;
        rackCount.id = "structureCountInput";
        var rf = el("div", "field");
        rf.appendChild(el("label", null, "How many " + childLabel.toLowerCase() + "s?"));
        rf.appendChild(rackCount);
        body.appendChild(rf);
      }
      if (level !== "unit" && !hasRacks){
        boxCount = document.createElement("input");
        boxCount.type = "number"; boxCount.min = 0; boxCount.value = (node.boxes || []).length;
        boxCount.id = "structureBoxCountInput";
        var bf = el("div", "field");
        bf.appendChild(el("label", null, "How many boxes?"));
        bf.appendChild(boxCount);
        body.appendChild(bf);
      }

      return function(){
        if (!name.value.trim()) return { ok:false, reason:"A name is required." };
        var next = labStorage, r;
        if (rackCount){
          var unitId = level === "unit" ? node.id : E.findRackNode(next, node.id).unit.id;
          var parentId = level === "unit" ? null : node.id;
          r = E.setSubdivisionCount(next, unitId, parentId, Number(rackCount.value), childLabel);
          if (!r.ok) return r;
          next = r.state;
        }
        if (boxCount){
          r = setBoxCountWithOwner(next, node.id, Number(boxCount.value));
          if (!r.ok) return r;
          next = r.state;
        }
        if (level === "unit"){
          r = E.setUnitDetails(next, node.id, { name: name.value, type: type.value, note: note.value });
          if (!r.ok) return r;
          next = r.state;
          E.findUnit(next, node.id).icon = icon.value;
        } else {
          r = E.renameSubdivision(next, node.id, name.value);
          if (!r.ok) return r;
          next = r.state;
          E.findRackNode(next, node.id).rack.icon = icon.value;
        }
        return { state: next, message: "Edit " + name.value.trim() };
      };
    }, { kind: level === "unit" ? "unit" : "rack", id: node.id, name: node.name });
  }

  // setBoxCount only knows about boxes; a box also needs an owner, and a shrink has to
  // count vials that live in other people's files. Both are supplied here.
  function setBoxCountWithOwner(storage, rackId, count){
    var node = E.findRackNode(storage, rackId);
    if (!node) return { ok:false, reason:"No such subdivision." };
    var counts = labVialCounts();
    var current = node.rack.boxes || [];
    var n = Math.max(0, Math.floor(Number(count) || 0));
    if (n < current.length){
      var stranded = current.slice(n).filter(function(b){ return counts[b.id]; });
      if (stranded.length){
        return { ok:false, reason: stranded.map(function(b){
          return b.name + " still holds " + counts[b.id] + " vial" + (counts[b.id] === 1 ? "" : "s") +
                 " and needs a new location first";
        }).join("; ") + "." };
      }
    }
    var r = E.setBoxCount(storage, rackId, n);
    if (!r.ok) return r;
    // A box admin adds on someone's behalf starts unassigned; the box's own ✎ says whose.
    return r;
  }

        found.box.cols = Number(cols.value);

      // The worker has done the hard part of this since round 5 -- it moves both data
      // files in one atomic commit and re-keys the account (see routeRenameUser) -- it
      // simply had no button. Existing sessions are keyed to the old name and stop

        newName = newName.trim();
        if (!window.confirm("Rename " + u.name + " to " + newName + "?\n\nTheir boxes and vials move with them. " +
            "If they are logged in right now they'll be signed out and have to log back in as " + newName + ".")) return;
        try {
          await workerFetch("/admin/users/" + encodeURIComponent(u.name) + "/rename", {
            method:"POST", headers: adminAuth(), body: JSON.stringify({ newName: newName })
          });
          adminUsersCache = null;
          // Same reason as Create and Delete below: the merged view holds one snapshot
          // per name for the whole session, and both names are now wrong in it.
          labCache.members = null; labCache.data = {};
          if (manageView.user === u.name){ manageView.user = null; manageView.state = null; }
          structureView.expanded = null;   // owner labels in the tree are now wrong
          showBanner("Renamed " + esc(u.name) + " to <b>" + esc(newName) + "</b>.");
          renderAdminUsers();
        } catch(err){ showBanner(err.message); }
      };
      row.appendChild(ren);
      var del = el("button", "danger", "Delete");
      del.style.marginLeft = "6px";
      del.onclick = async function(){
        // The worker refuses this outright while they still own a box, so that a
        // deleted account can never leave boxes behind in the lab's shared tree naming
        // somebody who no longer exists. Saying so here saves the round trip and points
        // at the screen that actually handles it.
        var theirs = [];
        E.eachBox(labStorage, function(box){
          if ((box.owner || "").toLowerCase() === u.name.toLowerCase()) theirs.push(box.name);
        });
        if (theirs.length){
          showBanner(esc(u.name) + " still owns " + theirs.length + " box" + (theirs.length === 1 ? "" : "es") +
                     " in the freezer (" + esc(theirs.slice(0, 3).join(", ")) + (theirs.length > 3 ? ", and more" : "") +
                     "). Use <b>Handoff</b> instead — it gives every box a new owner, or discards it, and then " +
                     "deletes the account.");
          return;
        }
        if (!window.confirm("Delete " + u.name + "? This also deletes their data and workbook — it cannot be undone.")) return;
        try {
          await workerFetch("/admin/users/" + encodeURIComponent(u.name), { method:"DELETE", headers: adminAuth() });
          adminUsersCache = null;
          // See the matching comment on Create above -- the deleted account's data
          // must not keep showing in the merged view from this session's in-memory cache.
          labCache.members = null; labCache.data = {};
          renderAdminUsers();
        } catch(err){ showBanner(err.message); }
      };
      row.appendChild(del);
      c.appendChild(row);
    });
  }

  function renderAdminHistory(){
    var c = clear($("admin-history"));

    var exportMsg = el("div");
    exportBtn.onclick = async function(){
      exportBtn.disabled = true;

      try {
        var users = (await adminUsers()).filter(function(u){ return !u.hidden; }).map(function(u){ return u.name; });
        var states = {};
        await Promise.all(users.map(function(name){
          return adminFetchState(name).then(function(s){ states[name] = s; }).catch(function(){});
        }));
        var logRows = [["date", "owner", "name", "unit", "rack", "box", "position", "by", "purpose", "notes", "vial_id"]];
        var entries = [];
        users.forEach(function(name){
          var s = states[name];
          if (!s) return;
          (s.withdrawals || []).forEach(function(w){ entries.push({ owner:name, state:s, w:w }); });
        });
        entries.sort(function(a, b){ return String(b.w.date || "") < String(a.w.date || "") ? -1 : 1; });
        entries.forEach(function(e){
          var w = e.w;
          var box = w.from ? E.findBox(e.state, w.from.boxId) : null;
          logRows.push([w.date || "", e.owner, w.name || "",
            box ? box.unit.name : "", box ? box.chain.map(function(r){ return r.name; }).join(" / ") : "", box ? box.box.name : "",
            w.from ? w.from.position : "", w.by || "", w.purpose || "", w.notes || "", w.vialId]);
        });
        var sheets = [{ name:"Log", rows:logRows }];
        users.forEach(function(name){
          var s = states[name];
          if (!s) return;
          var vs = E.vialsToSheets(s).filter(function(sh){ return sh.name === "vials"; })[0];
          sheets.push({ name: name.slice(0, 31), rows: vs.rows });
        });
        var bytes = await X.writeWorkbookAsync(sheets);
        adminDownloadBlob(bytes, "cellstocks-export-" + new Date().toISOString().slice(0, 10) + ".xlsx",
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
        clear(exportMsg).appendChild(el("div", "note", "Exported " + Object.keys(states).length + " of " + users.length + " account(s)."));
      } catch(err){ clear(exportMsg).appendChild(el("div", "note", err.message)); }
      exportBtn.disabled = false;
    };
    c.appendChild(exportBtn);
    c.appendChild(exportMsg);

    c.appendChild(el("h3", null, "Point-in-time history"));
    c.appendChild(el("p", "note", "One user's file, as it stood at a moment in the past."));
    var histUser = document.createElement("input"); histUser.placeholder = "umut"; histUser.autocomplete = "off";
    var histAt = document.createElement("input"); histAt.type = "datetime-local";
    [["User", histUser], ["At", histAt]].forEach(function(p){
      var f = el("div", "field"); f.appendChild(el("label", null, p[0])); f.appendChild(p[1]); c.appendChild(f);
    });
    var loadBtn = el("button", "primary", "Load");
    var histResult = el("div");
    loadBtn.onclick = async function(){
      var user = histUser.value.trim(), at = histAt.value;
      if (!user || !at) return;
      try {
        var iso = new Date(at).toISOString();
        var result = await workerFetch("/admin/history/at?user=" + encodeURIComponent(user) + "&at=" + encodeURIComponent(iso), { headers: adminAuth() });
        var s;
        try { s = E.mergeDefaults(JSON.parse(result.content)); } catch(e){ clear(histResult).appendChild(el("p","note","Couldn't parse that commit's content.")); return; }
        clear(histResult).appendChild(el("p", "note", "As of " + result.commitDate + ": " + (s.vials || []).length + " item(s) recorded."));
        var exp = el("button", "primary", "Export as .xlsx");
        exp.onclick = async function(){
          var bytes = await X.writeWorkbookAsync(E.vialsToSheets(s));
          adminDownloadBlob(bytes, user + "-" + result.commitDate.slice(0, 10) + ".xlsx",
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
        };
        histResult.appendChild(exp);
      } catch(err){ showBanner(err.message); }
    };
    c.appendChild(loadBtn);
    c.appendChild(histResult);
  }

  // ---- Handoff ----
  function adminNewId(prefix){ return prefix + "-" + Math.random().toString(36).slice(2, 10); }

  var hoState = null, hoAssignments = {}, hoAllNames = [];

  async function renderAdminHandoff(){
    var c = clear($("admin-handoff"));
    c.appendChild(el("p", "note",
      "Somebody leaving the lab. Their boxes stay exactly where they physically are -- the " +
      "freezer belongs to the lab -- and change hands to whoever takes them over. Once every " +
      "box has somewhere to go, their account and its files are deleted."));
    var users = await adminUsers().catch(function(){ return []; });
    // A PI holds no inventory, so they can neither leave boxes behind nor take any on.
    hoAllNames = users.filter(function(u){ return !u.hidden && u.role !== "pi"; }).map(function(u){ return u.name; });
    var sel = document.createElement("select");
    hoAllNames.forEach(function(n){ var o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); });
    var f = el("div", "field"); f.appendChild(el("label", null, "Who's leaving")); f.appendChild(sel);
    c.appendChild(f);
    var leaving = document.createElement("input"); leaving.type = "checkbox";
    var lbl = el("label", null); lbl.style.cssText = "display:flex;align-items:center;gap:6px;margin:8px 0";
    lbl.appendChild(leaving); lbl.appendChild(document.createTextNode("This person has left the lab"));
    c.appendChild(lbl);
    var boxesWrap = el("div");
    c.appendChild(boxesWrap);
    var applyBtn = el("button", "danger", "Hand over and delete the account");
    applyBtn.hidden = true;
    applyBtn.style.marginTop = "10px";
    c.appendChild(applyBtn);
    var msg = el("div");
    c.appendChild(msg);

    leaving.onchange = async function(){
      clear(boxesWrap); applyBtn.hidden = true; hoState = null; hoAssignments = {};
      if (!leaving.checked || !sel.value) return;
      hoState = await adminFetchState(sel.value);
      var owner = sel.value.toLowerCase();
      var boxes = [];
      // Their boxes are the ones in the lab's shared structure marked as theirs.
      E.eachBox(labStorage, function(box, rack, unit, chain){
        if ((box.owner || "").toLowerCase() !== owner) return;
        var count = (hoState.vials || []).filter(function(v){
          return v.status !== "withdrawn" && v.location && v.location.boxId === box.id;
        }).length;
        boxes.push({ unit:unit, chain:chain, box:box, count:count });
      });
      if (!boxes.length){
        boxesWrap.appendChild(el("p", "note", sel.value + " has no boxes -- their account can be deleted straight away."));
        applyBtn.hidden = false;
        return;
      }
      boxesWrap.appendChild(el("p", "note", "Every box needs a destination before the account can go."));
      boxes.forEach(function(entry){
        var row = el("div", "item");
        var grow = el("div", "grow");
        var path = [entry.unit.name].concat(entry.chain.map(function(r){ return r.name; })).concat([entry.box.name]);
        grow.appendChild(el("div", null, path.join(" → ")));
        grow.appendChild(el("div", "sub", entry.count + " vial" + (entry.count === 1 ? "" : "s")));
        row.appendChild(grow);
        var assignSel = document.createElement("select");
        var none = document.createElement("option"); none.value = ""; none.textContent = "(nobody yet)";
        assignSel.appendChild(none);
        hoAllNames.filter(function(n){ return n !== sel.value; }).forEach(function(n){
          var o = document.createElement("option"); o.value = n; o.textContent = "→ " + n; assignSel.appendChild(o);
        });
        var discard = document.createElement("option");
        discard.value = " discard";
        discard.textContent = "Discard (delete " + entry.count + " vial" + (entry.count === 1 ? "" : "s") + ")";
        assignSel.appendChild(discard);
        assignSel.onchange = function(){ hoAssignments[entry.box.id] = assignSel.value; };
        row.appendChild(assignSel);
        boxesWrap.appendChild(row);
      });
      applyBtn.hidden = false;
    };

    applyBtn.onclick = async function(){
      var user = sel.value;
      if (!user) return;
      var owner = user.toLowerCase();
      var myBoxes = [];
      E.eachBox(labStorage, function(box){ if ((box.owner || "").toLowerCase() === owner) myBoxes.push(box); });

      var unassigned = myBoxes.filter(function(b){ return !hoAssignments[b.id]; });
      if (unassigned.length){
        clear(msg).appendChild(el("div", "note",
          "Still nowhere to go: " + unassigned.map(function(b){ return b.name; }).join(", ") +
          ". Give every box a new owner (or Discard it) first."));
        return;
      }
      var discarding = myBoxes.filter(function(b){ return hoAssignments[b.id] === " discard"; });
      var discardedVials = (hoState.vials || []).filter(function(v){
        return v.location && discarding.some(function(b){ return b.id === v.location.boxId; });
      }).length;
      if (!window.confirm("Hand " + (myBoxes.length - discarding.length) + " box(es) over" +
          (discarding.length ? ", discard " + discarding.length + " box(es) with " + discardedVials + " vial(s)" : "") +
          ", then delete " + user + "'s account and both its files? This cannot be undone.")) return;

      applyBtn.disabled = true;
      try {
        // 1. The boxes change hands where they already are: only `owner` moves, and the
        //    tree, the ids and every position stay exactly as they were. A discarded box
        //    is removed from the structure entirely.
        var nextStorage = JSON.parse(JSON.stringify(labStorage));
        var byTarget = {};
        myBoxes.forEach(function(box){
          var target = hoAssignments[box.id];
          if (target === " discard"){
            var f2 = E.findBox(nextStorage, box.id);
            var list = f2.rack.boxes;
            list.splice(list.indexOf(f2.box), 1);
            return;
          }
          E.findBox(nextStorage, box.id).box.owner = target.toLowerCase();
          (byTarget[target] = byTarget[target] || []).push(box.id);
        });

        // 2. The vials follow their box into the new owner's own file, keeping their
        //    slot but taking fresh ids -- two accounts mint ids independently, so
        //    "v-2" from one can collide with "v-2" in the other (PR #82).
        var prepared = [];
        var targetNames = Object.keys(byTarget);
        for (var t = 0; t < targetNames.length; t++){
          var target = targetNames[t];
          var targetState = await adminFetchState(target);
          var ids = {};
          byTarget[target].forEach(function(id){ ids[id] = true; });
          (hoState.vials || []).forEach(function(v){
            if (!v.location || !ids[v.location.boxId]) return;
            var moved = JSON.parse(JSON.stringify(v));
            moved.id = adminNewId("v");
            targetState.vials.push(moved);
          });
          (hoState.withdrawals || []).forEach(function(w){
            if (!w.from || !ids[w.from.boxId]) return;
            var movedW = JSON.parse(JSON.stringify(w));
            movedW.id = adminNewId("w");
            targetState.withdrawals.push(movedW);
          });
          var errors = E.errorsOnly(E.validate(E.hydrateStorage(targetState, nextStorage, target)));
          if (errors.length) throw new Error(target + "'s inventory would be invalid after this: " + errors[0].message);
          prepared.push({ name:target, state:targetState });
        }

        // 3. Write it all: the structure first, then each new owner's file, then the
        //    account itself goes -- DELETE /admin/users also removes both its files.
        await commitLabStorage(nextStorage, "Handoff: " + user + "'s boxes change hands");
        for (var i = 0; i < prepared.length; i++){
          await adminCommit(prepared[i].name, prepared[i].state, "Handoff: took over boxes from " + user);
        }
        await workerFetch("/admin/users/" + encodeURIComponent(user), { method:"DELETE", headers: adminAuth() });
        adminUsersCache = null;
        labCache.members = null; labCache.data = {};
        structureView.expanded = null;

        clear(msg).appendChild(el("div", "note",
          "Handed " + (myBoxes.length - discarding.length) + " box(es) over to " +
          (targetNames.length ? targetNames.join(", ") : "nobody") +
          (discarding.length ? ", discarded " + discarding.length : "") +
          ", and deleted " + user + "'s account."));
        leaving.checked = false; clear(boxesWrap); applyBtn.hidden = true; hoState = null; hoAssignments = {};
        renderAdminHandoff();
      } catch(err){ clear(msg).appendChild(el("div", "note", err.message)); }
      applyBtn.disabled = false;
    };
  }

  function go(name){
    screen = name;
    Array.prototype.forEach.call(document.querySelectorAll(".screen"), function(s){
      s.classList.toggle("active", s.id === "s-" + name);
    });
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-screen") === name);
    });
    if (name !== "boxes") boxView.highlight = [];
    renderAll();
    window.scrollTo(0, 0);
  }

  function renderNavBadge(){
    var btn = document.querySelector('nav button[data-screen="review"]');
    var old = btn.querySelector(".dot");
    if (old) btn.removeChild(old);
    var n = E.reviewQueue(state).total;
    if (!n) return;
    var d = el("span", "dot", n > 99 ? "99+" : String(n));
    btn.appendChild(d);
  }

  var rendering = false;
  function renderAll(){
    if (rendering) return;
    rendering = true;
    try {
      renderNavBadge();
      if (screen === "find"){ renderFilters(); renderResults(); }   // renderFilters re-follows the extents
      else if (screen === "freeze"){
        renderFreezeType(); renderFreezeUnits(); renderFreezeFacets(); renderFreezeCustomFacets();
        renderFreezePlan(); renderFreezeGuard();
      }
      else if (screen === "boxes") renderBoxes();
      else if (screen === "review") renderReview();
      else if (screen === "log") renderLog();
      else if (screen === "admin") renderAdmin();
      else if (screen === "settings") renderSettings();
    } finally { rendering = false; }
  }

  function renderFreezeGuard(){
    var why = $("fzWhyNot");
    var btn = $("fzGo");
    if (!canWrite()){
      btn.disabled = true;
      why.textContent = "Read-only on this device — nothing can be written until a GitHub token is " +
        "added under Settings → Connect.";
      return;
    }
    var ok = !!(freeze.name.trim() && freeze.plan && freeze.plan.ok);
    btn.disabled = !ok;
    why.textContent = !freeze.name.trim() ? "Give it a name first."
      : (freeze.plan && !freeze.plan.ok) ? freeze.plan.reason : "";
  }

  function renderFreezeUnits(){
    var sel = $("fzUnit");
    if (sel.childNodes.length && sel.dataset.n === String((state.storage.units || []).length)) return;
    clear(sel);
    (state.storage.units || []).forEach(function(u){
      var o = document.createElement("option");
      o.value = u.id; o.textContent = u.name;
      o.selected = u.id === (freeze.unitId || state.settings.defaultUnitId);
      sel.appendChild(o);
    });
    sel.dataset.n = String((state.storage.units || []).length);
  }

  // ---- wiring ----
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.onclick = function(){ go(b.getAttribute("data-screen")); };
  });
  $("dlgX").onclick = function(){ $("dlg").close(); };

  var qTimer = null;
  $("q").oninput = function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ filter.query = $("q").value; renderResults(); }, 150);
  };

  $("fzName").oninput = function(){
    freeze.name = $("fzName").value;
    freeze.boxId = null;
    renderFreezeFacets();
    renderFreezePlan();
    renderFreezeGuard();
  };
  $("fzType").onchange = function(){
    var sel = $("fzType");
    if (sel.value === "__new__"){
      var name = prompt("Name this type:", "");
      if (!name || !name.trim()){ sel.value = freeze.kind; return; }
      var trimmed = name.trim();
      workerFetch("/types", { method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() },
        body: JSON.stringify({ name: trimmed }) })
        .then(function(cfg){ typesCache = cfg; freeze.kind = trimmed; freeze.customFacets = {}; renderAll(); })
        .catch(function(err){ showBanner(esc(err.message)); sel.value = freeze.kind; });
      return;
    }
    freeze.kind = sel.value;
    freeze.customFacets = {};
    renderFreezeFacets();
    renderFreezeCustomFacets();
    renderFreezePlan();
    renderFreezeGuard();
  };
  var COUNT_MIN = 1, COUNT_MAX = 81;
  function setCount(n, fromTyping){
    var v = Math.round(Number(n));
    if (!isFinite(v)) v = COUNT_MIN;
    v = Math.max(COUNT_MIN, Math.min(COUNT_MAX, v));
    freeze.count = v;
    // Don't fight the field while it is being typed in -- rewriting it mid-keystroke
    // makes "12" impossible to type, because the 1 becomes a 1 and the cursor jumps.
    if (!fromTyping) $("fzCount").value = String(v);
    $("fzMinus").disabled = v <= COUNT_MIN;
    $("fzPlus").disabled = v >= COUNT_MAX;
    renderFreezePlan();
    renderFreezeGuard();
  }
  $("fzCount").oninput = function(){ setCount($("fzCount").value, true); };
  // On the way out, put back whatever was actually settled on, so an emptied or
  // out-of-range field never sits there looking like it means something.
  $("fzCount").onblur = function(){ setCount(freeze.count); };
  $("fzMinus").onclick = function(){ setCount(freeze.count - 1); };
  $("fzPlus").onclick = function(){ setCount(freeze.count + 1); };
  setCount(freeze.count);
  $("fzUnit").onchange = function(){
    freeze.unitId = $("fzUnit").value; freeze.boxId = null; renderFreezePlan(); renderFreezeGuard();
  };
  $("fzGo").onclick = doFreeze;
  $("fzDate").value = new Date().toISOString().slice(0, 10);

  $("bxOwner").onchange = function(){
    boxView.owner = $("bxOwner").value; boxView.unitId = null; boxView.boxId = null; boxView.rackPath = []; renderBoxes();
  };
  $("bxUnit").onchange = function(){
    boxView.unitId = $("bxUnit").value; boxView.boxId = null; boxView.rackPath = []; renderBoxes();
  };

  try {
    var t = localStorage.getItem(LS.theme);
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}

  // A freezer is shared, so take another look whenever the app comes back to the
  // front rather than trusting a copy that may be an hour old -- but only once someone
  // is actually logged in; nothing fetches anyone's inventory before that.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && !dirty && canWrite()) load();
  });

  $("appFooter").textContent = "© " + new Date().getFullYear() + " CAApp · Umut Cagiral · Built with Claude";

  cacheLoad();
  afterAuthChange();
  if (canWrite()) load();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
