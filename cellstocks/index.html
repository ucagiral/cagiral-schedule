    if (v.importedFrom) body.appendChild(el("p", "note", "From " + v.importedFrom));

    var edit = el("button", null, "Edit");
    edit.disabled = !canWrite();
    edit.onclick = function(){ $("dlg").close(); editVial(v); };
    foot.appendChild(edit);
    var take = el("button", "primary", "Took it");
    take.disabled = !canWrite();
    take.onclick = function(){ $("dlg").close(); takeVial(v); };
    foot.appendChild(take);
    $("dlg").showModal();
  }

  // Admin picks a member from a third select before Unit/Box -- the same two selects a
  // member uses for their own boxes, just fed by that member's real state instead. The
  // box grid renders `static` (see boxGrid()), so no cell opens the slot dialog and
  // nothing here can ever write anywhere.
  function renderBoxes(){
    $("bxOwnerField").hidden = !isAdminUser();
    if (!isAdminUser()){ renderBoxesBody(false); return; }

    if (!labCache.members){
      clear($("bxGrid")).appendChild(el("div", "empty", "Loading the lab…"));
      clear($("bxLines"));
      ensureLabCache().then(renderBoxes);
      return;
    }
    var names = labCache.members.slice().sort();
    if (!names.length){
      clear($("bxGrid")).appendChild(el("div", "empty", "No member has any boxes yet."));
      clear($("bxLines"));
      return;
    }
    if (!boxView.owner || names.indexOf(boxView.owner) === -1) boxView.owner = names[0];
    var os = clear($("bxOwner"));
    names.forEach(function(name){
      var o = document.createElement("option");
      o.value = name; o.textContent = name; o.selected = name === boxView.owner;
      os.appendChild(o);
    });

    var real = state;
    ADMIN_MERGED = true;
    state = labCache.data[boxView.owner] || E.blankState();
    try { renderBoxesBody(true); } finally { state = real; ADMIN_MERGED = false; }
  }

  function renderBoxesBody(readOnly){
    var units = state.storage.units || [];
    if (!units.length){
      clear($("bxGrid")).appendChild(el("div", "empty", "No freezer set up yet — Settings → Storage."));
      clear($("bxLines"));
      return;
    }
    if (!boxView.unitId || !E.findUnit(state, boxView.unitId)) boxView.unitId = units[0].id;

    var us = clear($("bxUnit"));
    units.forEach(function(u){
      var o = document.createElement("option");
      o.value = u.id; o.textContent = u.name; o.selected = u.id === boxView.unitId;
      us.appendChild(o);
    });

    var bs = clear($("bxBox"));
    var first = null;
    E.eachBox(state, function(box, rack, unit){
      if (unit.id !== boxView.unitId) return;
      if (!first) first = box.id;
      var occ = E.occupancy(state, box.id);
      var o = document.createElement("option");
      o.value = box.id;
      o.textContent = box.name + " — " + occ.used + "/" + occ.capacity;
      bs.appendChild(o);
    });
    if (!boxView.boxId || !E.findBox(state, boxView.boxId) ||
        E.findBox(state, boxView.boxId).unit.id !== boxView.unitId) boxView.boxId = first;
    bs.value = boxView.boxId;

    var g = clear($("bxGrid"));
    if (!boxView.boxId){ g.appendChild(el("div", "empty", "This unit has no boxes yet.")); return; }
    g.appendChild(boxGrid(boxView.boxId, { highlight: boxView.highlight, static: !!readOnly }));

    var occ = E.occupancy(state, boxView.boxId);
    $("bxOcc").textContent = occ.used + " of " + occ.capacity + " slots full · " + occ.free + " free";
    $("bxBar").style.width = (occ.capacity ? (occ.used / occ.capacity * 100) : 0) + "%";

    // What is actually in this box, so the colours mean something.
    var lines = clear($("bxLines"));
    lines.appendChild(el("h3", null, "In this box"));
    var byOrigin = {};
    occ.slots.forEach(function(s){
      if (!s.vial) return;
      var o = originOf(s.vial);
      if (!byOrigin[o]) byOrigin[o] = { n: 0, rows: {}, lines: {} };
      var g = byOrigin[o];
      g.n++;
      g.rows[s.position.replace(/\d+$/, "")] = true;
      var k = s.vial.lineId || s.vial.name;
      if (!g.lines[k]) g.lines[k] = { name: s.vial.name, n: 0, positions: [] };
      g.lines[k].n++;
      g.lines[k].positions.push(s.position);
    });
    var origins = Object.keys(byOrigin).sort(function(a, b){ return byOrigin[b].n - byOrigin[a].n; });
    if (!origins.length){ lines.appendChild(el("div", "empty", "Empty.")); return; }
    origins.forEach(function(o){
      var g = byOrigin[o];
      var head = el("div", "item");
      var dot = el("div");
      dot.style.cssText = "width:14px;height:14px;border-radius:4px;flex:0 0 auto;margin-top:3px;background:" + tintFor(o);
      head.appendChild(dot);
      var grow = el("div", "grow");
      var title = el("div", null, o);
      title.style.fontWeight = "650";
      grow.appendChild(title);
      var rowNames = Object.keys(g.rows).sort();
      grow.appendChild(el("div", "sub", g.n + " vial" + (g.n === 1 ? "" : "s") + " · row" +
        (rowNames.length === 1 ? " " : "s ") + rowNames.join(", ")));
      Object.keys(g.lines).sort(function(a, b){ return g.lines[b].n - g.lines[a].n; }).forEach(function(k){
        var l = g.lines[k];
        grow.appendChild(el("div", "sub", "· " + l.name + " — " + l.positions.join(", ")));
      });
      head.appendChild(grow);
      lines.appendChild(head);
    });
  }

  // =====================================================================
  // Review -- the queues the import left behind
  // =====================================================================

  // Admin sees every member's review queue merged onto this one screen, but never acts
  // on it here -- that would mean writing to someone else's file through a screen that
  // was never built to know whose file it is. So each member's own real `state` is
  // swapped in just long enough to build their section with the exact same code path a
  // member sees for their own queue (their own rules, correctly), then swapped back --
  // ADMIN_MERGED (checked by every button below) makes every one of those buttons
  // disabled while it's true, so nothing rendered during the swap can ever fire.
  function renderReview(){
    var box = clear($("reviewBody"));
    if (isAdminUser()){
      renderMergedByOwner(box, renderReview, function(container){
        var q = E.reviewQueue(state);
        if (!q.total) return false;
        renderReviewBody(container);
        return true;
      }, "Nothing to review, lab-wide.");
      return;
    }
    renderReviewBody(box);
  }

  function renderReviewBody(box){
    var q = E.reviewQueue(state);

    if (!q.total){
      box.appendChild(el("div", "empty", "Nothing to review. Everything the import wasn't sure about has been answered."));
      return;
    }

    // ---- rows an import couldn't place at all ----
    if (q.ambiguousImport.length){
      var ic = el("div", "card");
      ic.appendChild(el("h3", null, "Rows we weren't sure about (" + q.ambiguousImport.length + ")"));
      ic.appendChild(el("p", "note",
        "No name, or no position that fits inside its box — rather than guess, these came in with " +
        "no location. They won't show up in Find until fixed here."));
      q.ambiguousImport.slice(0, 60).forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        var raw = v.importRaw || {};
        grow.appendChild(el("div", "sub",
          "sheet row " + (raw.row || "?") + ": name " + (raw.name ? "\"" + raw.name + "\"" : "(blank)") +
          ", position " + (raw.position ? "\"" + raw.position + "\"" : "(blank)") +
          (raw.box ? " in " + raw.box : "")));
        row.appendChild(grow);
        var fix = el("button", null, "Fix");
        fix.disabled = !canWrite() || ADMIN_MERGED;
        fix.onclick = function(){ resolveAmbiguousImport(v); };
        row.appendChild(fix);
        ic.appendChild(row);
      });
      if (q.ambiguousImport.length > 60) ic.appendChild(el("p", "note", "…and " + (q.ambiguousImport.length - 60) + " more."));
      box.appendChild(ic);
    }

    // ---- dates ----
    if (q.dates.length){
      var c = el("div", "card");
      c.appendChild(el("h3", null, "Dates to confirm (" + q.dates.length + ")"));
      c.appendChild(el("p", "note",
        "This column was typed day-month-year, but the spreadsheet read whatever it could as " +
        "month-day and converted it — so these have their day and month the wrong way round. " +
        "Nothing was changed automatically. Until a date is confirmed the vial stays out of the " +
        "date slider, but it is still findable by name."));

      var swappable = q.dates.filter(function(d){ return d.date.proposed; });
      if (swappable.length){
        var all = el("button", "primary", "Accept the swap for all " + swappable.length);
        all.disabled = !canWrite() || ADMIN_MERGED;
        all.onclick = function(){
          var next = state;
          swappable.forEach(function(d){
            var r = E.confirmDate(next, d.vial.id, d.date.proposed);
            if (r.ok) next = r.state;
          });
          state = next;
          markDirty("Confirm " + swappable.length + " dates");
          renderAll();
        };
        c.appendChild(all);
      }

      q.dates.slice(0, 40).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.vial.name));
        var sub = d.vial.frozenRaw
          ? "sheet says " + d.vial.frozenRaw + (d.date.asWritten ? " (reads as " + prettyDate(d.date.asWritten) + ")" : "")
          : "no date at all";
        grow.appendChild(el("div", "sub", sub + " · " + E.locationPath(state, d.vial.location)));
        row.appendChild(grow);

        if (d.date.proposed){
          var b = el("button", null, prettyDate(d.date.proposed));
          b.disabled = !canWrite() || ADMIN_MERGED;
          b.onclick = function(){
            var r = E.confirmDate(state, d.vial.id, d.date.proposed);
            if (!r.ok){ showBanner(esc(r.reason)); return; }
            state = r.state; markDirty("Confirm a date"); renderAll();
          };
          row.appendChild(b);
        } else {
          var t = el("button", null, "Type it");
          t.disabled = !canWrite() || ADMIN_MERGED;
          t.onclick = function(){ askDate(d.vial); };
          row.appendChild(t);
        }
        c.appendChild(row);
      });
      if (q.dates.length > 40) c.appendChild(el("p", "note", "…and " + (q.dates.length - 40) + " more."));
      box.appendChild(c);
    }

    // ---- facets ----
    if (q.facets.length){
      var fc = el("div", "card");
      fc.appendChild(el("h3", null, "Facets the rules read differently (" + q.facets.length + ")"));
      fc.appendChild(el("p", "note",
        "The spreadsheet's own formulas had five bugs. These are the rows where the corrected " +
        "rules disagree with what the sheet wrote. Nothing here needs doing — it's shown so the " +
        "change isn't silent. Dismissing accepts the new reading."));
      q.facets.slice(0, 60).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.name));
        var bits = Object.keys(d.changed).map(function(f){
          return f + ": " + d.changed[f].sheet + " → " + d.changed[f].now;
        });
        grow.appendChild(el("div", "sub", bits.join(" · ")));
        row.appendChild(grow);
        fc.appendChild(row);
      });
      if (q.facets.length > 60) fc.appendChild(el("p", "note", "…and " + (q.facets.length - 60) + " more."));
      var dismiss = el("button", null, "Accept all of these");
      dismiss.disabled = !canWrite() || ADMIN_MERGED;
      dismiss.onclick = function(){
        state.vials.forEach(function(v){ delete v.facetsFromSheet; });
        markDirty("Accept the corrected facets");
        renderAll();
      };
      fc.appendChild(dismiss);
      box.appendChild(fc);
    }

    // ---- gaps ----
    if (q.gaps.length){
      var gc = el("div", "card");
      gc.appendChild(el("h3", null, "Names no rule covers (" + q.gaps.length + ")"));
      gc.appendChild(el("p", "note",
        "The sheet wrote #N/A for these, which reads like a value but isn't one. Add a rule and " +
        "they fill themselves in — that's what Settings → Rules is for."));
      var byName = {};
      q.gaps.forEach(function(g){ byName[g.name] = (byName[g.name] || 0) + 1; });
      Object.keys(byName).sort().forEach(function(n){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", byName[n] + " vial" + (byName[n] === 1 ? "" : "s")));
        row.appendChild(grow);
        gc.appendChild(row);
      });
      var add = el("button", "primary", "Add a rule");
      add.disabled = ADMIN_MERGED;
      add.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
      gc.appendChild(add);
      box.appendChild(gc);
    }

    // ---- vials with no passage recorded ----
    if (q.unknownPassage.length){
      var uc = el("div", "card");
      uc.appendChild(el("h3", null, "Passage not recorded (" + q.unknownPassage.length + ")"));
      uc.appendChild(el("p", "note",
        "The sheet says p? for these. They are still findable by name, and the passage slider " +
        "keeps them behind its \u201cinclude unknown\u201d toggle rather than dropping them. " +
        "Fill one in whenever you happen to know it."));
      var byName = {};
      q.unknownPassage.forEach(function(v){
        if (!byName[v.name]) byName[v.name] = [];
        byName[v.name].push(v);
      });
      Object.keys(byName).sort().slice(0, 60).forEach(function(n){
        var list = byName[n];
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", list.length + " vial" + (list.length === 1 ? "" : "s") +
          " · " + list.map(function(v){ return E.locationPath(state, v.location).split(" → ").slice(-2).join(" "); }).join(", ")));
        row.appendChild(grow);
        var b = el("button", null, list.length === 1 ? "Fill in" : "Fill in first");
        b.disabled = !canWrite() || ADMIN_MERGED;
        b.onclick = function(){ editVial(list[0]); };
        row.appendChild(b);
        uc.appendChild(row);
      });
      if (Object.keys(byName).length > 60) uc.appendChild(el("p", "note", "…and more."));
      box.appendChild(uc);
    }

    // ---- rows holding more than one kind of cell ----
    if (q.rows.length){
      var rc = el("div", "card");
      rc.appendChild(el("h3", null, "Rows holding two kinds of cell (" + q.rows.length + ")"));
      rc.appendChild(el("p", "note",
        "A row is meant to hold one kind of cell — that is how the freezer is laid out, and it is " +
        "what the app follows when it proposes a place. These rows do not. Most of them are rows " +
        "carrying vials no origin rule covers yet, so adding the rule fixes the row too."));
      q.rows.forEach(function(m){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, m.box + " row " + m.label));
        grow.appendChild(el("div", "sub", m.origins.map(function(o){
          return o + " × " + m.counts[o];
        }).join("  ·  ")));
        row.appendChild(grow);
        var b = el("button", null, "Show");
        b.disabled = ADMIN_MERGED;
        b.onclick = function(){
          boxView.unitId = E.findBox(state, m.boxId).unit.id;
          boxView.boxId = m.boxId;
          boxView.highlight = [];
          go("boxes");
        };
        row.appendChild(b);
        rc.appendChild(row);
      });

      pc.appendChild(el("p", "note",

  function renderLog(){

        if (!(state.withdrawals || []).length) return false;

  // Fetched fresh every time Settings is opened (not cached like ensureLabCache() --
  // approving or denying changes this list, so a stale copy would show a request as
  // still-pending after acting on it). Renders synchronously with whatever it already
  // has, then re-renders once the fetch resolves.
  var notifications = null;
  function renderNotifications(){
    var wu = getWorkerUser();
    var n = clear($("notificationsCard"));
    if (!wu) return;
    n.appendChild(el("h3", null, "Notifications"));
    if (!messagesCache) ensureMessagesCache().then(renderNotifications);

    var bField = el("div", "field");
    bField.appendChild(el("label", null, "Send to the lab"));
    var bText = document.createElement("textarea");
    bText.rows = 2;
    bText.placeholder = wu.canBroadcast || wu.role === "admin"
      ? message("broadcast-placeholder-direct", "Goes straight to everyone…")
      : message("broadcast-placeholder-queued", "Goes to an admin for approval first…");
    bField.appendChild(bText);
    var bSend = el("button", null, "Send");
    bSend.style.marginTop = "6px";
    bSend.onclick = async function(){
      var text = bText.value.trim();
      if (!text) return;
      bSend.disabled = true;
      try {
        var res = await workerFetch("/broadcasts", {
          method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() },
          body: JSON.stringify({ text:text })
        });
        bText.value = "";
        showBanner(res.broadcast && res.broadcast.status === "sent"
          ? "Sent to the lab."
          : "Sent to an admin for approval.");
      } catch(err){
        showBanner("Couldn't send that: " + esc(err.message));
      }
      bSend.disabled = false;
    };
    bField.appendChild(bSend);
    n.appendChild(bField);

    if (notifications === null){
      n.appendChild(el("p", "note", "Checking…"));
      workerFetch("/notifications", { headers:{ Authorization:"Bearer " + getWorkerToken() } })
        .then(function(body){ notifications = body.notifications || []; renderNotifications(); })
        .catch(function(){ notifications = []; renderNotifications(); });
      return;
    }
    if (!notifications.length){
      n.appendChild(el("p", "note", "Nothing yet."));
      return;
    }
    notifications.forEach(function(note){
      var item = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, note.text));
      grow.appendChild(el("div", "sub", prettyDate(note.createdAt.slice(0, 10))));
      item.appendChild(grow);
      if (note.type === "request" && !note.read){
        var approve = el("button", "primary", "Approve");
        approve.onclick = function(){ resolveRequestNotification(note, "approve"); };
        item.appendChild(approve);
        var deny = el("button", "danger", "Deny");
        deny.onclick = function(){ resolveRequestNotification(note, "deny"); };
        item.appendChild(deny);
      } else if (note.type === "broadcast-pending" && !note.read){
        var bApprove = el("button", "primary", "Send it");
        bApprove.onclick = function(){ resolveBroadcastNotification(note, "approve"); };
        item.appendChild(bApprove);
        var bDeny = el("button", "danger", "Don't send");
        bDeny.onclick = function(){ resolveBroadcastNotification(note, "deny"); };
        item.appendChild(bDeny);
      } else if (!note.read){
        var ok = el("button", null, "OK");
        ok.onclick = function(){ markNotificationRead(note); };
        item.appendChild(ok);
      }
      n.appendChild(item);
    });
  }

  async function markNotificationRead(note){
    try {
      await workerFetch("/notifications/" + note.id + "/read", {
        method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() }
      });
    } catch(err){ /* not fatal -- it'll just show again next time Settings opens */ }
    notifications = (notifications || []).map(function(x){ return x.id === note.id ? Object.assign({}, x, { read:true }) : x; });
    renderNotifications();
  }

  // Approving marks the app's OWN vial "reserved for" the requester and saves it
  // normally (an ordinary edit through the usual markDirty()/save() path) -- the vial
  // never moves, physically or in the data, per Umut's answer on this (see
  // cellstocks-worker/README.md). The Worker only ever sees the request/notification
  // bookkeeping, never the vial itself.
  async function resolveRequestNotification(note, decision){
    try {
      await workerFetch("/requests/" + note.requestId + "/" + decision, {
        method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() }
      });
    } catch(err){
      showBanner("Couldn't " + decision + " that request: " + esc(err.message));
      return;
    }
    if (decision === "approve" && note.vialId){
      var vial = E.indexById(state.vials)[note.vialId];
      if (vial){
        vial.reservedFor = note.fromUser;
        markDirty("Reserve " + vial.name + " for " + note.fromUser);
      }
    }
    await markNotificationRead(note);
    renderAll();
  }

  async function resolveBroadcastNotification(note, decision){
    try {
      await workerFetch("/broadcasts/" + note.broadcastId + "/" + decision, {
        method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() }
      });
    } catch(err){
      showBanner("Couldn't " + (decision === "approve" ? "send" : "refuse") + " that: " + esc(err.message));
      return;
    }
    await markNotificationRead(note);
  }

  // Builds the login/connect UI into whichever container asks for it -- the mandatory
  // login gate (#gateBody, shown before anyone is identified) and Settings' own
  // Connect card (#connectCard, for managing the connection once already in) render the
  // exact same thing, so there is exactly one place that knows how to log in or out.
  function renderConnect(container){
    var c = clear(container);
    c.appendChild(el("h3", null, "Connect"));

    // ---- log in (worker auth) ----
    var wu = getWorkerUser();
    if (wu){
      c.appendChild(el("p", "note",
        "Logged in as " + esc(wu.name) + (wu.role === "admin" ? " (admin)" : "") + ". Changes go through " +
        esc(getWorkerUrl()) + "."));
      var lo = el("button", "danger", "Log out");
      lo.id = "workerLogoutBtn";
      lo.onclick = async function(){
        lo.disabled = true;
        await workerLogout();
        afterAuthChange();
      };
      c.appendChild(lo);
    } else {
      c.appendChild(el("p", "note",
        "Log in with the name and password an admin set up for you. This is the lab-wide way in — " +
        "your own boxes, kept separate from everyone else's."));
      // A real <form> boundary -- without one, Safari's passkey/password heuristic treats
      // unrelated fields elsewhere on the page (like the plain search box) as part of this
      // "login form" too, since it has nothing else to scope to.
      var wform = document.createElement("form");
      wform.autocomplete = "off";
      var wurl = document.createElement("input");
      wurl.placeholder = "Worker address (https://…workers.dev)";
      wurl.value = getWorkerUrl() || "";
      wurl.autocomplete = "off";
      var wname = document.createElement("input");
      wname.placeholder = "Name"; wname.style.marginTop = "8px"; wname.autocomplete = "off";
      var wpass = document.createElement("input");
      // Deliberately "off", not "current-password" -- everyone in the lab logs in
      // through this one shared form/origin, so iCloud Keychain / Safari's password
      // manager was offering whichever account it had saved (not necessarily the one
      // being typed), which is actively wrong here rather than a convenience.
      wpass.type = "password"; wpass.placeholder = "Password"; wpass.autocomplete = "off";
      wpass.style.marginTop = "8px";
      wform.appendChild(wurl); wform.appendChild(wname); wform.appendChild(wpass);
      var wgo = el("button", "primary", "Log in");
      wgo.type = "button";
      wgo.id = "workerLoginBtn";
      wgo.style.marginTop = "8px";
      wgo.onclick = async function(){
        if (!wurl.value.trim() || !wname.value.trim() || !wpass.value) return;
        wgo.disabled = true;
        try {
          await workerLogin(wurl.value.trim(), wname.value.trim(), wpass.value);
          // The instant the active account changes, drop whatever was on screen for the
          // previous one -- load() will fill this back in from this account's own data (or
          // leave it blank, for a fresh account) once the fetch resolves.
          state = E.blankState();
          hideBanner();
          await load();
          afterAuthChange();
        } catch(err){
          showBanner("Couldn't log in: " + esc(err.message));
        }
        wgo.disabled = false;
      };
      wform.appendChild(wgo);
      c.appendChild(wform);
    }

    // ---- GitHub token (the older, per-device way in) ----
    c.appendChild(el("h3", null, "GitHub token"));
    if (getToken()){
      c.appendChild(el("p", "note", "Connected as " + getDevice() + ". Changes are committed to " + REPO + "."));
      var out = el("button", "danger", "Forget the token on this device");
      out.onclick = function(){
        try { localStorage.removeItem(LS.token); } catch(e){}
        afterAuthChange();
      };
      c.appendChild(out);
    } else {
      c.appendChild(el("p", "note",
        "Paste a GitHub personal access token with Contents: Read and write for " +
        (REPO || "this repository") + ". It stays on this device, and it is this app's own — " +
        "nothing else on this host reads or writes it."));
      var tform = document.createElement("form");
      tform.autocomplete = "off";
      var tok = document.createElement("input");
      tok.type = "password"; tok.placeholder = "github_pat_…"; tok.autocomplete = "off";
      var dev = document.createElement("input");
      dev.placeholder = "What is this device called?";
      dev.value = getDevice() === "unknown device" ? "" : getDevice();
      dev.style.marginTop = "8px"; dev.autocomplete = "off";
      tform.appendChild(tok); tform.appendChild(dev);
      c.appendChild(tform);
      var go2 = el("button", "primary", "Connect");
      go2.type = "button";
      go2.style.marginTop = "8px";
      go2.onclick = async function(){
        if (!tok.value.trim()) return;
        go2.disabled = true;
        try {
          var r = await fetch(API + "/contents/" + LEGACY_DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
            { headers: { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
                         "Authorization":"Bearer " + tok.value.trim() } });
          if (!r.ok && r.status !== 404) throw new Error("GitHub said " + r.status);
          localStorage.setItem(LS.token, tok.value.trim());
          localStorage.setItem(LS.device, dev.value.trim() || "a device");
          hideBanner();
          await load();
          afterAuthChange();
        } catch(err){
          showBanner("That token didn't work: " + esc(err.message));
        }
        go2.disabled = false;
      };
      c.appendChild(go2);
    }
    var themeField = el("div", "field");
    themeField.appendChild(el("label", null, "Appearance"));
    var themeSeg = el("div", "seg");
    var currentTheme = (function(){ try { return localStorage.getItem(LS.theme) || "system"; } catch(e){ return "system"; } })();
    [{ id:"system", name:"System" }, { id:"light", name:"Light" }, { id:"dark", name:"Dark" }].forEach(function(opt){
      var b = el("button", currentTheme === opt.id ? "on" : null, opt.name);
      b.onclick = function(){
        if (opt.id === "system") {
          document.documentElement.removeAttribute("data-theme");
          try { localStorage.removeItem(LS.theme); } catch(e){}
        } else {
          document.documentElement.setAttribute("data-theme", opt.id);
          try { localStorage.setItem(LS.theme, opt.id); } catch(e){}
        }
        renderConnect(container);
      };
      themeSeg.appendChild(b);
    });
    themeField.appendChild(themeSeg);
    c.appendChild(themeField);
  }

  // Nothing about anyone's inventory ever renders before someone is identified -- either
  // a worker login or a legacy GitHub token, both of which canWrite() already recognizes.
  // Called after every login, logout, or token change, and once at boot.
  // Admin never has a Freeze tab -- they have no inventory of their own to freeze into
  // (see the "Admin" tab's "Manage a box" instead) -- and gets the Admin tab nobody else
  // does. Re-checked on every login/logout, since the same tab can move between a member
  // and an admin account over a session.
  function updateNavForRole(){
    var admin = isAdminUser();
    $("navFreeze").hidden = admin;
    $("navAdmin").hidden = !admin;
    if (admin && screen === "freeze") screen = "find";
  }

  function afterAuthChange(){
    var authed = canWrite();
    document.body.classList.toggle("gated", !authed);
    updateNavForRole();
    if (!authed){
      renderConnect($("gateBody"));
      setStatus("Read-only", "");
      return;
    }
    setStatus("Ready", "");
    go(screen);
  }

  function renameBox(box){
    $("dlgTitle").textContent = "Rename " + box.name;

  function addRuleDialog(facet){
    $("dlgTitle").textContent = "A rule for " + facet;

    body.appendChild(el("p", "note",
      "If a name contains the text on the left, this facet becomes the value on the right. " +
      "Rules are tried in order and the new one goes first."));
    var match = document.createElement("input"); match.placeholder = "LCC"; match.autocomplete = "off";
    var value = document.createElement("input"); value.placeholder = "LCC"; value.autocomplete = "off";
    [["If the name contains", match], ["then " + facet + " is", value]].forEach(function(p){
      var f = el("div", "field");

      f.appendChild(p[1]);
      body.appendChild(f);
    });
    var preview = el("p", "note");
    body.appendChild(preview);
    function refresh(){
      if (!match.value.trim() || !value.value.trim()){ preview.textContent = ""; return; }
      var trial = JSON.parse(JSON.stringify(state.rules));
      trial[facet].unshift({ match: match.value.trim(), value: value.value.trim() });
      var before = E.classifyAll(state, state.rules);
      var after = E.classifyAll(state, trial);
      var n = 0;
      state.vials.forEach(function(v){
        if (E.classify(v.name, trial)[facet] !== E.classify(v.name, state.rules)[facet]) n++;
      });
      preview.textContent = "This would change " + n + " of " + state.vials.length + " vials, and close " +
        (before.gaps.length - after.gaps.length) + " of the " + before.gaps.length + " gaps.";
    }
    match.oninput = refresh; value.oninput = refresh;
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Add the rule");
    ok.onclick = function(){
      if (!match.value.trim() || !value.value.trim()) return;
      state.rules[facet].unshift({ match: match.value.trim(), value: value.value.trim() });
      $("dlg").close(); markDirty("Add a " + facet + " rule"); renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  // =====================================================================
  // Import

  function openImport(){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    input.onchange = function(){ if (input.files && input.files[0]) startImport(input.files[0]); };
    input.click();
  }

  async function startImport(file){
    var wb;
    setStatus("Reading…", "saving");
    try {
      wb = await X.readWorkbook(await file.arrayBuffer());
    } catch(err){
      setStatus("Ready", "");
      showBanner("Couldn't read that file: " + esc(err.message));
      return;
    }
    setStatus("Ready", "");
    if (!wb.sheets.length){ showBanner("That workbook has no sheets."); return; }

    // Sheet picker. Everything is listed, nothing is chosen for you when there is
    // more than one -- this is somebody's whole lab in one file.
    $("dlgTitle").textContent = "Which sheet?";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", file.name + " has " + wb.sheets.length + " sheet" +
      (wb.sheets.length === 1 ? "" : "s") + ". Only one is imported."));
    wb.sheets.forEach(function(sh){
      var rows = sh.rows.filter(function(r){ return r && r.some(function(c){ return c && c.text; }); }).length;
      var b = el("button", null, sh.name + " — " + rows + " rows");
      b.style.width = "100%"; b.style.textAlign = "left"; b.style.marginBottom = "6px";
      b.disabled = !rows;
      b.onclick = function(){ mapColumns(file.name, sh); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function mapColumns(fileName, sheet){
    $("dlgTitle").textContent = "What is in each column?";
    var body = clear($("dlgBody"));
    var guesses = E.guessColumns(sheet.rows, 0, sheet.merges);
    var map = {};
    // A returning member's own confirmed layout (from the last time they imported)
    // takes priority over a fresh guess -- but it is still only ever a pre-selection
    // on the same screen that shows and lets them override it, never applied silently.
    var saved = state.settings && state.settings.columnMap;
    var usedSaved = false;
    if (saved && Object.keys(saved).length){
      Object.keys(saved).forEach(function(role){
        if (typeof saved[role] === "number") { map[role] = saved[role]; usedSaved = true; }
      });
    }
    guesses.forEach(function(g){ if (g.role !== "ignore" && map[g.role] === undefined) map[g.role] = g.index; });

    body.appendChild(el("p", "note",
      (usedSaved ? "Pre-filled from how you mapped your last import, plus a fresh guess for anything new. " : "Guessed from the headers and the first rows. ") +
      "A column filled by a formula shows the " +
      "formula, so a value that was calculated from another column can be mapped to its source " +
      "instead of imported as if it had been typed."));

    guesses.forEach(function(g){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, g.letter + (g.header ? " — " + g.header : " — (no header)")));
      var sample = [];
      var formula = null;
      for (var r = 1; r < Math.min(sheet.rows.length, 30) && sample.length < 3; r++){
        var c = (sheet.rows[r] || [])[g.index];
        if (!c) continue;
        if (!formula && c.formula) formula = c.formula;
        if (c.text) sample.push(c.text);
      }
      grow.appendChild(el("div", "sub", sample.join(" · ") || "(empty)"));
      if (formula){
        var f = el("div", "sub mono", formula.length > 90 ? formula.slice(0, 90) + "…" : formula);
        f.style.color = "var(--guess)";
        grow.appendChild(f);
      }
      row.appendChild(grow);

      var sel = document.createElement("select");
      sel.style.width = "auto";
      E.ROLES.forEach(function(role){
        var o = document.createElement("option");
        o.value = role; o.textContent = role;
        o.selected = map[role] === g.index || (role === "ignore" && Object.keys(map).every(function(k){ return map[k] !== g.index; }));
        sel.appendChild(o);
      });
      sel.onchange = function(){
        Object.keys(map).forEach(function(k){ if (map[k] === g.index) delete map[k]; });
        if (sel.value !== "ignore") map[sel.value] = g.index;
      };
      row.appendChild(sel);
      body.appendChild(row);
    });

    var foot = clear($("dlgFoot"));
    var next = el("button", "primary", "Look at what it found");
    next.onclick = function(){
      if (map.name === undefined || map.position === undefined){
        showBanner("At least a name column and a position column are needed.");
        return;
      }
      previewImport(fileName, sheet, map);
    };
    foot.appendChild(next);
    $("dlg").showModal();
  }

  function previewImport(fileName, sheet, map){
    var out = E.importSheet(sheet, {
      headerRow: 1, columns: map, rules: state.rules, customFlags: state.settings.customFlags,
      unitId: "u-f80", rackId: "r-1", unitName: "-80 °C Freezer", unitType: "freezer",
      childLabel: "Rack", rackName: "Rack 1",
      sourceName: fileName, idPrefix: "v", unnamedBoxName: "Unnamed box"
    });
    var rep = out.report;

    $("dlgTitle").textContent = "Before anything is written";
    var body = clear($("dlgBody"));
    function line(text, bad){
      var p = el("p", "note", text);
      if (bad) p.style.color = "var(--bad)";
      body.appendChild(p);
    }
    line(rep.imported + " vials out of " + rep.rows + " rows, in " + rep.boxes.length + " boxes.");
    rep.boxes.forEach(function(b){ line("　" + b.name + " — " + b.rows + " × " + b.cols); });
    if (rep.dateQueue) line(rep.dateQueue + " dates can't be read unambiguously and will wait in Review.");
    if (rep.facetDiffs) line(rep.facetDiffs + " rows where the corrected rules disagree with the sheet.");
    if (rep.gaps.length) line(rep.gaps.length + " rows whose name no rule covers.");
    if (rep.uncalculated) line(rep.uncalculated + " cells hold a formula with no calculated result — " +
      "those come in empty. Reopen and save the file in Excel or Sheets first.", true);
    if (rep.collisions.length) line(rep.collisions.length + " rows want a slot another row already took; " +
      "they will be dropped.", true);
    if (rep.skipped.length) line(rep.skipped.length + " rows couldn't be placed (no name, or a position " +
      "outside their box) — they'll come in with no location, waiting in Review instead of being guessed.", true);
    rep.skipped.slice(0, 5).forEach(function(s){ line("　row " + s.row + ": " + (s.name || "(no name)") + " — " + s.why, true); });
    var errs = E.errorsOnly(rep.problems);
    if (errs.length) line(errs.length + " problems that would make the inventory wrong.", true);

    var warn = el("p", "note");
    warn.style.color = "var(--warn-text)";
    warn.textContent = "This replaces the whole inventory — all " + state.vials.length +
      " vials currently here, and the boxes they live in.";
    body.appendChild(warn);

    var foot = clear($("dlgFoot"));
    var go3 = el("button", "primary", "Replace the inventory");
    go3.disabled = !canWrite() || !!errs.length;

    // Dropping a row outright is exactly the kind of quiet data loss this app exists
    // to stop, so a real collision still has to be agreed to out loud. A row that
    // couldn't be placed is no longer dropped -- it comes in and waits in Review --
    // so it doesn't need the same "are you sure" gate, just the note above.
    var lost = rep.collisions.length;
    if (lost){
      var agree = el("label", "toggle");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.onchange = function(){ go3.disabled = !canWrite() || !!errs.length || !cb.checked; };
      agree.appendChild(cb);
      agree.appendChild(el("span", null, "I know " + lost + " row(s) will be thrown away — check the " +
        "column mapping first, especially which column holds the box name."));
      body.appendChild(agree);
      go3.disabled = true;
    }
    go3.onclick = function(){
      var keptRules = state.rules;
      state = E.mergeDefaults(out.state);
      state.rules = keptRules;
      state.settings.columnMap = map;
      $("dlg").close();
      markDirty("Import " + rep.imported + " vials from " + fileName);
      renderAll();
    };
    foot.appendChild(go3);
    $("dlg").showModal();
  }

  // =====================================================================
  // Admin -- the only place admin ever actually writes to a member's file. Find,
  // Boxes, Review and Log are read-only for admin (see ADMIN_MERGED above); every real
  // change -- adding, editing or withdrawing a vial, approving a request, renaming a
  // user -- happens on this one screen instead, each action naming exactly whose file
  // it commits to.
  // =====================================================================

  function adminAuth(){ return { Authorization: "Bearer " + getWorkerToken() }; }

  async function adminCommit(user, jsonState, message){
    var xlsxBytes = await X.writeWorkbookAsync(E.vialsToSheets(jsonState));
    return workerFetch("/commit", {
      method:"POST", headers: adminAuth(),
      body: JSON.stringify({
        files: [
          { path: DATA_PREFIX + user.toLowerCase() + ".json", content: E.serialise(jsonState) },
          { path: DATA_PREFIX + user.toLowerCase() + ".xlsx", content: bytesToBase64(xlsxBytes), base64: true }
        ],
        message: message || ("Admin change for " + user)
      })
    });
  }

  async function adminFetchState(user){
    var resp = await fetch(rawURL(DATA_PREFIX + user.toLowerCase() + ".json"), { cache:"no-store" });
    var text = resp.ok ? await resp.text() : "{}";
    return E.mergeDefaults(JSON.parse(text));
  }

  var adminTab = "manage";
  var adminUsersCache = null;
  async function adminUsers(){
    if (adminUsersCache) return adminUsersCache;
    var body = await workerFetch("/admin/users", { headers: adminAuth() });
    adminUsersCache = body.users;
    return adminUsersCache;
  }

  function renderAdmin(){
    Array.prototype.forEach.call(document.querySelectorAll("#adminTabs button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-admintab") === adminTab);
    });
    ["manage", "users", "requests", "messages", "history", "handoff"].forEach(function(t){
      $("admin-" + t).hidden = t !== adminTab;
    });
    if (adminTab === "manage") renderAdminManage();
    else if (adminTab === "users") renderAdminUsers();
    else if (adminTab === "requests") renderAdminRequests();
    else if (adminTab === "messages") renderAdminMessages();
    else if (adminTab === "history") renderAdminHistory();
    else if (adminTab === "handoff") renderAdminHandoff();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#adminTabs button"), function(b){
    b.onclick = function(){ adminTab = b.getAttribute("data-admintab"); renderAdmin(); };
  });

  // ---- Manage a box: the one place admin actually freezes, edits or withdraws a vial,
  // always straight into the real member's own file. ----
  var manageView = { user:null, state:null, unitId:null, boxId:null };

  async function renderAdminManage(){
    var c = clear($("admin-manage"));
    var users = await adminUsers().catch(function(err){ c.appendChild(el("p","note",err.message)); return []; });
    var visible = users.filter(function(u){ return !u.hidden; });

    var userSel = document.createElement("select");
    userSel.appendChild(el("option", null, "Choose a member…"));
    visible.forEach(function(u){
      var o = document.createElement("option"); o.value = u.name; o.textContent = u.name;
      if (u.name === manageView.user) o.selected = true;
      userSel.appendChild(o);
    });
    userSel.onchange = async function(){
      manageView.user = userSel.value || null;
      manageView.state = null; manageView.unitId = null; manageView.boxId = null;
      renderAdminManage();
    };
    var f = el("div", "field"); f.appendChild(el("label", null, "Member")); f.appendChild(userSel);
    c.appendChild(f);

    if (!manageView.user) return;
    if (!manageView.state){
      c.appendChild(el("p", "note", "Loading " + manageView.user + "'s boxes…"));
      manageView.state = await adminFetchState(manageView.user);
      renderAdminManage();
      return;
    }

    var s = manageView.state;
    var units = s.storage.units || [];
    if (!units.length){
      c.appendChild(el("p", "note", manageView.user + " has no freezer set up yet."));
    } else {
      if (!manageView.unitId || !E.findUnit(s, manageView.unitId)) manageView.unitId = units[0].id;
      var unitSel = document.createElement("select");
      units.forEach(function(u){
        var o = document.createElement("option"); o.value = u.id; o.textContent = u.name;
        o.selected = u.id === manageView.unitId; unitSel.appendChild(o);
      });
      unitSel.onchange = function(){ manageView.unitId = unitSel.value; manageView.boxId = null; renderAdminManage(); };
      var uf = el("div", "field"); uf.appendChild(el("label", null, "Unit")); uf.appendChild(unitSel);
      c.appendChild(uf);

      var boxSel = document.createElement("select");
      var first = null;
      E.eachBox(s, function(box, rack, unit){
        if (unit.id !== manageView.unitId) return;
        if (!first) first = box.id;
        var occ = E.occupancy(s, box.id);
        var o = document.createElement("option");
        o.value = box.id; o.textContent = box.name + " — " + occ.used + "/" + occ.capacity;
        boxSel.appendChild(o);
      });
      if (!manageView.boxId || !E.findBox(s, manageView.boxId) || E.findBox(s, manageView.boxId).unit.id !== manageView.unitId){
        manageView.boxId = first;
      }
      boxSel.value = manageView.boxId;
      boxSel.onchange = function(){ manageView.boxId = boxSel.value; renderAdminManage(); };
      var bf = el("div", "field"); bf.appendChild(el("label", null, "Box")); bf.appendChild(boxSel);
      c.appendChild(bf);

      if (manageView.boxId) renderAdminManageBox(c, s);
    }

    var addBox = el("button", null, "Add a box for " + manageView.user);
    addBox.style.marginTop = "10px";
    addBox.onclick = function(){ adminAddBoxDialog(); };
    c.appendChild(addBox);
  }

  function renderAdminManageBox(c, s){
    var occ = E.occupancy(s, manageView.boxId);
    c.appendChild(el("p", "note", occ.used + " of " + occ.capacity + " slots full"));

    var list = el("div");
    occ.slots.filter(function(sl){ return sl.vial; }).forEach(function(sl){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, sl.position + " · " + sl.vial.name));
      grow.appendChild(el("div", "sub", (sl.vial.passage || "p?") + (sl.vial.notes ? " · " + sl.vial.notes : "")));
      row.appendChild(grow);
      var wd = el("button", "danger", "Withdraw");
      wd.onclick = function(){ adminWithdraw(sl.vial); };
      row.appendChild(wd);
      list.appendChild(row);
    });
    c.appendChild(list);

    var add = el("button", "primary", "Add a vial here");
    add.style.marginTop = "8px";
    add.onclick = function(){ adminAddVialDialog(occ); };
    c.appendChild(add);
  }

  function adminAddBoxDialog(){
    $("dlgTitle").textContent = "Add a box for " + manageView.user;
    var body = clear($("dlgBody"));
    var s = manageView.state;
    var unitSel = document.createElement("select");
    (s.storage.units || []).forEach(function(u){
      (u.racks || []).forEach(function(rk){
        var o = document.createElement("option");
        o.value = u.id + "|" + rk.id; o.textContent = u.name + " → " + rk.name;
        unitSel.appendChild(o);
      });
    });

  // ---- Handoff ----
  function adminNewId(prefix){ return prefix + "-" + Math.random().toString(36).slice(2, 10); }

  var hoState = null, hoAssignments = {}, hoAllNames = [];

  async function renderAdminHandoff(){
    var c = clear($("admin-handoff"));
    c.appendChild(el("p", "note", "Pick who's leaving. Their boxes get handed off one at a time to whoever " +
      "should take over each -- a box left on “Keep with them” is untouched."));
    var users = await adminUsers().catch(function(){ return []; });
    hoAllNames = users.filter(function(u){ return !u.hidden; }).map(function(u){ return u.name; });
    var sel = document.createElement("select");
    hoAllNames.forEach(function(n){ var o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); });
    var f = el("div", "field"); f.appendChild(el("label", null, "Who's leaving")); f.appendChild(sel);
    c.appendChild(f);
    var leaving = document.createElement("input"); leaving.type = "checkbox";
    var lbl = el("label", null); lbl.style.cssText = "display:flex;align-items:center;gap:6px;margin:8px 0";
    lbl.appendChild(leaving); lbl.appendChild(document.createTextNode("This person has left the lab"));
    c.appendChild(lbl);
    var boxesWrap = el("div");
    c.appendChild(boxesWrap);
    var applyBtn = el("button", "primary", "Apply handoff");
    applyBtn.hidden = true;
    applyBtn.style.marginTop = "10px";
    c.appendChild(applyBtn);
    var msg = el("div");
    c.appendChild(msg);

    leaving.onchange = async function(){
      clear(boxesWrap); applyBtn.hidden = true; hoState = null; hoAssignments = {};
      if (!leaving.checked || !sel.value) return;
      hoState = await adminFetchState(sel.value);
      var boxes = [];
      E.eachBox(hoState, function(box, rack, unit){
        var count = (hoState.vials || []).filter(function(v){ return v.location && v.location.boxId === box.id; }).length;
        boxes.push({ unit:unit, rack:rack, box:box, count:count });
      });
      if (!boxes.length){ boxesWrap.appendChild(el("p", "note", sel.value + " has no boxes to hand off.")); return; }
      boxes.forEach(function(entry){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, entry.unit.name + " → " + entry.rack.name + " → " + entry.box.name));
        grow.appendChild(el("div", "sub", entry.count + " vials"));
        row.appendChild(grow);
        var assignSel = document.createElement("select");
        var keep = document.createElement("option"); keep.value = ""; keep.textContent = "Keep with " + sel.value;
        assignSel.appendChild(keep);
        hoAllNames.filter(function(n){ return n !== sel.value; }).forEach(function(n){
          var o = document.createElement("option"); o.value = n; o.textContent = n; assignSel.appendChild(o);
        });
        assignSel.onchange = function(){ hoAssignments[entry.box.id] = assignSel.value; };
        row.appendChild(assignSel);
        boxesWrap.appendChild(row);
      });
      applyBtn.hidden = false;
    };

    applyBtn.onclick = async function(){
      var user = sel.value;
      if (!hoState || !user) return;
      var byTarget = {};
      Object.keys(hoAssignments).forEach(function(boxId){
        var target = hoAssignments[boxId];
        if (target) (byTarget[target] = byTarget[target] || []).push(boxId);
      });
      var targetNames = Object.keys(byTarget);
      if (!targetNames.length){ clear(msg).appendChild(el("div", "note", "Nothing assigned yet.")); return; }
      applyBtn.disabled = true;
      try {
        var sourceState = E.mergeDefaults(JSON.parse(JSON.stringify(hoState)));
        var allMovedBoxIds = {};
        var prepared = [];
        for (var t = 0; t < targetNames.length; t++){
          var target = targetNames[t];
          var targetState = await adminFetchState(target);
          var newUnitId = adminNewId("u");
          var newRack = { id: adminNewId("r"), name: "From " + user, boxes: [] };
          targetState.storage.units.push({ id:newUnitId, name:"From " + user, type:"freezer", childLabel:"Rack", racks:[newRack] });
          byTarget[target].forEach(function(boxId){
            var found = E.findBox(sourceState, boxId);
            if (!found) return;
            allMovedBoxIds[boxId] = true;
            var newBoxId = adminNewId("b");
            newRack.boxes.push(JSON.parse(JSON.stringify(Object.assign({}, found.box, { id:newBoxId }))));
            sourceState.vials.forEach(function(v){
              if (v.location && v.location.boxId === boxId){
                var moved = JSON.parse(JSON.stringify(v));
                moved.location = { unitId:newUnitId, rackId:newRack.id, boxId:newBoxId, position:v.location.position };
                targetState.vials.push(moved);
              }
            });
          });
          var errors = E.errorsOnly(E.validate(targetState));
          if (errors.length) throw new Error(target + "'s inventory would be invalid after this handoff: " + errors[0].message);
          prepared.push({ name:target, state:targetState });
        }
        for (var i = 0; i < prepared.length; i++){
          await adminCommit(prepared[i].name, prepared[i].state, "Handoff: received boxes from " + user);
        }
        (sourceState.storage.units || []).forEach(function(u){
          (u.racks || []).forEach(function(r){ r.boxes = (r.boxes || []).filter(function(b){ return !allMovedBoxIds[b.id]; }); });
        });
        (sourceState.storage.units || []).forEach(function(u){ u.racks = (u.racks || []).filter(function(r){ return r.boxes.length; }); });
        sourceState.storage.units = (sourceState.storage.units || []).filter(function(u){ return u.racks.length; });
        sourceState.vials = sourceState.vials.filter(function(v){ return !(v.location && allMovedBoxIds[v.location.boxId]); });
        var sourceErrors = E.errorsOnly(E.validate(sourceState));
        if (sourceErrors.length) throw new Error("Every target was updated, but " + user + "'s own remaining inventory would be invalid: " + sourceErrors[0].message);
        await adminCommit(user, sourceState, "Handoff: gave away boxes to " + targetNames.join(", "));
        clear(msg).appendChild(el("div", "note", "Handed off " + Object.keys(allMovedBoxIds).length + " box(es) from " + user + " to " + targetNames.join(", ") + "."));
        leaving.checked = false; clear(boxesWrap); applyBtn.hidden = true; hoState = null; hoAssignments = {};
      } catch(err){ clear(msg).appendChild(el("div", "note", err.message)); }
      applyBtn.disabled = false;
    };
  }

    btn.appendChild(d);

  var rendering = false;
  function renderAll(){
    if (rendering) return;
    rendering = true;
    try {
      renderNavBadge();
      if (screen === "find"){ renderFilters(); renderResults(); }   // renderFilters re-follows the extents
      else if (screen === "freeze"){ renderFreezeUnits(); renderFreezeFacets(); renderFreezePlan(); renderFreezeGuard(); }
      else if (screen === "boxes") renderBoxes();
      else if (screen === "review") renderReview();
      else if (screen === "log") renderLog();
      else if (screen === "admin") renderAdmin();
      else if (screen === "settings") renderSettings();
    } finally { rendering = false; }
  }

  function renderFreezeGuard(){
    var why = $("fzWhyNot");

  }

  // ---- wiring ----
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.onclick = function(){ go(b.getAttribute("data-screen")); };
  });
  $("dlgX").onclick = function(){ $("dlg").close(); };

  var qTimer = null;
  $("q").oninput = function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ filter.query = $("q").value; renderResults(); }, 150);
  };

  $("fzName").oninput = function(){
    freeze.name = $("fzName").value;
    freeze.boxId = null;
    renderFreezeFacets();
    renderFreezePlan();
    renderFreezeGuard();
  };
  var COUNT_MIN = 1, COUNT_MAX = 81;
  function setCount(n, fromTyping){
    var v = Math.round(Number(n));
    if (!isFinite(v)) v = COUNT_MIN;
    v = Math.max(COUNT_MIN, Math.min(COUNT_MAX, v));
    freeze.count = v;
    // Don't fight the field while it is being typed in -- rewriting it mid-keystroke
    // makes "12" impossible to type, because the 1 becomes a 1 and the cursor jumps.
    if (!fromTyping) $("fzCount").value = String(v);
    $("fzMinus").disabled = v <= COUNT_MIN;
    $("fzPlus").disabled = v >= COUNT_MAX;
    renderFreezePlan();
    renderFreezeGuard();
  }
  $("fzCount").oninput = function(){ setCount($("fzCount").value, true); };
  // On the way out, put back whatever was actually settled on, so an emptied or
  // out-of-range field never sits there looking like it means something.
  $("fzCount").onblur = function(){ setCount(freeze.count); };
  $("fzMinus").onclick = function(){ setCount(freeze.count - 1); };
  $("fzPlus").onclick = function(){ setCount(freeze.count + 1); };
  setCount(freeze.count);
  $("fzUnit").onchange = function(){
    freeze.unitId = $("fzUnit").value; freeze.boxId = null; renderFreezePlan(); renderFreezeGuard();
  };
  $("fzGo").onclick = doFreeze;
  $("fzDate").value = new Date().toISOString().slice(0, 10);

  $("bxOwner").onchange = function(){
    boxView.owner = $("bxOwner").value; boxView.unitId = null; boxView.boxId = null; renderBoxes();
  };
  $("bxUnit").onchange = function(){ boxView.unitId = $("bxUnit").value; boxView.boxId = null; renderBoxes(); };
  $("bxBox").onchange = function(){ boxView.boxId = $("bxBox").value; renderBoxes(); };

  try {
    var t = localStorage.getItem(LS.theme);
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}

  // A freezer is shared, so take another look whenever the app comes back to the
  // front rather than trusting a copy that may be an hour old -- but only once someone
  // is actually logged in; nothing fetches anyone's inventory before that.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && !dirty && canWrite()) load();
  });

  $("appFooter").textContent = "© " + new Date().getFullYear() + " CAApp · Umut Cagiral · Built with Claude";

  cacheLoad();
  afterAuthChange();
  if (canWrite()) load();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
