  function addBoxDialog(){
    $("dlgTitle").textContent = "Add a box";
    var body = clear($("dlgBody"));
    var unit = document.createElement("select");
    (state.storage.units || []).forEach(function(u){
      (u.racks || []).forEach(function(rk){
        var o = document.createElement("option");
        o.value = u.id + "|" + rk.id;
        o.textContent = u.name + " → " + rk.name;
        unit.appendChild(o);
      });
    });
    var name = document.createElement("input"); name.placeholder = "Box 7";
    var rows = document.createElement("input"); rows.type = "number"; rows.min = 1; rows.value = 9;
    var cols = document.createElement("input"); cols.type = "number"; cols.min = 1; cols.value = 9;
    [["Where", unit], ["Name", name], ["Rows", rows], ["Columns", cols]].forEach(function(p){
      var f = el("div", "field");
      f.appendChild(el("label", null, p[0]));
      f.appendChild(p[1]);
      body.appendChild(f);
    });
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Add");
    ok.onclick = function(){
      if (!name.value.trim() || !unit.value) return;
      var parts = unit.value.split("|");
      var u = E.findUnit(state, parts[0]);
      var rk = (u.racks || []).filter(function(x){ return x.id === parts[1]; })[0];
      var id = "b-" + name.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      if (E.findBox(state, id)) id += "-" + Date.now().toString(36).slice(-4);
      rk.boxes.push({ id:id, name:name.value.trim(), rows:Number(rows.value), cols:Number(cols.value),
                      scheme:"grid", note:"", archived:false });
      $("dlg").close(); markDirty("Add a box"); renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function addUnitDialog(){
    $("dlgTitle").textContent = "Add a freezer or tank";
    var body = clear($("dlgBody"));
    var name = document.createElement("input"); name.placeholder = "LN2 Tank";
    var kind = document.createElement("select");
    [["freezer","Freezer — its children are Racks"], ["ln2","Nitrogen tank — its children are Towers"]]
      .forEach(function(k){
        var o = document.createElement("option"); o.value = k[0]; o.textContent = k[1]; kind.appendChild(o);
      });
    var count = document.createElement("input"); count.type = "number"; count.min = 1; count.value = 1;
    [["Name", name], ["Kind", kind], ["How many racks or towers?", count]].forEach(function(p){
      var f = el("div", "field");
      f.appendChild(el("label", null, p[0]));
      f.appendChild(p[1]);
      body.appendChild(f);
    });
    body.appendChild(el("p", "note", "Boxes go in afterwards. A tank is usually ten identical towers, " +
      "so they're made empty and named for you."));
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Add");
    ok.onclick = function(){
      if (!name.value.trim()) return;
      var childLabel = kind.value === "ln2" ? "Tower" : "Rack";
      var id = "u-" + name.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      if (E.findUnit(state, id)) id += "-" + Date.now().toString(36).slice(-4);
      var racks = [];
      for (var i = 1; i <= Math.max(1, Number(count.value)); i++){
        racks.push({ id: id + "-r" + i, name: childLabel + " " + i, boxes: [] });
      }
      state.storage.units.push({ id:id, name:name.value.trim(), type:kind.value, childLabel:childLabel, racks:racks });
      $("dlg").close(); markDirty("Add a unit"); renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function addRuleDialog(facet){
    $("dlgTitle").textContent = "A rule for " + facet;
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note",
      "If a name contains the text on the left, this facet becomes the value on the right. " +
      "Rules are tried in order and the new one goes first."));
    var match = document.createElement("input"); match.placeholder = "LCC";
    var value = document.createElement("input"); value.placeholder = "LCC";
    [["If the name contains", match], ["then " + facet + " is", value]].forEach(function(p){
      var f = el("div", "field");
      f.appendChild(el("label", null, p[0]));
      f.appendChild(p[1]);
      body.appendChild(f);
    });
    var preview = el("p", "note");
    body.appendChild(preview);
    function refresh(){
      if (!match.value.trim() || !value.value.trim()){ preview.textContent = ""; return; }
      var trial = JSON.parse(JSON.stringify(state.rules));
      trial[facet].unshift({ match: match.value.trim(), value: value.value.trim() });
      var before = E.classifyAll(state, state.rules);
      var after = E.classifyAll(state, trial);
      var n = 0;
      state.vials.forEach(function(v){
        if (E.classify(v.name, trial)[facet] !== E.classify(v.name, state.rules)[facet]) n++;
      });
      preview.textContent = "This would change " + n + " of " + state.vials.length + " vials, and close " +
        (before.gaps.length - after.gaps.length) + " of the " + before.gaps.length + " gaps.";
    }
    match.oninput = refresh; value.oninput = refresh;
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Add the rule");
    ok.onclick = function(){
      if (!match.value.trim() || !value.value.trim()) return;
      state.rules[facet].unshift({ match: match.value.trim(), value: value.value.trim() });
      $("dlg").close(); markDirty("Add a " + facet + " rule"); renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  // =====================================================================
  // Import
  // =====================================================================

  function openImport(){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    input.onchange = function(){ if (input.files && input.files[0]) startImport(input.files[0]); };
    input.click();
  }

  async function startImport(file){
    var wb;
    setStatus("Reading…", "saving");
    try {
      wb = await X.readWorkbook(await file.arrayBuffer());
    } catch(err){
      setStatus("Ready", "");
      showBanner("Couldn't read that file: " + esc(err.message));
      return;
    }
    setStatus("Ready", "");
    if (!wb.sheets.length){ showBanner("That workbook has no sheets."); return; }

    // Sheet picker. Everything is listed, nothing is chosen for you when there is
    // more than one -- this is somebody's whole lab in one file.
    $("dlgTitle").textContent = "Which sheet?";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", file.name + " has " + wb.sheets.length + " sheet" +
      (wb.sheets.length === 1 ? "" : "s") + ". Only one is imported."));
    wb.sheets.forEach(function(sh){
      var rows = sh.rows.filter(function(r){ return r && r.some(function(c){ return c && c.text; }); }).length;
      var b = el("button", null, sh.name + " — " + rows + " rows");
      b.style.width = "100%"; b.style.textAlign = "left"; b.style.marginBottom = "6px";
      b.disabled = !rows;
      b.onclick = function(){ mapColumns(file.name, sh); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function mapColumns(fileName, sheet){
    $("dlgTitle").textContent = "What is in each column?";
    var body = clear($("dlgBody"));
    var guesses = E.guessColumns(sheet.rows, 0, sheet.merges);
    var map = {};
    guesses.forEach(function(g){ if (g.role !== "ignore") map[g.role] = g.index; });

    body.appendChild(el("p", "note",
      "Guessed from the headers and the first rows. A column filled by a formula shows the " +
      "formula, so a value that was calculated from another column can be mapped to its source " +
      "instead of imported as if it had been typed."));

    guesses.forEach(function(g){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, g.letter + (g.header ? " — " + g.header : " — (no header)")));
      var sample = [];
      var formula = null;
      for (var r = 1; r < Math.min(sheet.rows.length, 30) && sample.length < 3; r++){
        var c = (sheet.rows[r] || [])[g.index];
        if (!c) continue;
        if (!formula && c.formula) formula = c.formula;
        if (c.text) sample.push(c.text);
      }
      grow.appendChild(el("div", "sub", sample.join(" · ") || "(empty)"));
      if (formula){
        var f = el("div", "sub mono", formula.length > 90 ? formula.slice(0, 90) + "…" : formula);
        f.style.color = "var(--guess)";
        grow.appendChild(f);
      }
      row.appendChild(grow);

      var sel = document.createElement("select");
      sel.style.width = "auto";
      E.ROLES.forEach(function(role){
        var o = document.createElement("option");
        o.value = role; o.textContent = role;
        o.selected = map[role] === g.index || (role === "ignore" && Object.keys(map).every(function(k){ return map[k] !== g.index; }));
        sel.appendChild(o);
      });
      sel.onchange = function(){
        Object.keys(map).forEach(function(k){ if (map[k] === g.index) delete map[k]; });
        if (sel.value !== "ignore") map[sel.value] = g.index;
      };
      row.appendChild(sel);
      body.appendChild(row);
    });

    var foot = clear($("dlgFoot"));
    var next = el("button", "primary", "Look at what it found");
    next.onclick = function(){
      if (map.name === undefined || map.position === undefined){
        showBanner("At least a name column and a position column are needed.");
        return;
      }
      previewImport(fileName, sheet, map);
    };
    foot.appendChild(next);
    $("dlg").showModal();
  }

  function previewImport(fileName, sheet, map){
    var out = E.importSheet(sheet, {
      headerRow: 1, columns: map, rules: state.rules,
      unitId: "u-f80", rackId: "r-1", unitName: "-80 °C Freezer", unitType: "freezer",
      childLabel: "Rack", rackName: "Rack 1",
      sourceName: fileName, idPrefix: "v", unnamedBoxName: "Unnamed box"
    });
    var rep = out.report;

    $("dlgTitle").textContent = "Before anything is written";
    var body = clear($("dlgBody"));
    function line(text, bad){
      var p = el("p", "note", text);
      if (bad) p.style.color = "var(--bad)";
      body.appendChild(p);
    }
    line(rep.imported + " vials out of " + rep.rows + " rows, in " + rep.boxes.length + " boxes.");
    rep.boxes.forEach(function(b){ line("　" + b.name + " — " + b.rows + " × " + b.cols); });
    if (rep.dateQueue) line(rep.dateQueue + " dates can't be read unambiguously and will wait in Review.");
    if (rep.facetDiffs) line(rep.facetDiffs + " rows where the corrected rules disagree with the sheet.");
    if (rep.gaps.length) line(rep.gaps.length + " rows whose name no rule covers.");
    if (rep.uncalculated) line(rep.uncalculated + " cells hold a formula with no calculated result — " +
      "those come in empty. Reopen and save the file in Excel or Sheets first.", true);
    if (rep.collisions.length) line(rep.collisions.length + " rows want a slot another row already took; " +
      "they will be dropped.", true);
    if (rep.skipped.length) line(rep.skipped.length + " rows have a position outside their box and will be dropped.", true);
    rep.skipped.slice(0, 5).forEach(function(s){ line("　row " + s.row + ": " + s.name + " — " + s.why, true); });
    var errs = E.errorsOnly(rep.problems);
    if (errs.length) line(errs.length + " problems that would make the inventory wrong.", true);

    var warn = el("p", "note");
    warn.style.color = "var(--warn-text)";
    warn.textContent = "This replaces the whole inventory — all " + state.vials.length +
      " vials currently here, and the boxes they live in.";
    body.appendChild(warn);

    var foot = clear($("dlgFoot"));
    var go3 = el("button", "primary", "Replace the inventory");
    go3.disabled = !canWrite() || !!errs.length;

    // Dropping rows is exactly the kind of quiet data loss this app exists to stop,
    // so a run with collisions or skips has to be agreed to out loud. Usually it
    // means a column was mapped wrongly -- most often the box column, which has a
    // blank header and only one filled cell per block.
    var lost = rep.collisions.length + rep.skipped.length;
    if (lost){
      var agree = el("label", "toggle");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.onchange = function(){ go3.disabled = !canWrite() || !!errs.length || !cb.checked; };
      agree.appendChild(cb);
      agree.appendChild(el("span", null, "I know " + lost + " rows will be thrown away — check the " +
        "column mapping first, especially which column holds the box name."));
      body.appendChild(agree);
      go3.disabled = true;
    }
    go3.onclick = function(){
      var keptRules = state.rules;
      state = E.mergeDefaults(out.state);
      state.rules = keptRules;
      state.settings.columnMap = map;
      $("dlg").close();
      markDirty("Import " + rep.imported + " vials from " + fileName);
      renderAll();
    };
    foot.appendChild(go3);
    $("dlg").showModal();
  }

  // =====================================================================
  // Shell
  // =====================================================================

  var screen = "find";
  function go(name){
    screen = name;
    Array.prototype.forEach.call(document.querySelectorAll(".screen"), function(s){
      s.classList.toggle("active", s.id === "s-" + name);
    });
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-screen") === name);
    });
    if (name !== "boxes") boxView.highlight = [];
    renderAll();
    window.scrollTo(0, 0);
  }

  function renderNavBadge(){
    var btn = document.querySelector('nav button[data-screen="review"]');
    var old = btn.querySelector(".dot");
    if (old) btn.removeChild(old);
    var n = E.reviewQueue(state).total;
    if (!n) return;
    var d = el("span", "dot", n > 99 ? "99+" : String(n));
    btn.appendChild(d);
  }

  var rendering = false;
  function renderAll(){
    if (rendering) return;
    rendering = true;
    try {
      renderNavBadge();
      if (screen === "find"){ renderFilters(); renderResults(); }   // renderFilters re-follows the extents
      else if (screen === "freeze"){ renderFreezeUnits(); renderFreezeFacets(); renderFreezePlan(); renderFreezeGuard(); }
      else if (screen === "boxes") renderBoxes();
      else if (screen === "review") renderReview();
      else if (screen === "log") renderLog();
      else if (screen === "settings") renderSettings();
    } finally { rendering = false; }
  }

  function renderFreezeGuard(){
    var why = $("fzWhyNot");
    var btn = $("fzGo");
    if (!canWrite()){
      btn.disabled = true;
      why.textContent = "Read-only on this device — nothing can be written until a GitHub token is " +
        "added under Settings → Connect.";
      return;
    }
    var ok = !!(freeze.name.trim() && freeze.plan && freeze.plan.ok);
    btn.disabled = !ok;
    why.textContent = !freeze.name.trim() ? "Give it a name first."
      : (freeze.plan && !freeze.plan.ok) ? freeze.plan.reason : "";
  }

  function renderFreezeUnits(){
    var sel = $("fzUnit");
    if (sel.childNodes.length && sel.dataset.n === String((state.storage.units || []).length)) return;
    clear(sel);
    (state.storage.units || []).forEach(function(u){
      var o = document.createElement("option");
      o.value = u.id; o.textContent = u.name;
      o.selected = u.id === (freeze.unitId || state.settings.defaultUnitId);
      sel.appendChild(o);
    });
    sel.dataset.n = String((state.storage.units || []).length);
  }

  // ---- wiring ----
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.onclick = function(){ go(b.getAttribute("data-screen")); };
  });
  $("dlgX").onclick = function(){ $("dlg").close(); };

  var qTimer = null;
  $("q").oninput = function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ filter.query = $("q").value; renderResults(); }, 150);
  };

  $("fzName").oninput = function(){
    freeze.name = $("fzName").value;
    freeze.boxId = null;
    renderFreezeFacets();
    renderFreezePlan();
    renderFreezeGuard();
  };
  $("fzCount").oninput = function(){
    freeze.count = Math.max(1, Number($("fzCount").value) || 1);
    renderFreezePlan();
    renderFreezeGuard();
  };
  $("fzUnit").onchange = function(){
    freeze.unitId = $("fzUnit").value; freeze.boxId = null; renderFreezePlan(); renderFreezeGuard();
  };
  $("fzGo").onclick = doFreeze;
  $("fzDate").value = new Date().toISOString().slice(0, 10);

  $("bxUnit").onchange = function(){ boxView.unitId = $("bxUnit").value; boxView.boxId = null; renderBoxes(); };
  $("bxBox").onchange = function(){ boxView.boxId = $("bxBox").value; renderBoxes(); };

  try {
    var t = localStorage.getItem(LS.theme);
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}

  // A freezer is shared, so take another look whenever the app comes back to the
  // front rather than trusting a copy that may be an hour old.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && !dirty) load();
  });

  cacheLoad();
  renderAll();
  load();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
