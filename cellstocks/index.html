  function renderLog(){
    var box = clear($("logBody"));
    var stock = clear($("stockBody"));
    if (canSeeWholeLab()){
      renderMergedByOwner(box, renderLog, function(section){
        if (!(state.withdrawals || []).length) return false;
        renderLogBody(section);
        return true;
      }, "Nothing has been taken out, lab-wide.");
      renderMergedByOwner(stock, renderLog, function(section){
        var counts = E.stockCounts(state).filter(function(c){ return c.stored > 0; });
        if (!counts.length) return false;
        renderStockBody(section, counts);
        return true;
      }, "Nothing stored, lab-wide.");
      return;
    }
    renderLogBody(box);
    stock.appendChild(el("h3", null, "How much is left"));
    renderStockBody(stock, E.stockCounts(state).filter(function(c){ return c.stored > 0; }));
  }

  function renderLogBody(box){
    var log = (state.withdrawals || []).slice().reverse();
    if (!log.length){
      box.appendChild(el("div", "empty", "Nothing has been taken out yet."));
      return;
    }
    log.slice(0, 100).forEach(function(w){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", "strike", w.name || w.vialId));
      grow.appendChild(el("div", "sub",
        (w.date ? prettyDate(w.date) : "no date") +
        (w.from ? " · from " + E.locationPath(state, w.from) : "") +
        (w.by ? " · " + w.by : "")));
      row.appendChild(grow);
      var u = el("button", null, "Put back");
      u.disabled = !canWrite() || ADMIN_MERGED;
      u.onclick = function(){ undoTake(w.id); };
      row.appendChild(u);
      box.appendChild(row);
    });
  }

  function renderStockBody(stock, counts){
    counts.slice(0, 200).forEach(function(c){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, c.name));
      grow.appendChild(el("div", "sub", c.stored + " stored" +
        (c.withdrawn ? " · " + c.withdrawn + " taken out" : "") +
        " · " + c.boxes + " box" + (c.boxes === 1 ? "" : "es")));
      row.appendChild(grow);
      if (c.stored <= 2) row.appendChild(el("span", "chip guess", "low"));
      stock.appendChild(row);
    });
  }

  // =====================================================================
  // Settings
  // =====================================================================

  // Builds the login/connect UI into whichever container asks for it -- the mandatory
  // login gate (#gateBody, shown before anyone is identified) and Settings' own
  // Connect card (#connectCard, for managing the connection once already in) render the
  // exact same thing, so there is exactly one place that knows how to log in or out.
  function renderConnect(container){
    var c = clear(container);
    c.appendChild(el("h3", null, "Connect"));

    // ---- log in (worker auth) ----
    var wu = getWorkerUser();
    if (wu){
      c.appendChild(el("p", "note",
        "Logged in as " + esc(wu.name) + (wu.role === "admin" ? " (admin)" : "") + ". Changes go through " +
        esc(getWorkerUrl()) + "."));
      var lo = el("button", "danger", "Log out");
      lo.id = "workerLogoutBtn";
      lo.onclick = async function(){
        lo.disabled = true;
        await workerLogout();
        afterAuthChange();
      };
      c.appendChild(lo);
    } else {
      c.appendChild(el("p", "note",
        "Log in with the name and password an admin set up for you. This is the lab-wide way in — " +
        "your own boxes, kept separate from everyone else's."));
      // A real <form> boundary -- without one, Safari's passkey/password heuristic treats
      // unrelated fields elsewhere on the page (like the plain search box) as part of this
      // "login form" too, since it has nothing else to scope to.
      var wform = document.createElement("form");
      wform.autocomplete = "off";
      var wurl = document.createElement("input");
      wurl.placeholder = "Worker address (https://…workers.dev)";
      // When the page is being served BY the backend, the answer is this address, and
      // it is offered even if an older one is still saved on this device. That is not a
      // hypothetical: changing the lab's Cloudflare subdomain changes this host, and
      // every device that had typed the old one in would otherwise be left logging in
      // against a name that no longer resolves. Logging in stores whatever is here.
      wurl.value = servedByWorker() ? location.origin : (getWorkerUrl() || "");
      wurl.autocomplete = "off";
      var wname = document.createElement("input");
      wname.placeholder = "Name"; wname.style.marginTop = "8px"; wname.autocomplete = "off";
      var wpass = document.createElement("input");
      // Deliberately "off", not "current-password" -- everyone in the lab logs in
      // through this one shared form/origin, so iCloud Keychain / Safari's password
      // manager was offering whichever account it had saved (not necessarily the one
      // being typed), which is actively wrong here rather than a convenience.
      wpass.type = "password"; wpass.placeholder = "Password"; wpass.autocomplete = "off";
      wpass.style.marginTop = "8px";
      wform.appendChild(wurl); wform.appendChild(wname); wform.appendChild(wpass);
      var wgo = el("button", "primary", "Log in");
      wgo.type = "button";
      wgo.id = "workerLoginBtn";
      wgo.style.marginTop = "8px";
      wgo.onclick = async function(){
        if (!wurl.value.trim() || !wname.value.trim() || !wpass.value) return;
        wgo.disabled = true;
        try {
          await workerLogin(wurl.value.trim(), wname.value.trim(), wpass.value);
          // The instant the active account changes, drop whatever was on screen for the
          // previous one -- load() will fill this back in from this account's own data (or
          // leave it blank, for a fresh account) once the fetch resolves.
          state = E.blankState();
          hideBanner();
          await load();
          afterAuthChange();
        } catch(err){
          showBanner("Couldn't log in: " + esc(err.message));
        }
        wgo.disabled = false;
      };
      wform.appendChild(wgo);
      c.appendChild(wform);
    }

    // ---- GitHub token (the older, per-device way in) ----
    c.appendChild(el("h3", null, "GitHub token"));
    if (getToken()){
      c.appendChild(el("p", "note", "Connected as " + getDevice() + ". Changes are committed to " + REPO + "."));
      var out = el("button", "danger", "Forget the token on this device");
      out.onclick = function(){
        try { localStorage.removeItem(LS.token); } catch(e){}
        afterAuthChange();
      };
      c.appendChild(out);
    } else {
      c.appendChild(el("p", "note",
        "Paste a GitHub personal access token with Contents: Read and write for " +
        (REPO || "this repository") + ". It stays on this device, and it is this app's own — " +
        "nothing else on this host reads or writes it."));
      var tform = document.createElement("form");
      tform.autocomplete = "off";
      var tok = document.createElement("input");
      tok.type = "password"; tok.placeholder = "github_pat_…"; tok.autocomplete = "off";
      var dev = document.createElement("input");
      dev.placeholder = "What is this device called?";
      dev.value = getDevice() === "unknown device" ? "" : getDevice();
      dev.style.marginTop = "8px"; dev.autocomplete = "off";
      tform.appendChild(tok); tform.appendChild(dev);
      c.appendChild(tform);
      var go2 = el("button", "primary", "Connect");
      go2.type = "button";
      go2.style.marginTop = "8px";
      go2.onclick = async function(){
        if (!tok.value.trim()) return;
        go2.disabled = true;
        try {
          var r = await fetch(API + "/contents/" + LEGACY_DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
            { headers: { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
                         "Authorization":"Bearer " + tok.value.trim() } });
          if (!r.ok && r.status !== 404) throw new Error("GitHub said " + r.status);
          localStorage.setItem(LS.token, tok.value.trim());
          localStorage.setItem(LS.device, dev.value.trim() || "a device");
          hideBanner();
          await load();
          afterAuthChange();
        } catch(err){
          showBanner("That token didn't work: " + esc(err.message));
        }
        go2.disabled = false;
      };
      c.appendChild(go2);
    }
  }

  // Light and dark were always here, but buried at the bottom of Connect, under the
  // worker URL and the GitHub token -- so nobody found them. Now its own card, first on
  // the Settings screen, because it is the one setting somebody changes for no reason at
  // all. It stays on the login gate too: choosing dark should not require logging in.
  // Per-device on purpose: it is how this phone looks, not a fact about the lab, so it
  // lives in localStorage and is never committed.
  function renderAppearance(target){
    var c = clear(target || $("appearanceCard"));
    c.appendChild(el("h3", null, "Appearance"));
    var seg = el("div", "seg");
    var current = (function(){ try { return localStorage.getItem(LS.theme) || "system"; } catch(e){ return "system"; } })();
    [{ id:"system", name:"System" }, { id:"light", name:"Light" }, { id:"dark", name:"Dark" }].forEach(function(opt){
      var b = el("button", current === opt.id ? "on" : null, opt.name);
      b.onclick = function(){
        if (opt.id === "system"){
          document.documentElement.removeAttribute("data-theme");
          try { localStorage.removeItem(LS.theme); } catch(e){}
        } else {
          document.documentElement.setAttribute("data-theme", opt.id);
          try { localStorage.setItem(LS.theme, opt.id); } catch(e){}
        }
        renderAppearance(target);
      };
      seg.appendChild(b);
    });
    c.appendChild(seg);
    c.appendChild(el("p", "note", current === "system"
      ? "Following this device — it turns dark when your phone or laptop does."
      : "Fixed to " + current + " on this device, whatever the system is set to."));
  }

  // Nothing about anyone's inventory ever renders before someone is identified -- either
  // a worker login or a legacy GitHub token, both of which canWrite() already recognizes.
  // Called after every login, logout, or token change, and once at boot.
  // Admin never has a Freeze tab -- they have no inventory of their own to freeze into
  // (see the "Admin" tab's "Manage a box" instead) -- and gets the Admin tab nobody else
  // does. Re-checked on every login/logout, since the same tab can move between a member
  // and an admin account over a session.
  function updateNavForRole(){
    var admin = isAdminUser();
    // Neither admin nor the PI has an inventory to add to; only admin gets the tools.
    $("navFreeze").hidden = !hasOwnInventory();
    $("navAdmin").hidden = !admin;
    if (!hasOwnInventory() && screen === "freeze") screen = "find";
  }

  function afterAuthChange(){
    var authed = canWrite();
    document.body.classList.toggle("gated", !authed);
    updateNavForRole();
    if (!authed){
      renderConnect($("gateBody"));
      // Appended, not replacing: renderConnect owns the rest of the gate.
      renderAppearance($("gateAppearance"));
      setStatus("Read-only", "");
      return;
    }
    setStatus("Ready", "");
    go(screen);
  }

  function renderSettings(){
    renderAppearance();
    renderConnect($("connectCard"));

    // The PI has no inventory of their own, so every card below this one -- storage,
    // rules, keywords, import, the integrity check -- is about a file that does not
    // exist for them. Connect is the whole of their Settings screen.
    ["storageCard", "rulesCard", "keywordsCard", "importCard", "checkCard"].forEach(function(id){
      clear($(id)).hidden = isPiUser();
    });
    if (isPiUser()) return;

    // ---- storage ----
    var s = clear($("storageCard"));
    s.appendChild(el("h3", null, "Storage"));
    s.appendChild(el("p", "note",
      "The freezers, racks and towers belong to the whole lab — admin lays them out in " +
      "Admin → Structure. What's below is your own boxes inside them; renaming or " +
      "resizing one changes it for everybody, because there is only one of it."));

    var GROUPING_OPTIONS = [
      { id:"category-row", name:"One row per cell", note:"The rule this app has always used: a row holds one cell, never two." },
      { id:"random", name:"No rule", note:"No grouping at all — a new freeze-down just takes the first free space." }
    ];
    var groupField = el("div", "field");
    groupField.appendChild(el("label", null, "How new freezes get grouped"));
    var groupSeg = el("div", "seg");
    var currentGrouping = E.groupingStrategyFor(state);
    GROUPING_OPTIONS.forEach(function(opt){
      var b = el("button", currentGrouping === opt.id ? "on" : null, opt.name);
      b.onclick = function(){
        state.settings.groupingStrategy = opt.id;
        markDirty("Switch grouping to " + opt.name.toLowerCase());
        renderAll();
      };
      groupSeg.appendChild(b);
    });
    groupField.appendChild(groupSeg);
    var currentGroupingOpt = GROUPING_OPTIONS.filter(function(o){ return o.id === currentGrouping; })[0];
    groupField.appendChild(el("p", "note", currentGroupingOpt ? currentGroupingOpt.note : ""));
    s.appendChild(groupField);
    // Your own boxes, wherever in the tree they ended up, grouped by the area they sit
    // in. Somebody else's box is theirs to rename; this screen is about your own. There
    // is no per-layer walk any more -- with the depth unbounded, listing every empty
    // layer between here and a box was most of the screen and none of the point.
    var me = (effectiveIdentity() || "").toLowerCase();
    var byArea = [], areaSeen = {};
    E.eachBox(state, function(box, rack, unit, chain){
      if (box.archived) return;
      if (box.owner && box.owner.toLowerCase() !== me) return;
      var areaName = chain.length ? chain[0].name : "Not placed yet";
      if (!areaSeen[areaName]){ areaSeen[areaName] = { name: areaName, boxes: [] }; byArea.push(areaSeen[areaName]); }
      areaSeen[areaName].boxes.push({ box: box, chain: chain });
    });
    if (!byArea.length){
      s.appendChild(el("p", "note", "You have no boxes yet. Add one from the Boxes tab."));
    }
    byArea.forEach(function(area){
      var head = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, area.name));
      var used = 0, capacity = 0;
      area.boxes.forEach(function(entry){
        var o = E.occupancy(state, entry.box.id);
        used += o.used; capacity += o.capacity;
      });
      grow.appendChild(el("div", "sub", used + " of " + capacity + " slots full \u00b7 " +
        area.boxes.length + " box" + (area.boxes.length === 1 ? "" : "es") + " of yours"));
      head.appendChild(grow);
      s.appendChild(head);
      area.boxes.forEach(function(entry){
        var box = entry.box;
        var occ = E.occupancy(state, box.id);
        var inside = entry.chain.slice(1).map(function(r){ return r.name; }).join(" \u2192 ");
        var row = el("div", "item");
        var g2 = el("div", "grow");
        g2.appendChild(el("div", null, "\u3000" + (inside ? inside + " \u2192 " : "") + box.name));
        g2.appendChild(el("div", "sub", box.rows + " \u00d7 " + box.cols + " \u00b7 " + occ.used + "/" + occ.capacity));
        row.appendChild(g2);
        var ren = el("button", null, "Rename");
        ren.disabled = !canWrite();
        ren.onclick = function(){ renameBox(box); };
        row.appendChild(ren);
        var res = el("button", null, "Resize");
        res.disabled = !canWrite();
        res.onclick = function(){ resizeBox(box); };
        row.appendChild(res);
        s.appendChild(row);
      });
    });

    s.appendChild(el("p", "note", "Adding a box or a freezer/tank moved to the Boxes tab — it's an everyday " +
      "action, not a settings change. Renaming and resizing stay here."));

    // ---- rules ----
    var r2 = clear($("rulesCard"));
    r2.appendChild(el("h3", null, "Rules"));
    r2.appendChild(el("p", "note",
      "In the spreadsheet, the cell name is the only thing typed — origin, KO/OX, resistance, " +
      "CASPEX and guide are all formulas over that one string. These are those formulas. " +
      "Adding a common label here is all it takes; nothing is built into the app."));
    // These used to be per-account, and had drifted: the same name read one way on
    // admin's screen and another on umut's. One set now, for everybody, at Umut's word.
    r2.appendChild(el("p", "note",
      "These are the whole lab's rules — everyone reads names the same way, so a change " +
      "here changes what every member sees, not just you."));
    // Which is also why the whole lab has to be loaded before any of the Edit/Delete
    // buttons can say what they would do. Counting only your own vials would tell
    // somebody "this changes 0 vials" while it silently re-read half of everybody else's.
    var labKnown = !!labCache.members;
    if (!labKnown){
      r2.appendChild(el("p", "note", "Reading the rest of the lab, so these can say what they would change…"));
      ensureLabCache().then(renderSettings);
    }
    E.FACETS.forEach(function(facet){
      var list = state.rules[facet] || [];
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, facet));
      grow.appendChild(el("div", "sub", list.length + " rule" + (list.length === 1 ? "" : "s") + ", tried in order"));
      row.appendChild(grow);
      var add = el("button", null, "Add");
      add.disabled = !canWrite() || !labKnown;
      add.onclick = function(){ addRuleDialog(facet); };
      row.appendChild(add);
      r2.appendChild(row);

      // One row per rule rather than one grey line per facet: a rule that reads wrong
      // (or was typed wrong) has to be fixable and removable, not just addable. Both
      // buttons show what they would do to the real inventory before doing it -- see
      // ruleImpact().
      list.forEach(function(rule, index){
        var rr = el("div", "item");
        var rg = el("div", "grow");
        rg.appendChild(el("div", "sub mono", "　" + ruleText(rule)));
        rr.appendChild(rg);
        var edit = el("button", null, "Edit");
        edit.disabled = !canWrite() || !labKnown;
        edit.onclick = function(){ editRuleDialog(facet, index); };
        rr.appendChild(edit);
        var del = el("button", "danger", "Delete");
        del.style.marginLeft = "6px";
        del.disabled = !canWrite() || !labKnown;
        del.onclick = function(){ deleteRuleDialog(facet, index); };
        rr.appendChild(del);
        r2.appendChild(rr);
      });
    });

    // ---- keywords ----
    var k = clear($("keywordsCard"));
    k.appendChild(el("h3", null, "Keywords"));
    k.appendChild(el("p", "note",
      "A word or phrase in Notes becomes a searchable tag — built in for things like " +
      "\"myco -\" or \"to-do\". Add your own below; nothing here replaces the built-in ones."));
    E.FLAG_RULES.forEach(function(rule){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, rule.flag));
      grow.appendChild(el("div", "sub", "built in"));
      row.appendChild(grow);
      k.appendChild(row);
    });
    (state.settings.customFlags || []).forEach(function(c){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, c.flag));
      grow.appendChild(el("div", "sub mono", "\"" + c.match + "\""));
      row.appendChild(grow);
      k.appendChild(row);
    });
    var addKeyword = el("button", null, "Add a keyword");
    addKeyword.disabled = !canWrite();
    addKeyword.onclick = function(){ addKeywordDialog(); };
    k.appendChild(addKeyword);

    // ---- import ----
    var i = clear($("importCard"));
    i.appendChild(el("h3", null, "Import a spreadsheet"));
    i.appendChild(el("p", "note",
      "Reads an .xlsx in the browser. It shows what it found before anything is written, and it " +
      "replaces the whole inventory rather than merging — so use it to start, not to top up."));
    var pick = el("button", null, "Choose a file");
    pick.disabled = !canWrite();
    pick.onclick = openImport;
    i.appendChild(pick);

    var dl = el("button", null, "Download the workbook");
    dl.style.marginTop = "8px";
    dl.onclick = async function(){
      var blob = new Blob([await workbookBytes()],
        { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cell-stocks.xlsx";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    };
    i.appendChild(dl);
    i.appendChild(el("p", "note",
      "The workbook is written from this inventory every time it's saved, so the two can't drift. " +
      "That also means editing it by hand is pointless — the next save overwrites it."));

    // ---- check ----
    var ch = clear($("checkCard"));
    ch.appendChild(el("h3", null, "Check it"));
    var problems = E.validate(state);
    var errs = problems.filter(function(p){ return p.level === "error"; });
    var line = el("p", "note");
    line.textContent = state.vials.length + " vials · " + state.lines.length + " lines · " +
      errs.length + " errors · " + (problems.length - errs.length) + " warnings";
    ch.appendChild(line);
    problems.slice(0, 30).forEach(function(p){
      ch.appendChild(el("div", "prob " + p.level, p.message));
    });
    if (problems.length > 30) ch.appendChild(el("p", "note", "…and " + (problems.length - 30) + " more."));
    if (!problems.length) ch.appendChild(el("p", "note", "Nothing wrong: no slot holds two vials, every position is inside its box."));
  }

  function renameBox(box){
    $("dlgTitle").textContent = "Rename " + box.name;
    var body = clear($("dlgBody"));
    var inp = document.createElement("input");
    inp.value = box.name;
    inp.autocomplete = "off";
    body.appendChild(inp);
    var foot = clear($("dlgFoot"));
    var msg = el("p", "note"); body.appendChild(msg);
    var ok = el("button", "primary", "Save");
    ok.onclick = async function(){
      if (!inp.value.trim()) return;
      ok.disabled = true;
      try {
        await editLabBox(box.id, function(b){ b.name = inp.value.trim(); }, "Rename a box");
        $("dlg").close(); renderAll();
      } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function resizeBox(box){
    $("dlgTitle").textContent = "Resize " + box.name;
    var body = clear($("dlgBody"));
    var rows = document.createElement("input"); rows.type = "number"; rows.min = 1; rows.value = box.rows;
    var cols = document.createElement("input"); cols.type = "number"; cols.min = 1; cols.value = box.cols;
    var g = el("div", "two");
    var f1 = el("div", "field"); f1.appendChild(el("label", null, "Rows")); f1.appendChild(rows);
    var f2 = el("div", "field"); f2.appendChild(el("label", null, "Columns")); f2.appendChild(cols);
    g.appendChild(f1); g.appendChild(f2);
    body.appendChild(g);
    var msg = el("p", "note");
    body.appendChild(msg);
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    ok.onclick = async function(){
      var can = E.canResizeBox(state, box.id, Number(rows.value), Number(cols.value));
      if (!can.ok){ msg.textContent = can.reason; msg.style.color = "var(--bad)"; return; }
      ok.disabled = true;
      try {
        await editLabBox(box.id, function(b){ b.rows = Number(rows.value); b.cols = Number(cols.value); }, "Resize a box");
        $("dlg").close(); renderAll();
      } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  // Name-only, on purpose -- this is the everyday action (Boxes tab), not a settings
  // change. A box defaults to 9×9; Settings → Storage's own Rename/Resize buttons
  // already handle changing that afterwards, so there is nothing to ask up front.
  // A member makes a box; where it goes is an admin's call, so it lands in "Not placed
  // yet" and admin puts it away from the Structure screen. Umut's rule, and it is also
  // the flow he described: fill the box first, then choose the cabinet.
  function addBoxDialog(){
    $("dlgTitle").textContent = "Add a box";
    var body = clear($("dlgBody"));
    var name = document.createElement("input"); name.placeholder = "Box 7"; name.autocomplete = "off";
    var rows = document.createElement("input"); rows.type = "number"; rows.min = 1; rows.value = 9;
    var cols = document.createElement("input"); cols.type = "number"; cols.min = 1; cols.value = 9;
    var f = el("div", "field"); f.appendChild(el("label", null, "Name")); f.appendChild(name);
    body.appendChild(f);
    var grid = el("div", "two");
    [["Rows", rows], ["Columns", cols]].forEach(function(p){
      var g = el("div", "field"); g.appendChild(el("label", null, p[0])); g.appendChild(p[1]); grid.appendChild(g);
    });
    body.appendChild(grid);
    body.appendChild(el("p", "note",
      "The box is yours and you can start filling it straight away. Where it sits in the " +
      "freezer is set by an admin — until then it waits under “Not placed yet”."));
    var foot = clear($("dlgFoot"));
    var msg = el("p", "note"); body.appendChild(msg);
    var ok = el("button", "primary", "Add");
    ok.onclick = async function(){
      if (!name.value.trim()) return;
      ok.disabled = true;
      try {
        // The tree is the lab's, so this lands in the shared file. Re-read it first:
        // somebody else may have touched it since this screen was drawn, and this is
        // last-write-wins like every file here.
        var fresh = await fetchLabStorage();
        var r = E.addNode(fresh, "unplaced", {
          name: name.value.trim(), rows: rows.value, cols: cols.value, icon: "📦",
          isBox: true, owner: (effectiveIdentity() || "").toLowerCase()
        });
        if (!r.ok){ msg.textContent = r.reason; msg.style.color = "var(--bad)"; ok.disabled = false; return; }
        await commitLabStorage(r.state, "Add a box");
        $("dlg").close();
        showBanner("Added <b>" + esc(name.value.trim()) + "</b> — an admin will say where it goes.");
        renderAll();
      } catch(err){
        msg.textContent = "Couldn't save that: " + err.message;
        msg.style.color = "var(--bad)";
      }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function ruleText(rule){
    if (rule.extract) return "/" + rule.extract + "/" + (rule.value !== undefined ? " → " + rule.value : "");
    if (rule.match !== undefined) return rule.match + " → " + rule.value;
    return "else " + rule.value;
  }

  // What swapping `state.rules` for `trial` would actually do to this inventory: how many
  // vials read differently, how many of those are pinned by hand (and so do not move at
  // all -- facetsFor() never recomputes those), and whether it opens or closes gaps.
  // Every add/edit/delete below shows this before it is applied; nothing here writes.
  // The rules are the lab's now, so the impact is the lab's too: counting only your own
  // vials would have told somebody "this changes 0 vials" while it silently re-read
  // half of everybody else's. Whatever this session has read is what it can count, and
  // the sentence below says which that was.
  function ruleImpact(trial, facet){
    var states = [state].concat(Object.keys(labCache.data || {}).map(function(n){ return labCache.data[n]; }));
    var changed = 0, pinned = 0, total = 0, gapsBefore = 0, gapsAfter = 0;
    states.forEach(function(st){
      if (!st) return;
      gapsBefore += E.classifyAll(st, state.rules).gaps.length;
      gapsAfter += E.classifyAll(st, trial).gaps.length;
      (st.vials || []).forEach(function(v){
        total++;
        if (E.classify(v.name, trial)[facet] === E.classify(v.name, state.rules)[facet]) return;
        changed++;
        if (v.facetsSetByHand && v.facetsSetByHand[facet] !== undefined) pinned++;
      });
    });
    return { changed: changed, pinned: pinned, gapsBefore: gapsBefore, gapsAfter: gapsAfter,
             total: total, wholeLab: states.length > 1 };
  }

  function impactSentence(imp){
    var bits = ["This changes " + imp.changed + " of " +
                (imp.wholeLab ? "the lab's " + imp.total + " vials" : imp.total + " vials")];
    if (imp.pinned) bits.push(imp.pinned + " of them are pinned by hand and stay as they are");
    var d = imp.gapsAfter - imp.gapsBefore;
    if (d > 0) bits.push("it opens " + d + " new gap" + (d === 1 ? "" : "s"));
    else if (d < 0) bits.push("it closes " + (-d) + " of the " + imp.gapsBefore + " gaps");
    return bits.join(" · ") + ".";
  }

  // Edits one existing rule in place, keeping its position in the list -- order matters,
  // rules are tried top to bottom. The fields follow the rule's own shape: a plain
  // "contains -> value" rule gets two text boxes, an extraction rule gets its pattern
  // (a real regular expression, labelled as one), a fallback gets just its value.
  function editRuleDialog(facet, index){
    var rule = (state.rules[facet] || [])[index];
    if (!rule) return;
    $("dlgTitle").textContent = "Edit a " + facet + " rule";
    var body = clear($("dlgBody"));
    var fields = [], inputs = {};
    function field(key, label, value, placeholder, mono){
      var input = document.createElement("input");
      input.value = value === undefined ? "" : value;
      input.placeholder = placeholder || "";
      input.autocomplete = "off";
      if (mono) input.className = "mono";
      inputs[key] = input;
      fields.push([label, input]);
    }
    if (rule.extract !== undefined){
      body.appendChild(el("p", "note",
        "This one is a pattern (a regular expression) matched against the name, not plain text. " +
        "The preview below is the safety net -- check it before saving."));
      field("extract", "Pattern", rule.extract, "(DS)?g\\\\d+", true);
      if (rule.value !== undefined) field("value", "then " + facet + " is", rule.value, "");
    } else if (rule.match !== undefined){
      field("match", "If the name contains", rule.match, "LCC");
      field("value", "then " + facet + " is", rule.value, "LnCap");
    } else {
      body.appendChild(el("p", "note",
        "This is the fallback: what " + facet + " becomes when no rule above it matched."));
      field("value", "Otherwise " + facet + " is", rule.value, "-");
    }
    fields.forEach(function(p){
      var f = el("div", "field");
      f.appendChild(el("label", null, p[0]));
      f.appendChild(p[1]);
      body.appendChild(f);
    });
    var preview = el("p", "note");
    body.appendChild(preview);

    function candidate(){
      var next = JSON.parse(JSON.stringify(rule));
      Object.keys(inputs).forEach(function(k){ next[k] = inputs[k].value; });
      return next;
    }
    function refresh(){
      var trial = JSON.parse(JSON.stringify(state.rules));
      trial[facet][index] = candidate();
      preview.textContent = impactSentence(ruleImpact(trial, facet));
    }
    Object.keys(inputs).forEach(function(k){ inputs[k].oninput = refresh; });
    refresh();

    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save the rule");
    ok.onclick = async function(){
      var next = candidate();
      var blank = Object.keys(inputs).some(function(k){ return !String(inputs[k].value).trim(); });
      if (blank){ showBanner("A rule can't have an empty field."); return; }
      Object.keys(inputs).forEach(function(k){ next[k] = String(inputs[k].value).trim(); });
      var trial = JSON.parse(JSON.stringify(state.rules));
      trial[facet][index] = next;
      ok.disabled = true;
      try {
        await commitLabRules(trial, "Edit a " + facet + " rule");
        $("dlg").close();
        renderAll();
      } catch(err){ showBanner("Couldn't save that: " + esc(err.message)); }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function deleteRuleDialog(facet, index){
    var rule = (state.rules[facet] || [])[index];

  // =====================================================================
  // Import
  // =====================================================================

  function openImport(){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    input.onchange = function(){ if (input.files && input.files[0]) startImport(input.files[0]); };
    input.click();
  }

  async function startImport(file){
    var wb;
    setStatus("Reading…", "saving");
    try {
      wb = await X.readWorkbook(await file.arrayBuffer());
    } catch(err){
      setStatus("Ready", "");
      showBanner("Couldn't read that file: " + esc(err.message));
      return;
    }
    setStatus("Ready", "");
    if (!wb.sheets.length){ showBanner("That workbook has no sheets."); return; }

    // Sheet picker. Everything is listed, nothing is chosen for you when there is
    // more than one -- this is somebody's whole lab in one file.
    $("dlgTitle").textContent = "Which sheet?";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", file.name + " has " + wb.sheets.length + " sheet" +
      (wb.sheets.length === 1 ? "" : "s") + ". Only one is imported."));
    wb.sheets.forEach(function(sh){
      var rows = sh.rows.filter(function(r){ return r && r.some(function(c){ return c && c.text; }); }).length;
      var b = el("button", null, sh.name + " — " + rows + " rows");
      b.style.width = "100%"; b.style.textAlign = "left"; b.style.marginBottom = "6px";
      b.disabled = !rows;
      b.onclick = function(){ mapColumns(file.name, sh); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function mapColumns(fileName, sheet){
    $("dlgTitle").textContent = "What is in each column?";
    var body = clear($("dlgBody"));
    var guesses = E.guessColumns(sheet.rows, 0, sheet.merges);
    var map = {};
    // A returning member's own confirmed layout (from the last time they imported)
    // takes priority over a fresh guess -- but it is still only ever a pre-selection
    // on the same screen that shows and lets them override it, never applied silently.
    var customColumns = {};   // colIndex -> field name, for columns mapped to "New"
    var saved = state.settings && state.settings.columnMap;
    var savedCustom = state.settings && state.settings.customColumns;
    var usedSaved = false;
    if (saved && Object.keys(saved).length){
      Object.keys(saved).forEach(function(role){
        if (typeof saved[role] === "number") { map[role] = saved[role]; usedSaved = true; }
      });
    }
    // A saved "New" column is remembered by its header text, since a re-imported
    // sheet's column order can shift -- unlike the known roles above, matching by
    // index alone would silently point a name at the wrong column next time.
    var savedCustomByHeader = {};
    if (savedCustom) Object.keys(savedCustom).forEach(function(h){ savedCustomByHeader[h] = savedCustom[h]; });
    guesses.forEach(function(g){ if (g.role !== "ignore" && map[g.role] === undefined) map[g.role] = g.index; });
    guesses.forEach(function(g){
      if (g.role !== "ignore") return;
      var h = g.header || "";
      if (h && savedCustomByHeader[h]) { customColumns[g.index] = savedCustomByHeader[h]; usedSaved = true; }
    });

    body.appendChild(el("p", "note",
      (usedSaved ? "Pre-filled from how you mapped your last import, plus a fresh guess for anything new. " : "Guessed from the headers and the first rows. ") +
      "A column filled by a formula shows the " +
      "formula, so a value that was calculated from another column can be mapped to its source " +
      "instead of imported as if it had been typed."));

    guesses.forEach(function(g){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, g.letter + (g.header ? " — " + g.header : " — (no header)")));
      var sample = [];
      var formula = null;
      for (var r = 1; r < Math.min(sheet.rows.length, 30) && sample.length < 3; r++){
        var c = (sheet.rows[r] || [])[g.index];
        if (!c) continue;
        if (!formula && c.formula) formula = c.formula;
        if (c.text) sample.push(c.text);
      }
      grow.appendChild(el("div", "sub", sample.join(" · ") || "(empty)"));
      if (formula){
        var f = el("div", "sub mono", formula.length > 90 ? formula.slice(0, 90) + "…" : formula);
        f.style.color = "var(--guess)";
        grow.appendChild(f);
      }
      row.appendChild(grow);

      var isCustom = customColumns[g.index] !== undefined;
      var sel = document.createElement("select");
      sel.style.width = "auto";
      E.ROLES.forEach(function(role){
        var o = document.createElement("option");
        o.value = role; o.textContent = role;
        o.selected = !isCustom && (map[role] === g.index || (role === "ignore" && Object.keys(map).every(function(k){ return map[k] !== g.index; })));
        sel.appendChild(o);
      });
      // Anything the guesser and the known roles above can't place still gets a real
      // home: "New" turns it into its own named field on the vial, rather than being
      // dropped or stuffed into notes.
      var newOpt = document.createElement("option");
      newOpt.value = "__new__"; newOpt.textContent = "New…";
      newOpt.selected = isCustom;
      sel.appendChild(newOpt);
      var customLabel = el("div", "sub");
      customLabel.style.display = isCustom ? "" : "none";
      customLabel.textContent = isCustom ? ("→ " + customColumns[g.index]) : "";
      sel.onchange = function(){
        Object.keys(map).forEach(function(k){ if (map[k] === g.index) delete map[k]; });
        delete customColumns[g.index];
        customLabel.style.display = "none";
        if (sel.value === "__new__"){
          var name = prompt("Name this field:", g.header || "");
          if (name && name.trim()){
            customColumns[g.index] = name.trim();
            customLabel.textContent = "→ " + name.trim();
            customLabel.style.display = "";
          } else {
            sel.value = "ignore";
          }
        } else if (sel.value !== "ignore") {
          map[sel.value] = g.index;
        }
      };
      row.appendChild(sel);
      row.appendChild(customLabel);
      body.appendChild(row);
    });

    var headerByIndex = {};
    guesses.forEach(function(g){ headerByIndex[g.index] = g.header || ""; });

    var foot = clear($("dlgFoot"));
    var next = el("button", "primary", "Look at what it found");
    next.onclick = function(){
      if (map.name === undefined || map.position === undefined){
        showBanner("At least a name column and a position column are needed.");
        return;
      }
      previewImport(fileName, sheet, map, customColumns, headerByIndex);
    };
    foot.appendChild(next);
    $("dlg").showModal();
  }

  function previewImport(fileName, sheet, map, customColumns, headerByIndex){
    var out = E.importSheet(sheet, {
      headerRow: 1, columns: map, rules: state.rules, customFlags: state.settings.customFlags,
      unitId: "u-f80", rackId: "r-1", unitName: "-80 °C Freezer", unitType: "freezer",
      rackName: "Rack 1",
      sourceName: fileName, idPrefix: "v", unnamedBoxName: "Unnamed box",
      customColumns: customColumns
    });
    var rep = out.report;

    $("dlgTitle").textContent = "Before anything is written";
    var body = clear($("dlgBody"));
    function line(text, bad){
      var p = el("p", "note", text);
      if (bad) p.style.color = "var(--bad)";
      body.appendChild(p);
    }
    line(rep.imported + " vials out of " + rep.rows + " rows, in " + rep.boxes.length + " boxes.");
    // Said out loud rather than passed over: the sheet lists every slot in a box, so most
    // of these are simply spaces with nothing frozen in them. Reading that as "144 rows I
    // could not understand" is what filled Review with questions nobody could answer.
    if (rep.emptySlots) line(rep.emptySlots + " lines held a slot and nothing else — empty " +
      "spaces in the sheet, not imported.");
    rep.boxes.forEach(function(b){ line("　" + b.name + " — " + b.rows + " × " + b.cols); });
    if (rep.dateQueue) line(rep.dateQueue + " dates can't be read unambiguously and will wait in Review.");
    if (rep.facetDiffs) line(rep.facetDiffs + " rows where the corrected rules disagree with the sheet.");
    if (rep.gaps.length) line(rep.gaps.length + " rows whose name no rule covers.");
    if (rep.uncalculated) line(rep.uncalculated + " cells hold a formula with no calculated result — " +
      "those come in empty. Reopen and save the file in Excel or Sheets first.", true);
    if (rep.collisions.length) line(rep.collisions.length + " rows want a slot another row already took; " +
      "they will be dropped.", true);
    if (rep.skipped.length) line(rep.skipped.length + " rows couldn't be placed (no name, or a position " +
      "outside their box) — they'll come in with no location, waiting in Review instead of being guessed.", true);
    rep.skipped.slice(0, 5).forEach(function(s){ line("　row " + s.row + ": " + (s.name || "(no name)") + " — " + s.why, true); });
    var errs = E.errorsOnly(rep.problems);
    if (errs.length) line(errs.length + " problems that would make the inventory wrong.", true);

    var warn = el("p", "note");
    warn.style.color = "var(--warn-text)";
    warn.textContent = "This replaces the whole inventory — all " + state.vials.length +
      " vials currently here, and the boxes they live in.";
    body.appendChild(warn);

    var foot = clear($("dlgFoot"));
    var go3 = el("button", "primary", "Replace the inventory");
    go3.disabled = !canWrite() || !!errs.length;

    // Dropping a row outright is exactly the kind of quiet data loss this app exists
    // to stop, so a real collision still has to be agreed to out loud. A row that
    // couldn't be placed is no longer dropped -- it comes in and waits in Review --
    // so it doesn't need the same "are you sure" gate, just the note above.
    var lost = rep.collisions.length;
    if (lost){
      var agree = el("label", "toggle");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.onchange = function(){ go3.disabled = !canWrite() || !!errs.length || !cb.checked; };
      agree.appendChild(cb);
      agree.appendChild(el("span", null, "I know " + lost + " row(s) will be thrown away — check the " +
        "column mapping first, especially which column holds the box name."));
      body.appendChild(agree);
      go3.disabled = true;
    }
    go3.onclick = async function(){
      // The boxes the sheet describes have to reach the lab's shared file, or they exist
      // only in this browser: slim() drops `storage` from a member's own file, so before
      // this the next reload turned every imported vial into "(unknown box)" and then
      // validate() refused to save the file at all. They land under "Not placed yet",
      // owned by whoever imported -- a member makes boxes, an admin says where they go.
      go3.disabled = true;
      try {
        var adopted = E.adoptImportedBoxes(labStorage, out.state, effectiveIdentity());
        var next = E.mergeDefaults(adopted.state);
        next.rules = state.rules;               // the rules are the lab's, not the sheet's
        next.settings.columnMap = map;
        if (customColumns && Object.keys(customColumns).length){
          var byHeader = {};
          Object.keys(customColumns).forEach(function(idx){
            var h = headerByIndex && headerByIndex[idx];
            if (h) byHeader[h] = customColumns[idx];
          });
          next.settings.customColumns = byHeader;
        }
        // One commit: the member's vials, their workbook, the lab's tree with the new
        // boxes in it, and every OTHER member's workbook the new boxes just made stale --
        // every workbook's storage sheet describes the whole shared tree, not just its
        // owner's boxes. Two commits would leave vials pointing at boxes that are not
        // there yet if the second one failed; leaving the other regenerations for later
        // is exactly the half-finished state that left admin's and umut's workbooks
        // silently wrong the last time this ran without them.
        state = next;
        var bytes = await X.writeWorkbookAsync(E.vialsToSheets(state));
        var elsewhere = (await dependentFiles(adopted.storage, state.rules)).filter(function(f){
          return f.path !== dataPath() && f.path !== xlsxPath();
        });
        await workerCommit([
          { path: dataPath(), content: E.serialise(state) },
          { path: xlsxPath(), content: bytesToBase64(bytes), base64: true },
          { path: LAB_STORAGE_PATH, content: E.serialiseStorage(adopted.storage) }
        ].concat(elsewhere), "Import " + rep.imported + " vials from " + fileName + " from " + getDevice());
        labStorage = E.mergeStorageDefaults(adopted.storage);
        labStorageLoaded = true;
        var caveat = workbookRefreshCaveat();
        labCache.members = null; labCache.data = {}; labCache.failed = [];
        dirty = false; cacheSave(); setStatus("Saved", "");
        $("dlg").close();
        var n = (labStorage.unplaced || []).length;
        showBanner("Imported " + rep.imported + " vials. Their box(es) are waiting under " +
                   "<b>Not placed yet</b> — an admin says where they go. (" + n + " unplaced in the lab.)" + caveat);
        renderAll();
      } catch(err){
        showBanner("Couldn't import: " + esc(err.message));
      }
      go3.disabled = false;
    };
    foot.appendChild(go3);
    $("dlg").showModal();
  }

  // =====================================================================
  // Admin -- the only place admin ever actually writes to a member's file. Find,
  // Boxes, Review and Log are read-only for admin (see ADMIN_MERGED above); every real
  // change -- adding, editing or withdrawing a vial, approving a request, renaming a
  // user -- happens on this one screen instead, each action naming exactly whose file
  // it commits to.
  // =====================================================================

  function adminAuth(){ return { Authorization: "Bearer " + getWorkerToken() }; }

  async function adminCommit(user, jsonState, message){
    var xlsxBytes = await X.writeWorkbookAsync(E.vialsToSheets(jsonState));
    return workerFetch("/commit", {
      method:"POST", headers: adminAuth(),
      body: JSON.stringify({
        files: [
          { path: DATA_PREFIX + user.toLowerCase() + ".json", content: E.serialise(jsonState) },
          { path: DATA_PREFIX + user.toLowerCase() + ".xlsx", content: bytesToBase64(xlsxBytes), base64: true }
        ],
        message: message || ("Admin change for " + user)
      })
    });
  }

  // A member's file plus the lab's shared structure, which is what every screen expects
  // a state to be. Admin edits one member's vials through this; the structure itself is
  // edited on the Structure screen and committed separately (see commitLabStorage).
  async function adminFetchState(user){
    var resp = await fetch(rawURL(DATA_PREFIX + user.toLowerCase() + ".json"), { cache:"no-store" });
    var text = resp.ok ? await resp.text() : "{}";
    await ensureLabFiles();
    return hydrate(E.mergeDefaults(JSON.parse(text)), user);
  }

  var adminTab = "manage";
  var adminUsersCache = null;
  async function adminUsers(){
    if (adminUsersCache) return adminUsersCache;
    var body = await workerFetch("/admin/users", { headers: adminAuth() });
    adminUsersCache = body.users;
    return adminUsersCache;
  }

  function renderAdmin(){
    Array.prototype.forEach.call(document.querySelectorAll("#adminTabs button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-admintab") === adminTab);
    });
    ["manage", "structure", "users", "types", "history", "handoff"].forEach(function(t){
      $("admin-" + t).hidden = t !== adminTab;
    });
    if (adminTab === "manage") renderAdminManage();
    else if (adminTab === "structure") renderAdminStructure();
    else if (adminTab === "users") renderAdminUsers();
    else if (adminTab === "types") renderAdminTypes();
    else if (adminTab === "history") renderAdminHistory();
    else if (adminTab === "handoff") renderAdminHandoff();
  }
  Array.prototype.forEach.call(document.querySelectorAll("#adminTabs button"), function(b){
    b.onclick = function(){ adminTab = b.getAttribute("data-admintab"); renderAdmin(); };
  });

  // ---- Manage a box: the one place admin actually freezes, edits or withdraws a vial,
  // always straight into the real member's own file. ----
  var manageView = { user:null, state:null, unitId:null, boxId:null };

  async function renderAdminManage(){
    var c = clear($("admin-manage"));
    var users = await adminUsers().catch(function(err){ c.appendChild(el("p","note",err.message)); return []; });
    var visible = users.filter(function(u){ return !u.hidden; });

    var userSel = document.createElement("select");
    userSel.appendChild(el("option", null, "Choose a member…"));
    visible.forEach(function(u){
      var o = document.createElement("option"); o.value = u.name; o.textContent = u.name;
      if (u.name === manageView.user) o.selected = true;
      userSel.appendChild(o);
    });
    userSel.onchange = async function(){
      manageView.user = userSel.value || null;
      manageView.state = null; manageView.unitId = null; manageView.boxId = null;
      renderAdminManage();
    };
    var f = el("div", "field"); f.appendChild(el("label", null, "Member")); f.appendChild(userSel);
    c.appendChild(f);

    if (!manageView.user) return;
    if (!manageView.state){
      c.appendChild(el("p", "note", "Loading " + manageView.user + "'s boxes…"));
      manageView.state = await adminFetchState(manageView.user);
      renderAdminManage();
      return;
    }

    var s = manageView.state;
    // This member's own boxes, wherever they sit -- including any the admin has not yet
    // placed in the tree, which are exactly the ones somebody is most likely to be
    // asking about.
    var owned = [];
    E.eachBox(s, function(box, rack, unit, chain){
      if (box.owner && box.owner.toLowerCase() !== String(manageView.user).toLowerCase()) return;
      owned.push({ box: box, chain: chain,
                   areaId: chain.length ? chain[0].id : "_unplaced",
                   areaName: chain.length ? chain[0].name : "Not placed yet" });
    });
    if (!owned.length){
      c.appendChild(el("p", "note", manageView.user + " has no boxes yet."));
    } else {
      var areas = [], areaSeen = {};
      owned.forEach(function(e){
        if (areaSeen[e.areaId]) return;
        areaSeen[e.areaId] = true; areas.push({ id: e.areaId, name: e.areaName });
      });
      if (!manageView.unitId || !areaSeen[manageView.unitId]) manageView.unitId = areas[0].id;
      var unitSel = document.createElement("select");
      areas.forEach(function(u){
        var o = document.createElement("option"); o.value = u.id; o.textContent = u.name;
        o.selected = u.id === manageView.unitId; unitSel.appendChild(o);
      });
      unitSel.onchange = function(){ manageView.unitId = unitSel.value; manageView.boxId = null; renderAdminManage(); };
      var uf = el("div", "field"); uf.appendChild(el("label", null, "Where")); uf.appendChild(unitSel);
      c.appendChild(uf);

      var here = owned.filter(function(e){ return e.areaId === manageView.unitId; });
      var boxSel = document.createElement("select");
      here.forEach(function(e){
        var occ = E.occupancy(s, e.box.id);
        var inside = e.chain.slice(1).map(function(n){ return n.name; }).join(" → ");
        var o = document.createElement("option");
        o.value = e.box.id;
        o.textContent = (inside ? inside + " → " : "") + e.box.name + " — " + occ.used + "/" + occ.capacity;
        boxSel.appendChild(o);
      });
      if (!manageView.boxId || !here.some(function(e){ return e.box.id === manageView.boxId; })){
        manageView.boxId = here[0].box.id;
      }
      boxSel.value = manageView.boxId;
      boxSel.onchange = function(){ manageView.boxId = boxSel.value; renderAdminManage(); };
      var bf = el("div", "field"); bf.appendChild(el("label", null, "Box")); bf.appendChild(boxSel);
      c.appendChild(bf);

      if (manageView.boxId) renderAdminManageBox(c, s);
    }

    var addBox = el("button", null, "Add a box for " + manageView.user);
    addBox.style.marginTop = "10px";
    addBox.onclick = function(){ adminAddBoxDialog(); };
    c.appendChild(addBox);
  }

  // ---- Structure: the lab's freezer, as a folder tree ----
  //
  // One tree for the whole lab, not one per person: Umut's own picture of what he wanted
  // has no person level in it at all, and the -80 in the corridor is one freezer however
  // many people keep boxes in it. It lives in cellstocks/lab-storage.json; each box
  // records whose it is. Every folder is open at once, the way a file browser shows one,
  // so a box can be dragged to any rack in the lab rather than only to a sibling.
  //
  // Editing the structure is admin's; adding your own box is everyone's (the Boxes tab's
  // quick-add), which is why the worker lets any member write this file.
  // The screen's premise is that the whole lab is on screen at once, so a node is open
  // unless it has been closed by hand -- which also means a layer added inside a folder
  // is visible the moment it is saved, rather than hiding under a twisty nobody touched.
  var structureView = { collapsed: {} };

  // One icon per kind, and only two kinds now: a layer and a box.
  // Drag-and-drop is a desktop affordance: on a touch screen a draggable row fights the
  // scroll, and the row's own tap is what opens a folder. Moving a node on a phone goes
  // through the ✎ dialog's "where it lives" picker instead.
  function isDesktopPointer(){ return !("ontouchstart" in window); }

  var LEVEL_ICON = { lab: "🏛️", layer: "📁", box: "📦" };
  var ICON_CHOICES = ["📁", "📂", "🗃️", "🧊", "❄️", "🥶",
                      "🧪", "🧫", "🔬", "🏥", "🏢", "📦", "🥶", "🌡️", "⭐️", "🔴", "🟢", "🔵"];

  function iconNode(value, kind){
    var v = String(value || "").trim();
    if (E.iconKind(v) === "image"){
      var img = document.createElement("img");
      img.src = ICON_SRC_PREFIX + v;
      img.alt = "";
      img.className = "nodeIcon";
      return img;
    }
    return el("span", "nodeIcon", v || LEVEL_ICON[kind] || LEVEL_ICON.layer);
  }

  // How many stored vials sit in a given box, lab-wide -- the owner's file is where they
  // live, so this reads every member's, not admin's own.
  function labVialCounts(){
    var counts = {};
    Object.keys(labCache.data || {}).forEach(function(name){
      (labCache.data[name].vials || []).forEach(function(v){
        if (v.status === "withdrawn" || !v.location || !v.location.boxId) return;
        counts[v.location.boxId] = (counts[v.location.boxId] || 0) + 1;
      });
    });
    return counts;
  }

  // ---- the tree ---------------------------------------------------------------------
  //
  // One kind of row, drawn by one function, all the way down. A layer holds anything; a
  // box holds vials and stops. That is the whole screen, and it is the sixth attempt at
  // it -- the five before all tried to keep freezers, racks and boxes as separate kinds
  // of thing, and every one of them ran out of levels the moment a real shelf appeared.
  async function renderAdminStructure(){
    var c = clear($("admin-structure"));
    // Everyone's vials, so a count and a "this still holds N" refusal can be honest
    // about boxes that are not admin's own.
    if (!labCache.members){
      c.appendChild(el("p", "note", "Loading the lab…"));
      ensureLabCache().then(renderAdmin);
      return;
    }

    c.appendChild(el("p", "note",
      "Every row is a layer. Tap one to open or close it, ✎ to edit it, + to put another " +
      "layer or a box inside it. A layer marked as a box gets a grid and an owner, and " +
      "nothing goes inside a box. Drag a row onto any layer to move it there."));

    var tree = el("div", "tree");
    tree.appendChild(structureRootRow());
    (labStorage.children || []).forEach(function(node){ renderTreeNode(tree, node, 1); });
    if (!(labStorage.children || []).length){
      tree.appendChild(el("p", "note", "Nothing here yet — use + on the lab row to add the first layer."));
    }
    c.appendChild(tree);
    renderUnplaced(c);
  }

  // Boxes a member has made that nobody has put anywhere yet. Umut's flow: fill the box
  // first, then an admin says which cabinet it belongs in. They sit under the tree rather
  // than inside it, because they are genuinely not in the freezer.
  function renderUnplaced(c){
    var loose = labStorage.unplaced || [];
    var wrap = el("div");
    wrap.style.marginTop = "14px";
    var head = el("div", "treeRow");
    var body = el("div", "grow treeBody");
    body.dataset.title = "Not placed yet";
    body.appendChild(el("span", "nodeIcon", "📥"));
    body.appendChild(el("span", "treeName", "Not placed yet"));
    body.appendChild(el("span", "sub", loose.length
      ? loose.length + " box" + (loose.length === 1 ? "" : "es") + " waiting for a home"
      : "empty"));
    head.appendChild(body);
    // Dropping a box here takes it back out of the freezer without deleting it.
    head.ondragover = function(ev){ ev.preventDefault(); head.classList.add("dropTarget"); };
    head.ondragleave = function(){ head.classList.remove("dropTarget"); };
    head.ondrop = function(ev){
      ev.preventDefault(); head.classList.remove("dropTarget");
      moveNodeTo(String(ev.dataTransfer.getData("text/plain") || ""), "unplaced");
    };
    wrap.appendChild(head);
    loose.forEach(function(box){ renderTreeNode(wrap, box, 1); });
    if (loose.length){
      wrap.appendChild(el("p", "note",
        "Drag one onto a layer above to put it away — or open ✎ and choose where it goes."));
    }
    c.appendChild(wrap);
  }

  function structureRootRow(){
    var row = el("div", "treeRow");
    var body = el("div", "grow treeBody");
    body.dataset.title = labStorage.labName;
    body.appendChild(iconNode(labStorage.labIcon, "lab"));
    body.appendChild(el("span", "treeName", labStorage.labName));
    var n = (labStorage.children || []).length;
    body.appendChild(el("span", "sub", n + " layer" + (n === 1 ? "" : "s")));
    row.appendChild(body);
    var add = el("button", "structRowEdit", "+");
    add.title = "Add a layer or a box at the top level";
    add.onclick = function(){ addNodeDialog(null, labStorage.labName); };
    row.appendChild(add);
    var edit = el("button", "structRowEdit", "✎");
    edit.title = "Rename the lab or change its icon";
    edit.onclick = function(){ editLabDialog(); };
    row.appendChild(edit);
    // The top level is a destination too, so a shelf can be pulled out to the root.
    row.ondragover = function(ev){ ev.preventDefault(); row.classList.add("dropTarget"); };
    row.ondragleave = function(){ row.classList.remove("dropTarget"); };
    row.ondrop = function(ev){
      ev.preventDefault(); row.classList.remove("dropTarget");
      moveNodeTo(String(ev.dataTransfer.getData("text/plain") || ""), null);
    };
    return row;
  }

  function renderTreeNode(container, node, depth){
    var isBox = E.isBoxNode(node);
    var children = isBox ? [] : (node.children || []);
    var open = !structureView.collapsed[node.id];

    var row = el("div", "treeRow");
    row.style.paddingLeft = (depth * 18) + "px";
    if (isBox) row.classList.add("isBox");

    var twisty = el("button", "twisty", children.length ? (open ? "▾" : "▸") : "·");
    twisty.disabled = !children.length;
    twisty.onclick = function(){ structureView.collapsed[node.id] = open; renderAdmin(); };
    row.appendChild(twisty);

    var body = el("div", "grow treeBody");
    body.dataset.title = node.name;
    body.dataset.id = node.id;
    body.appendChild(iconNode(node.icon, isBox ? "box" : "layer"));
    body.appendChild(el("span", "treeName", node.name));
    body.appendChild(el("span", "sub", structureSubtitle(node)));
    body.onclick = function(){
      if (!children.length) return;
      structureView.collapsed[node.id] = open;
      renderAdmin();
    };
    row.appendChild(body);

    if (!isBox){
      var add = el("button", "structRowEdit", "+");
      add.title = "Add a layer or a box inside " + node.name;
      add.onclick = function(){ addNodeDialog(node.id, node.name); };
      row.appendChild(add);
    }
    var edit = el("button", "structRowEdit", "✎");
    edit.onclick = function(){ editNodeDialog(node); };
    row.appendChild(edit);

    // Anything can be dragged; anything that is not a box can receive.
    if (isDesktopPointer()){
      row.draggable = true;
      row.ondragstart = function(ev){ ev.dataTransfer.setData("text/plain", node.id); };
    }
    if (!isBox){
      row.ondragover = function(ev){ ev.preventDefault(); row.classList.add("dropTarget"); };
      row.ondragleave = function(){ row.classList.remove("dropTarget"); };
      row.ondrop = function(ev){
        ev.preventDefault();
        row.classList.remove("dropTarget");
        moveNodeTo(String(ev.dataTransfer.getData("text/plain") || ""), node.id);
      };
    }
    container.appendChild(row);

    if (!open) return;
    children.forEach(function(child){ renderTreeNode(container, child, depth + 1); });
  }

  function structureSubtitle(node){
    if (E.isBoxNode(node)){
      var counts = labVialCounts();
      var cap = (Number(node.rows) || 0) * (Number(node.cols) || 0);
      return [node.rows + "×" + node.cols,
              (counts[node.id] || 0) + "/" + cap + " full",
              node.owner || "nobody",
              node.note].filter(Boolean).join(" · ");
    }
    var kids = (node.children || []).length;
    var boxes = (node.children || []).filter(E.isBoxNode).length;
    var bits = [];
    if (!kids) bits.push("empty");
    else if (boxes === kids) bits.push(kids + " box" + (kids === 1 ? "" : "es"));
    else bits.push(kids + " inside");
    if (node.note) bits.push(node.note);
    return bits.join(" · ");
  }

  // One move for everything. A box, a shelf, a whole freezer -- to the tree they are all
  // nodes, and the only difference is how many vials come along. `targetId` may be null
  // (the top level) or the string "unplaced" (a box taken back out of the freezer).
  async function moveNodeTo(id, targetId){
    if (!id) return;
    var r = E.moveNode(labStorage, id, targetId);
    if (!r.ok){ showBanner(r.reason); return; }
    var moving = E.findNode(labStorage, id);
    var name = moving ? moving.node.name : id;
    try {
      // commitLabStorage rewrites the affected vials' stored paths in the same commit.
      await commitLabStorage(r.state, "Move " + name);
      showBanner("Moved <b>" + esc(name) + "</b>.");
      renderAdmin();
    } catch(err){ showBanner("Couldn't save that: " + esc(err.message)); }
  }

  // ---- the structure's own dialogs ----

  function iconField(body, current, onPick){
    var f = el("div", "field");
    f.appendChild(el("label", null, "Icon"));
    var picked = { value: current || "" };
    var preview = el("div", "iconPreview");
    function paintPreview(){
      clear(preview).appendChild(iconNode(picked.value, "rack"));
      preview.appendChild(el("span", "sub", picked.value ? picked.value : "default"));
    }
    var palette = el("div", "iconPalette");
    ICON_CHOICES.forEach(function(emoji){
      var b = el("button", "iconChoice", emoji);
      b.onclick = function(){ picked.value = emoji; onPick(picked.value); paintPreview(); };
      palette.appendChild(b);
    });
    var clearBtn = el("button", "iconChoice", "✕");
    clearBtn.title = "Back to the default icon";
    clearBtn.onclick = function(){ picked.value = ""; onPick(""); paintPreview(); };
    palette.appendChild(clearBtn);

    // An uploaded image, exactly the way the wardrobe app already does it: read as
    // base64 in the browser, committed as a real file, and only its name stored here.
    var upload = el("button", null, "Upload an image…");
    upload.onclick = function(){
      var input = document.createElement("input");
      input.type = "file";
      input.accept = "image/png,image/jpeg,image/webp";
      input.onchange = async function(){
        var file = input.files && input.files[0];
        if (!file) return;
        upload.disabled = true;
        upload.textContent = "Uploading…";
        try {
          var name = await uploadIcon(file);
          picked.value = name; onPick(name); paintPreview();
        } catch(err){ showBanner("Couldn't upload that: " + esc(err.message)); }
        upload.disabled = false;
        upload.textContent = "Upload an image…";
      };
      input.click();
    };

    paintPreview();
    f.appendChild(preview);
    f.appendChild(palette);
    f.appendChild(upload);
    body.appendChild(f);
  }

  async function uploadIcon(file){
    var ext = (/\.(png|jpe?g|webp)$/i.exec(file.name) || [])[0];
    if (!ext) throw new Error("only PNG, JPG or WEBP");
    var slug = file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    var fileName = (slug || "icon") + "-" + Date.now().toString(36) + ext.toLowerCase();
    var base64 = await blobToBase64(file);
    await workerCommit([{ path: ICON_PREFIX + fileName, content: base64, base64: true }], "Add a storage icon");
    return fileName;
  }

  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onerror = function(){ reject(new Error("couldn't read that file")); };
      r.onload = function(){ resolve(String(r.result).split(",")[1] || ""); };
      r.readAsDataURL(blob);
    });
  }

  // `remove`, when given, is {kind, id, name} and adds a Delete to the dialog's footer.
  // Deleting is deliberately in the edit dialog rather than on the row -- the row is what
  // you tap to open a folder, and a delete one pixel away from that is a trap.
  // ---- adding, editing and deleting one node --------------------------------------
  //
  // One dialog for both, because there is one kind of thing. Ticking "this is a box"
  // reveals the grid and the owner and hides nothing else: a box is a layer that stopped.
  function nodeFieldsDialog(title, initial, onSave){
    $("dlgTitle").textContent = title;
    var body = clear($("dlgBody"));
    var msg = el("p", "note");

    var name = document.createElement("input");
    name.value = initial.name || ""; name.autocomplete = "off"; name.placeholder = "Shelf 1";
    var note = document.createElement("input");
    note.value = initial.note || ""; note.autocomplete = "off";
    note.placeholder = "-80 °C, back corner — anything worth remembering";
    [["Name", name], ["Notes / properties", note]].forEach(function(p){
      var f = el("div", "field"); f.appendChild(el("label", null, p[0])); f.appendChild(p[1]); body.appendChild(f);
    });

    var icon = { value: initial.icon || "" };
    iconField(body, icon.value, function(v){ icon.value = v; });

    var isBox = document.createElement("input");
    isBox.type = "checkbox";
    isBox.checked = !!initial.isBox;
    isBox.id = "nodeIsBox";
    var lbl = el("label", null);
    lbl.style.cssText = "display:flex;align-items:center;gap:8px;margin:10px 0";
    lbl.appendChild(isBox);
    lbl.appendChild(document.createTextNode("This is a box — it holds vials, and nothing goes inside it"));
    body.appendChild(lbl);
    // What a node IS cannot be changed after the fact: turning a layer into a box would
    // orphan its children, and a box into a layer would orphan its vials. Both are a
    // delete-and-make-again decision, so the tick is fixed once the node exists.
    if (initial.exists){
      isBox.disabled = true;
      lbl.appendChild(el("span", "sub", initial.isBox
        ? "  (a box cannot become a layer — make a new layer and move the vials)"
        : "  (a layer cannot become a box — make a box inside it instead)"));
    }

    var boxFields = el("div");
    var owner = document.createElement("select");
    var ownerNames = (labCache.members || []).slice().sort();
    var opt0 = document.createElement("option"); opt0.value = ""; opt0.textContent = "Choose…";
    owner.appendChild(opt0);
    ownerNames.forEach(function(n){
      var o = document.createElement("option"); o.value = n; o.textContent = n;
      if ((initial.owner || "").toLowerCase() === n.toLowerCase()) o.selected = true;
      owner.appendChild(o);
    });
    var rows = document.createElement("input"); rows.type = "number"; rows.min = 1; rows.value = initial.rows || 9;
    var cols = document.createElement("input"); cols.type = "number"; cols.min = 1; cols.value = initial.cols || 9;
    var of = el("div", "field"); of.appendChild(el("label", null, "Whose is it? (required)")); of.appendChild(owner);
    boxFields.appendChild(of);
    var grid = el("div", "two");
    [["Rows (A)", rows], ["Columns (B)", cols]].forEach(function(p){
      var f = el("div", "field"); f.appendChild(el("label", null, p[0])); f.appendChild(p[1]); grid.appendChild(f);
    });
    boxFields.appendChild(grid);
    body.appendChild(boxFields);

    function sync(){ boxFields.hidden = !isBox.checked; }
    isBox.onchange = sync;
    sync();

    body.appendChild(msg);
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    ok.onclick = async function(){
      var details = {
        name: name.value, note: note.value, icon: icon.value,
        isBox: isBox.checked, owner: owner.value, rows: rows.value, cols: cols.value
      };
      if (!details.name.trim()){ msg.textContent = "A name is required."; msg.style.color = "var(--bad)"; return; }
      if (details.isBox && !details.owner){ msg.textContent = "A box has to belong to somebody."; msg.style.color = "var(--bad)"; return; }
      ok.disabled = true;
      try {
        var r = await onSave(details);
        if (r && r.ok === false){ msg.textContent = r.reason; msg.style.color = "var(--bad)"; ok.disabled = false; return; }
        $("dlg").close();
        renderAdmin();
      } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    if (initial.exists){
      var del = el("button", "danger", "Delete");
      del.style.marginRight = "auto";
      del.onclick = async function(){
        del.disabled = true; ok.disabled = true;
        try { await deleteStructureNode(initial.id, msg); }
        catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
        del.disabled = false; ok.disabled = false;

  // Deleting a layer, a box, or a whole branch, as admin, with no Handoff and no
  // emptying it by hand first. What it will not do is make a vial cease to exist: any
  // vial inside is WITHDRAWN first, in its own owner's file, with the same
  // snapshot-of-where-it-was that taking one out by hand writes -- so it leaves the
  // active inventory, stays in the Log, and stays searchable. The confirm says how many
  // and whose, before anything runs.
  //
  // Order matters: the owners' files are written first, so the boxes really are empty by
  // the time the tree is. If a member's commit fails, the tree still names their box and
  // nothing is lost -- the opposite order would strand the vials.
  async function deleteStructureNode(id, msg){
    var found = E.findNode(labStorage, id);
    if (!found){ msg.textContent = "That is already gone."; return; }
    var contents = E.nodeContents(labStorage, id);

    // Refuse rather than guess. What is inside this node is counted out of the other
    // members' files, and a file that could not be read counts as zero -- so with one
    // missing, "nothing is inside it" is not an answer, it is an absence. Going ahead on
    // that is what stranded two vials naming a box that had gone, and locked their owner
    // out of saving anything at all. An empty structure is an answer; an unread one is not.
    if ((labCache.failed || []).length){
      msg.textContent = "Not deleting anything yet: " + labCache.failed.join(", ") +
        "'s inventory could not be read just now, so I cannot tell whether any of their vials " +
        "are inside. Reload and try again in a minute.";
      msg.style.color = "var(--bad)";
      return;
    }

    var counts = labVialCounts();
    var byOwner = {};
    contents.boxes.forEach(function(b){
      var n = counts[b.id] || 0;
      if (n) byOwner[b.owner || ""] = (byOwner[b.owner || ""] || 0) + n;
    });
    var owners = Object.keys(byOwner);
    var vialTotal = owners.reduce(function(n, o){ return n + byOwner[o]; }, 0);

    var lines = ["Delete " + found.node.name + "?"];
    if (contents.layers) lines.push(contents.layers + " layer(s) inside it go too.");
    if (contents.boxes.length) lines.push(contents.boxes.length + " box(es) go with it.");
    if (vialTotal){
      lines.push(vialTotal + " vial(s) still inside (" +
        owners.map(function(o){ return (o || "unassigned") + ": " + byOwner[o]; }).join(", ") +
        ") will be taken out and logged, not erased — they stay in the Log and in history.");
    } else if (!contents.boxes.length && !contents.layers){
      lines.push("Nothing is inside it.");
    }
    lines.push("Every member sees the same freezer, so this goes for the whole lab.");
    if (!window.confirm(lines.join("\n\n"))) return;

    var emptied = {};
    contents.boxes.forEach(function(b){ emptied[b.id] = 0; });
    for (var i = 0; i < owners.length; i++){
      var owner = owners[i];
      if (!owner) continue;
      var st = await adminFetchState(owner);
      var ids = (st.vials || []).filter(function(v){
        return v.status !== "withdrawn" && v.location && emptied.hasOwnProperty(v.location.boxId);
      }).map(function(v){ return v.id; });
      if (!ids.length) continue;
      var w = E.withdraw(st, ids, {
        date: new Date().toISOString().slice(0, 10),
        by: effectiveIdentity() || "admin",
        purpose: "discarded",
        notes: found.node.name + " was removed from the freezer",
        ids: ids.map(function(){ return adminNewId("w"); })
      });
      await adminCommit(owner, w.state, "Take out " + ids.length + " vial(s): " + found.node.name + " was removed");
    }

    var r = E.removeNode(labStorage, id, emptied);
    if (!r.ok){ msg.textContent = r.reason; msg.style.color = "var(--bad)"; return; }
    await commitLabStorage(r.state, "Delete " + found.node.name);
    $("dlg").close();
    showBanner("Deleted <b>" + esc(found.node.name) + "</b>" +
               (vialTotal ? " — " + vialTotal + " vial(s) taken out and logged." : "."));
    renderAdmin();
  }
