  // ---- History & export ----
  function adminDownloadBlob(bytes, filename, type){
    var blob = new Blob([bytes], { type:type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  // ---- who the nightly layout export goes to ----
  //
  // The export itself is built and committed by a scheduled job, from the repository --
  // nothing here generates it. All this screen owns is the list of addresses, which is a
  // committed file for the same reason: whatever sends the mail reads the repo, and has
  // no account to log in with.
  async function renderExportRecipients(c){
    c.appendChild(el("h3", null, "Daily layout export"));
    c.appendChild(el("p", "note",
      "Every morning the freezer's layout is rebuilt — an Excel workbook with a grid per box, " +
      "a printable PDF map for the freezer door, and a one-row-per-box summary — and mailed to " +
      "the addresses below. Leave it empty and nothing is sent; the files are still rebuilt and " +
      "kept in the repository."));

    var list = el("div");
    c.appendChild(list);
    var msg = el("div");
    var current = [];
    // The whole settings object, so saving one field never drops another.
    var settings = mailSettings || { emails: [], sendAt: "07:30", timeZone: "Europe/Istanbul", rosterHiddenColumns: [] };

    function draw(){
      clear(list);
      if (!current.length) list.appendChild(el("p", "note", "Nobody yet — the export is written but not mailed."));
      current.forEach(function(addr, i){
        var row = el("div", "item");
        row.appendChild(el("div", "grow", addr));
        var del = el("button", "danger", "Remove");
        del.onclick = async function(){
          var next = current.slice(0, i).concat(current.slice(i + 1));
          await saveRecipients(next);
        };
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    // One file holds both who it goes to and when. It is written whole, so this merges
    // into what was read rather than replacing it -- writing { emails } alone used to be
    // enough, and now it would silently reset the send time every time somebody added an
    // address.
    async function saveSettings(changes, what){
      var next = Object.assign({}, settings, changes);
      clear(msg).appendChild(el("p", "note", "Saving…"));
      try {
        await workerCommit(
          [{ path: RECIPIENTS_PATH, content: JSON.stringify(next, null, 2) + "\n" }],
          what || "Set up the daily layout export");
        settings = next;
        // What was just committed is now the freshest copy there is. Recording it here is
        // what stops the next render -- or the next save's merge -- from resurrecting the
        // old values out of a stale CDN read.
        mailSettings = next;
        current = next.emails;
        draw();
        return true;
      } catch(err){
        clear(msg).appendChild(el("p", "note", "Couldn't save that: " + esc(err.message)));
        return false;
      }
    }

    async function saveRecipients(next){
      if (await saveSettings({ emails: next }, "Set who the daily layout export goes to")){
        clear(msg).appendChild(el("p", "note", "Saved. The next morning's export goes to " +
          (next.length ? next.join(", ") : "nobody") + "."));
      }
    }

    var input = document.createElement("input");
    input.type = "email";
    input.placeholder = "somebody@example.com";
    input.autocomplete = "off";
    var add = el("button", "primary", "Add");
    add.onclick = async function(){
      var addr = input.value.trim();
      // Deliberately loose: this is a list an admin types, not a signup form, and the
      // only cost of a typo is a bounce. It rejects what is obviously not an address.
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)){
        clear(msg).appendChild(el("p", "note", "That does not look like an email address."));
        return;
      }
      if (current.some(function(a){ return a.toLowerCase() === addr.toLowerCase(); })){
        clear(msg).appendChild(el("p", "note", addr + " is already on the list."));
        return;
      }
      input.value = "";
      await saveRecipients(current.concat([addr]));
    };
    var row = el("div", "row tight");
    row.appendChild(input); row.appendChild(add);
    c.appendChild(row);

    // ---- when it goes out -------------------------------------------------------
    //
    // This is a value the scheduled job reads, not a time written into the workflow:
    // the app can write this one file and must never be able to write a workflow. The
    // job wakes every half hour and sends on the first wake at or after this time,
    // which is also what makes a morning GitHub skips heal itself.
    c.appendChild(el("h3", null, "When it goes out"));
    var timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.step = 60;
    var saveTime = el("button", "primary", "Save the time");
    saveTime.onclick = async function(){
      var v = String(timeInput.value || "").trim();
      if (!/^\d{1,2}:\d{2}$/.test(v)){
        clear(msg).appendChild(el("p", "note", "Give a time like 07:30."));
        return;
      }
      saveTime.disabled = true;
      if (await saveSettings({ sendAt: v }, "Send the daily layout at " + v)){
        clear(msg).appendChild(el("p", "note",
          "Saved. From tomorrow the layout goes out at " + esc(v) + " " + esc(settings.timeZone) + "."));
      }
      saveTime.disabled = false;
    };
    var timeRow = el("div", "row tight");
    timeRow.appendChild(timeInput); timeRow.appendChild(saveTime);
    c.appendChild(timeRow);
    var timeNote = el("p", "note");
    c.appendChild(timeNote);
    c.appendChild(msg);

    // Only read the file when this session has never seen it. Once we have committed it,
    // re-reading can only lose the change (see mailSettings above).
    if (!mailSettings){
      try {
        var resp = await fetch(rawURL(RECIPIENTS_PATH), { cache:"no-store" });
        if (resp.ok){
          var body = JSON.parse(await resp.text());
          settings = {
            emails: (body.emails || []).filter(function(a){ return typeof a === "string" && a; }),
            sendAt: /^\d{1,2}:\d{2}$/.test(body.sendAt || "") ? body.sendAt : "07:30",
            timeZone: body.timeZone || "Europe/Istanbul",
            rosterHiddenColumns: Array.isArray(body.rosterHiddenColumns) ? body.rosterHiddenColumns : []
          };
          mailSettings = settings;
          current = settings.emails;
        }
      } catch(err){ /* no list yet is not an error -- it is the starting state */ }
    } else {
      current = settings.emails;
    }
    timeInput.value = settings.sendAt;
    // Say what actually happens rather than implying a guarantee GitHub does not give.
    timeNote.textContent = "Times are " + settings.timeZone + ". The freezer is checked every half " +
      "hour and the mail goes out on the first check at or after this time, so it can be a few " +
      "minutes late — and a morning GitHub skips is picked up by the next check instead of lost.";
    draw();

    // ---- which columns the roster shows ----------------------------------------
    //
    // roster.xlsx (built by the same scheduled job) lists every cell attribute as a
    // column, including whatever a member typed on the Add screen for a non-"cell" kind
    // (a Plasmid's dox-inducible/tet/FLAG...) -- so the set can't be hardcoded shut, and
    // this is the one place an admin can trim it. Only what is explicitly hidden is
    // stored: a column nobody has an opinion on yet, today's or tomorrow's, stays shown.
    c.appendChild(el("h3", null, "Roster columns"));
    c.appendChild(el("p", "note",
      "roster.xlsx lists every cell attribute as a column, including one a member added " +
      "themselves. Pick which ones actually show — a new attribute stays on until you turn it off."));
    var colsBox = el("div");
    c.appendChild(colsBox);

    if (!labCache.members){
      colsBox.appendChild(el("p", "note", "Reading the rest of the lab, so every account's own attributes can be listed…"));
      ensureLabCache().then(renderAdminHistory);
    } else {
      var FIXED_ROSTER_COLUMNS = ["name", "origin", "koox", "resistance", "caspex", "guide", "passage",
        "passage_kind", "frozen", "frozen_raw", "location", "position", "notes", "flags"];
      // The lab's, not just this account's -- counting only your own vials would say a
      // custom attribute nobody else uses is the whole list, the same trap ruleImpact()
      // already avoids for the rules screen.
      var customKeys = {};
      [state].concat(Object.keys(labCache.data || {}).map(function(n){ return labCache.data[n]; })).forEach(function(st){
        if (!st) return;
        (st.vials || []).forEach(function(v){
          if (v.customFacets) Object.keys(v.customFacets).forEach(function(k){ customKeys[k] = true; });
        });
      });
      var allRosterColumns = FIXED_ROSTER_COLUMNS.concat(Object.keys(customKeys).sort());
      var hiddenColumns = (settings.rosterHiddenColumns || []).slice();
      allRosterColumns.forEach(function(col){
        var row = el("label", "item");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = hiddenColumns.indexOf(col) === -1;
        cb.disabled = !canWrite();
        cb.onchange = async function(){
          cb.disabled = true;
          var next = cb.checked ? hiddenColumns.filter(function(k){ return k !== col; }) : hiddenColumns.concat([col]);
          await saveSettings({ rosterHiddenColumns: next }, (cb.checked ? "Show " : "Hide ") + col + " in the daily roster export");
          cb.disabled = !canWrite();
        };
        row.appendChild(cb);
        row.appendChild(document.createTextNode(" " + col));
        colsBox.appendChild(row);
      });
    }
  }

  // ---- Handoff ----
  function adminNewId(prefix){ return prefix + "-" + Math.random().toString(36).slice(2, 10); }

  var hoState = null, hoAssignments = {}, hoAllNames = [];

  async function renderAdminHandoff(){
    var c = clear($("admin-handoff"));
    c.appendChild(el("p", "note",
      "Somebody leaving the lab. Their boxes stay exactly where they physically are -- the " +
      "freezer belongs to the lab -- and change hands to whoever takes them over. Once every " +
      "box has somewhere to go, their account and its files are deleted."));
    var users = await adminUsers().catch(function(){ return []; });
    // A PI holds no inventory, so they can neither leave boxes behind nor take any on.
    hoAllNames = users.filter(function(u){ return !u.hidden && u.role !== "pi"; }).map(function(u){ return u.name; });
    var sel = document.createElement("select");
    hoAllNames.forEach(function(n){ var o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); });
    var f = el("div", "field"); f.appendChild(el("label", null, "Who's leaving")); f.appendChild(sel);
    c.appendChild(f);
    var leaving = document.createElement("input"); leaving.type = "checkbox";
    var lbl = el("label", null); lbl.style.cssText = "display:flex;align-items:center;gap:6px;margin:8px 0";
    lbl.appendChild(leaving); lbl.appendChild(document.createTextNode("This person has left the lab"));
    c.appendChild(lbl);
    var boxesWrap = el("div");
    c.appendChild(boxesWrap);
    var applyBtn = el("button", "danger", "Hand over and delete the account");
    applyBtn.hidden = true;
    applyBtn.style.marginTop = "10px";
    c.appendChild(applyBtn);
    var msg = el("div");
    c.appendChild(msg);

    leaving.onchange = async function(){
      clear(boxesWrap); applyBtn.hidden = true; hoState = null; hoAssignments = {};
      if (!leaving.checked || !sel.value) return;
      hoState = await adminFetchState(sel.value);
      var owner = sel.value.toLowerCase();
      var boxes = [];
      // Their boxes are the ones in the lab's shared structure marked as theirs.
      E.eachBox(labStorage, function(box, rack, unit, chain){
        if ((box.owner || "").toLowerCase() !== owner) return;
        var count = (hoState.vials || []).filter(function(v){
          return v.status !== "withdrawn" && v.location && v.location.boxId === box.id;
        }).length;
        boxes.push({ unit:unit, chain:chain, box:box, count:count });
      });
      if (!boxes.length){
        boxesWrap.appendChild(el("p", "note", sel.value + " has no boxes -- their account can be deleted straight away."));
        applyBtn.hidden = false;
        return;
      }
      boxesWrap.appendChild(el("p", "note", "Every box needs a destination before the account can go."));
      boxes.forEach(function(entry){
        var row = el("div", "item");
        var grow = el("div", "grow");
        var path = [entry.unit.name].concat(entry.chain.map(function(r){ return r.name; })).concat([entry.box.name]);
        grow.appendChild(el("div", null, path.join(" → ")));
        grow.appendChild(el("div", "sub", entry.count + " vial" + (entry.count === 1 ? "" : "s")));
        row.appendChild(grow);
        var assignSel = document.createElement("select");
        var none = document.createElement("option"); none.value = ""; none.textContent = "(nobody yet)";
        assignSel.appendChild(none);
        hoAllNames.filter(function(n){ return n !== sel.value; }).forEach(function(n){
          var o = document.createElement("option"); o.value = n; o.textContent = "→ " + n; assignSel.appendChild(o);
        });
        var discard = document.createElement("option");
        discard.value = " discard";
        discard.textContent = "Discard (delete " + entry.count + " vial" + (entry.count === 1 ? "" : "s") + ")";
        assignSel.appendChild(discard);
        assignSel.onchange = function(){ hoAssignments[entry.box.id] = assignSel.value; };
        row.appendChild(assignSel);
        boxesWrap.appendChild(row);
      });
      applyBtn.hidden = false;
    };

    applyBtn.onclick = async function(){
      var user = sel.value;
      if (!user) return;
      var owner = user.toLowerCase();
      var myBoxes = [];
      E.eachBox(labStorage, function(box){ if ((box.owner || "").toLowerCase() === owner) myBoxes.push(box); });

      var unassigned = myBoxes.filter(function(b){ return !hoAssignments[b.id]; });
      if (unassigned.length){
        clear(msg).appendChild(el("div", "note",
          "Still nowhere to go: " + unassigned.map(function(b){ return b.name; }).join(", ") +
          ". Give every box a new owner (or Discard it) first."));
        return;
      }
      var discarding = myBoxes.filter(function(b){ return hoAssignments[b.id] === " discard"; });
      var discardedVials = (hoState.vials || []).filter(function(v){
        return v.location && discarding.some(function(b){ return b.id === v.location.boxId; });
      }).length;
      if (!window.confirm("Hand " + (myBoxes.length - discarding.length) + " box(es) over" +
          (discarding.length ? ", discard " + discarding.length + " box(es) with " + discardedVials + " vial(s)" : "") +
          ", then delete " + user + "'s account and both its files? This cannot be undone.")) return;

      applyBtn.disabled = true;
      try {
        // 1. The boxes change hands where they already are: only `owner` moves, and the
        //    tree, the ids and every position stay exactly as they were. A discarded box
        //    is removed from the structure entirely.
        var nextStorage = JSON.parse(JSON.stringify(labStorage));
        var byTarget = {};
        myBoxes.forEach(function(box){
          var target = hoAssignments[box.id];
          if (target === " discard"){
            var gone = E.removeNode(nextStorage, box.id, {});
            if (!gone.ok) throw new Error(gone.reason);
            nextStorage = gone.state;
            return;
          }
          E.findBox(nextStorage, box.id).box.owner = target.toLowerCase();
          (byTarget[target] = byTarget[target] || []).push(box.id);
        });

        // 2. The vials follow their box into the new owner's own file, keeping their
        //    slot but taking fresh ids -- two accounts mint ids independently, so
        //    "v-2" from one can collide with "v-2" in the other (PR #82).
        var prepared = [];
        var targetNames = Object.keys(byTarget);
        for (var t = 0; t < targetNames.length; t++){
          var target = targetNames[t];
          var targetState = await adminFetchState(target);
          var ids = {};
          byTarget[target].forEach(function(id){ ids[id] = true; });
          (hoState.vials || []).forEach(function(v){
            if (!v.location || !ids[v.location.boxId]) return;
            var moved = JSON.parse(JSON.stringify(v));
            moved.id = adminNewId("v");
            targetState.vials.push(moved);
          });
          (hoState.withdrawals || []).forEach(function(w){
            if (!w.from || !ids[w.from.boxId]) return;
            var movedW = JSON.parse(JSON.stringify(w));
            movedW.id = adminNewId("w");
            targetState.withdrawals.push(movedW);
          });
          var errors = E.errorsOnly(E.validate(E.hydrateStorage(targetState, nextStorage, target)));
          if (errors.length) throw new Error(target + "'s inventory would be invalid after this: " + errors[0].message);
          prepared.push({ name:target, state:targetState });
        }

        // 3. Write it all: the structure first, then each new owner's file, then the
        //    account itself goes -- DELETE /admin/users also removes both its files.
        await commitLabStorage(nextStorage, "Handoff: " + user + "'s boxes change hands");
        for (var i = 0; i < prepared.length; i++){
          await adminCommit(prepared[i].name, prepared[i].state, "Handoff: took over boxes from " + user);
        }
        await workerFetch("/admin/users/" + encodeURIComponent(user), { method:"DELETE", headers: adminAuth() });
        adminUsersCache = null;
        labCache.members = null; labCache.data = {}; labCache.failed = [];
        structureView.collapsed = {};

        clear(msg).appendChild(el("div", "note",
          "Handed " + (myBoxes.length - discarding.length) + " box(es) over to " +
          (targetNames.length ? targetNames.join(", ") : "nobody") +
          (discarding.length ? ", discarded " + discarding.length : "") +
          ", and deleted " + user + "'s account."));
        leaving.checked = false; clear(boxesWrap); applyBtn.hidden = true; hoState = null; hoAssignments = {};
        renderAdminHandoff();
      } catch(err){ clear(msg).appendChild(el("div", "note", err.message)); }
      applyBtn.disabled = false;
    };
  }

      sel.appendChild(o);
    });
    sel.dataset.n = String((state.storage.children || []).length);
  }

  // ---- wiring ----
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.onclick = function(){ go(b.getAttribute("data-screen")); };
  });
  $("dlgX").onclick = function(){ $("dlg").close(); };

  var qTimer = null;
  $("q").oninput = function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ filter.query = $("q").value; renderResults(); }, 150);
  };

  $("fzName").oninput = function(){
    freeze.name = $("fzName").value;
    // A locked exact slot came from clicking a specific cell, not from typing a name --
    // it should survive the name changing (suggestPlacementAt() still re-checks the new
    // name's origin against that slot's row every time, so a real mix is still refused).
    // Without this guard, arriving here from "Add into this slot" with the name field
    // still empty dropped the pin on the very first keystroke.
    if (!freeze.position) freeze.boxId = null;
    renderFreezeFacets();
    renderFreezePlan();
    renderFreezeGuard();
  };
  $("fzType").onchange = function(){
    var sel = $("fzType");
    if (sel.value === "__new__"){
      var name = prompt("Name this type:", "");
      if (!name || !name.trim()){ sel.value = freeze.kind; return; }
      var trimmed = name.trim();
      workerFetch("/types", { method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() },
        body: JSON.stringify({ name: trimmed }) })
        .then(function(cfg){ typesCache = cfg; freeze.kind = trimmed; freeze.customFacets = {}; renderAll(); })
        .catch(function(err){ showBanner(esc(err.message)); sel.value = freeze.kind; });
      return;
    }
    freeze.kind = sel.value;
    freeze.customFacets = {};
    renderFreezeFacets();
    renderFreezeCustomFacets();
    renderFreezePlan();
    renderFreezeGuard();
  };
  var COUNT_MIN = 1, COUNT_MAX = 81;
  function setCount(n, fromTyping){
    var v = Math.round(Number(n));
    if (!isFinite(v)) v = COUNT_MIN;
    v = Math.max(COUNT_MIN, Math.min(COUNT_MAX, v));
    freeze.count = v;
    // Don't fight the field while it is being typed in -- rewriting it mid-keystroke
    // makes "12" impossible to type, because the 1 becomes a 1 and the cursor jumps.
    if (!fromTyping) $("fzCount").value = String(v);
    $("fzMinus").disabled = v <= COUNT_MIN;
    $("fzPlus").disabled = v >= COUNT_MAX;
    renderFreezePlan();
    renderFreezeGuard();
  }
  $("fzCount").oninput = function(){ setCount($("fzCount").value, true); };
  // On the way out, put back whatever was actually settled on, so an emptied or
  // out-of-range field never sits there looking like it means something.
  $("fzCount").onblur = function(){ setCount(freeze.count); };
  $("fzMinus").onclick = function(){ setCount(freeze.count - 1); };
  $("fzPlus").onclick = function(){ setCount(freeze.count + 1); };
  setCount(freeze.count);
  $("fzUnit").onchange = function(){
    freeze.unitId = $("fzUnit").value; freeze.boxId = null; freeze.position = null; renderFreezePlan(); renderFreezeGuard();
  };
  $("fzGo").onclick = doFreeze;
  $("fzDate").value = new Date().toISOString().slice(0, 10);

  $("bxOwner").onchange = function(){
    boxView.owner = $("bxOwner").value; boxView.unitId = null; boxView.boxId = null; renderBoxes();
  };
  $("bxUnit").onchange = function(){
    boxView.unitId = $("bxUnit").value; boxView.boxId = null; renderBoxes();
  };

  try {
    var t = localStorage.getItem(LS.theme);
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}

  // A freezer is shared, so take another look whenever the app comes back to the
  // front rather than trusting a copy that may be an hour old -- but only once someone
  // is actually logged in; nothing fetches anyone's inventory before that.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && !dirty && canWrite()) load();
  });

  $("appFooter").textContent = "© " + new Date().getFullYear() + " CAApp · Umut Cagiral · Built with Claude";

  // Pressing it is never destructive: load() merges anything this device has not managed
  // to commit rather than replacing it, so the worst case is that nothing has changed.
  $("refresh").onclick = async function(){
    if (!canWrite()) return;
    var b = $("refresh");
    b.disabled = true; b.classList.add("spin");
    // Somebody pressing this is asking for a fresh look, so the shared files are re-read
    // too -- otherwise a rack an admin added a minute ago would still be missing and the
    // button would look broken. This is the one place re-reading is right: the rule
    // against it is about re-reading straight AFTER a commit, when the CDN still serves
    // the copy from before it.
    labStorageLoaded = false; labRulesLoaded = false;
    labCache.members = null; labCache.data = {}; labCache.failed = [];
    try { await load(); renderAll(); }
    finally { b.disabled = false; b.classList.remove("spin"); }
  };

  cacheLoad();
  afterAuthChange();
  if (canWrite()) load();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
