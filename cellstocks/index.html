      if (ox.frozen.max && (!x.frozen.max || ox.frozen.max > x.frozen.max)) x.frozen.max = ox.frozen.max;
      x.frozen.dated += ox.frozen.dated;
      x.frozen.unconfirmed += ox.frozen.unconfirmed;
    });
    return x;
  }

  function isoToDay(iso){ return Math.round(Date.parse(iso + "T00:00:00Z") / 86400000); }
  function dayToIso(day){ return new Date(day * 86400000).toISOString().slice(0, 10); }
  function prettyDate(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
  }

  // One dual-handle slider. Returns nothing; it writes straight into `filter` and
  // asks for a redraw, because a filter that lagged behind the handle would defeat
  // the point of dragging it.
  function dualSlider(parent, opts){
    var wrap = el("div", "dual");
    var track = el("div", "track"), fill = el("div", "fill");
    var lo = document.createElement("input"), hi = document.createElement("input");
    [lo, hi].forEach(function(inp){
      inp.type = "range"; inp.min = opts.min; inp.max = opts.max; inp.step = opts.step || 1;
    });
    lo.value = opts.lo; hi.value = opts.hi;
    wrap.appendChild(track); wrap.appendChild(fill);
    wrap.appendChild(lo); wrap.appendChild(hi);
    parent.appendChild(wrap);

    function paint(){
      var span = opts.max - opts.min || 1;
      var a = (Number(lo.value) - opts.min) / span * 100;
      var b = (Number(hi.value) - opts.min) / span * 100;
      fill.style.left = a + "%";
      fill.style.width = Math.max(0, b - a) + "%";
    }
    function changed(){
      // Handles may cross; whichever is lower is the floor.
      var a = Math.min(Number(lo.value), Number(hi.value));
      var b = Math.max(Number(lo.value), Number(hi.value));
      paint();
      opts.onChange(a, b);
    }
    lo.oninput = changed; hi.oninput = changed;
    paint();
    return wrap;
  }

  function renderFilters(){
    var box = clear($("filters"));
    // Admin and the PI always see the whole lab merged here -- there is no separate
    // toggle for it, and no "own" results to search alongside (see renderResults()).
    if (canSeeWholeLab() && !labCache.members) ensureLabCache().then(function(){ renderFilters(); renderResults(); });
    var x = combinedSearchExtents();
    followExtents(x);
    // Always fully open -- see the comment on followExtents() above.
    filter.frozenFrom = x.frozen.min;
    filter.frozenTo = x.frozen.max;
    var units = state.storage.children || [];

    // "Search in lab": own boxes always come first (see renderResults) -- this only
    // adds a second pass over every other visible member's own inventory, each read
    // straight from GitHub the same way this account's own data is (see
    // ensureLabCache()), never through the worker. Only makes sense once logged in as
    // an account with lab-mates to search, so it's not shown for the PAT flow, and not
    // for admin or the PI either -- they already see every member merged, always.
    if (getWorkerUser() && hasOwnInventory()){
      var lab = el("label", "toggle");
      var labCb = document.createElement("input");
      labCb.type = "checkbox"; labCb.checked = filter.searchInLab;
      labCb.onchange = function(){
        filter.searchInLab = labCb.checked;
        // The slider has to widen to cover whatever lab-mates' dates already loaded --
        // renderFilters() re-fully-opens it via combinedSearchExtents() -- and again
        // once ensureLabCache()'s fetch actually resolves, for the first toggle-on.
        renderFilters(); renderResults();
        if (filter.searchInLab) ensureLabCache().then(function(){ renderFilters(); renderResults(); });
      };
      lab.appendChild(labCb);
      lab.appendChild(document.createTextNode("Search in lab" +
        (labCache.members ? " (" + labCache.members.length + (labCache.members.length === 1 ? " other member" : " other members") + ")" : "")));
      box.appendChild(lab);
    }

    if (units.length > 1){
      var seg = el("div", "seg");
      [{ id:null, name:"Everywhere" }].concat(units).forEach(function(u){
        var b = el("button", filter.unitId === u.id ? "on" : null, u.name);
        b.onclick = function(){ filter.unitId = u.id; renderFilters(); renderResults(); };
        seg.appendChild(b);
      });
      box.appendChild(seg);
    }

    // ---- frozen ----
    if (x.frozen.dated > 0){
      var f = el("div", "flt");
      var hd = el("div", "hd");
      hd.appendChild(el("b", null, "Frozen"));
      var val = el("span", "val");
      hd.appendChild(val);
      f.appendChild(hd);

      var dMin = isoToDay(x.frozen.min), dMax = isoToDay(x.frozen.max);
      if (filter.frozenFrom === null) filter.frozenFrom = x.frozen.min;
      if (filter.frozenTo === null) filter.frozenTo = x.frozen.max;
      var lo = Math.max(dMin, Math.min(dMax, isoToDay(filter.frozenFrom)));
      var hi = Math.max(dMin, Math.min(dMax, isoToDay(filter.frozenTo)));
      function label(){ val.textContent = prettyDate(filter.frozenFrom) + " → " + prettyDate(filter.frozenTo); }
      label();
      dualSlider(f, { min:dMin, max:dMax, lo:lo, hi:hi, onChange: function(a, b){
        filter.frozenFrom = dayToIso(a); filter.frozenTo = dayToIso(b);
        label(); renderResults();
      }});

      // Fine-tuning on top of the slider, typed rather than dragged -- the slider
      // alone can't land exactly on a specific day once the range spans years.
      var dateInputs = el("div", "two");
      var fromInput = document.createElement("input");
      fromInput.type = "date"; fromInput.min = x.frozen.min; fromInput.max = x.frozen.max; fromInput.value = filter.frozenFrom;
      var toInput = document.createElement("input");
      toInput.type = "date"; toInput.min = x.frozen.min; toInput.max = x.frozen.max; toInput.value = filter.frozenTo;
      function applyManualRange(){
        var a = fromInput.value || x.frozen.min, b = toInput.value || x.frozen.max;
        if (a > b){ var t = a; a = b; b = t; }
        filter.frozenFrom = a; filter.frozenTo = b;
        renderFilters(); renderResults();
      }
      fromInput.onchange = applyManualRange;
      toInput.onchange = applyManualRange;
      var fFrom = el("div", "field"); fFrom.appendChild(el("label", null, "From")); fFrom.appendChild(fromInput);
      var fTo = el("div", "field"); fTo.appendChild(el("label", null, "To")); fTo.appendChild(toInput);
      dateInputs.appendChild(fFrom); dateInputs.appendChild(fTo);
      f.appendChild(dateInputs);

      if (x.frozen.unconfirmed){
        var t = el("label", "toggle");
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = filter.includeUndated;
        cb.onchange = function(){ filter.includeUndated = cb.checked; renderResults(); };
        t.appendChild(cb);
        t.appendChild(el("span", null, "Also show the " + x.frozen.unconfirmed +
          " vials whose date isn't confirmed yet"));
        f.appendChild(t);
      }
      box.appendChild(f);
    }

    // ---- passage ----
    var p = el("div", "flt");
    var phd = el("div", "hd");
    phd.appendChild(el("b", null, "Passage"));
    var pval = el("span", "val");
    phd.appendChild(pval);
    p.appendChild(phd);

    var kinds = [
      { id:"any", label:"Any" },
      { id:"absolute", label:"p11 (absolute)" },
      { id:"relative", label:"p+2 (since thaw)" }
    ];
    var pseg = el("div", "seg");
    kinds.forEach(function(k){
      var b = el("button", filter.passageKind === k.id ? "on" : null, k.label);
      b.onclick = function(){
        filter.passageKind = k.id; filter.passageMin = null; filter.passageMax = null;
        renderFilters(); renderResults();
      };
      pseg.appendChild(b);
    });
    p.appendChild(pseg);

    if (filter.passageKind === "any"){
      pval.textContent = "all";
      var sub = el("div", "sub",
        "p11 and p+2 are different things — one counts from the line's origin, the other from " +
        "the last thaw — so pick a scale before sliding.");
      p.appendChild(sub);
    } else {
      var scale = x.passage[filter.passageKind];
      if (!scale.count){
        pval.textContent = "none";
        p.appendChild(el("div", "sub", "No vials use this scale."));
      } else {
        if (filter.passageMin === null) filter.passageMin = scale.min;
        if (filter.passageMax === null) filter.passageMax = scale.max;
        var prefix = filter.passageKind === "relative" ? "p+" : "p";
        function plabel(){ pval.textContent = prefix + filter.passageMin + " → " + prefix + filter.passageMax; }
        plabel();
        dualSlider(p, { min:scale.min, max:scale.max,
          lo:Math.max(scale.min, Math.min(scale.max, filter.passageMin)),
          hi:Math.max(scale.min, Math.min(scale.max, filter.passageMax)),
          onChange: function(a, b){ filter.passageMin = a; filter.passageMax = b; plabel(); renderResults(); }});
      }
      if (x.passage.unknown){
        var t2 = el("label", "toggle");
        var cb2 = document.createElement("input"); cb2.type = "checkbox"; cb2.checked = filter.includeUnknownPassage;
        cb2.onchange = function(){ filter.includeUnknownPassage = cb2.checked; renderResults(); };
        t2.appendChild(cb2);
        t2.appendChild(el("span", null, "Also show the " + x.passage.unknown + " vials marked p?"));
        p.appendChild(t2);
      }
    }
    box.appendChild(p);
  }

  function facetChips(vial){
    var f = E.facetsFor(vial, state.rules);
    var out = [];
    ["origin","koox","resistance","caspex","guide"].forEach(function(k){
      var v = f[k];
      if (!v || v === "-") return;
      out.push(v);
    });
    return out;
  }

  function vialMeta(vial){
    var bits = [];
    if (vial.kind) bits.push(vial.kind);
    if (vial.passage) bits.push(vial.passage);
    if (vial.frozenOn) bits.push("frozen " + prettyDate(vial.frozenOn));
    else if (vial.dateUnknown) bits.push("frozen Unknown");
    else if (vial.frozenRaw) bits.push("date unconfirmed (" + vial.frozenRaw + ")");
    else bits.push("no date");
    return bits.join(" · ");
  }

  // `owner` is set only for a "search in lab" hit: { name, state } for the lab-mate
  // whose inventory this came from. Their vial is real, but this account cannot edit it,
  // take it out, or show it in a box screen that renders against this account's own
  // boxView -- so it renders with no actions at all, purely as information.
  function resultCard(r, owner, forAdmin){
    var v = r.vial;
    var card = el("div", "res" + (v.status === "withdrawn" ? " gone" : ""));
    card.style.borderLeftColor = tintFor(v.lineId || v.name);
    card.appendChild(el("div", "nm", v.name));

    if (owner){
      card.appendChild(el("div", "chip", "in " + owner.name + "’s boxes"));
    }

    var chips = el("div", "chips");
    chips.style.marginTop = "5px";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    if (chips.childNodes.length) card.appendChild(chips);

    if (v.status === "withdrawn"){
      card.appendChild(el("div", "where", "Taken out"));
    } else {
      var w = el("div", "where");
      var path = E.locationPath(owner ? owner.state : state, v.location).split(" → ");
      var pos = path.pop();
      w.appendChild(document.createTextNode(path.join(" → ") + " → "));
      w.appendChild(el("span", "pos", pos));
      card.appendChild(w);
    }
    card.appendChild(el("div", "meta", vialMeta(v)));
    if (r.missed && r.missed.length){
      card.appendChild(el("div", "miss",
        "matched " + r.matched.length + " of " + (r.matched.length + r.missed.length) +
        " words — no " + r.missed.join(", ")));
    }

    var row = el("div", "row tight");
    if (v.status !== "withdrawn" && !owner){
      var take = el("button", "primary", "Took it");
      take.disabled = !canWrite();
      take.onclick = function(){ takeVial(v); };
      row.appendChild(take);
      var show = el("button", null, "Show in box");
      show.onclick = function(){ showInBox(v); };
      row.appendChild(show);
      var ed = el("button", null, "Edit");
      ed.disabled = !canWrite();
      ed.onclick = function(){ editVial(v); };
      row.appendChild(ed);
    }
    // A lab-mate's vial is information, not an action: it says whose it is and exactly
    // which box and slot it sits in, and you go and ask them yourself. There is
    // deliberately no button here at all.
    if (row.childNodes.length) card.appendChild(row);
    return card;
  }

  function renderResults(){
    var box = clear($("results"));
    var q = {
      query: filter.query, unitId: filter.unitId,
      passageKind: filter.passageKind, passageMin: filter.passageMin, passageMax: filter.passageMax,
      includeUnknownPassage: filter.includeUnknownPassage,
      frozenFrom: filter.frozenFrom, frozenTo: filter.frozenTo, includeUndated: filter.includeUndated
    };

    // Admin and the PI have no boxes of their own to search -- every result comes from
    // a member's own file, always, on every screen this whole app draws for them.
    if (canSeeWholeLab()){
      if (!labCache.members){
        box.appendChild(el("div", "empty", "Loading the lab…"));
        return;
      }
      var labHits = [];
      labCache.members.slice().sort().forEach(function(name){
        var ownerState = labCache.data[name];
        if (!ownerState) return;
        E.search(ownerState, q).forEach(function(r){ labHits.push({ r: r, owner: { name: name, state: ownerState } }); });
      });
      box.appendChild(el("p", "note", labHits.length + (labHits.length === 1 ? " vial" : " vials") +
        (filter.query ? " match “" + filter.query + "”, lab-wide" : " in range, lab-wide")));
      if (!labHits.length){
        box.appendChild(el("div", "empty", "Nothing here. Try fewer words, or widen a slider."));
        return;
      }
      labHits.slice(0, 200).forEach(function(h){ box.appendChild(resultCard(h.r, h.owner, true)); });
      if (labHits.length > 200) box.appendChild(el("p", "note", "…and " + (labHits.length - 200) + " more. Narrow it down."));
      return;
    }

    var hits = E.search(state, q);

    // Own boxes always come first -- lab-mates' results are a second pass, appended
    // after every one of this account's own, never interleaved with them.
    var labHits = [];
    if (filter.searchInLab && labCache.members && filter.query){
      labCache.members.forEach(function(name){
        var ownerState = labCache.data[name];
        if (!ownerState) return;
        E.search(ownerState, q).forEach(function(r){ labHits.push({ r: r, owner: { name: name, state: ownerState } }); });
      });
    }

    var head = el("p", "note");
    var headBits = [hits.length + (hits.length === 1 ? " vial" : " vials") +
      (filter.query ? " match “" + filter.query + "”" : " in range")];
    if (filter.searchInLab && labHits.length){
      headBits.push(labHits.length + " more in the lab");
    } else if (filter.searchInLab && labCache.promise){
      headBits.push("checking the lab…");
    }
    head.textContent = headBits.join(" · ");
    box.appendChild(head);

    if (!hits.length && !labHits.length){
      box.appendChild(el("div", "empty", state.vials.length
        ? "Nothing here. Try fewer words, or widen a slider."
        : "Nothing imported yet — Settings → Import a spreadsheet."));
      return;
    }
    hits.slice(0, 200).forEach(function(r){ box.appendChild(resultCard(r)); });
    if (hits.length > 200) box.appendChild(el("p", "note", "…and " + (hits.length - 200) + " more. Narrow it down."));
    labHits.slice(0, 50).forEach(function(h){ box.appendChild(resultCard(h.r, h.owner)); });
    if (labHits.length > 50) box.appendChild(el("p", "note", "…and " + (labHits.length - 50) + " more in the lab. Narrow it down."));
  }

  function takeVial(v){
    var out = E.withdraw(state, v.id, {
      date: new Date().toISOString().slice(0, 10), by: getDevice(), purpose: "thaw",
      ids: ["w-" + Date.now().toString(36)]
    });
    if (out.warnings.length){ showBanner(esc(out.warnings[0])); return; }
    lastWithdrawal = out.state.withdrawals[out.state.withdrawals.length - 1].id;
    state = out.state;
    markDirty("Take out " + v.name);
    renderAll();
    showBanner("Took <b>" + esc(v.name) + "</b> from " + esc(out.freed[0].path) + ".",
      [{ label:"Undo", onClick: function(){ undoTake(lastWithdrawal); } }]);
  }

  function undoTake(id){
    var back = E.undoWithdrawal(state, id);
    if (!back.ok){ showBanner(esc(back.reason)); return; }
    state = back.state;
    markDirty("Put back " + back.vial.name);
    hideBanner();
    renderAll();
  }

  // The box is what is being asked for; renderBoxesBody works the area out from it. A
  // vial's own location no longer carries a unit id -- the tree has no fixed levels for
  // one to mean -- so reading one off the vial would name a layer that is not there.
  function showInBox(v){
    if (!v.location) return;
    boxView.unitId = null;
    boxView.boxId = v.location.boxId;
    boxView.highlight = v.location.position ? [v.location.position] : [];
    go("boxes");
  }

  // =====================================================================
  // Freeze
  // =====================================================================

  var freeze = { name:"", count:1, unitId:null, boxId:null, position:null, plan:null, kind:"Cell", customFacets:{} };

  // The type selector -- Cell plus whatever the lab-wide list holds (Plasmid, RNA,
  // cDNA, Protein, Bacterial Glycerol out of the box, plus anything anyone has typed
  // in). "+ New type…" posts the new name immediately (no approval needed, per Umut)
  // and switches to it.
  function renderFreezeType(){
    if (!typesCache) { ensureTypesCache().then(renderAll); return; }
    var sel = $("fzType");
    var names = typeNames();
    var sig = names.join("|") + "|" + freeze.kind;
    if (sel.dataset.sig === sig) return;
    clear(sel);
    names.forEach(function(n){
      var o = document.createElement("option");
      o.value = n; o.textContent = n; o.selected = n === freeze.kind;
      sel.appendChild(o);
    });
    var newOpt = document.createElement("option");
    newOpt.value = "__new__"; newOpt.textContent = "+ New type…";
    sel.appendChild(newOpt);
    sel.dataset.sig = sig;
  }

  // Rebuilt only when the selected type actually changes (tracked via the container's
  // own dataset) -- renderAll() calls this on every render, and rebuilding a live
  // spreadsheet-style table from scratch on every keystroke elsewhere on the screen
  // would wipe out whatever the user is mid-typing here and steal their focus.
  function renderFreezeCustomFacets(){
    var box = $("fzCustomFacets");
    if (freeze.kind === "Cell"){ clear(box); box.dataset.kind = ""; freeze.collectCustomFacets = null; return; }
    if (box.dataset.kind === freeze.kind && freeze.collectCustomFacets) return;
    freeze.collectCustomFacets = buildAttributeTable(box, freeze.kind, freeze.customFacets);
    box.dataset.kind = freeze.kind;
  }

  function renderFreezeFacets(){
    var box = clear($("fzFacets"));
    var name = freeze.name.trim();
    $("fzNameLabel").textContent = freeze.kind === "Cell" ? "What are you freezing?" : "What are you adding?";
    // The origin/KO-OX/CASPEX/guide chips below, and the row-mixing rules they drive,
    // are cell-specific -- a Plasmid or a Protein gets its own facets instead, from
    // the lab-wide type rules (see renderFreezeCustomFacets), never these five.
    if (freeze.kind !== "Cell"){ $("fzLine").textContent = ""; return; }
    if (!name){ $("fzLine").textContent = ""; return; }
    var f = E.classify(name, state.rules);
    [["origin","Origin"],["koox","Edit"],["resistance","Resistance"],["caspex","CASPEX"],["guide","Guide"]]
      .forEach(function(pair){
        var key = pair[0], v = f[key];
        if (v === null){
          var gap = el("button", "chip gap", pair[1] + ": no rule");
          gap.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
          box.appendChild(gap);
        } else if (v !== "-"){
          box.appendChild(el("span", "chip on", v));
        }
      });

    // What matters for where it goes is the CELL, not the line: KO, OX and CASPEX of
    // one cell all share a row, and a different cell never joins them.
    var origin = f.origin || E.NO_ORIGIN;
    var rows = [], boxes = {}, slots = 0;
    E.eachBox(state, function(box){
      E.rowsOf(state, box.id, state.rules).forEach(function(r){
        if (!r.counts[origin]) return;
        rows.push(box.name + " " + r.label);
        boxes[box.name] = true;
        slots += r.counts[origin];
      });
    });
    var lineId = E.lineIdFor(name, state.rules);
    var existing = E.vialsOfLine(state, lineId).length;
    if (slots){
      // Naming ten rows is not information, it is a wall. Say how much and where in
      // the coarse sense; Boxes is one tap away for the detail.
      var boxCount = Object.keys(boxes).length;
      var where = rows.length <= 3
        ? "row" + (rows.length === 1 ? " " : "s ") + rows.join(", ")
        : rows.length + " rows across " + boxCount + " box" + (boxCount === 1 ? "" : "es");
      $("fzLine").textContent = origin + " already has " + slots + " vial" + (slots === 1 ? "" : "s") +
        " in " + where +
        (existing ? " — " + existing + " of them this exact line." : ", but none of this exact line.");
    } else {
      $("fzLine").textContent = origin === E.NO_ORIGIN
        ? "No origin rule covers this name yet, so it will start a row of its own."
        : "Nothing of " + origin + " is stored yet — this starts a row of its own.";
    }
  }

  function renderFreezePlan(){
    var card = clear($("fzPlanCard"));
    var name = freeze.name.trim();
    if (!name){
      card.appendChild(el("p", "note", "Type what you're adding and this will say which box to put it in."));
      freeze.plan = null;
      return;
    }
    // A locked exact slot only ever means one vial -- there is no meaning to "lock
    // several onto this one slot" -- so raising the count while one is pinned drops
    // the pin rather than silently ignoring it.
    if (freeze.position && freeze.count !== 1) freeze.position = null;

    var plan = freeze.boxId && freeze.position
      ? E.suggestPlacementAt(state, { name: name, boxId: freeze.boxId, position: freeze.position })
      : E.suggestPlacement(state, {
          name: name, count: freeze.count,
          unitId: freeze.unitId || state.settings.defaultUnitId,
          boxId: freeze.boxId || null
        });
    freeze.plan = plan;

    if (!plan.ok){
      var bad = el("p", "note", plan.reason);
      bad.style.color = "var(--bad)";
      card.appendChild(bad);
      if (freeze.position){
        var clearPin = el("button", null, "Clear this exact slot");
        clearPin.onclick = function(){ freeze.position = null; renderFreezePlan(); renderFreezeGuard(); };
        card.appendChild(clearPin);
      }
      return;
    }

    var head = el("div");
    head.style.fontWeight = "650";
    head.style.fontSize = "14px";
    head.textContent = "Put these in " + plan.summary;
    card.appendChild(head);
    card.appendChild(el("p", "note", plan.reason));

    plan.segments.forEach(function(seg){
      card.appendChild(el("div", "occ", seg.path));
      // Clicking an empty cell locks placement to exactly that one -- only meaningful
      // for a single vial, so a freeze of several falls back to the plan's own
      // highlighting and the ordinary slot dialog, same as everywhere else in the app.
      card.appendChild(boxGrid(seg.boxId, { target: seg.positions,
        onEmptyClick: freeze.count === 1 ? function(position){
          freeze.boxId = seg.boxId; freeze.position = position; renderFreezePlan(); renderFreezeGuard();
        } : null }));
    });

    var row = el("div", "row tight");
    var override = el("button", null, freeze.boxId ? "Choose a different box" : "Put it somewhere else");
    override.onclick = pickBox;
    row.appendChild(override);
    if (freeze.position){
      var clearPin2 = el("button", null, "Let it pick a slot in this box");
      clearPin2.onclick = function(){ freeze.position = null; renderFreezePlan(); renderFreezeGuard(); };
      row.appendChild(clearPin2);
    } else if (freeze.boxId){
      var auto = el("button", null, "Let it choose");
      auto.onclick = function(){ freeze.boxId = null; freeze.position = null; renderFreezePlan(); renderFreezeGuard(); };
      row.appendChild(auto);
    }
    card.appendChild(row);
  }

  function pickBox(){
    var body = clear($("dlgBody"));
    $("dlgTitle").textContent = "Which box?";
    // Your own placed boxes only -- same filter suggestPlacement() already applies for
    // the automatic proposal (E.boxesFor, owner-scoped). A raw E.eachBox() here used to
    // list every box in the whole lab, including other members' and anything still
    // sitting in "Not placed yet": an override that is supposed to offer a different
    // box of YOURS was instead offering to freeze a vial straight into Barış's box.
    var mine = E.boxesFor(state, null, effectiveIdentity());
    if (!mine.length){
      body.appendChild(el("p", "note", "You have no boxes with room yet — ask an admin for one."));
    }
    mine.forEach(function(entry){
      var box = entry.box, rack = entry.rack, unit = entry.unit;
      var occ = E.occupancy(state, box.id);
      var b = el("button", null, "");
      b.style.width = "100%";
      b.style.textAlign = "left";
      b.style.marginBottom = "6px";
      b.textContent = unit.name + " → " + rack.name + " → " + box.name + "  (" + occ.free + " free)";
      b.disabled = occ.free < freeze.count;
      // A previously locked slot belonged to the box being replaced -- carrying it
      // over could silently target the wrong cell in the new one.
      b.onclick = function(){ freeze.boxId = box.id; freeze.position = null; $("dlg").close(); renderFreezePlan(); renderFreezeGuard(); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function doFreeze(){
    if (!canWrite()){ showBanner("Read-only — add a GitHub token under Settings → Connect first."); return; }
    var name = freeze.name.trim();
    if (!name){ showBanner("Give it a name first."); return; }
    if (!freeze.plan || !freeze.plan.ok){ showBanner("There's nowhere to put these yet."); return; }

    var ids = [];
    var stamp = Date.now().toString(36);
    for (var i = 0; i < freeze.count; i++) ids.push("v-" + stamp + "-" + i);
    var dateInput = $("fzDate").value;
    var customFacets = freeze.collectCustomFacets ? freeze.collectCustomFacets() : {};
    var out = E.applyPlacement(state, freeze.plan, {
      name: name,
      passage: $("fzPassage").value.trim(),
      frozenOn: dateInput,
      notes: $("fzNotes").value.trim(),
      kind: freeze.kind,
      customFacets: customFacets
    }, { ids: ids, now: new Date().toISOString(), by: getDevice() });

    var errors = E.errorsOnly(E.validate(out.state));
    if (errors.length){ showBanner("Not doing that: " + esc(errors[0].message)); return; }

    state = out.state;
    if (freeze.kind !== "Cell") rememberNewAttributes(freeze.kind, customFacets);
    markDirty("Add " + freeze.count + " × " + name);
    showBanner("Put " + out.vials.length + " × <b>" + esc(name) + "</b> in " + esc(freeze.plan.summary) + ".");
    freeze.boxId = null;
    freeze.position = null;
    freeze.customFacets = {};
    $("fzCustomFacets").dataset.kind = ""; // force a fresh, empty table on the next render
    renderAll();
  }

  // =====================================================================
  // Boxes
  // =====================================================================

  var boxView = { unitId:null, boxId:null, highlight:[], owner:null };

  function boxGrid(boxId, opts){
    var o = opts || {};
    var occ = E.occupancy(state, boxId);
    var wrap = el("div");
    if (!occ) return wrap;
    var cols = occ.box.cols, rows = occ.box.rows;
    var grid = el("div", "gridwrap");
    grid.style.gridTemplateColumns = "auto repeat(" + cols + ", minmax(26px, 1fr))";
    grid.appendChild(el("div"));
    for (var c = 0; c < cols; c++) grid.appendChild(el("div", "axis", String(c + 1)));

    for (var r = 0; r < rows; r++){
      grid.appendChild(el("div", "axis r", occ.box.scheme === "linear" ? "" : E.rowLabel(r)));
      for (var c2 = 0; c2 < cols; c2++){
        var slot = occ.slots[r * cols + c2];
        var cell = el("div", "slot" + (slot.vial ? " taken" : ""));
        if (slot.vial){
          // Not `o`: that is the options object above, and `var` is function-scoped,
          // so reusing the name here silently emptied it for every later slot --
          // which killed the highlighting on the freeze proposal.
          var cellOrigin = originOf(slot.vial);
          cell.style.background = tintFor(cellOrigin);
          cell.title = slot.position + " · " + slot.vial.name + " (" + cellOrigin + ")";
          cell.textContent = shortOrigin(cellOrigin);
        } else {
          cell.title = slot.position + " · empty";
          cell.textContent = "";
        }
        if (o.target && o.target.indexOf(slot.position) !== -1) cell.className += " target";
        if (o.highlight && o.highlight.indexOf(slot.position) !== -1) cell.className += " hit";
        if (!o.static){
          // onEmptyClick is how the freeze plan lets a person lock the exact slot
          // themselves, rather than only the box -- an empty cell there goes straight to
          // the caller instead of opening the generic slot dialog. A taken cell still
          // shows what's in it either way.
          (function(s){
            cell.onclick = (!s.vial && o.onEmptyClick) ? function(){ o.onEmptyClick(s.position); }
                                                         : function(){ slotDialog(boxId, s); };
          })(slot);
        }
        grid.appendChild(cell);
      }
    }
    wrap.appendChild(grid);
    return wrap;
  }

  // Editing a vial. Everything the sheet carried is editable here, plus the five
  // derived facets: each shows what the rules read, and typing over one pins it by
  // hand so classify() will not touch it again.
  function editVial(vial){
    $("dlgTitle").textContent = "Edit " + vial.name;
    var body = clear($("dlgBody"));

    function field(label, node, hint){
      var f = el("div", "field");
      f.appendChild(el("label", null, label));
      f.appendChild(node);
      if (hint) f.appendChild(el("div", "sub", hint));
      body.appendChild(f);
      return node;
    }

    var name = document.createElement("input");
    name.value = vial.name || "";
    name.autocomplete = "off";
    field("Name", name, "Everything below that isn't pinned is worked out from this.");

    // Umut asked for this explicitly: existing vials get no retroactive type, but he
    // wants to set one himself, by hand, as he goes -- this select is that "by hand".
    // Not shown until the lab-wide type list has actually loaded, since offering only
    // "Cell" while the real list is still in flight would look like a real choice.
    var currentKind = vial.kind || "Cell";
    var typeSel = document.createElement("select");
    if (typesCache){
      typeNames().forEach(function(n){
        var o = document.createElement("option");
        o.value = n; o.textContent = n; o.selected = n === currentKind;
        typeSel.appendChild(o);
      });
      if (typeNames().indexOf(currentKind) === -1){
        var o2 = document.createElement("option");
        o2.value = currentKind; o2.textContent = currentKind + " (no longer in the type list)"; o2.selected = true;
        typeSel.appendChild(o2);
      }
      field("Type", typeSel, "Nothing is ever assigned automatically -- pick one, or leave it as Cell.");
    } else {
      ensureTypesCache();
    }

    var facetBox = el("div");
    var facetLabel = el("label", null, "Cell details");
    body.appendChild(facetLabel);
    body.appendChild(facetBox);
    var facetInputs = {};
    var customFacetsCollector = null;
    // For a non-Cell kind, the facet table only rebuilds when the TYPE actually
    // changes (tracked via facetBox.dataset.customKind), never on a name keystroke --
    // unlike Cell's facets, a Plasmid/Protein/etc.'s attribute table has nothing to do
    // with the typed name, and rebuilding it on every keystroke elsewhere in this
    // dialog would wipe out whatever the user is mid-typing here.
    function paintFacets(){
      var kind = typeSel && typeSel.value ? typeSel.value : "Cell";
      if (kind !== "Cell"){
        if (facetBox.dataset.customKind === kind && customFacetsCollector) return;
        clear(facetBox);
        facetLabel.textContent = kind + " details";
        customFacetsCollector = buildAttributeTable(facetBox, kind, vial.kind === kind ? (vial.customFacets || {}) : {});
        facetBox.dataset.customKind = kind;
        return;
      }
      clear(facetBox);
      facetBox.dataset.customKind = "";
      customFacetsCollector = null;
      facetLabel.textContent = "Cell details";
      var derived = E.classify(name.value.trim(), state.rules);
      E.FACETS.forEach(function(f){
        var pinned = vial.facetsSetByHand && vial.facetsSetByHand[f] !== undefined;
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, f));
        grow.appendChild(el("div", "sub", derived[f] === null
          ? "no rule covers this name"
          : "rules read: " + derived[f]));
        row.appendChild(grow);
        var inp = facetInputs[f] || document.createElement("input");
        facetInputs[f] = inp;
        inp.style.width = "9em";
        inp.autocomplete = "off";
        if (inp.value === undefined || inp.dataset.init !== "1"){
          inp.value = pinned ? vial.facetsSetByHand[f] : "";
          inp.dataset.init = "1";
        }
        inp.placeholder = derived[f] === null ? "—" : derived[f];
        row.appendChild(inp);
        facetBox.appendChild(row);
      });
    }
    paintFacets();
    name.oninput = paintFacets;
    typeSel.onchange = paintFacets;

    var passage = document.createElement("input");
    passage.value = vial.passage || "";
    passage.placeholder = "p12, p+3 or p?";
    passage.autocomplete = "off";
    field("Passage", passage, "p12 counts from the line's origin; p+3 counts from the last thaw. p? means unknown.");

    var date = document.createElement("input");
    date.type = "date";
    if (vial.frozenOn) date.value = vial.frozenOn;
    field("Date frozen", date, vial.dateUnknown
      ? "Marked Unknown in Review -- picking a date here replaces that."
      : vial.frozenRaw
      ? "The sheet says " + vial.frozenRaw + (vial.frozenOn ? "" : ", which could be read two ways.")
      : "The sheet had nothing here.");

    var notes = document.createElement("input");
    notes.value = vial.notes || "";
    notes.placeholder = "myco -";
    notes.autocomplete = "off";
    field("Notes", notes, "myco -, chip- and to-do become searchable tags.");

    body.appendChild(el("p", "note", "In " + E.locationPath(state, vial.location) +
      (vial.importedFrom ? " · from " + vial.importedFrom : "")));

    var foot = clear($("dlgFoot"));
    var save = el("button", "primary", "Save");
    save.disabled = !canWrite();
    save.onclick = function(){
      var v = E.indexById(state.vials)[vial.id];
      if (!v) return;
      var newName = name.value.trim();
      if (!newName){ showBanner("A vial needs a name."); return; }

      var before = JSON.parse(JSON.stringify(v));
      v.name = newName;
      v.lineId = E.lineIdFor(newName, state.rules);

      // If the lab-wide type list never finished loading, the Type field was never
      // shown -- leave whatever kind/customFacets/facetsSetByHand the vial already had
      // entirely alone, rather than guessing from a facet panel that painted in Cell
      // mode by default and may not reflect the vial's real (unloaded) type.
      if (!typesCache){
        /* kind, customFacets and facetsSetByHand are untouched */
      } else if (typeSel.value === "Cell" || !typeSel.value){
        var pinned = {};
        var derived = E.classify(newName, state.rules);
        E.FACETS.forEach(function(f){
          var typed = facetInputs[f] ? facetInputs[f].value.trim() : "";
          if (typed && typed !== derived[f]) pinned[f] = typed;
        });
        if (Object.keys(pinned).length) v.facetsSetByHand = pinned; else delete v.facetsSetByHand;
        delete v.kind;
        delete v.customFacets;
      } else {
        v.kind = typeSel.value;
        var customFacets = customFacetsCollector ? customFacetsCollector() : {};
        if (Object.keys(customFacets).length) v.customFacets = customFacets; else delete v.customFacets;
        delete v.facetsSetByHand;
        rememberNewAttributes(v.kind, customFacets);
      }

      var p = E.parsePassage(passage.value);
      v.passage = p.raw; v.passageNumber = p.number; v.passageKind = p.kind;

      if (date.value){
        var parsed = E.parseDate(date.value);
        if (!parsed.iso){ showBanner("That date can't be read."); return; }
        v.frozenOn = parsed.iso;
        delete v.dateUnknown;
      } else {
        v.frozenOn = null;
      }

      v.notes = notes.value.trim();
      v.flags = E.flagsFrom(v.notes, state.settings.customFlags);

      var errors = E.errorsOnly(E.validate(state));
      if (errors.length){
        Object.keys(before).forEach(function(k){ v[k] = before[k]; });
        showBanner("Not saving that: " + esc(errors[0].message));
        return;
      }
      $("dlg").close();
      markDirty("Edit " + newName);
      renderAll();
    };
    foot.appendChild(save);
    $("dlg").showModal();
  }

  // A row importSheet() couldn't place at all (see reviewQueue()'s ambiguousImport) has
  // no location to show, so it needs its own dialog rather than editVial()'s (which
  // assumes a vial is already somewhere). Resolving it is E.resolveImportRow()'s job --
  // this is just the box/position picker for it.
  function resolveAmbiguousImport(vial){
    $("dlgTitle").textContent = "Where does this belong?";
    var body = clear($("dlgBody"));
    var raw = vial.importRaw || {};

    var name = document.createElement("input");
    name.value = raw.name || (/^Unreadable row/.test(vial.name) ? "" : vial.name) || "";
    name.autocomplete = "off";
    var nameField = el("div", "field");
    nameField.appendChild(el("label", null, "Name"));
    nameField.appendChild(name);
    body.appendChild(nameField);

    var boxSel = document.createElement("select");
    var boxes = [];
    E.eachBox(state, function(b, rack, unit){ boxes.push({ id: b.id, label: unit.name + " → " + rack.name + " → " + b.name, box: b }); });
    boxes.forEach(function(b){
      var o = document.createElement("option");
      o.value = b.id; o.textContent = b.label;
      boxSel.appendChild(o);
    });
    var boxField = el("div", "field");
    boxField.appendChild(el("label", null, "Box"));
    boxField.appendChild(boxSel);
    body.appendChild(boxField);

    var posInput = document.createElement("input");
    posInput.placeholder = "A1";
    posInput.autocomplete = "off";
    posInput.value = raw.position && /^[A-Za-z]+\s*\d+$/.test(raw.position) ? raw.position : "";
    var posField = el("div", "field");
    posField.appendChild(el("label", null, "Position"));
    posField.appendChild(posInput);
    body.appendChild(posField);

    body.appendChild(el("p", "note", "From the sheet: name " + (raw.name ? "\"" + raw.name + "\"" : "(blank)") +
      ", position " + (raw.position ? "\"" + raw.position + "\"" : "(blank)") + (raw.box ? " in " + raw.box : "") + "."));

    var msg = el("p", "note");
    body.appendChild(msg);

    var foot = clear($("dlgFoot"));
    var save = el("button", "primary", "Save");
    save.disabled = !canWrite() || !boxes.length;
    if (!boxes.length) msg.textContent = "There is nowhere to put it yet -- add a box first.";
    save.onclick = function(){
      var res = E.resolveImportRow(state, vial.id, { name: name.value, boxId: boxSel.value, position: posInput.value.trim() });
      if (!res.ok){ msg.textContent = res.reason; msg.style.color = "var(--bad)"; return; }
      state = res.state;
      $("dlg").close();
      markDirty("Fill in an import row");
      renderAll();
    };
    foot.appendChild(save);
    $("dlg").showModal();
  }

  function slotDialog(boxId, slot){
    var occ = E.occupancy(state, boxId);
    $("dlgTitle").textContent = occ.box.name + " · " + slot.position;
    var body = clear($("dlgBody"));
    var foot = clear($("dlgFoot"));

    if (!slot.vial){
      body.appendChild(el("p", "note", "This slot is empty."));
      var f = el("button", "primary", "Add into this slot");
      f.disabled = !canWrite();
      f.onclick = function(){
        // "This slot", not merely "this box" -- locking the exact position only makes
        // sense for one vial, so the count resets to match what was actually asked for.
        freeze.boxId = boxId; freeze.position = slot.position; setCount(1);
        $("dlg").close(); go("freeze");
        $("fzName").focus(); renderFreezePlan();
      };
      foot.appendChild(f);
      $("dlg").showModal();
      return;
    }

    var v = slot.vial;
    body.appendChild(el("div", "nm", v.name));
    var chips = el("div", "chips");
    chips.style.margin = "8px 0";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    body.appendChild(chips);
    body.appendChild(el("p", "note", vialMeta(v)));
    if (v.notes) body.appendChild(el("p", "note", "Notes: " + v.notes));
    if (v.importedFrom) body.appendChild(el("p", "note", "From " + v.importedFrom));

    var edit = el("button", null, "Edit");
    edit.disabled = !canWrite();
    edit.onclick = function(){ $("dlg").close(); editVial(v); };
    foot.appendChild(edit);
    var take = el("button", "primary", "Took it");
    take.disabled = !canWrite();
    take.onclick = function(){ $("dlg").close(); takeVial(v); };
    foot.appendChild(take);
    $("dlg").showModal();
  }

  // Admin picks a member from a third select before Unit/Box -- the same two selects a
  // member uses for their own boxes, just fed by that member's real state instead. The
  // box grid renders `static` (see boxGrid()), so no cell opens the slot dialog and
  // nothing here can ever write anywhere.
  function renderBoxes(){
    $("bxOwnerField").hidden = !canSeeWholeLab();
    if (!canSeeWholeLab()){ renderBoxesBody(false); return; }

    if (!labCache.members){
      clear($("bxGrid")).appendChild(el("div", "empty", "Loading the lab…"));
      clear($("bxLines"));
      ensureLabCache().then(renderBoxes);
      return;
    }
    var names = labCache.members.slice().sort();
    if (!names.length){
      clear($("bxGrid")).appendChild(el("div", "empty", "No member has any boxes yet."));
      clear($("bxLines"));
      return;
    }
    if (!boxView.owner || names.indexOf(boxView.owner) === -1) boxView.owner = names[0];
    var os = clear($("bxOwner"));
    names.forEach(function(name){
      var o = document.createElement("option");
      o.value = name; o.textContent = name; o.selected = name === boxView.owner;
      os.appendChild(o);
    });

    var real = state;
    ADMIN_MERGED = true;
    state = labCache.data[boxView.owner] || E.blankState();
    try { renderBoxesBody(true); } finally { state = real; ADMIN_MERGED = false; }
  }

  // The everyday version of "set up storage" -- just a name, a box defaulting to
  // 9×9 (Rename/Resize on Settings → Storage already handle changing that after).
  // Available to any member, same permission level as everything else on this screen;
  // hidden entirely for admin's read-only merged view, which has no inventory of its
  // own to add to.
  //
  // A box, and only a box. The freezer itself is the lab's: adding or removing one is
  // admin's, from Admin → Structure. A member who could add a freezer here was adding
  // it to everybody's tree, which is not theirs to do -- so the button is gone rather
  // than merely disabled.
  function renderBoxesQuickAdd(readOnly){
    var c = $("bxQuickAdd");
    c.hidden = !!readOnly;
    if (readOnly) return;
    clear(c);
    var addBox = el("button", null, "Add a box");
    addBox.disabled = !canWrite();
    addBox.onclick = function(){ addBoxDialog(); };
    var row = el("div", "row tight");
    row.appendChild(addBox);
    c.appendChild(row);
    // No freezer needed first: a new box waits under "Not placed yet" until an admin
    // says where it lives, which is Umut's rule -- the member owns the box, the admin
    // owns the tree.
    var loose = (state.storage.unplaced || []).filter(function(b){
      return (b.owner || "").toLowerCase() === (effectiveIdentity() || "").toLowerCase();
    });
    if (loose.length){
      c.appendChild(el("p", "note",
        loose.length + " of your boxes " + (loose.length === 1 ? "is" : "are") +
        " waiting for an admin to say where they go: " +
        loose.map(function(b){ return b.name; }).join(", ") +
        ". You can fill them now; they just have no place in the freezer yet."));
    }
  }

  // Whose boxes this screen is showing: your own, or -- for admin and PI, who have no
  // inventory of their own -- the member picked at the top. A box with no owner
  // recorded is nobody's in particular and shows for everyone, which is what an
  // unmigrated or hand-added box looks like and is better than stranding it.
  function boxesOnThisScreen(){
    var me = String(boxView.owner || effectiveIdentity() || "").toLowerCase();
    var out = [];
    E.eachBox(state, function(box, rack, unit, chain){
      if (box.archived) return;
      if (me && box.owner && box.owner.toLowerCase() !== me) return;
      out.push({ box: box, chain: chain });
    });
    return out;
  }

  // Two controls, whatever the depth of the tree: which area, then which box in it.
  //
  // This used to be one <select> per level, which worked while the tree was exactly
  // unit -> rack -> box. It cannot survive layers going as deep as the admin wants: a
  // six-deep branch would be six dropdowns to tap through on a phone to reach one grid.
  // Instead the box picker carries the route in an <optgroup>, so the whole freezer is
  // two taps and the path is still written out under it.
  function renderBoxesBody(readOnly){
    renderBoxesQuickAdd(readOnly);
    var mine = boxesOnThisScreen();
    if (!mine.length){
      clear($("bxPath")); clear($("bxWhere")); clear($("bxLines"));
      clear($("bxGrid")).appendChild(el("div", "empty",
        (state.storage.children || []).length
          ? (readOnly ? "No boxes here yet." : "No boxes yet — add one above.")
          : (readOnly ? "No freezer set up yet." : "No freezer set up yet — ask an admin to add one.")));
      return;
    }

    // The areas are the top layers that actually hold one of these boxes, plus the
    // holding pen for boxes an admin has not placed yet. Nothing is listed that the
    // person cannot then open.
    var areas = [], seen = {};
    mine.forEach(function(entry){
      var id = entry.chain.length ? entry.chain[0].id : "_unplaced";
      if (seen[id]) return;
      seen[id] = true;
      areas.push({ id: id, name: entry.chain.length ? entry.chain[0].name : "Not placed yet" });
    });
    // A box jumped to from a search result or from Review brings its own area with it:
    // the box is the thing the person asked for, so it wins over whatever was last
    // picked here.
    var jumpedTo = boxView.boxId && mine.filter(function(e){ return e.box.id === boxView.boxId; })[0];
    if (jumpedTo) boxView.unitId = jumpedTo.chain.length ? jumpedTo.chain[0].id : "_unplaced";
    if (!boxView.unitId || !seen[boxView.unitId]) boxView.unitId = areas[0].id;

    var us = clear($("bxUnit"));
    areas.forEach(function(a){
      var o = document.createElement("option");
      o.value = a.id; o.textContent = a.name; o.selected = a.id === boxView.unitId;
      us.appendChild(o);
    });

    var here = mine.filter(function(entry){
      return (entry.chain.length ? entry.chain[0].id : "_unplaced") === boxView.unitId;
    });

    // Grouped by the route below the area, so boxes sitting on the same shelf arrive
    // together however many layers down that shelf is.
    var bs = document.createElement("select");
    var groups = {};
    here.forEach(function(entry){
      var label = entry.chain.slice(1).map(function(n){ return n.name; }).join(" → ");
      if (!groups[label]){
        groups[label] = label ? document.createElement("optgroup") : bs;
        if (label){ groups[label].label = label; bs.appendChild(groups[label]); }
      }
      var occ = E.occupancy(state, entry.box.id);
      var o = document.createElement("option");
      o.value = entry.box.id;
      o.textContent = entry.box.name + " — " + occ.used + "/" + occ.capacity;
      groups[label].appendChild(o);
    });
    if (!boxView.boxId || !here.some(function(e){ return e.box.id === boxView.boxId; })) {
      boxView.boxId = here[0].box.id;
    }
    bs.value = boxView.boxId;
    bs.onchange = function(){ boxView.boxId = bs.value; renderBoxes(); };
    var pathBox = clear($("bxPath"));
    var bf = el("div", "field"); bf.appendChild(el("label", null, "Box")); bf.appendChild(bs);
    pathBox.appendChild(bf);

    // The route in words, because the picker only shows the group you are inside.
    $("bxWhere").textContent = E.locationPath(state, { boxId: boxView.boxId }) || "";

    var g = clear($("bxGrid"));
    if (!boxView.boxId){ g.appendChild(el("div", "empty", "This area has no boxes yet.")); return; }
    g.appendChild(boxGrid(boxView.boxId, { highlight: boxView.highlight, static: !!readOnly }));

    var occ = E.occupancy(state, boxView.boxId);
    $("bxOcc").textContent = occ.used + " of " + occ.capacity + " slots full · " + occ.free + " free";
    $("bxBar").style.width = (occ.capacity ? (occ.used / occ.capacity * 100) : 0) + "%";

    // What is actually in this box, so the colours mean something.
    var lines = clear($("bxLines"));
    lines.appendChild(el("h3", null, "In this box"));
    var byOrigin = {};
    occ.slots.forEach(function(s){
      if (!s.vial) return;
      var o = originOf(s.vial);
      if (!byOrigin[o]) byOrigin[o] = { n: 0, rows: {}, lines: {} };
      var g = byOrigin[o];
      g.n++;
      g.rows[s.position.replace(/\d+$/, "")] = true;
      var k = s.vial.lineId || s.vial.name;
      if (!g.lines[k]) g.lines[k] = { name: s.vial.name, n: 0, positions: [] };
      g.lines[k].n++;
      g.lines[k].positions.push(s.position);
    });
    var origins = Object.keys(byOrigin).sort(function(a, b){ return byOrigin[b].n - byOrigin[a].n; });
    if (!origins.length){ lines.appendChild(el("div", "empty", "Empty.")); return; }
    origins.forEach(function(o){
      var g = byOrigin[o];
      var head = el("div", "item");
      var dot = el("div");
      dot.style.cssText = "width:14px;height:14px;border-radius:4px;flex:0 0 auto;margin-top:3px;background:" + tintFor(o);
      head.appendChild(dot);
      var grow = el("div", "grow");
      var title = el("div", null, o);
      title.style.fontWeight = "650";
      grow.appendChild(title);
      var rowNames = Object.keys(g.rows).sort();
      grow.appendChild(el("div", "sub", g.n + " vial" + (g.n === 1 ? "" : "s") + " · row" +
        (rowNames.length === 1 ? " " : "s ") + rowNames.join(", ")));
      Object.keys(g.lines).sort(function(a, b){ return g.lines[b].n - g.lines[a].n; }).forEach(function(k){
        var l = g.lines[k];
        grow.appendChild(el("div", "sub", "· " + l.name + " — " + l.positions.join(", ")));
      });
      head.appendChild(grow);
      lines.appendChild(head);
    });
  }

  // =====================================================================
  // Review -- the queues the import left behind
  // =====================================================================

  // Admin sees every member's review queue merged onto this one screen, but never acts
  // on it here -- that would mean writing to someone else's file through a screen that
  // was never built to know whose file it is. So each member's own real `state` is
  // swapped in just long enough to build their section with the exact same code path a
  // member sees for their own queue (their own rules, correctly), then swapped back --
  // ADMIN_MERGED (checked by every button below) makes every one of those buttons
  // disabled while it's true, so nothing rendered during the swap can ever fire.
  function renderReview(){
    var box = clear($("reviewBody"));
    if (canSeeWholeLab()){
      renderMergedByOwner(box, renderReview, function(container){
        var q = E.reviewQueue(state);
        if (!q.total) return false;
        renderReviewBody(container);
        return true;
      }, "Nothing to review, lab-wide.");
      return;
    }
    renderReviewBody(box);
  }

  function renderReviewBody(box){
    var q = E.reviewQueue(state);

    if (!q.total){
      box.appendChild(el("div", "empty", "Nothing to review. Everything the import wasn't sure about has been answered."));
      return;
    }

    // ---- vials whose box has gone ----
    //
    // First, because this is the one category that blocks every save: validate() calls a
    // vial pointing at a missing box an error, and save() refuses on any error, so until
    // these are answered the account can save nothing at all -- not an import, not a new
    // vial, not even a fix somewhere else. That is exactly how one account got stuck: a
    // box was deleted while its owner's file could not be read, so the withdrawal that
    // should have gone with the delete never happened.
    //
    // Offered, never done automatically: the vial is not erased, it is taken out and
    // logged, with the slot it was in kept in the Log exactly as taking one out by hand
    // records it.
    if ((q.orphans || []).length){
      var oc = el("div", "card");
      oc.appendChild(el("h3", null, "Vials whose box is gone (" + q.orphans.length + ")"));
      oc.appendChild(el("p", "note",
        "The box these sit in is no longer in the freezer — someone deleted it. Nothing is " +
        "saved while this is unanswered, so this comes first. Taking one out does not erase " +
        "it: it leaves the inventory and stays in the Log, with the slot it was in."));

      function takeOrphans(list, label){
        var ids = list.map(function(v){ return v.id; });
        var out = E.withdraw(state, ids, {
          date: new Date().toISOString().slice(0, 10), by: getDevice(), purpose: "discarded",
          notes: "the box it was in was removed from the freezer",
          ids: ids.map(function(_, i){ return "w-" + Date.now().toString(36) + "-" + i; })
        });
        if (out.warnings.length){ showBanner(esc(out.warnings[0])); return; }
        state = out.state;
        markDirty(label);
        renderAll();
        showBanner("Took out " + ids.length + " vial(s). They are in the Log.");
      }

      if (q.orphans.length > 1){
        var allOut = el("button", "primary", "Take out all " + q.orphans.length);
        allOut.disabled = !canWrite() || ADMIN_MERGED;
        allOut.onclick = function(){ takeOrphans(q.orphans, "Take out " + q.orphans.length + " vial(s) whose box is gone"); };
        oc.appendChild(allOut);
      }

      q.orphans.slice(0, 60).forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        // The box id is all that is left of where it was, so say it rather than "(unknown
        // box)" -- it is what tells an admin which deletion did this.
        grow.appendChild(el("div", "sub", "box " + (v.location && v.location.boxId) +
          (v.location && v.location.position ? " · " + v.location.position : "") + " — no longer in the freezer"));
        row.appendChild(grow);
        var take = el("button", null, "Take it out");
        take.disabled = !canWrite() || ADMIN_MERGED;
        take.onclick = function(){ takeOrphans([v], "Take out " + v.name + ", whose box is gone"); };
        row.appendChild(take);
        oc.appendChild(row);
      });
      if (q.orphans.length > 60) oc.appendChild(el("p", "note", "…and " + (q.orphans.length - 60) + " more."));
      box.appendChild(oc);
    }

    // ---- empty slots the first import mistook for rows ----
    //
    // Before importSheet learned the difference, a line holding a slot label and nothing
    // else came in as a vial called "Unreadable row (E 6)". 144 of them, all asking a
    // question with no answer, and burying the rows that really did need one. New imports
    // no longer make them; these are the ones already in the file, and clearing them is
    // his click, not something done to his inventory behind his back.
    if ((q.emptySlots || []).length){
      var ec = el("div", "card");
      ec.appendChild(el("h3", null, "Empty spaces from the sheet (" + q.emptySlots.length + ")"));
      ec.appendChild(el("p", "note",
        "Your spreadsheet lists every slot in a box and leaves the name blank where nothing " +
        "is frozen. These lines held a slot and nothing else — no name, no date, no passage, " +
        "no note — so there is nothing here to fix and nothing to lose. Removing them is not " +
        "a withdrawal: no vial was ever in these spaces."));
      var drop = el("button", "primary", "Remove all " + q.emptySlots.length);
      drop.disabled = !canWrite() || ADMIN_MERGED;
      drop.onclick = function(){
        var out = E.dropEmptyImportRows(state);
        state = out.state;
        markDirty("Remove " + out.removed + " empty spaces from the sheet");
        renderAll();
        showBanner("Removed " + out.removed + " empty spaces. Nothing that held a vial was touched.");
      };
      ec.appendChild(drop);
      q.emptySlots.slice(0, 20).forEach(function(v){
        var raw = v.importRaw || {};
        ec.appendChild(el("p", "note", "　" + (raw.box ? raw.box + " " : "") +
          (raw.position || "(no slot)") + " — sheet row " + (raw.row || "?")));
      });
      if (q.emptySlots.length > 20) ec.appendChild(el("p", "note", "…and " + (q.emptySlots.length - 20) + " more."));
      box.appendChild(ec);
    }

    // ---- rows an import couldn't place at all ----
    if (q.ambiguousImport.length){
      var ic = el("div", "card");
      ic.appendChild(el("h3", null, "Rows we weren't sure about (" + q.ambiguousImport.length + ")"));
      ic.appendChild(el("p", "note",
        "No name, or no position that fits inside its box — rather than guess, these came in with " +
        "no location. They won't show up in Find until fixed here."));
      q.ambiguousImport.slice(0, 60).forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        var raw = v.importRaw || {};
        grow.appendChild(el("div", "sub",
          "sheet row " + (raw.row || "?") + ": name " + (raw.name ? "\"" + raw.name + "\"" : "(blank)") +
          ", position " + (raw.position ? "\"" + raw.position + "\"" : "(blank)") +
          (raw.box ? " in " + raw.box : "")));
        row.appendChild(grow);
        var fix = el("button", null, "Fix");
        fix.disabled = !canWrite() || ADMIN_MERGED;
        fix.onclick = function(){ resolveAmbiguousImport(v); };
        row.appendChild(fix);
        ic.appendChild(row);
      });
      if (q.ambiguousImport.length > 60) ic.appendChild(el("p", "note", "…and " + (q.ambiguousImport.length - 60) + " more."));
      box.appendChild(ic);
    }

    // ---- dates ----
    if (q.dates.length){
      var c = el("div", "card");
      c.appendChild(el("h3", null, "Dates to confirm (" + q.dates.length + ")"));
      c.appendChild(el("p", "note",
        "This column was typed day-month-year, but the spreadsheet read whatever it could as " +
        "month-day and converted it — so these have their day and month the wrong way round. " +
        "Nothing was changed automatically. Until a date is confirmed the vial stays out of the " +
        "date slider, but it is still findable by name."));

      var swappable = q.dates.filter(function(d){ return d.date.proposed; });
      if (swappable.length){
        var all = el("button", "primary", "Accept the swap for all " + swappable.length);
        all.disabled = !canWrite() || ADMIN_MERGED;
        all.onclick = function(){
          var next = state;
          swappable.forEach(function(d){
            var r = E.confirmDate(next, d.vial.id, d.date.proposed);
            if (r.ok) next = r.state;
          });
          state = next;
          markDirty("Confirm " + swappable.length + " dates");
          renderAll();
        };
        c.appendChild(all);
      }

      q.dates.slice(0, 40).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.vial.name));
        var sub = d.vial.frozenRaw
          ? "sheet says " + d.vial.frozenRaw + (d.date.asWritten ? " (reads as " + prettyDate(d.date.asWritten) + ")" : "")
          : "no date at all";
        grow.appendChild(el("div", "sub", sub + " · " + E.locationPath(state, d.vial.location)));
        row.appendChild(grow);

        if (d.date.proposed){
          var b = el("button", null, prettyDate(d.date.proposed));
          b.disabled = !canWrite() || ADMIN_MERGED;
          b.onclick = function(){
            var r = E.confirmDate(state, d.vial.id, d.date.proposed);
            if (!r.ok){ showBanner(esc(r.reason)); return; }
            state = r.state; markDirty("Confirm a date"); renderAll();
          };
          row.appendChild(b);
        } else {
          var t = el("button", null, "Type it");
          t.disabled = !canWrite() || ADMIN_MERGED;
          t.onclick = function(){ askDate(d.vial); };
          row.appendChild(t);
        }
        // A permanent "nobody knows" -- passage's "p?" for a date. Records the answer
        // once so this row stops coming back to Review every time it runs.
        var unk = el("button", null, "Unknown");
        unk.disabled = !canWrite() || ADMIN_MERGED;
        unk.onclick = function(){
          var r = E.markDateUnknown(state, d.vial.id);
          if (!r.ok){ showBanner(esc(r.reason)); return; }
          state = r.state; markDirty("Mark a date Unknown"); renderAll();
        };
        row.appendChild(unk);
        c.appendChild(row);
      });
      if (q.dates.length > 40) c.appendChild(el("p", "note", "…and " + (q.dates.length - 40) + " more."));
      box.appendChild(c);
    }

    // ---- facets ----
    if (q.facets.length){
      var fc = el("div", "card");
      fc.appendChild(el("h3", null, "Facets the rules read differently (" + q.facets.length + ")"));
      fc.appendChild(el("p", "note",
        "The spreadsheet's own formulas had five bugs. These are the rows where the corrected " +
        "rules disagree with what the sheet wrote. Nothing here needs doing — it's shown so the " +
        "change isn't silent. Dismissing accepts the new reading."));
      q.facets.slice(0, 60).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.name));
        var bits = Object.keys(d.changed).map(function(f){
          return f + ": " + d.changed[f].sheet + " → " + d.changed[f].now;
        });
        grow.appendChild(el("div", "sub", bits.join(" · ")));
        row.appendChild(grow);
        fc.appendChild(row);
      });
      if (q.facets.length > 60) fc.appendChild(el("p", "note", "…and " + (q.facets.length - 60) + " more."));
      var dismiss = el("button", null, "Accept all of these");
      dismiss.disabled = !canWrite() || ADMIN_MERGED;
      dismiss.onclick = function(){
        state.vials.forEach(function(v){ delete v.facetsFromSheet; });
        markDirty("Accept the corrected facets");
        renderAll();
      };
      fc.appendChild(dismiss);
      box.appendChild(fc);
    }

    // ---- gaps ----
    if (q.gaps.length){
      var gc = el("div", "card");
      gc.appendChild(el("h3", null, "Names no rule covers (" + q.gaps.length + ")"));
      gc.appendChild(el("p", "note",
        "The sheet wrote #N/A for these, which reads like a value but isn't one. Add a rule and " +
        "they fill themselves in — that's what Settings → Rules is for."));
      var byName = {};
      q.gaps.forEach(function(g){ byName[g.name] = (byName[g.name] || 0) + 1; });
      Object.keys(byName).sort().forEach(function(n){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", byName[n] + " vial" + (byName[n] === 1 ? "" : "s")));
        row.appendChild(grow);
        gc.appendChild(row);
      });
      var add = el("button", "primary", "Add a rule");
      add.disabled = ADMIN_MERGED;
      add.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
      gc.appendChild(add);
      box.appendChild(gc);
    }

    // ---- vials with no passage recorded ----
    if (q.unknownPassage.length){
      var uc = el("div", "card");
      uc.appendChild(el("h3", null, "Passage not recorded (" + q.unknownPassage.length + ")"));
      uc.appendChild(el("p", "note",
        "The sheet says p? for these. They are still findable by name, and the passage slider " +
        "keeps them behind its \u201cinclude unknown\u201d toggle rather than dropping them. " +
        "Fill one in whenever you happen to know it."));
      var byName = {};
      q.unknownPassage.forEach(function(v){
        if (!byName[v.name]) byName[v.name] = [];
        byName[v.name].push(v);
      });
      Object.keys(byName).sort().slice(0, 60).forEach(function(n){
        var list = byName[n];
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", list.length + " vial" + (list.length === 1 ? "" : "s") +
          " · " + list.map(function(v){ return E.locationPath(state, v.location).split(" → ").slice(-2).join(" "); }).join(", ")));
        row.appendChild(grow);
        var b = el("button", null, list.length === 1 ? "Fill in" : "Fill in first");
        b.disabled = !canWrite() || ADMIN_MERGED;
        b.onclick = function(){ editVial(list[0]); };
        row.appendChild(b);
        uc.appendChild(row);
      });
      if (Object.keys(byName).length > 60) uc.appendChild(el("p", "note", "…and more."));
      box.appendChild(uc);
    }

    // ---- rows holding more than one kind of cell ----
    if (q.rows.length){
      var rc = el("div", "card");
      rc.appendChild(el("h3", null, "Rows holding two kinds of cell (" + q.rows.length + ")"));
      rc.appendChild(el("p", "note",
        "A row is meant to hold one kind of cell — that is how the freezer is laid out, and it is " +
        "what the app follows when it proposes a place. These rows do not. Most of them are rows " +
        "carrying vials no origin rule covers yet, so adding the rule fixes the row too."));
      q.rows.forEach(function(m){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, m.box + " row " + m.label));
        grow.appendChild(el("div", "sub", m.origins.map(function(o){
          return o + " × " + m.counts[o];
        }).join("  ·  ")));
        row.appendChild(grow);
        var b = el("button", null, "Show");
        b.disabled = ADMIN_MERGED;
        b.onclick = function(){
          boxView.unitId = null;
          boxView.boxId = m.boxId;
          boxView.highlight = [];
          go("boxes");
        };
        row.appendChild(b);
        rc.appendChild(row);
      });
      box.appendChild(rc);
    }

    // ---- implausible passages ----
    if (q.passages.length){
      var pc = el("div", "card");
      pc.appendChild(el("h3", null, "Passages that can't be right (" + q.passages.length + ")"));
      pc.appendChild(el("p", "note",
        "A passage in the tens of thousands is a date serial that landed in the wrong column. " +
        "One of these is enough to stretch the passage slider until it's useless."));
      q.passages.forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        grow.appendChild(el("div", "sub", v.passage + " · " + E.locationPath(state, v.location)));
        row.appendChild(grow);
        var b = el("button", null, "Fix");
        b.disabled = !canWrite() || ADMIN_MERGED;
        b.onclick = function(){ editVial(v); };
        row.appendChild(b);
        pc.appendChild(row);
      });
      box.appendChild(pc);
    }
  }

  function askDate(vial){
    $("dlgTitle").textContent = "When was " + vial.name + " frozen?";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", vial.frozenRaw ? "The sheet says: " + vial.frozenRaw : "The sheet had nothing here."));
    var inp = document.createElement("input");
    inp.type = "date";
    body.appendChild(inp);
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    ok.onclick = function(){
      if (!inp.value) return;
      var r = E.confirmDate(state, vial.id, inp.value);
      if (!r.ok){ showBanner(esc(r.reason)); return; }
      state = r.state; $("dlg").close(); markDirty("Set a date"); renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }
