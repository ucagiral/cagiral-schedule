<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cell Stocks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cell Stocks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<style>
  /* Same palette as the schedule and wardrobe apps next door, so the three read as
     one family. The accent is cold cyan -- a freezer, not a calendar or a coat. */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#d8dce1; --text:#1f2430; --muted:#6b7280;
    --accent:#0891b2; --accent-soft:#cffafe;
    --warn-bg:#fff7ed; --warn-border:#fde68a; --warn-text:#7c2d12;
    --ok:#15803d; --bad:#b91c1c; --guess:#a16207; --guess-bg:#fef9c3;
    --card:#ffffff; --slot:#eef1f5;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#14161a; --panel:#1c1f26; --border:#2c3038; --text:#e6e8eb; --muted:#9aa1ac;
      --accent:#22d3ee; --accent-soft:#0b3a44;
      --warn-bg:#2a2210; --warn-border:#5c4a16; --warn-text:#fcd9a8;
      --ok:#4ade80; --bad:#f87171; --guess:#fbbf24; --guess-bg:#3a2f0b;
      --card:#1c1f26; --slot:#232830;
    }
  }
  html[data-theme="dark"]{
    --bg:#14161a; --panel:#1c1f26; --border:#2c3038; --text:#e6e8eb; --muted:#9aa1ac;
    --accent:#22d3ee; --accent-soft:#0b3a44;
    --warn-bg:#2a2210; --warn-border:#5c4a16; --warn-text:#fcd9a8;
    --ok:#4ade80; --bad:#f87171; --guess:#fbbf24; --guess-bg:#3a2f0b;
    --card:#1c1f26; --slot:#232830;
  }

  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:contain; height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column; min-height:100%;
  }
  button{
    font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; color:var(--text);
  }
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.45; cursor:not-allowed}
  input,select,textarea{
    font:inherit; padding:7px 9px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); width:100%;
  }
  a{color:var(--accent)}

  header{
    display:flex; align-items:center; gap:8px; padding:calc(8px + var(--safe-t)) 12px 8px;
    background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em}
  #status{font-size:12px; color:var(--muted); margin-left:auto; text-align:right}
  #status.saving{color:var(--accent)} #status.saved{color:var(--ok)} #status.error{color:var(--bad)}

  .banner{
    padding:9px 12px; font-size:13px; background:var(--warn-bg); color:var(--warn-text);
    border-bottom:1px solid var(--warn-border); display:none; line-height:1.5;
  }
  .banner.show{display:block}
  .banner button{margin-left:8px; padding:3px 9px; font-size:12px}
  .banner code{background:rgba(0,0,0,.08); padding:1px 4px; border-radius:4px}

  main{flex:1; padding:12px; padding-bottom:calc(74px + var(--safe-b)); max-width:760px; width:100%; margin:0 auto}
  .screen{display:none} .screen.active{display:block}

  nav{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--panel);
    border-top:1px solid var(--border); padding-bottom:var(--safe-b); z-index:20;
  }
  nav button{
    flex:1; border:0; border-radius:0; background:none; padding:9px 2px 10px; position:relative;
    font-size:10.5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button .ic{font-size:17px; line-height:1}
  nav button.on{color:var(--accent); font-weight:650}
  nav button .dot{
    position:absolute; top:6px; left:50%; transform:translateX(9px);
    min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--accent);
    color:#fff; font-size:9.5px; line-height:15px; font-weight:700;
  }

  h2{font-size:16px; margin:0 0 10px; font-weight:650}
  h3{font-size:13px; margin:18px 0 8px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  p.note{font-size:12.5px; color:var(--muted); line-height:1.55; margin:8px 0}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .row.tight{gap:6px; margin-top:6px}
  .row > button{flex:1; min-width:110px}
  .field{margin-top:10px}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

  /* ---- chips ---- */
  .chips{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
  .chip{
    font-size:11px; padding:2px 8px; border-radius:99px; background:var(--slot);
    border:1px solid var(--border); color:var(--muted); white-space:nowrap;
  }
  .chip.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:650}
  .chip.guess{background:var(--guess-bg); color:var(--guess); border-color:var(--guess)}
  .chip.gap{background:var(--warn-bg); color:var(--warn-text); border-color:var(--warn-border); font-weight:650}
  button.chip{cursor:pointer; padding:3px 9px}

  /* ---- search ---- */
  #q{font-size:16px; padding:10px 12px}
  .filters{margin-top:12px}
  .flt{margin-top:14px}
  .flt .hd{display:flex; align-items:baseline; gap:8px; font-size:12px; margin-bottom:2px}
  .flt .hd b{font-size:12px; font-weight:650}
  .flt .hd .val{color:var(--accent); font-weight:650; margin-left:auto; font-variant-numeric:tabular-nums}
  .flt .sub{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5}

  /* Two range inputs stacked into one dual-handle slider. The track is drawn by the
     divs; the inputs are transparent and only their thumbs take pointer events, so
     whichever handle is nearer the touch is the one that moves. */
  .dual{position:relative; height:30px; margin-top:6px}
  .dual .track,.dual .fill{position:absolute; top:13px; height:4px; border-radius:99px}
  .dual .track{left:0; right:0; background:var(--border)}
  .dual .fill{background:var(--accent)}
  .dual input[type=range]{
    position:absolute; left:0; top:0; width:100%; height:30px; margin:0; padding:0;
    -webkit-appearance:none; appearance:none; background:none; pointer-events:none;
  }
  .dual input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; pointer-events:auto; width:22px; height:22px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); cursor:grab;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .dual input[type=range]::-moz-range-thumb{
    pointer-events:auto; width:20px; height:20px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); cursor:grab;
  }
  .dual input[type=range]::-moz-range-track{background:none; border:0}

  .seg{display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden}
  .seg button{
    flex:1; border:0; border-radius:0; font-size:12px; padding:6px 4px; background:var(--panel);
    border-right:1px solid var(--border); color:var(--muted);
  }
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent-soft); color:var(--accent); font-weight:650}

  .toggle{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:8px}
  .toggle input{width:auto}

  /* ---- results ---- */
  .res{
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:12px; padding:11px 12px; margin-bottom:9px;
  }
  .res .nm{font-weight:650; font-size:14px; line-height:1.35; word-break:break-word}
  .res .where{font-size:13px; margin-top:5px; font-weight:600}
  .res .where .pos{
    background:var(--accent-soft); color:var(--accent); border-radius:6px;
    padding:1px 7px; font-weight:700; margin-left:4px;
  }
  .res .meta{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5}
  .res .miss{font-size:11.5px; color:var(--guess); margin-top:4px}
  .res.gone{border-left-color:var(--muted); opacity:.72}

  /* ---- box grid ---- */
  .boxgrid{display:grid; gap:3px; margin-top:10px; overflow-x:auto}
  .slot{
    aspect-ratio:1; border-radius:5px; background:var(--slot); border:1px solid transparent;
    font-size:9px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer; overflow:hidden; min-width:26px;
  }
  .slot.taken{border-color:rgba(0,0,0,.10); color:#10151c; font-weight:650}
  .slot.target{outline:2.5px solid var(--accent); outline-offset:-1px; background:var(--accent-soft)}
  .slot.hit{outline:2.5px solid var(--bad); outline-offset:-1px}
  .gridwrap{display:grid; gap:3px; align-items:center}
  .axis{font-size:9.5px; color:var(--muted); text-align:center}
  .axis.r{text-align:right; padding-right:3px}

  .occ{font-size:12px; color:var(--muted); margin-top:8px}
  .bar{height:5px; border-radius:99px; background:var(--border); margin-top:6px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent)}

  /* ---- lists ---- */
  .item{
    display:flex; gap:10px; align-items:flex-start; padding:9px 0;
    border-bottom:1px solid var(--border); font-size:13px;
  }
  .item:last-child{border-bottom:0}
  .item .grow{flex:1; min-width:0}
  .item .sub{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.5}
  .item button{padding:4px 9px; font-size:11.5px; white-space:nowrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px}
  .strike{text-decoration:line-through; color:var(--muted)}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:26px 10px; line-height:1.6}
  .prob{font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); line-height:1.5}
  .prob.error{color:var(--bad)} .prob.warning{color:var(--guess)}

  dialog{
    border:1px solid var(--border); border-radius:16px; padding:0; background:var(--panel);
    color:var(--text); max-width:520px; width:calc(100% - 24px); max-height:84vh;
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-head{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border)}
  .dlg-head h3{margin:0; text-transform:none; letter-spacing:0; font-size:14px; color:var(--text)}
  .dlg-body{padding:14px; overflow:auto; max-height:60vh}
  .dlg-foot{padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
  .dlg-foot button{flex:1; min-width:100px}
</style>
</head>
<body>

<header>
  <h1>Cell Stocks</h1>
  <span id="status">Loading…</span>
</header>
<div class="banner" id="banner"></div>

<main>
  <section class="screen active" id="s-find">
    <input id="q" type="search" placeholder="hela p12 caspex g5.1 …" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="filters" id="filters"></div>
    <div id="results"></div>
  </section>

  <section class="screen" id="s-freeze">
    <h2>Freeze</h2>
    <div class="card">
      <div class="field">
        <label for="fzName">What are you freezing?</label>
        <input id="fzName" placeholder="DuDtxR CASPEX g5.1" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="chips" id="fzFacets" style="margin-top:9px"></div>
      <p class="note" id="fzLine"></p>
      <div class="two">
        <div class="field"><label for="fzCount">How many vials?</label><input id="fzCount" type="number" min="1" max="81" value="5"></div>
        <div class="field"><label for="fzUnit">Where</label><select id="fzUnit"></select></div>
      </div>
    </div>
    <div class="card" id="fzPlanCard"></div>
    <div class="card">
      <div class="two">
        <div class="field"><label for="fzPassage">Passage</label><input id="fzPassage" placeholder="p12 or p+3" autocomplete="off"></div>
        <div class="field"><label for="fzDate">Date frozen</label><input id="fzDate" type="date"></div>
      </div>
      <div class="field"><label for="fzNotes">Notes</label><input id="fzNotes" placeholder="myco -" autocomplete="off"></div>
      <div class="row"><button class="primary" id="fzGo">Put them in</button></div>
      <p class="note" id="fzWhyNot"></p>
    </div>
  </section>

  <section class="screen" id="s-boxes">
    <h2>Boxes</h2>
    <div class="card">
      <div class="two">
        <div class="field"><label for="bxUnit">Unit</label><select id="bxUnit"></select></div>
        <div class="field"><label for="bxBox">Box</label><select id="bxBox"></select></div>
      </div>
      <div id="bxGrid"></div>
      <div class="occ" id="bxOcc"></div>
      <div class="bar"><i id="bxBar"></i></div>
    </div>
    <div class="card" id="bxLines"></div>
  </section>

  <section class="screen" id="s-review">
    <h2>Review</h2>
    <div id="reviewBody"></div>
  </section>

  <section class="screen" id="s-log">
    <h2>Taken out</h2>
    <div class="card" id="logBody"></div>
    <div class="card" id="stockBody"></div>
  </section>

  <section class="screen" id="s-settings">
    <h2>Settings</h2>
    <div class="card" id="connectCard"></div>
    <div class="card" id="storageCard"></div>
    <div class="card" id="rulesCard"></div>
    <div class="card" id="importCard"></div>
    <div class="card" id="checkCard"></div>
  </section>
</main>

<nav>
  <button data-screen="find"><span class="ic">🔍</span>Find</button>
  <button data-screen="freeze"><span class="ic">❄️</span>Freeze</button>
  <button data-screen="boxes"><span class="ic">🧊</span>Boxes</button>
  <button data-screen="review"><span class="ic">📋</span>Review</button>
  <button data-screen="log"><span class="ic">🗂️</span>Log</button>
  <button data-screen="settings"><span class="ic">⚙️</span>Settings</button>
</nav>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button id="dlgX" style="margin-left:auto">Close</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>

<script src="xlsx.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  "use strict";
  var E = window.CellStocksEngine;
  var X = window.XlsxLite;

  // Same localStorage keys as the schedule and wardrobe apps: all three are served
  // from one origin, so opening this in Safari picks up a token that is already
  // there. Only the cache key is this app's own.
  var LS = { token:"cs_token", device:"cs_device", theme:"cs_theme", cache:"cst_cache", cfg:"cs_cfg" };
  var DATA_PATH = "cellstocks/cellstocks.json";
  var XLSX_PATH = "cellstocks/cell-stocks.xlsx";

  function resolveConfig(){
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(LS.cfg) || "null"); } catch(e){}
    if (stored && stored.owner && stored.repo) return stored;
    var host = location.hostname || "";
    var m = host.match(/^([^.]+)\.github\.io$/i);
    var seg = location.pathname.split("/").filter(Boolean);
    if (m) return { owner: m[1], repo: seg.length ? seg[0] : (m[1] + ".github.io"), branch: "main" };
    return { owner:null, repo:null, branch:"main" };
  }
  var CFG = resolveConfig();
  var REPO = CFG.owner ? CFG.owner + "/" + CFG.repo : null;
  var API = REPO ? "https://api.github.com/repos/" + REPO : null;

  function getToken(){ try { return localStorage.getItem(LS.token) || null; } catch(e){ return null; } }
  function getDevice(){ try { return localStorage.getItem(LS.device) || "unknown device"; } catch(e){ return "unknown device"; } }
  function canWrite(){ return !!(getToken() && API); }
  function ghHeaders(){
    var h = { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
    var t = getToken();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }
  function rawURL(path){
    return "https://raw.githubusercontent.com/" + REPO + "/" + (CFG.branch||"main") + "/" + path + "?t=" + Date.now();
  }

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function esc(s){
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); return node; }
  function setStatus(text, cls){ $("status").textContent = text; $("status").className = cls || ""; }

  var bannerTimer = null;
  function showBanner(html, actions){
    var b = $("banner");
    b.innerHTML = html;
    (actions||[]).forEach(function(a){
      var btn = el("button", null, a.label);
      btn.onclick = a.onClick;
      b.appendChild(btn);
    });
    b.classList.add("show");
    clearTimeout(bannerTimer);
    if (!actions || !actions.length) bannerTimer = setTimeout(hideBanner, 9000);
  }
  function hideBanner(){ $("banner").classList.remove("show"); }

  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str), out = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }
  function base64ToUtf8(b64){
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function bytesToBase64(bytes){
    var out = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }

  // =====================================================================
  // State
  // =====================================================================

  var state = E.blankState();
  var dirty = false;
  var lastWithdrawal = null;     // for the 10-second undo in the status line

  function cacheSave(){
    try { localStorage.setItem(LS.cache, JSON.stringify({ at: Date.now(), state: state })); } catch(e){}
  }
  function cacheLoad(){
    try {
      var c = JSON.parse(localStorage.getItem(LS.cache) || "null");
      if (c && c.state){ state = E.mergeDefaults(c.state); return c.at; }
    } catch(e){}
    return null;
  }

  async function load(){
    if (!REPO){
      setStatus("Open from GitHub Pages", "error");
      showBanner("This app works out which repository it belongs to from its own address, so it has to be " +
                 "opened from GitHub Pages rather than from a file on disk.");
      return;
    }
    try {
      var text = null;
      if (getToken()){
        var r = await fetch(API + "/contents/" + DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
                            { headers: ghHeaders(), cache:"no-store" });
        if (r.status === 404) text = null;
        else if (!r.ok) throw new Error("GitHub said " + r.status);
        else { var j = await r.json(); text = base64ToUtf8(j.content || ""); }
      } else {
        var resp = await fetch(rawURL(DATA_PATH), { cache:"no-store" });
        text = resp.ok ? await resp.text() : null;
      }
      if (text !== null && text !== undefined) state = E.mergeDefaults(JSON.parse(text));
      cacheSave();
      setStatus(canWrite() ? "Ready" : "Read-only", "");
      if (!canWrite()){
        showBanner("Read-only: no GitHub token on this device, so nothing can be frozen or taken out. " +
                   "Add one under Settings → Connect.");
      }
    } catch(err){
      var at = cacheLoad();
      setStatus("Offline", "error");
      showBanner("Couldn't reach GitHub — showing the last copy this device downloaded" +
                 (at ? " (" + esc(new Date(at).toLocaleString()) + ")" : "") +
                 ". Nothing can be saved until it's back.");
    }
    renderAll();
  }

  // =====================================================================
  // Saving -- the JSON and the workbook, in ONE commit
  //
  // The .xlsx is generated from the JSON every time, so the two can never drift.
  // That is also why this uses the git data API rather than the contents API: two
  // files have to land together, or there is a moment where the workbook describes
  // an inventory that no longer exists.
  // =====================================================================

  async function gh(path, opts){
    var r = await fetch(API + path, Object.assign({ headers: ghHeaders() }, opts || {}));
    if (!r.ok){
      var body = "";
      try { body = (await r.json()).message || ""; } catch(e){}
      var err = new Error("GitHub " + r.status + (body ? ": " + body : ""));
      err.status = r.status;
      throw err;
    }
    return r.json();
  }

  async function commitFiles(files, message){
    var branch = CFG.branch || "main";
    var ref = await gh("/git/ref/heads/" + branch);
    var baseSha = ref.object.sha;
    var baseCommit = await gh("/git/commits/" + baseSha);
    var tree = [];
    for (var i = 0; i < files.length; i++){
      var f = files[i];
      var blob = await gh("/git/blobs", { method:"POST",
        body: JSON.stringify(f.base64 ? { content:f.base64, encoding:"base64" } : { content:f.text, encoding:"utf-8" }) });
      tree.push({ path:f.path, mode:"100644", type:"blob", sha:blob.sha });
    }
    var newTree = await gh("/git/trees", { method:"POST",
      body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree: tree }) });
    var commit = await gh("/git/commits", { method:"POST",
      body: JSON.stringify({ message: message, tree: newTree.sha, parents: [baseSha] }) });
    await gh("/git/refs/heads/" + branch, { method:"PATCH", body: JSON.stringify({ sha: commit.sha }) });
    return commit.sha;
  }

  // Deflated, not stored: the same workbook is eight times larger uncompressed and
  // it is uploaded on every save.
  function workbookBytes(){ return X.writeWorkbookAsync(E.vialsToSheets(state)); }

  var saveTimer = null;
  function markDirty(message){
    dirty = true;
    cacheSave();
    renderNavBadge();
    if (!canWrite()){ setStatus("Not saved — read-only", "error"); return; }
    setStatus("Saving…", "saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ save(message || "Update cell stocks"); }, 900);
  }

  async function save(message){
    if (!canWrite()) return;
    clearTimeout(saveTimer);

    // Never commit a state that would put two vials in one slot. This is the one
    // invariant the whole app exists to hold, so it blocks the save rather than
    // showing a badge.
    var errors = E.errorsOnly(E.validate(state));
    if (errors.length){
      setStatus("Not saved", "error");
      showBanner("Refusing to save, because the inventory would be wrong: " + esc(errors[0].message) +
                 (errors.length > 1 ? " (and " + (errors.length - 1) + " more — see Settings → Check it)" : ""));
      return;
    }

    setStatus("Saving…", "saving");
    try {
      state._meta = { savedBy: getDevice(), savedAt: new Date().toISOString() };
      await commitFiles([
        { path: DATA_PATH, text: JSON.stringify(state, null, 2) + "\n" },
        { path: XLSX_PATH, base64: bytesToBase64(await workbookBytes()) }
      ], message + " from " + getDevice());
      dirty = false;
      cacheSave();
      setStatus("Saved", "saved");
      setTimeout(function(){ if ($("status").textContent === "Saved") setStatus("Ready", ""); }, 2500);
    } catch(err){
      setStatus("Not saved", "error");
      if (err.status === 401 || err.status === 403){
        showBanner("GitHub refused the write (" + err.status + "). The token may have expired, or it may not " +
                   "have <code>Contents: Read and write</code> for this repository.");
      } else if (err.status === 409 || err.status === 422){
        showBanner("Someone else saved first. Reload to take their copy — your change is still on this device.",
                   [{ label:"Reload theirs", onClick: function(){ location.reload(); } }]);
      } else {
        showBanner("Couldn't save: " + esc(err.message) + " Your change is kept on this device.");
      }
    }
  }

  // =====================================================================
  // Colour per line, hashed from the name -- the same trick the schedule app uses
  // for groups, so there is no palette to keep in sync with anything.
  // =====================================================================
  function hueFor(text){
    var h = 0, s = String(text || "");
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function tintFor(text){ return "hsl(" + hueFor(text) + " 62% 78%)"; }

  // =====================================================================
  // Find
  // =====================================================================

  var filter = {
    query: "", passageKind: "any", passageMin: null, passageMax: null,
    includeUnknownPassage: true, frozenFrom: null, frozenTo: null, includeUndated: true,
    unitId: null,
    // What the handles were bounded by last time. Without this, freezing a vial dated
    // today leaves the ceiling where it was and the new vial is silently filtered out
    // of the very search you would run to check it landed.
    bounds: null
  };

  function followExtents(x){
    var b = filter.bounds;
    if (b){
      if (filter.frozenFrom === b.frozenMin) filter.frozenFrom = x.frozen.min;
      if (filter.frozenTo === b.frozenMax) filter.frozenTo = x.frozen.max;
      ["absolute", "relative"].forEach(function(kind){
        if (filter.passageKind !== kind) return;
        if (filter.passageMin === b["min_" + kind]) filter.passageMin = x.passage[kind].min;
        if (filter.passageMax === b["max_" + kind]) filter.passageMax = x.passage[kind].max;
      });
    }
    // And clamp, in case the data shrank rather than grew.
    if (x.frozen.min && filter.frozenFrom && filter.frozenFrom < x.frozen.min) filter.frozenFrom = x.frozen.min;
    if (x.frozen.max && filter.frozenTo && filter.frozenTo > x.frozen.max) filter.frozenTo = x.frozen.max;
    filter.bounds = {
      frozenMin: x.frozen.min, frozenMax: x.frozen.max,
      min_absolute: x.passage.absolute.min, max_absolute: x.passage.absolute.max,
      min_relative: x.passage.relative.min, max_relative: x.passage.relative.max
    };
  }

  function isoToDay(iso){ return Math.round(Date.parse(iso + "T00:00:00Z") / 86400000); }
  function dayToIso(day){ return new Date(day * 86400000).toISOString().slice(0, 10); }
  function prettyDate(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
  }

  // One dual-handle slider. Returns nothing; it writes straight into `filter` and
  // asks for a redraw, because a filter that lagged behind the handle would defeat
  // the point of dragging it.
  function dualSlider(parent, opts){
    var wrap = el("div", "dual");
    var track = el("div", "track"), fill = el("div", "fill");
    var lo = document.createElement("input"), hi = document.createElement("input");
    [lo, hi].forEach(function(inp){
      inp.type = "range"; inp.min = opts.min; inp.max = opts.max; inp.step = opts.step || 1;
    });
    lo.value = opts.lo; hi.value = opts.hi;
    wrap.appendChild(track); wrap.appendChild(fill);
    wrap.appendChild(lo); wrap.appendChild(hi);
    parent.appendChild(wrap);

    function paint(){
      var span = opts.max - opts.min || 1;
      var a = (Number(lo.value) - opts.min) / span * 100;
      var b = (Number(hi.value) - opts.min) / span * 100;
      fill.style.left = a + "%";
      fill.style.width = Math.max(0, b - a) + "%";
    }
    function changed(){
      // Handles may cross; whichever is lower is the floor.
      var a = Math.min(Number(lo.value), Number(hi.value));
      var b = Math.max(Number(lo.value), Number(hi.value));
      paint();
      opts.onChange(a, b);
    }
    lo.oninput = changed; hi.oninput = changed;
    paint();
    return wrap;
  }

  function renderFilters(){
    var box = clear($("filters"));
    var x = E.searchExtents(state);
    followExtents(x);
    var units = state.storage.units || [];

    if (units.length > 1){
      var seg = el("div", "seg");
      [{ id:null, name:"Everywhere" }].concat(units).forEach(function(u){
        var b = el("button", filter.unitId === u.id ? "on" : null, u.name);
        b.onclick = function(){ filter.unitId = u.id; renderFilters(); renderResults(); };
        seg.appendChild(b);
      });
      box.appendChild(seg);
    }

    // ---- frozen ----
    if (x.frozen.dated > 0){
      var f = el("div", "flt");
      var hd = el("div", "hd");
      hd.appendChild(el("b", null, "Frozen"));
      var val = el("span", "val");
      hd.appendChild(val);
      f.appendChild(hd);

      var dMin = isoToDay(x.frozen.min), dMax = isoToDay(x.frozen.max);
      if (filter.frozenFrom === null) filter.frozenFrom = x.frozen.min;
      if (filter.frozenTo === null) filter.frozenTo = x.frozen.max;
      var lo = Math.max(dMin, Math.min(dMax, isoToDay(filter.frozenFrom)));
      var hi = Math.max(dMin, Math.min(dMax, isoToDay(filter.frozenTo)));
      function label(){ val.textContent = prettyDate(filter.frozenFrom) + " → " + prettyDate(filter.frozenTo); }
      label();
      dualSlider(f, { min:dMin, max:dMax, lo:lo, hi:hi, onChange: function(a, b){
        filter.frozenFrom = dayToIso(a); filter.frozenTo = dayToIso(b);
        label(); renderResults();
      }});

      if (x.frozen.unconfirmed){
        var t = el("label", "toggle");
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = filter.includeUndated;
        cb.onchange = function(){ filter.includeUndated = cb.checked; renderResults(); };
        t.appendChild(cb);
        t.appendChild(el("span", null, "Also show the " + x.frozen.unconfirmed +
          " vials whose date isn't confirmed yet"));
        f.appendChild(t);
      }
      box.appendChild(f);
    }

    // ---- passage ----
    var p = el("div", "flt");
    var phd = el("div", "hd");
    phd.appendChild(el("b", null, "Passage"));
    var pval = el("span", "val");
    phd.appendChild(pval);
    p.appendChild(phd);

    var kinds = [
      { id:"any", label:"Any" },
      { id:"absolute", label:"p11 (absolute)" },
      { id:"relative", label:"p+2 (since thaw)" }
    ];
    var pseg = el("div", "seg");
    kinds.forEach(function(k){
      var b = el("button", filter.passageKind === k.id ? "on" : null, k.label);
      b.onclick = function(){
        filter.passageKind = k.id; filter.passageMin = null; filter.passageMax = null;
        renderFilters(); renderResults();
      };
      pseg.appendChild(b);
    });
    p.appendChild(pseg);

    if (filter.passageKind === "any"){
      pval.textContent = "all";
      var sub = el("div", "sub",
        "p11 and p+2 are different things — one counts from the line's origin, the other from " +
        "the last thaw — so pick a scale before sliding.");
      p.appendChild(sub);
    } else {
      var scale = x.passage[filter.passageKind];
      if (!scale.count){
        pval.textContent = "none";
        p.appendChild(el("div", "sub", "No vials use this scale."));
      } else {
        if (filter.passageMin === null) filter.passageMin = scale.min;
        if (filter.passageMax === null) filter.passageMax = scale.max;
        var prefix = filter.passageKind === "relative" ? "p+" : "p";
        function plabel(){ pval.textContent = prefix + filter.passageMin + " → " + prefix + filter.passageMax; }
        plabel();
        dualSlider(p, { min:scale.min, max:scale.max,
          lo:Math.max(scale.min, Math.min(scale.max, filter.passageMin)),
          hi:Math.max(scale.min, Math.min(scale.max, filter.passageMax)),
          onChange: function(a, b){ filter.passageMin = a; filter.passageMax = b; plabel(); renderResults(); }});
      }
      if (x.passage.unknown){
        var t2 = el("label", "toggle");
        var cb2 = document.createElement("input"); cb2.type = "checkbox"; cb2.checked = filter.includeUnknownPassage;
        cb2.onchange = function(){ filter.includeUnknownPassage = cb2.checked; renderResults(); };
        t2.appendChild(cb2);
        t2.appendChild(el("span", null, "Also show the " + x.passage.unknown + " vials marked p?"));
        p.appendChild(t2);
      }
    }
    box.appendChild(p);
  }

  function facetChips(vial){
    var f = E.facetsFor(vial, state.rules);
    var out = [];
    ["origin","koox","resistance","caspex","guide"].forEach(function(k){
      var v = f[k];
      if (!v || v === "-") return;
      out.push(v);
    });
    return out;
  }

  function vialMeta(vial){
    var bits = [];
    if (vial.passage) bits.push(vial.passage);
    if (vial.frozenOn) bits.push("frozen " + prettyDate(vial.frozenOn));
    else if (vial.frozenRaw) bits.push("date unconfirmed (" + vial.frozenRaw + ")");
    else bits.push("no date");
    return bits.join(" · ");
  }

  function resultCard(r){
    var v = r.vial;
    var card = el("div", "res" + (v.status === "withdrawn" ? " gone" : ""));
    card.style.borderLeftColor = tintFor(v.lineId || v.name);
    card.appendChild(el("div", "nm", v.name));

    var chips = el("div", "chips");
    chips.style.marginTop = "5px";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    if (chips.childNodes.length) card.appendChild(chips);

    if (v.status === "withdrawn"){
      card.appendChild(el("div", "where", "Taken out"));
    } else {
      var w = el("div", "where");
      var path = E.locationPath(state, v.location).split(" → ");
      var pos = path.pop();
      w.appendChild(document.createTextNode(path.join(" → ") + " → "));
      w.appendChild(el("span", "pos", pos));
      card.appendChild(w);
    }
    card.appendChild(el("div", "meta", vialMeta(v)));
    if (r.missed && r.missed.length){
      card.appendChild(el("div", "miss",
        "matched " + r.matched.length + " of " + (r.matched.length + r.missed.length) +
        " words — no " + r.missed.join(", ")));
    }

    var row = el("div", "row tight");
    if (v.status !== "withdrawn"){
      var take = el("button", "primary", "Took it");
      take.disabled = !canWrite();
      take.onclick = function(){ takeVial(v); };
      row.appendChild(take);
      var show = el("button", null, "Show in box");
      show.onclick = function(){ showInBox(v); };
      row.appendChild(show);
    }
    if (row.childNodes.length) card.appendChild(row);
    return card;
  }

  function renderResults(){
    var box = clear($("results"));
    var q = {
      query: filter.query, unitId: filter.unitId,
      passageKind: filter.passageKind, passageMin: filter.passageMin, passageMax: filter.passageMax,
      includeUnknownPassage: filter.includeUnknownPassage,
      frozenFrom: filter.frozenFrom, frozenTo: filter.frozenTo, includeUndated: filter.includeUndated
    };
    var hits = E.search(state, q);

    var head = el("p", "note");
    head.textContent = hits.length + (hits.length === 1 ? " vial" : " vials") +
      (filter.query ? " match “" + filter.query + "”" : " in range");
    box.appendChild(head);

    if (!hits.length){
      box.appendChild(el("div", "empty", state.vials.length
        ? "Nothing here. Try fewer words, or widen a slider."
        : "Nothing imported yet — Settings → Import a spreadsheet."));
      return;
    }
    hits.slice(0, 200).forEach(function(r){ box.appendChild(resultCard(r)); });
    if (hits.length > 200) box.appendChild(el("p", "note", "…and " + (hits.length - 200) + " more. Narrow it down."));
  }

  function takeVial(v){
    var out = E.withdraw(state, v.id, {
      date: new Date().toISOString().slice(0, 10), by: getDevice(), purpose: "thaw",
      ids: ["w-" + Date.now().toString(36)]
    });
    if (out.warnings.length){ showBanner(esc(out.warnings[0])); return; }
    lastWithdrawal = out.state.withdrawals[out.state.withdrawals.length - 1].id;
    state = out.state;
    markDirty("Take out " + v.name);
    renderAll();
    showBanner("Took <b>" + esc(v.name) + "</b> from " + esc(out.freed[0].path) + ".",
      [{ label:"Undo", onClick: function(){ undoTake(lastWithdrawal); } }]);
  }

  function undoTake(id){
    var back = E.undoWithdrawal(state, id);
    if (!back.ok){ showBanner(esc(back.reason)); return; }
    state = back.state;
    markDirty("Put back " + back.vial.name);
    hideBanner();
    renderAll();
  }

  function showInBox(v){
    if (!v.location) return;
    boxView.unitId = v.location.unitId;
    boxView.boxId = v.location.boxId;
    boxView.highlight = [v.location.position];
    go("boxes");
  }

  // =====================================================================
  // Freeze
  // =====================================================================

  var freeze = { name:"", count:5, unitId:null, boxId:null, plan:null };

  function renderFreezeFacets(){
    var box = clear($("fzFacets"));
    var name = freeze.name.trim();
    if (!name){ $("fzLine").textContent = ""; return; }
    var f = E.classify(name, state.rules);
    [["origin","Origin"],["koox","Edit"],["resistance","Resistance"],["caspex","CASPEX"],["guide","Guide"]]
      .forEach(function(pair){
        var key = pair[0], v = f[key];
        if (v === null){
          var gap = el("button", "chip gap", pair[1] + ": no rule");
          gap.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
          box.appendChild(gap);
        } else if (v !== "-"){
          box.appendChild(el("span", "chip on", v));
        }
      });

    var lineId = E.lineIdFor(name, state.rules);
    var existing = E.vialsOfLine(state, lineId);
    if (existing.length){
      var boxes = {};
      existing.forEach(function(v){ if (v.location) boxes[v.location.boxId] = true; });
      var names = Object.keys(boxes).map(function(b){ var f2 = E.findBox(state, b); return f2 ? f2.box.name : b; });
      $("fzLine").textContent = "Already have " + existing.length + " vial" + (existing.length === 1 ? "" : "s") +
        " of this line, in " + names.join(", ") + ".";
    } else {
      $("fzLine").textContent = "New line — nothing like this is stored yet.";
    }
  }

  function renderFreezePlan(){
    var card = clear($("fzPlanCard"));
    var name = freeze.name.trim();
    if (!name){
      card.appendChild(el("p", "note", "Type what you're freezing and this will say which box to put it in."));
      freeze.plan = null;
      return;
    }
    var plan = E.suggestPlacement(state, {
      name: name, count: freeze.count,
      unitId: freeze.unitId || state.settings.defaultUnitId,
      boxId: freeze.boxId || null
    });
    freeze.plan = plan;

    if (!plan.ok){
      var bad = el("p", "note", plan.reason);
      bad.style.color = "var(--bad)";
      card.appendChild(bad);
      return;
    }

    var head = el("div");
    head.style.fontWeight = "650";
    head.style.fontSize = "14px";
    head.textContent = "Put these in " + plan.summary;
    card.appendChild(head);
    card.appendChild(el("p", "note", plan.reason));

    plan.segments.forEach(function(seg){
      card.appendChild(el("div", "occ", seg.path));
      card.appendChild(boxGrid(seg.boxId, { target: seg.positions }));
    });

    var row = el("div", "row tight");
    var override = el("button", null, freeze.boxId ? "Choose a different box" : "Put it somewhere else");
    override.onclick = pickBox;
    row.appendChild(override);
    if (freeze.boxId){
      var auto = el("button", null, "Let it choose");
      auto.onclick = function(){ freeze.boxId = null; renderFreezePlan(); renderFreezeGuard(); };
      row.appendChild(auto);
    }
    card.appendChild(row);
  }

  function pickBox(){
    var body = clear($("dlgBody"));
    $("dlgTitle").textContent = "Which box?";
    E.eachBox(state, function(box, rack, unit){
      var occ = E.occupancy(state, box.id);
      var b = el("button", null, "");
      b.style.width = "100%";
      b.style.textAlign = "left";
      b.style.marginBottom = "6px";
      b.textContent = unit.name + " → " + rack.name + " → " + box.name + "  (" + occ.free + " free)";
      b.disabled = occ.free < freeze.count;
      b.onclick = function(){ freeze.boxId = box.id; $("dlg").close(); renderFreezePlan(); renderFreezeGuard(); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function doFreeze(){
    if (!canWrite()){ showBanner("Read-only — add a GitHub token under Settings → Connect first."); return; }
    var name = freeze.name.trim();
    if (!name){ showBanner("Give it a name first."); return; }
    if (!freeze.plan || !freeze.plan.ok){ showBanner("There's nowhere to put these yet."); return; }

    var ids = [];
    var stamp = Date.now().toString(36);
    for (var i = 0; i < freeze.count; i++) ids.push("v-" + stamp + "-" + i);
    var dateInput = $("fzDate").value;
    var out = E.applyPlacement(state, freeze.plan, {
      name: name,
      passage: $("fzPassage").value.trim(),
      frozenOn: dateInput,
      notes: $("fzNotes").value.trim()
    }, { ids: ids, now: new Date().toISOString(), by: getDevice() });

    var errors = E.errorsOnly(E.validate(out.state));
    if (errors.length){ showBanner("Not doing that: " + esc(errors[0].message)); return; }

    state = out.state;
    markDirty("Freeze " + freeze.count + " × " + name);
    showBanner("Put " + out.vials.length + " × <b>" + esc(name) + "</b> in " + esc(freeze.plan.summary) + ".");
    freeze.boxId = null;
    renderAll();
  }

  // =====================================================================
  // Boxes
  // =====================================================================

  var boxView = { unitId:null, boxId:null, highlight:[] };

  function boxGrid(boxId, opts){
    var o = opts || {};
    var occ = E.occupancy(state, boxId);
    var wrap = el("div");
    if (!occ) return wrap;
    var cols = occ.box.cols, rows = occ.box.rows;
    var grid = el("div", "gridwrap");
    grid.style.gridTemplateColumns = "auto repeat(" + cols + ", minmax(26px, 1fr))";
    grid.appendChild(el("div"));
    for (var c = 0; c < cols; c++) grid.appendChild(el("div", "axis", String(c + 1)));

    for (var r = 0; r < rows; r++){
      grid.appendChild(el("div", "axis r", occ.box.scheme === "linear" ? "" : E.rowLabel(r)));
      for (var c2 = 0; c2 < cols; c2++){
        var slot = occ.slots[r * cols + c2];
        var cell = el("div", "slot" + (slot.vial ? " taken" : ""));
        if (slot.vial){
          cell.style.background = tintFor(slot.vial.lineId || slot.vial.name);
          cell.title = slot.position + " · " + slot.vial.name;
          cell.textContent = slot.vial.name.slice(0, 3);
        } else {
          cell.title = slot.position + " · empty";
          cell.textContent = "";
        }
        if (o.target && o.target.indexOf(slot.position) !== -1) cell.className += " target";
        if (o.highlight && o.highlight.indexOf(slot.position) !== -1) cell.className += " hit";
        if (!o.static){
          (function(s){ cell.onclick = function(){ slotDialog(boxId, s); }; })(slot);
        }
        grid.appendChild(cell);
      }
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function slotDialog(boxId, slot){
    var occ = E.occupancy(state, boxId);
    $("dlgTitle").textContent = occ.box.name + " · " + slot.position;
    var body = clear($("dlgBody"));
    var foot = clear($("dlgFoot"));

    if (!slot.vial){
      body.appendChild(el("p", "note", "This slot is empty."));
      var f = el("button", "primary", "Freeze into this slot");
      f.disabled = !canWrite();
      f.onclick = function(){
        freeze.boxId = boxId; $("dlg").close(); go("freeze");
        $("fzName").focus(); renderFreezePlan();
      };
      foot.appendChild(f);
      $("dlg").showModal();
      return;
    }

    var v = slot.vial;
    body.appendChild(el("div", "nm", v.name));
    var chips = el("div", "chips");
    chips.style.margin = "8px 0";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    body.appendChild(chips);
    body.appendChild(el("p", "note", vialMeta(v)));
    if (v.notes) body.appendChild(el("p", "note", "Notes: " + v.notes));
    if (v.importedFrom) body.appendChild(el("p", "note", "From " + v.importedFrom));

    var take = el("button", "primary", "Took it");
    take.disabled = !canWrite();
    take.onclick = function(){ $("dlg").close(); takeVial(v); };

  function renderBoxes(){
    var units = state.storage.units || [];
    if (!units.length){
      clear($("bxGrid")).appendChild(el("div", "empty", "No freezer set up yet — Settings → Storage."));
      clear($("bxLines"));
      return;
    }
    if (!boxView.unitId || !E.findUnit(state, boxView.unitId)) boxView.unitId = units[0].id;

    var us = clear($("bxUnit"));
    units.forEach(function(u){
      var o = document.createElement("option");
      o.value = u.id; o.textContent = u.name; o.selected = u.id === boxView.unitId;
      us.appendChild(o);
    });

    var bs = clear($("bxBox"));
    var first = null;
    E.eachBox(state, function(box, rack, unit){
      if (unit.id !== boxView.unitId) return;
      if (!first) first = box.id;
      var occ = E.occupancy(state, box.id);
      var o = document.createElement("option");
      o.value = box.id;
      o.textContent = box.name + " — " + occ.used + "/" + occ.capacity;
      bs.appendChild(o);
    });
    if (!boxView.boxId || !E.findBox(state, boxView.boxId) ||
        E.findBox(state, boxView.boxId).unit.id !== boxView.unitId) boxView.boxId = first;
    bs.value = boxView.boxId;

    var g = clear($("bxGrid"));
    if (!boxView.boxId){ g.appendChild(el("div", "empty", "This unit has no boxes yet.")); return; }
    g.appendChild(boxGrid(boxView.boxId, { highlight: boxView.highlight }));

    var occ = E.occupancy(state, boxView.boxId);
    $("bxOcc").textContent = occ.used + " of " + occ.capacity + " slots full · " + occ.free + " free";
    $("bxBar").style.width = (occ.capacity ? (occ.used / occ.capacity * 100) : 0) + "%";

    // What is actually in this box, so the colours mean something.
    var lines = clear($("bxLines"));
    lines.appendChild(el("h3", null, "In this box"));
    var counts = {};
    occ.slots.forEach(function(s){
      if (!s.vial) return;
      var k = s.vial.lineId || s.vial.name;
      if (!counts[k]) counts[k] = { name: s.vial.name, n: 0, positions: [] };
      counts[k].n++;
      counts[k].positions.push(s.position);
    });
    var keys = Object.keys(counts).sort(function(a, b){ return counts[b].n - counts[a].n; });
    if (!keys.length){ lines.appendChild(el("div", "empty", "Empty.")); return; }
    keys.forEach(function(k){
      var c = counts[k];
      var row = el("div", "item");
      var dot = el("div");
      dot.style.cssText = "width:14px;height:14px;border-radius:4px;flex:0 0 auto;margin-top:2px;background:" + tintFor(k);
      row.appendChild(dot);
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, c.name));
      grow.appendChild(el("div", "sub", c.n + " vial" + (c.n === 1 ? "" : "s") + " · " + c.positions.join(", ")));
      row.appendChild(grow);
      lines.appendChild(row);
    });
  }

  // =====================================================================
  // Review -- the queues the import left behind
  // =====================================================================

  function renderReview(){
    var box = clear($("reviewBody"));
    var q = E.reviewQueue(state);

    if (!q.total){
      box.appendChild(el("div", "empty", "Nothing to review. Everything the import wasn't sure about has been answered."));
      return;
    }

    // ---- dates ----
    if (q.dates.length){
      var c = el("div", "card");
      c.appendChild(el("h3", null, "Dates to confirm (" + q.dates.length + ")"));
      c.appendChild(el("p", "note",
        "This column was typed day-month-year, but the spreadsheet read whatever it could as " +
        "month-day and converted it — so these have their day and month the wrong way round. " +
        "Nothing was changed automatically. Until a date is confirmed the vial stays out of the " +
        "date slider, but it is still findable by name."));

      var swappable = q.dates.filter(function(d){ return d.date.proposed; });
      if (swappable.length){
        var all = el("button", "primary", "Accept the swap for all " + swappable.length);
        all.disabled = !canWrite();
        all.onclick = function(){
          var next = state;
          swappable.forEach(function(d){
            var r = E.confirmDate(next, d.vial.id, d.date.proposed);
            if (r.ok) next = r.state;
          });
          state = next;
          markDirty("Confirm " + swappable.length + " dates");
          renderAll();
        };
        c.appendChild(all);
      }

      q.dates.slice(0, 40).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.vial.name));
        var sub = d.vial.frozenRaw
          ? "sheet says " + d.vial.frozenRaw + (d.date.asWritten ? " (reads as " + prettyDate(d.date.asWritten) + ")" : "")
          : "no date at all";
        grow.appendChild(el("div", "sub", sub + " · " + E.locationPath(state, d.vial.location)));
        row.appendChild(grow);

        if (d.date.proposed){
          var b = el("button", null, prettyDate(d.date.proposed));
          b.disabled = !canWrite();
          b.onclick = function(){
            var r = E.confirmDate(state, d.vial.id, d.date.proposed);
            if (!r.ok){ showBanner(esc(r.reason)); return; }
            state = r.state; markDirty("Confirm a date"); renderAll();
          };
          row.appendChild(b);
        } else {
          var t = el("button", null, "Type it");
          t.disabled = !canWrite();
          t.onclick = function(){ askDate(d.vial); };
          row.appendChild(t);
        }
        c.appendChild(row);
      });
      if (q.dates.length > 40) c.appendChild(el("p", "note", "…and " + (q.dates.length - 40) + " more."));
      box.appendChild(c);
    }

    // ---- facets ----
    if (q.facets.length){
      var fc = el("div", "card");
      fc.appendChild(el("h3", null, "Facets the rules read differently (" + q.facets.length + ")"));
      fc.appendChild(el("p", "note",
        "The spreadsheet's own formulas had five bugs. These are the rows where the corrected " +
        "rules disagree with what the sheet wrote. Nothing here needs doing — it's shown so the " +
        "change isn't silent. Dismissing accepts the new reading."));
      q.facets.slice(0, 60).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.name));
        var bits = Object.keys(d.changed).map(function(f){
          return f + ": " + d.changed[f].sheet + " → " + d.changed[f].now;
        });
        grow.appendChild(el("div", "sub", bits.join(" · ")));
        row.appendChild(grow);
        fc.appendChild(row);
      });
      if (q.facets.length > 60) fc.appendChild(el("p", "note", "…and " + (q.facets.length - 60) + " more."));
      var dismiss = el("button", null, "Accept all of these");
      dismiss.disabled = !canWrite();
      dismiss.onclick = function(){
        state.vials.forEach(function(v){ delete v.facetsFromSheet; });
        markDirty("Accept the corrected facets");
        renderAll();
      };
      fc.appendChild(dismiss);
      box.appendChild(fc);
    }

    // ---- gaps ----
    if (q.gaps.length){
      var gc = el("div", "card");
      gc.appendChild(el("h3", null, "Names no rule covers (" + q.gaps.length + ")"));
      gc.appendChild(el("p", "note",
        "The sheet wrote #N/A for these, which reads like a value but isn't one. Add a rule and " +
        "they fill themselves in — that's what Settings → Rules is for."));
      var byName = {};
      q.gaps.forEach(function(g){ byName[g.name] = (byName[g.name] || 0) + 1; });
      Object.keys(byName).sort().forEach(function(n){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", byName[n] + " vial" + (byName[n] === 1 ? "" : "s")));
        row.appendChild(grow);
        gc.appendChild(row);
      });
      var add = el("button", "primary", "Add a rule");
      add.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
      gc.appendChild(add);
      box.appendChild(gc);
    }

    // ---- implausible passages ----
    if (q.passages.length){
      var pc = el("div", "card");
      pc.appendChild(el("h3", null, "Passages that can't be right (" + q.passages.length + ")"));
      pc.appendChild(el("p", "note",
        "A passage in the tens of thousands is a date serial that landed in the wrong column. " +
        "One of these is enough to stretch the passage slider until it's useless."));
      q.passages.forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        grow.appendChild(el("div", "sub", v.passage + " · " + E.locationPath(state, v.location)));
        row.appendChild(grow);
        var b = el("button", null, "Fix");
        b.disabled = !canWrite();
        b.onclick = function(){ askPassage(v); };
        row.appendChild(b);
        pc.appendChild(row);
      });
      box.appendChild(pc);
    }
  }

  function askDate(vial){

    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", vial.frozenRaw ? "The sheet says: " + vial.frozenRaw : "The sheet had nothing here."));

    body.appendChild(inp);
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    ok.onclick = function(){
      if (!inp.value) return;
      var r = E.confirmDate(state, vial.id, inp.value);

  // =====================================================================
  // Settings
  // =====================================================================

  function renderSettings(){
    // ---- connect ----
    var c = clear($("connectCard"));
    c.appendChild(el("h3", null, "Connect"));
    if (canWrite()){
      c.appendChild(el("p", "note", "Connected as " + getDevice() + ". Changes are committed to " + REPO + "."));
      var out = el("button", "danger", "Forget the token on this device");
      out.onclick = function(){
        try { localStorage.removeItem(LS.token); } catch(e){}
        renderAll(); setStatus("Read-only", "");
      };
      c.appendChild(out);
    } else {
      c.appendChild(el("p", "note",
        "Paste a GitHub personal access token with " +
        "Contents: Read and write for " + (REPO || "this repository") + ". It stays on this device."));
      var tok = document.createElement("input");
      tok.type = "password"; tok.placeholder = "github_pat_…"; tok.autocomplete = "off";
      var dev = document.createElement("input");
      dev.placeholder = "What is this device called?";
      dev.value = getDevice() === "unknown device" ? "" : getDevice();
      dev.style.marginTop = "8px";
      c.appendChild(tok); c.appendChild(dev);
      var go2 = el("button", "primary", "Connect");
      go2.style.marginTop = "8px";
      go2.onclick = async function(){
        if (!tok.value.trim()) return;
        go2.disabled = true;
        try {
          var r = await fetch(API + "/contents/" + DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
            { headers: { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
                         "Authorization":"Bearer " + tok.value.trim() } });
          if (!r.ok && r.status !== 404) throw new Error("GitHub said " + r.status);
          localStorage.setItem(LS.token, tok.value.trim());
          localStorage.setItem(LS.device, dev.value.trim() || "a device");
          hideBanner();
          await load();
        } catch(err){
          showBanner("That token didn't work: " + esc(err.message));
        }
        go2.disabled = false;
      };
      c.appendChild(go2);
    }
    var theme = el("button", null, "Switch theme");
    theme.style.marginTop = "8px";
    theme.onclick = function(){
      var now = document.documentElement.getAttribute("data-theme");
      var next = now === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem(LS.theme, next); } catch(e){}
    };
    c.appendChild(theme);

    // ---- storage ----
    var s = clear($("storageCard"));
    s.appendChild(el("h3", null, "Storage"));
    s.appendChild(el("p", "note",
      "A freezer and a nitrogen tank are the same shape here — a unit, its racks or towers, and " +
      "boxes with a grid. Nothing about 9×9 is built in."));
    (state.storage.units || []).forEach(function(unit){
      var head = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, unit.name));
      var sum = E.unitSummary(state, unit.id);
      grow.appendChild(el("div", "sub", sum.used + " of " + sum.capacity + " slots full · " +
        sum.boxes.length + " boxes · " + (unit.childLabel || "Rack") + "s"));
      head.appendChild(grow);
      s.appendChild(head);
      (unit.racks || []).forEach(function(rack){
        (rack.boxes || []).forEach(function(box){
          var occ = E.occupancy(state, box.id);
          var row = el("div", "item");
          var g2 = el("div", "grow");
          g2.appendChild(el("div", null, "　" + rack.name + " → " + box.name));
          g2.appendChild(el("div", "sub", box.rows + " × " + box.cols + " · " + occ.used + "/" + occ.capacity));
          row.appendChild(g2);
          var ren = el("button", null, "Rename");
          ren.disabled = !canWrite();
          ren.onclick = function(){ renameBox(box); };
          row.appendChild(ren);
          var res = el("button", null, "Resize");
          res.disabled = !canWrite();
          res.onclick = function(){ resizeBox(box); };
          row.appendChild(res);
          s.appendChild(row);
        });
      });
    });
    var addBox = el("button", null, "Add a box");
    addBox.disabled = !canWrite() || !(state.storage.units || []).length;
    addBox.onclick = function(){ addBoxDialog(); };
    var addUnit = el("button", null, "Add a freezer or tank");
    addUnit.disabled = !canWrite();
    addUnit.onclick = function(){ addUnitDialog(); };
    var row2 = el("div", "row tight");
    row2.appendChild(addBox); row2.appendChild(addUnit);
    s.appendChild(row2);

    // ---- rules ----
    var r2 = clear($("rulesCard"));
    r2.appendChild(el("h3", null, "Rules"));
    r2.appendChild(el("p", "note",
      "In the spreadsheet, the cell name is the only thing typed — origin, KO/OX, resistance, " +
      "CASPEX and guide are all formulas over that one string. These are those formulas. " +
      "Adding a common label here is all it takes; nothing is built into the app."));
    E.FACETS.forEach(function(facet){
      var list = state.rules[facet] || [];
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, facet));
      grow.appendChild(el("div", "sub mono", list.map(function(rule){
        if (rule.extract) return "/" + rule.extract + "/";
        if (rule.match !== undefined) return rule.match + " → " + rule.value;
        return "else " + rule.value;
      }).join("   ")));
      row.appendChild(grow);
      var add = el("button", null, "Add");
      add.disabled = !canWrite();
      add.onclick = function(){ addRuleDialog(facet); };
      row.appendChild(add);
      r2.appendChild(row);
    });

    // ---- import ----
    var i = clear($("importCard"));
    i.appendChild(el("h3", null, "Import a spreadsheet"));
    i.appendChild(el("p", "note",
      "Reads an .xlsx in the browser. It shows what it found before anything is written, and it " +
      "replaces the whole inventory rather than merging — so use it to start, not to top up."));
    var pick = el("button", null, "Choose a file");
    pick.disabled = !canWrite();
    pick.onclick = openImport;
    i.appendChild(pick);

    var dl = el("button", null, "Download the workbook");
    dl.style.marginTop = "8px";
    dl.onclick = async function(){
      var blob = new Blob([await workbookBytes()],
        { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cell-stocks.xlsx";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    };
    i.appendChild(dl);
    i.appendChild(el("p", "note",
      "The workbook is written from this inventory every time it's saved, so the two can't drift. " +
      "That also means editing it by hand is pointless — the next save overwrites it."));

    // ---- check ----
    var ch = clear($("checkCard"));
    ch.appendChild(el("h3", null, "Check it"));
    var problems = E.validate(state);
    var errs = problems.filter(function(p){ return p.level === "error"; });
    var line = el("p", "note");
    line.textContent = state.vials.length + " vials · " + state.lines.length + " lines · " +
      errs.length + " errors · " + (problems.length - errs.length) + " warnings";
    ch.appendChild(line);
    problems.slice(0, 30).forEach(function(p){
      ch.appendChild(el("div", "prob " + p.level, p.message));
    });
    if (problems.length > 30) ch.appendChild(el("p", "note", "…and " + (problems.length - 30) + " more."));
    if (!problems.length) ch.appendChild(el("p", "note", "Nothing wrong: no slot holds two vials, every position is inside its box."));
  }

    inp.value = box.name;

    ok.onclick = function(){
      if (!inp.value.trim()) return;

  function resizeBox(box){
    $("dlgTitle").textContent = "Resize " + box.name;
    var body = clear($("dlgBody"));
    var rows = document.createElement("input"); rows.type = "number"; rows.min = 1; rows.value = box.rows;
    var cols = document.createElement("input"); cols.type = "number"; cols.min = 1; cols.value = box.cols;
    var g = el("div", "two");
    var f1 = el("div", "field"); f1.appendChild(el("label", null, "Rows")); f1.appendChild(rows);

    body.appendChild(msg);

      var can = E.canResizeBox(state, box.id, Number(rows.value), Number(cols.value));
      if (!can.ok){ msg.textContent = can.reason; msg.style.color = "var(--bad)"; return; }
      box.rows = Number(rows.value); box.cols = Number(cols.value);
