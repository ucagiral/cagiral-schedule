<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAApp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<style>
  /* The accent is cold cyan, for a freezer. The greys are the same neutral ramp the
     other apps on this host use, so nothing here looks foreign next to them. */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#d8dce1; --text:#1f2430; --muted:#6b7280;
    --accent:#0891b2; --accent-soft:#cffafe;
    --warn-bg:#fff7ed; --warn-border:#fde68a; --warn-text:#7c2d12;
    --ok:#15803d; --bad:#b91c1c; --guess:#a16207; --guess-bg:#fef9c3;
    --card:#ffffff; --slot:#eef1f5;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  /* Dark mode drops the cyan accent entirely -- gray/black/white only, per Umut's
     request ("akşamları da beyaz siyah ama mavi tamamen denklemden çıksın"). Light
     mode is untouched. */
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#14161a; --panel:#1c1f26; --border:#2c3038; --text:#e6e8eb; --muted:#9aa1ac;
      --accent:#6b7280; --accent-soft:#2c3038;
      --warn-bg:#2a2210; --warn-border:#5c4a16; --warn-text:#fcd9a8;
      --ok:#4ade80; --bad:#f87171; --guess:#fbbf24; --guess-bg:#3a2f0b;
      --card:#1c1f26; --slot:#232830;
    }
  }
  html[data-theme="dark"]{
    --bg:#14161a; --panel:#1c1f26; --border:#2c3038; --text:#e6e8eb; --muted:#9aa1ac;
    --accent:#6b7280; --accent-soft:#2c3038;
    --warn-bg:#2a2210; --warn-border:#5c4a16; --warn-text:#fcd9a8;
    --ok:#4ade80; --bad:#f87171; --guess:#fbbf24; --guess-bg:#3a2f0b;
    --card:#1c1f26; --slot:#232830;
  }

  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:contain; height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column; min-height:100%;
  }
  button{
    font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; color:var(--text);
  }
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.45; cursor:not-allowed}
  input,select,textarea{
    font:inherit; padding:7px 9px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); width:100%;
  }
  a{color:var(--accent)}

  header{
    display:flex; align-items:center; gap:8px; padding:calc(8px + var(--safe-t)) 12px 8px;
    background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  /* iOS translucency where the browser supports it; @supports keeps the solid
     var(--panel) fill (already set above) as the fallback everywhere else. */
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    header,nav{
      background:color-mix(in srgb, var(--panel) 82%, transparent);
      -webkit-backdrop-filter:saturate(180%) blur(14px);
      backdrop-filter:saturate(180%) blur(14px);
    }
  }
  header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em}
  .brand-mark{width:22px; height:22px; border-radius:6px; flex:0 0 auto}
  footer{
    padding:14px 12px calc(14px + var(--safe-b)); text-align:center; font-size:11.5px;
    color:var(--muted); border-top:1px solid var(--border);
  }
  #status{font-size:12px; color:var(--muted); margin-left:auto; text-align:right}
  #status.saving{color:var(--accent)} #status.saved{color:var(--ok)} #status.error{color:var(--bad)}

  .banner{
    padding:9px 12px; font-size:13px; background:var(--warn-bg); color:var(--warn-text);
    border-bottom:1px solid var(--warn-border); display:none; line-height:1.5;
  }
  .banner.show{display:block}
  .banner button{margin-left:8px; padding:3px 9px; font-size:12px}
  .banner code{background:rgba(0,0,0,.08); padding:1px 4px; border-radius:4px}

  main{flex:1; padding:12px; padding-bottom:calc(74px + var(--safe-b)); max-width:760px; width:100%; margin:0 auto}
  .screen{display:none} .screen.active{display:block}

  /* Logging in is mandatory: nothing about anyone's inventory renders until someone is
     identified. See afterAuthChange() -- this class is the only thing that toggles it. */
  .gate{display:none}
  body.gated main, body.gated nav{display:none}
  body.gated .gate{display:block; padding:12px; max-width:520px; width:100%; margin:0 auto}

  nav{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--panel);
    border-top:1px solid var(--border); padding-bottom:var(--safe-b); z-index:20;
  }
  nav button{
    flex:1; border:0; border-radius:0; background:none; padding:9px 2px 10px; position:relative;
    font-size:10.5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  /* Without this, `nav button{display:flex}` above always wins over the browser's own
     [hidden]{display:none} default (an author rule beats a UA one regardless of
     specificity) -- so a hidden nav button, like #navAdmin for anyone who isn't admin,
     silently stayed visible. */
  nav button[hidden]{display:none}
  nav button .ic{font-size:17px; line-height:1}
  nav button.on{color:var(--accent); font-weight:650}
  nav button .dot{
    position:absolute; top:6px; left:50%; transform:translateX(9px);
    min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--accent);
    color:#fff; font-size:9.5px; line-height:15px; font-weight:700;
  }

  h2{font-size:16px; margin:0 0 10px; font-weight:650}
  h3{font-size:13px; margin:18px 0 8px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  p.note{font-size:12.5px; color:var(--muted); line-height:1.55; margin:8px 0}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .row.tight{gap:6px; margin-top:6px}
  .row > button{flex:1; min-width:110px}
  .field{margin-top:10px}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

  /* One vial is the common case, so the field starts at 1 and the two buttons do the
     rest. They are 44px so a thumb hits them, and the number stays typeable for the
     rare "I froze twelve". */
  .stepper{display:flex; align-items:stretch; gap:6px}
  .stepper button{
    flex:0 0 44px; width:44px; font-size:19px; line-height:1; font-weight:600;
    padding:0; display:flex; align-items:center; justify-content:center;
  }
  .stepper input{
    flex:1; min-width:0; text-align:center; font-variant-numeric:tabular-nums;
    font-size:16px; font-weight:600;
  }
  /* The spinners duplicate the buttons and shrink the tap target. */
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .stepper input[type=number]{-moz-appearance:textfield; appearance:textfield}

  /* ---- chips ---- */
  .chips{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
  .chip{
    font-size:11px; padding:2px 8px; border-radius:99px; background:var(--slot);
    border:1px solid var(--border); color:var(--muted); white-space:nowrap;
  }
  .chip.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:650}
  .chip.guess{background:var(--guess-bg); color:var(--guess); border-color:var(--guess)}
  .chip.gap{background:var(--warn-bg); color:var(--warn-text); border-color:var(--warn-border); font-weight:650}
  button.chip{cursor:pointer; padding:3px 9px}

  /* ---- search ---- */
  #q{font-size:16px; padding:10px 12px}
  .filters{margin-top:12px}
  .flt{margin-top:14px}
  .flt .hd{display:flex; align-items:baseline; gap:8px; font-size:12px; margin-bottom:2px}
  .flt .hd b{font-size:12px; font-weight:650}
  .flt .hd .val{color:var(--accent); font-weight:650; margin-left:auto; font-variant-numeric:tabular-nums}
  .flt .sub{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5}

  /* Two range inputs stacked into one dual-handle slider. The track is drawn by the
     divs; the inputs are transparent and only their thumbs take pointer events, so
     whichever handle is nearer the touch is the one that moves. */
  .dual{position:relative; height:30px; margin-top:6px}
  .dual .track,.dual .fill{position:absolute; top:13px; height:4px; border-radius:99px}
  .dual .track{left:0; right:0; background:var(--border)}
  .dual .fill{background:var(--accent)}
  .dual input[type=range]{
    position:absolute; left:0; top:0; width:100%; height:30px; margin:0; padding:0;
    -webkit-appearance:none; appearance:none; background:none; pointer-events:none;
  }
  .dual input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; pointer-events:auto; width:22px; height:22px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); cursor:grab;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .dual input[type=range]::-moz-range-thumb{
    pointer-events:auto; width:20px; height:20px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); cursor:grab;
  }
  .dual input[type=range]::-moz-range-track{background:none; border:0}

  .seg{display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden}
  .seg button{
    flex:1; border:0; border-radius:0; font-size:12px; padding:6px 4px; background:var(--panel);
    border-right:1px solid var(--border); color:var(--muted);
  }
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent-soft); color:var(--accent); font-weight:650}

  .toggle{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:8px}
  /* An iOS-style pill switch, drawn entirely from the checkbox itself -- no extra
     markup, so every existing <label class="toggle"><input type=checkbox> keeps
     working unchanged. */
  .toggle input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:38px; height:23px; min-width:38px;
    border-radius:99px; background:var(--border); border:none; position:relative;
    cursor:pointer; transition:background-color .15s ease;
  }
  .toggle input[type=checkbox]::before{
    content:""; position:absolute; top:2px; left:2px; width:19px; height:19px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .15s ease;
  }
  .toggle input[type=checkbox]:checked{background:var(--ok)}
  .toggle input[type=checkbox]:checked::before{transform:translateX(15px)}

  /* ---- results ---- */
  .res{
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:12px; padding:11px 12px; margin-bottom:9px;
  }
  .res .nm{font-weight:650; font-size:14px; line-height:1.35; word-break:break-word}
  .res .where{font-size:13px; margin-top:5px; font-weight:600}
  .res .where .pos{
    background:var(--accent-soft); color:var(--accent); border-radius:6px;
    padding:1px 7px; font-weight:700; margin-left:4px;
  }
  .res .meta{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5}
  .res .miss{font-size:11.5px; color:var(--guess); margin-top:4px}
  .res.gone{border-left-color:var(--muted); opacity:.72}

  /* ---- box grid ---- */
  .boxgrid{display:grid; gap:3px; margin-top:10px; overflow-x:auto}
  .slot{
    aspect-ratio:1; border-radius:5px; background:var(--slot); border:1px solid transparent;
    font-size:9px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer; overflow:hidden; min-width:26px;
  }
  .slot.taken{border-color:rgba(0,0,0,.10); color:#10151c; font-weight:650}
  .slot.target{outline:2.5px solid var(--accent); outline-offset:-1px; background:var(--accent-soft)}
  .slot.hit{outline:2.5px solid var(--bad); outline-offset:-1px}
  .gridwrap{display:grid; gap:3px; align-items:center}
  .axis{font-size:9.5px; color:var(--muted); text-align:center}
  .axis.r{text-align:right; padding-right:3px}

  .occ{font-size:12px; color:var(--muted); margin-top:8px}
  .bar{height:5px; border-radius:99px; background:var(--border); margin-top:6px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent)}

  /* ---- lists ---- */
  .item{
    display:flex; gap:10px; align-items:flex-start; padding:9px 0;
    border-bottom:1px solid var(--border); font-size:13px;
  }
  .item:last-child{border-bottom:0}
  .item .grow{flex:1; min-width:0}
  .item .sub{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.5}
  .item button{padding:4px 9px; font-size:11.5px; white-space:nowrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px}
  .strike{text-decoration:line-through; color:var(--muted)}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:26px 10px; line-height:1.6}
  .prob{font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); line-height:1.5}
  .prob.error{color:var(--bad)} .prob.warning{color:var(--guess)}

  dialog{
    border:1px solid var(--border); border-radius:16px; padding:0; background:var(--panel);
    color:var(--text); max-width:520px; width:calc(100% - 24px); max-height:84vh;
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-head{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border)}
  .dlg-head h3{margin:0; text-transform:none; letter-spacing:0; font-size:14px; color:var(--text)}
  .dlg-body{padding:14px; overflow:auto; max-height:60vh}
  .dlg-foot{padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
  .dlg-foot button{flex:1; min-width:100px}
</style>
</head>
<body>

<header>
  <img src="icon-192.png" alt="" class="brand-mark">
  <h1>CAApp</h1>
  <span id="status">Loading…</span>
</header>
<div class="banner" id="banner"></div>

<div class="gate" id="authGate">
  <h2>Log in</h2>
  <p class="note">CAApp is lab-wide now — nothing shows until you're identified, so no
    one sees anyone's boxes by just opening the page.</p>
  <div class="card" id="gateBody"></div>
</div>

<main>
  <section class="screen active" id="s-find">
    <input id="q" type="search" placeholder="hela p12 caspex g5.1 …" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="filters" id="filters"></div>
    <div id="results"></div>
  </section>

  <section class="screen" id="s-freeze">
    <h2>Freeze</h2>
    <div class="card">
      <div class="field">
        <label for="fzName">What are you freezing?</label>
        <input id="fzName" placeholder="DuDtxR CASPEX g5.1" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="chips" id="fzFacets" style="margin-top:9px"></div>
      <p class="note" id="fzLine"></p>
      <div class="two">
        <div class="field">
          <label for="fzCount">How many vials?</label>
          <div class="stepper">
            <button type="button" id="fzMinus" aria-label="One fewer vial">−</button>
            <input id="fzCount" type="number" min="1" max="81" step="1" value="1" inputmode="numeric">
            <button type="button" id="fzPlus" aria-label="One more vial">+</button>
          </div>
        </div>
        <div class="field"><label for="fzUnit">Where</label><select id="fzUnit"></select></div>
      </div>
    </div>
    <div class="card" id="fzPlanCard"></div>
    <div class="card">
      <div class="two">
        <div class="field"><label for="fzPassage">Passage</label><input id="fzPassage" placeholder="p12 or p+3" autocomplete="off"></div>
        <div class="field"><label for="fzDate">Date frozen</label><input id="fzDate" type="date"></div>
      </div>
      <div class="field"><label for="fzNotes">Notes</label><input id="fzNotes" placeholder="myco -" autocomplete="off"></div>
      <div class="row"><button class="primary" id="fzGo">Put them in</button></div>
      <p class="note" id="fzWhyNot"></p>
    </div>
  </section>

  <section class="screen" id="s-boxes">
    <h2>Boxes</h2>
    <div class="card">
      <div class="field" id="bxOwnerField" hidden><label for="bxOwner">Whose</label><select id="bxOwner"></select></div>
      <div class="two">
        <div class="field"><label for="bxUnit">Unit</label><select id="bxUnit"></select></div>
        <div class="field"><label for="bxBox">Box</label><select id="bxBox"></select></div>
      </div>
      <div id="bxGrid"></div>
      <div class="occ" id="bxOcc"></div>
      <div class="bar"><i id="bxBar"></i></div>
    </div>
    <div class="card" id="bxLines"></div>
  </section>

  <section class="screen" id="s-review">
    <h2>Review</h2>
    <div id="reviewBody"></div>
  </section>

  <section class="screen" id="s-log">
    <h2>Taken out</h2>
    <div class="card" id="logBody"></div>
    <div class="card" id="stockBody"></div>
  </section>

  <section class="screen" id="s-admin">
    <h2>Admin</h2>
    <div class="seg" id="adminTabs">
      <button data-admintab="manage" class="on">Manage a box</button>
      <button data-admintab="users">Users</button>
      <button data-admintab="requests">Requests</button>
      <button data-admintab="messages">Messages</button>
      <button data-admintab="history">History &amp; export</button>
      <button data-admintab="handoff">Handoff</button>
    </div>
    <div id="admin-manage" class="card"></div>
    <div id="admin-users" class="card" hidden></div>
    <div id="admin-requests" class="card" hidden></div>
    <div id="admin-messages" class="card" hidden></div>
    <div id="admin-history" class="card" hidden></div>
    <div id="admin-handoff" class="card" hidden></div>
  </section>

  <section class="screen" id="s-settings">
    <h2>Settings</h2>
    <div class="card" id="connectCard"></div>
    <div class="card" id="notificationsCard"></div>
    <div class="card" id="storageCard"></div>
    <div class="card" id="rulesCard"></div>
    <div class="card" id="keywordsCard"></div>
    <div class="card" id="importCard"></div>
    <div class="card" id="checkCard"></div>
  </section>

  <footer id="appFooter"></footer>
</main>

<nav>
  <button data-screen="find"><span class="ic">🔍</span>Find</button>
  <button data-screen="freeze" id="navFreeze"><span class="ic">❄️</span>Freeze</button>
  <button data-screen="boxes"><span class="ic">🧊</span>Boxes</button>
  <button data-screen="review"><span class="ic">📋</span>Review</button>
  <button data-screen="log"><span class="ic">🗂️</span>Log</button>
  <button data-screen="admin" id="navAdmin" hidden><span class="ic">🛠️</span>Admin</button>
  <button data-screen="settings"><span class="ic">⚙️</span>Settings</button>
</nav>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button id="dlgX" style="margin-left:auto">Close</button></div>
  <div class="dlg-body" id="dlgBody"></div>
  <div class="dlg-foot" id="dlgFoot"></div>
</dialog>

<script src="xlsx.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  "use strict";
  var E = window.CellStocksEngine;
  var X = window.XlsxLite;

  // This app's own storage, all of it. Nothing here is shared with anything else on
  // the host: its own token, its own device name, its own theme, its own offline
  // copy. That costs pasting a token once more on each device, and buys the app
  // being genuinely separate rather than separate-looking.
  var LS = { token:"cst_token", device:"cst_device", theme:"cst_theme", cachePrefix:"cst_cache:", cfg:"cst_cfg",
             workerUrl:"cst_worker_url", workerToken:"cst_worker_token", workerUser:"cst_worker_user" };
  var LEGACY_DATA_PATH = "cellstocks/cellstocks.json";
  var LEGACY_XLSX_PATH = "cellstocks/cell-stocks.xlsx";
  var DATA_PREFIX = "cellstocks/data/";

  function resolveConfig(){
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(LS.cfg) || "null"); } catch(e){}
    if (stored && stored.owner && stored.repo) return stored;
    var host = location.hostname || "";
    var m = host.match(/^([^.]+)\.github\.io$/i);
    var seg = location.pathname.split("/").filter(Boolean);
    if (m) return { owner: m[1], repo: seg.length ? seg[0] : (m[1] + ".github.io"), branch: "main" };
    return { owner:null, repo:null, branch:"main" };
  }
  var CFG = resolveConfig();
  var REPO = CFG.owner ? CFG.owner + "/" + CFG.repo : null;
  var API = REPO ? "https://api.github.com/repos/" + REPO : null;

  function getToken(){ try { return localStorage.getItem(LS.token) || null; } catch(e){ return null; } }
  function getDevice(){ try { return localStorage.getItem(LS.device) || "unknown device"; } catch(e){ return "unknown device"; } }

  // ---- worker auth (lab-wide login) -----------------------------------------------
  // Additive, alongside the GitHub-token flow above: whichever is present makes
  // canWrite() true. Reads never need the worker (the repo is public, so an
  // unauthenticated raw fetch always works) -- only a write needs an opinion about who
  // is allowed to make it, so only save() and the login/logout calls below ever talk
  // to the worker. See cellstocks-worker/README.md for what it does and why.
  function getWorkerUrl(){ try { return localStorage.getItem(LS.workerUrl) || null; } catch(e){ return null; } }
  function getWorkerToken(){ try { return localStorage.getItem(LS.workerToken) || null; } catch(e){ return null; } }
  function getWorkerUser(){ try { return JSON.parse(localStorage.getItem(LS.workerUser) || "null"); } catch(e){ return null; } }
  function workerBase(url){ return String(url || "").replace(/\/+$/, ""); }

  // ---- admin ------------------------------------------------------------------------
  // Admin never impersonates a member to see or change their boxes (that mechanism --
  // "act as", pointing this account's own screens at someone else's file -- is gone).
  // Admin sees every member's inventory merged, read-only, on Find/Boxes/Review/Log
  // (see renderMergedByOwner() and each screen's own admin branch), and makes any actual
  // change through the admin-only "Manage a box" tool, which always writes to the real
  // member's own file directly. effectiveIdentity() is just whoever is logged in --
  // admin's own file, which normally has nothing in it, same as anyone else's.
  function isAdminUser(){ var wu = getWorkerUser(); return !!wu && wu.role === "admin"; }
  function effectiveIdentity(){
    var u = getWorkerUser();
    return u ? u.name : null;
  }

  function dataPath(){
    var name = effectiveIdentity();
    return name ? DATA_PREFIX + name.toLowerCase() + ".json" : LEGACY_DATA_PATH;
  }
  function xlsxPath(){
    var name = effectiveIdentity();
    return name ? DATA_PREFIX + name.toLowerCase() + ".xlsx" : LEGACY_XLSX_PATH;
  }

  async function workerFetch(path, opts){
    var url = workerBase(getWorkerUrl()) + path;
    var headers = Object.assign({ "Content-Type":"application/json" }, (opts && opts.headers) || {});
    var r = await fetch(url, Object.assign({}, opts || {}, { headers: headers }));
    var body = {};
    try { body = await r.json(); } catch(e){}
    if (!r.ok){
      var err = new Error(body.error || ("Worker said " + r.status));
      err.status = r.status;
      throw err;
    }
    return body;
  }

  async function workerLogin(url, name, password){
    var base = workerBase(url);
    var res = await fetch(base + "/login", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:name, password:password })
    });
    var body = {};
    try { body = await res.json(); } catch(e){}
    if (!res.ok) throw new Error(body.error || ("Worker said " + res.status));
    try {
      localStorage.setItem(LS.workerUrl, base);
      localStorage.setItem(LS.workerToken, body.token);
      localStorage.setItem(LS.workerUser, JSON.stringify(body.user));
    } catch(e){}
    notifications = null; // a fresh login re-fetches rather than showing a stale list
    messagesCache = null;
  }

  async function workerLogout(){
    var token = getWorkerToken();
    if (token){
      try { await workerFetch("/logout", { method:"POST", headers:{ Authorization:"Bearer " + token } }); } catch(e){}
    }
    try { localStorage.removeItem(LS.workerToken); localStorage.removeItem(LS.workerUser); } catch(e){}
    notifications = null;
    // Nothing about the account that was just logged out should linger on screen while this
    // device sits read-only waiting for the next login.
    state = E.blankState();
  }

  async function workerCommit(files, message){
    return workerFetch("/commit", {
      method:"POST",
      headers:{ Authorization:"Bearer " + getWorkerToken() },
      body: JSON.stringify({ files:files, message:message })
    });
  }

  function canWrite(){ return !!(getWorkerToken() && getWorkerUrl()) || !!(getToken() && API); }

  // A brand-new worker login with nothing imported yet. Scoped to worker auth only --
  // the classic GitHub-token flow already has its own long-standing empty-state message
  // (Settings -> Stock: "Nothing imported yet"), so this isn't shown twice. Never true for
  // admin: their own file is normally empty by design (they have no inventory of their
  // own -- see the Admin tab's "Manage a box" instead), not a fresh account to prompt an
  // import into.
  function isFreshAccount(){
    return !isAdminUser() && !!effectiveIdentity() &&
      !(state.storage.units || []).length && !(state.vials || []).length;
  }
  function ghHeaders(){
    var h = { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
    var t = getToken();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }
  function rawURL(path){
    return "https://raw.githubusercontent.com/" + REPO + "/" + (CFG.branch||"main") + "/" + path + "?t=" + Date.now();
  }

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function esc(s){
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); return node; }
  function setStatus(text, cls){ $("status").textContent = text; $("status").className = cls || ""; }

  var bannerTimer = null;
  function showBanner(html, actions){
    var b = $("banner");
    b.innerHTML = html;
    (actions||[]).forEach(function(a){
      var btn = el("button", null, a.label);
      btn.onclick = a.onClick;
      b.appendChild(btn);
    });
    b.classList.add("show");
    clearTimeout(bannerTimer);
    if (!actions || !actions.length) bannerTimer = setTimeout(hideBanner, 9000);
  }
  function hideBanner(){ $("banner").classList.remove("show"); }

  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str), out = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }
  function base64ToUtf8(b64){
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function bytesToBase64(bytes){
    var out = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }

  // =====================================================================
  // State
  // =====================================================================

  var state = E.blankState();
  var dirty = false;
  var lastWithdrawal = null;     // for the 10-second undo in the status line

  // Set for the exact duration of building one member's section inside a merged,
  // admin-only view of Find/Boxes/Review/Log (see renderMergedByOwner below) -- every
  // button these screens create checks it, so nothing rendered while it's true can ever
  // trigger a write. It is always false again before control returns to the browser's
  // event loop, so a click can never observe it true.
  var ADMIN_MERGED = false;

  // Builds Review's or Log's whole screen for admin: every member with something to
  // show gets a heading and their own section, built by swapping the real, module-level
  // `state` to that member's own real data for exactly as long as perOwnerFn runs --
  // never a synthetic combined state, so each member's own rules and ids are used
  // correctly. perOwnerFn(container) returns true if it drew anything.
  function renderMergedByOwner(container, rerenderFn, perOwnerFn, emptyMessage){
    if (!labCache.members){
      container.appendChild(el("div", "empty", "Loading the lab…"));
      ensureLabCache().then(rerenderFn);
      return;
    }
    var real = state;
    ADMIN_MERGED = true;
    var any = false;
    labCache.members.slice().sort().forEach(function(name){
      var s = labCache.data[name];
      if (!s) return;
      state = s;
      var section = el("div");
      var wrote;
      try { wrote = perOwnerFn(section); } finally { state = real; }
      if (wrote){
        any = true;
        var head = el("div", null, name);
        head.style.cssText = "font-weight:700;font-size:15px;margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--border);";
        container.appendChild(head);
        container.appendChild(section);
      }
    });
    ADMIN_MERGED = false;
    if (!any) container.appendChild(el("div", "empty", emptyMessage));
  }

  // One device can log into more than one worker account over time (an admin trying out a
  // teammate's login, a shared lab laptop). The offline cache has to be keyed per account, or a
  // network hiccup after switching accounts would silently hand back whoever logged in earlier.
  function cacheKey(){
    var name = effectiveIdentity();
    return LS.cachePrefix + (name ? name.toLowerCase() : "legacy");
  }
  function cacheSave(){
    try { localStorage.setItem(cacheKey(), JSON.stringify({ at: Date.now(), state: state })); } catch(e){}
  }
  function cacheLoad(){
    try {
      var c = JSON.parse(localStorage.getItem(cacheKey()) || "null");
      if (c && c.state){ state = E.mergeDefaults(c.state); return c.at; }
    } catch(e){}
    return null;
  }

  async function load(){
    if (!REPO){
      setStatus("Open from GitHub Pages", "error");
      showBanner("This app works out which repository it belongs to from its own address, so it has to be " +
                 "opened from GitHub Pages rather than from a file on disk.");
      return;
    }
    try {
      var text = null;
      // A worker login never needs the token-authenticated read below -- the repo is
      // public, so an unauthenticated raw fetch of the account's own data path always
      // works. Only save() ever talks to the worker.
      if (getToken()){
        var r = await fetch(API + "/contents/" + LEGACY_DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
                            { headers: ghHeaders(), cache:"no-store" });
        if (r.status === 404) text = null;
        else if (!r.ok) throw new Error("GitHub said " + r.status);
        else { var j = await r.json(); text = base64ToUtf8(j.content || ""); }
      } else {
        var resp = await fetch(rawURL(dataPath()), { cache:"no-store" });
        text = resp.ok ? await resp.text() : null;
      }
      // A miss (404, or no token/legacy file yet) means this account has nothing saved yet --
      // that must render as a blank inventory, never as whatever the previously-active account
      // (or a stale in-memory state left over from before a worker login/logout) happened to be.
      state = (text !== null && text !== undefined) ? E.mergeDefaults(JSON.parse(text)) : E.blankState();
      cacheSave();
      setStatus(canWrite() ? "Ready" : "Read-only", "");
      if (!canWrite()){
        showBanner("Read-only: nothing can be frozen or taken out until this device is connected. " +
                   "Log in, or add a GitHub token, under Settings → Connect.");
      } else if (isFreshAccount()){
        // A worker login with no file yet (text stayed null, a 404) or one that loaded
        // an empty inventory look the same to whoever is looking at the screen -- both
        // just mean "nothing here to import into yet". importSheet() builds its own
        // boxes straight from the spreadsheet's own box column (see engine.js), so
        // there is nothing to set up by hand first unless someone wants to.
        var idName = effectiveIdentity();
        showBanner("Welcome" + (idName ? ", " + esc(idName) : "") + " — nothing imported yet.",
          [{ label:"Import a spreadsheet", onClick: function(){ hideBanner(); go("settings"); openImport(); } }]);
      }
    } catch(err){
      var at = cacheLoad();
      setStatus("Offline", "error");
      showBanner("Couldn't reach GitHub — showing the last copy this device downloaded" +
                 (at ? " (" + esc(new Date(at).toLocaleString()) + ")" : "") +
                 ". Nothing can be saved until it's back.");
    }
    renderAll();
  }

  // =====================================================================
  // Saving -- the JSON and the workbook, in ONE commit
  //
  // The .xlsx is generated from the JSON every time, so the two can never drift.
  // That is also why this uses the git data API rather than the contents API: two
  // files have to land together, or there is a moment where the workbook describes
  // an inventory that no longer exists.
  // =====================================================================

  async function gh(path, opts){
    var r = await fetch(API + path, Object.assign({ headers: ghHeaders() }, opts || {}));
    if (!r.ok){
      var body = "";
      try { body = (await r.json()).message || ""; } catch(e){}
      var err = new Error("GitHub " + r.status + (body ? ": " + body : ""));
      err.status = r.status;
      throw err;
    }
    return r.json();
  }

  async function commitFiles(files, message){
    var branch = CFG.branch || "main";
    var ref = await gh("/git/ref/heads/" + branch);
    var baseSha = ref.object.sha;
    var baseCommit = await gh("/git/commits/" + baseSha);
    var tree = [];
    for (var i = 0; i < files.length; i++){
      var f = files[i];
      var blob = await gh("/git/blobs", { method:"POST",
        body: JSON.stringify(f.base64 ? { content:f.base64, encoding:"base64" } : { content:f.text, encoding:"utf-8" }) });
      tree.push({ path:f.path, mode:"100644", type:"blob", sha:blob.sha });
    }
    var newTree = await gh("/git/trees", { method:"POST",
      body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree: tree }) });
    var commit = await gh("/git/commits", { method:"POST",
      body: JSON.stringify({ message: message, tree: newTree.sha, parents: [baseSha] }) });
    await gh("/git/refs/heads/" + branch, { method:"PATCH", body: JSON.stringify({ sha: commit.sha }) });
    return commit.sha;
  }

  // Deflated, not stored: the same workbook is eight times larger uncompressed and
  // it is uploaded on every save.
  function workbookBytes(){ return X.writeWorkbookAsync(E.vialsToSheets(state)); }

  var saveTimer = null;
  function markDirty(message){
    dirty = true;
    cacheSave();
    renderNavBadge();
    if (!canWrite()){ setStatus("Not saved — read-only", "error"); return; }
    setStatus("Saving…", "saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ save(message || "Update cell stocks"); }, 900);
  }

  async function save(message){
    if (!canWrite()) return;
    clearTimeout(saveTimer);

    // Never commit a state that would put two vials in one slot. This is the one
    // invariant the whole app exists to hold, so it blocks the save rather than
    // showing a badge.
    var errors = E.errorsOnly(E.validate(state));
    if (errors.length){
      setStatus("Not saved", "error");
      showBanner("Refusing to save, because the inventory would be wrong: " + esc(errors[0].message) +
                 (errors.length > 1 ? " (and " + (errors.length - 1) + " more — see Settings → Check it)" : ""));
      return;
    }

    setStatus("Saving…", "saving");
    try {
      state._meta = { savedBy: getDevice(), savedAt: new Date().toISOString() };
      var xlsxB64 = bytesToBase64(await workbookBytes());
      if (getWorkerUser()){
        await workerCommit([
          { path: dataPath(), content: E.serialise(state) },
          { path: xlsxPath(), content: xlsxB64, base64: true }
        ], message + " from " + getDevice());
      } else {
        await commitFiles([
          { path: LEGACY_DATA_PATH, text: E.serialise(state) },
          { path: LEGACY_XLSX_PATH, base64: xlsxB64 }
        ], message + " from " + getDevice());
      }
      dirty = false;
      cacheSave();
      setStatus("Saved", "saved");
      setTimeout(function(){ if ($("status").textContent === "Saved") setStatus("Ready", ""); }, 2500);
    } catch(err){
      setStatus("Not saved", "error");
      if (getWorkerUser() && (err.status === 401 || err.status === 403)){
        showBanner("The worker refused the write (" + err.status + "): " + esc(err.message) +
                   ". Try logging in again under Settings → Connect.");
      } else if (err.status === 401 || err.status === 403){
        showBanner("GitHub refused the write (" + err.status + "). The token may have expired, or it may not " +
                   "have <code>Contents: Read and write</code> for this repository.");
      } else if (err.status === 409 || err.status === 422){
        showBanner("Someone else saved first. Reload to take their copy — your change is still on this device.",
                   [{ label:"Reload theirs", onClick: function(){ location.reload(); } }]);
      } else {
        showBanner("Couldn't save: " + esc(err.message) + " Your change is kept on this device.");
      }
    }
  }

  // =====================================================================
  // Colour per line, hashed from the name -- the same trick the schedule app uses
  // for groups, so there is no palette to keep in sync with anything.
  // =====================================================================
  function hueFor(text){
    var h = 0, s = String(text || "");
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function tintFor(text){ return "hsl(" + hueFor(text) + " 62% 78%)"; }

  // Boxes are coloured by CELL, not by line. A row holds one kind of cell, so this
  // makes each row read as a single band and a stray vial obvious at a glance --
  // which is the whole reason the freezer is laid out that way.
  function originOf(vial){ return E.originOfVial(vial, state.rules); }
  function shortOrigin(o){
    if (o === E.NO_ORIGIN) return "?";
    var t = String(o).replace(/[^A-Za-z0-9]/g, "").slice(0, 3);
    return t || "?";
  }

  // =====================================================================
  // Find
  // =====================================================================

  var filter = {
    query: "", passageKind: "any", passageMin: null, passageMax: null,
    includeUnknownPassage: true, frozenFrom: null, frozenTo: null, includeUndated: true,
    unitId: null,
    // What the handles were bounded by last time. Without this, freezing a vial dated
    // today leaves the ceiling where it was and the new vial is silently filtered out
    // of the very search you would run to check it landed.
    bounds: null,
    searchInLab: false
  };

  // ---- search in lab: every other visible member's own inventory, read the same way
  // this account's own is (GitHub Contents API listing + a raw fetch per file), never
  // through the worker. Fetched once per session on first toggle-on and cached --
  // re-fetching on every keystroke would burn through GitHub's unauthenticated rate
  // limit for no reason, and a lab roster doesn't change mid-search.
  // Message templates are copy an admin can edit (see cellstocks-worker/README.md), not
  // secrets, so any logged-in user can read them -- this only ever backs UI text like the
  // broadcast box's own placeholder, never anything that gates a decision.
  var messagesCache = null;
  async function ensureMessagesCache(){
    if (messagesCache || !getWorkerUser()) return;
    try { messagesCache = await workerFetch("/messages", { headers:{ Authorization:"Bearer " + getWorkerToken() } }); }
    catch(e){ /* offline or not reachable yet -- callers fall back to their own literal default */ }
  }
  function message(key, fallback){
    return (messagesCache && messagesCache.messages && messagesCache.messages[key]) || fallback;
  }

  var labCache = { members: null, data: {}, loading: false };

  async function ensureLabCache(){
    if (labCache.members || labCache.loading || !REPO) return;
    labCache.loading = true;
    try {
      var idName = effectiveIdentity();
      var selfName = idName ? idName.toLowerCase() : null;
      var listing = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + DATA_PREFIX.replace(/\/$/, ""))
        .then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
      var names = (Array.isArray(listing) ? listing : [])
        .map(function(entry){ return entry.name || ""; })
        .filter(function(n){ return /\.json$/.test(n); })
        .map(function(n){ return n.replace(/\.json$/, ""); })
        // Excludes whoever's file is already the "own" view -- the real logged-in
        // account -- and, structurally, any hidden admin account, which has no
        // cellstocks/data/*.json of its own to begin with (so for admin, nothing is
        // excluded here at all: every real member comes back).
        .filter(function(n){ return n !== selfName; });
      labCache.members = names;
      await Promise.all(names.map(function(name){
        return fetch(rawURL(DATA_PREFIX + name + ".json"))
          .then(function(r){ return r.ok ? r.text() : null; })
          .then(function(text){ if (text) labCache.data[name] = E.mergeDefaults(JSON.parse(text)); })
          .catch(function(){});
      }));
    } finally {
      labCache.loading = false;
    }
  }

  // The date slider is never remembered across a render -- every fresh look at Find
  // starts fully open, "All time" to the newest date there is, exactly the way Umut
  // asked: a lab-mate's vial (found via search-in-lab) must never be invisible just
  // because the slider was computed before anyone knew that date existed. Only the
  // passage slider still "follows" the data the way it always did -- that part was
  // never the complaint.
  function followExtents(x){
    var b = filter.bounds;
    if (b){
      ["absolute", "relative"].forEach(function(kind){
        if (filter.passageKind !== kind) return;
        if (filter.passageMin === b["min_" + kind]) filter.passageMin = x.passage[kind].min;
        if (filter.passageMax === b["max_" + kind]) filter.passageMax = x.passage[kind].max;
      });
    }
    filter.bounds = {
      min_absolute: x.passage.absolute.min, max_absolute: x.passage.absolute.max,
      min_relative: x.passage.relative.min, max_relative: x.passage.relative.max
    };
  }

  // Own data's extents, merged with every lab-mate's when "search in lab" is on --
  // otherwise the slider is computed from a range that never knew a lab-mate's older
  // or newer vial existed, and silently clips it out of the very search meant to find
  // it. Pure recombination of E.searchExtents() per state; no engine.js change needed.
  function combinedSearchExtents(){
    var x = E.searchExtents(state);
    if (!(filter.searchInLab || isAdminUser()) || !labCache.members) return x;
    labCache.members.forEach(function(name){
      var other = labCache.data[name];
      if (!other) return;
      var ox = E.searchExtents(other);
      if (ox.frozen.min && (!x.frozen.min || ox.frozen.min < x.frozen.min)) x.frozen.min = ox.frozen.min;
      if (ox.frozen.max && (!x.frozen.max || ox.frozen.max > x.frozen.max)) x.frozen.max = ox.frozen.max;
      x.frozen.dated += ox.frozen.dated;
      x.frozen.unconfirmed += ox.frozen.unconfirmed;
    });
    return x;
  }

  function isoToDay(iso){ return Math.round(Date.parse(iso + "T00:00:00Z") / 86400000); }
  function dayToIso(day){ return new Date(day * 86400000).toISOString().slice(0, 10); }
  function prettyDate(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00Z");
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
  }

  // One dual-handle slider. Returns nothing; it writes straight into `filter` and
  // asks for a redraw, because a filter that lagged behind the handle would defeat
  // the point of dragging it.
  function dualSlider(parent, opts){
    var wrap = el("div", "dual");
    var track = el("div", "track"), fill = el("div", "fill");
    var lo = document.createElement("input"), hi = document.createElement("input");
    [lo, hi].forEach(function(inp){
      inp.type = "range"; inp.min = opts.min; inp.max = opts.max; inp.step = opts.step || 1;
    });
    lo.value = opts.lo; hi.value = opts.hi;
    wrap.appendChild(track); wrap.appendChild(fill);
    wrap.appendChild(lo); wrap.appendChild(hi);
    parent.appendChild(wrap);

    function paint(){
      var span = opts.max - opts.min || 1;
      var a = (Number(lo.value) - opts.min) / span * 100;
      var b = (Number(hi.value) - opts.min) / span * 100;
      fill.style.left = a + "%";
      fill.style.width = Math.max(0, b - a) + "%";
    }
    function changed(){
      // Handles may cross; whichever is lower is the floor.
      var a = Math.min(Number(lo.value), Number(hi.value));
      var b = Math.max(Number(lo.value), Number(hi.value));
      paint();
      opts.onChange(a, b);
    }
    lo.oninput = changed; hi.oninput = changed;
    paint();
    return wrap;
  }

  function renderFilters(){
    var box = clear($("filters"));
    // Admin always sees the whole lab merged here -- there is no separate toggle for
    // it, and no "own" results to search alongside (see renderResults()).
    if (isAdminUser() && !labCache.members) ensureLabCache().then(function(){ renderFilters(); renderResults(); });
    var x = combinedSearchExtents();
    followExtents(x);
    // Always fully open -- see the comment on followExtents() above.
    filter.frozenFrom = x.frozen.min;
    filter.frozenTo = x.frozen.max;
    var units = state.storage.units || [];

    // "Search in lab": own boxes always come first (see renderResults) -- this only
    // adds a second pass over every other visible member's own inventory, each read
    // straight from GitHub the same way this account's own data is (see
    // ensureLabCache()), never through the worker. Only makes sense once logged in as
    // an account with lab-mates to search, so it's not shown for the PAT flow, and not
    // for admin either -- admin already sees every member merged, always.
    if (getWorkerUser() && !isAdminUser()){
      var lab = el("label", "toggle");
      var labCb = document.createElement("input");
      labCb.type = "checkbox"; labCb.checked = filter.searchInLab;
      labCb.onchange = function(){
        filter.searchInLab = labCb.checked;
        // The slider has to widen to cover whatever lab-mates' dates already loaded --
        // renderFilters() re-fully-opens it via combinedSearchExtents() -- and again
        // once ensureLabCache()'s fetch actually resolves, for the first toggle-on.
        renderFilters(); renderResults();
        if (filter.searchInLab) ensureLabCache().then(function(){ renderFilters(); renderResults(); });
      };
      lab.appendChild(labCb);
      lab.appendChild(document.createTextNode("Search in lab" +
        (labCache.members ? " (" + labCache.members.length + (labCache.members.length === 1 ? " other member" : " other members") + ")" : "")));
      box.appendChild(lab);
    }

    if (units.length > 1){
      var seg = el("div", "seg");
      [{ id:null, name:"Everywhere" }].concat(units).forEach(function(u){
        var b = el("button", filter.unitId === u.id ? "on" : null, u.name);
        b.onclick = function(){ filter.unitId = u.id; renderFilters(); renderResults(); };
        seg.appendChild(b);
      });
      box.appendChild(seg);
    }

    // ---- frozen ----
    if (x.frozen.dated > 0){
      var f = el("div", "flt");
      var hd = el("div", "hd");
      hd.appendChild(el("b", null, "Frozen"));
      var val = el("span", "val");
      hd.appendChild(val);
      f.appendChild(hd);

      var dMin = isoToDay(x.frozen.min), dMax = isoToDay(x.frozen.max);
      if (filter.frozenFrom === null) filter.frozenFrom = x.frozen.min;
      if (filter.frozenTo === null) filter.frozenTo = x.frozen.max;
      var lo = Math.max(dMin, Math.min(dMax, isoToDay(filter.frozenFrom)));
      var hi = Math.max(dMin, Math.min(dMax, isoToDay(filter.frozenTo)));
      function label(){ val.textContent = prettyDate(filter.frozenFrom) + " → " + prettyDate(filter.frozenTo); }
      label();
      dualSlider(f, { min:dMin, max:dMax, lo:lo, hi:hi, onChange: function(a, b){
        filter.frozenFrom = dayToIso(a); filter.frozenTo = dayToIso(b);
        label(); renderResults();
      }});

      // Fine-tuning on top of the slider, typed rather than dragged -- the slider
      // alone can't land exactly on a specific day once the range spans years.
      var dateInputs = el("div", "two");
      var fromInput = document.createElement("input");
      fromInput.type = "date"; fromInput.min = x.frozen.min; fromInput.max = x.frozen.max; fromInput.value = filter.frozenFrom;
      var toInput = document.createElement("input");
      toInput.type = "date"; toInput.min = x.frozen.min; toInput.max = x.frozen.max; toInput.value = filter.frozenTo;
      function applyManualRange(){
        var a = fromInput.value || x.frozen.min, b = toInput.value || x.frozen.max;
        if (a > b){ var t = a; a = b; b = t; }
        filter.frozenFrom = a; filter.frozenTo = b;
        renderFilters(); renderResults();
      }
      fromInput.onchange = applyManualRange;
      toInput.onchange = applyManualRange;
      var fFrom = el("div", "field"); fFrom.appendChild(el("label", null, "From")); fFrom.appendChild(fromInput);
      var fTo = el("div", "field"); fTo.appendChild(el("label", null, "To")); fTo.appendChild(toInput);
      dateInputs.appendChild(fFrom); dateInputs.appendChild(fTo);
      f.appendChild(dateInputs);

      if (x.frozen.unconfirmed){
        var t = el("label", "toggle");
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = filter.includeUndated;
        cb.onchange = function(){ filter.includeUndated = cb.checked; renderResults(); };
        t.appendChild(cb);
        t.appendChild(el("span", null, "Also show the " + x.frozen.unconfirmed +
          " vials whose date isn't confirmed yet"));
        f.appendChild(t);
      }
      box.appendChild(f);
    }

    // ---- passage ----
    var p = el("div", "flt");
    var phd = el("div", "hd");
    phd.appendChild(el("b", null, "Passage"));
    var pval = el("span", "val");
    phd.appendChild(pval);
    p.appendChild(phd);

    var kinds = [
      { id:"any", label:"Any" },
      { id:"absolute", label:"p11 (absolute)" },
      { id:"relative", label:"p+2 (since thaw)" }
    ];
    var pseg = el("div", "seg");
    kinds.forEach(function(k){
      var b = el("button", filter.passageKind === k.id ? "on" : null, k.label);
      b.onclick = function(){
        filter.passageKind = k.id; filter.passageMin = null; filter.passageMax = null;
        renderFilters(); renderResults();
      };
      pseg.appendChild(b);
    });
    p.appendChild(pseg);

    if (filter.passageKind === "any"){
      pval.textContent = "all";
      var sub = el("div", "sub",
        "p11 and p+2 are different things — one counts from the line's origin, the other from " +
        "the last thaw — so pick a scale before sliding.");
      p.appendChild(sub);
    } else {
      var scale = x.passage[filter.passageKind];
      if (!scale.count){
        pval.textContent = "none";
        p.appendChild(el("div", "sub", "No vials use this scale."));
      } else {
        if (filter.passageMin === null) filter.passageMin = scale.min;
        if (filter.passageMax === null) filter.passageMax = scale.max;
        var prefix = filter.passageKind === "relative" ? "p+" : "p";
        function plabel(){ pval.textContent = prefix + filter.passageMin + " → " + prefix + filter.passageMax; }
        plabel();
        dualSlider(p, { min:scale.min, max:scale.max,
          lo:Math.max(scale.min, Math.min(scale.max, filter.passageMin)),
          hi:Math.max(scale.min, Math.min(scale.max, filter.passageMax)),
          onChange: function(a, b){ filter.passageMin = a; filter.passageMax = b; plabel(); renderResults(); }});
      }
      if (x.passage.unknown){
        var t2 = el("label", "toggle");
        var cb2 = document.createElement("input"); cb2.type = "checkbox"; cb2.checked = filter.includeUnknownPassage;
        cb2.onchange = function(){ filter.includeUnknownPassage = cb2.checked; renderResults(); };
        t2.appendChild(cb2);
        t2.appendChild(el("span", null, "Also show the " + x.passage.unknown + " vials marked p?"));
        p.appendChild(t2);
      }
    }
    box.appendChild(p);
  }

  function facetChips(vial){
    var f = E.facetsFor(vial, state.rules);
    var out = [];
    ["origin","koox","resistance","caspex","guide"].forEach(function(k){
      var v = f[k];
      if (!v || v === "-") return;
      out.push(v);
    });
    return out;
  }

  function vialMeta(vial){
    var bits = [];
    if (vial.passage) bits.push(vial.passage);
    if (vial.frozenOn) bits.push("frozen " + prettyDate(vial.frozenOn));
    else if (vial.frozenRaw) bits.push("date unconfirmed (" + vial.frozenRaw + ")");
    else bits.push("no date");
    if (vial.reservedFor) bits.push("reserved for " + vial.reservedFor);
    return bits.join(" · ");
  }

  // `owner` is set only for a "search in lab" hit: { name, state } for the lab-mate
  // whose inventory this came from. Their vial is real, but this account cannot edit it,
  // take it out, or show it in a box screen that renders against this account's own
  // boxView -- the one thing it CAN do is ask, via requestDialog() below.
  function resultCard(r, owner, forAdmin){
    var v = r.vial;
    var card = el("div", "res" + (v.status === "withdrawn" ? " gone" : ""));
    card.style.borderLeftColor = tintFor(v.lineId || v.name);
    card.appendChild(el("div", "nm", v.name));

    if (owner){
      card.appendChild(el("div", "chip", "in " + owner.name + "’s boxes"));
    }

    var chips = el("div", "chips");
    chips.style.marginTop = "5px";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    if (chips.childNodes.length) card.appendChild(chips);

    if (v.status === "withdrawn"){
      card.appendChild(el("div", "where", "Taken out"));
    } else {
      var w = el("div", "where");
      var path = E.locationPath(owner ? owner.state : state, v.location).split(" → ");
      var pos = path.pop();
      w.appendChild(document.createTextNode(path.join(" → ") + " → "));
      w.appendChild(el("span", "pos", pos));
      card.appendChild(w);
    }
    card.appendChild(el("div", "meta", vialMeta(v)));
    if (r.missed && r.missed.length){
      card.appendChild(el("div", "miss",
        "matched " + r.matched.length + " of " + (r.matched.length + r.missed.length) +
        " words — no " + r.missed.join(", ")));
    }

    var row = el("div", "row tight");
    if (v.status !== "withdrawn" && !owner){
      var take = el("button", "primary", "Took it");
      take.disabled = !canWrite();
      take.onclick = function(){ takeVial(v); };
      row.appendChild(take);
      var show = el("button", null, "Show in box");
      show.onclick = function(){ showInBox(v); };
      row.appendChild(show);
      var ed = el("button", null, "Edit");
      ed.disabled = !canWrite();
      ed.onclick = function(){ editVial(v); };
      row.appendChild(ed);
    } else if (v.status !== "withdrawn" && owner && !forAdmin){
      if (requestedThisSession[v.id]){
        card.appendChild(el("p", "note", "Request sent."));
      } else {
        var reqBtn = el("button", "primary", "Request this");
        reqBtn.onclick = function(){ requestDialog(v, owner); };
        row.appendChild(reqBtn);
      }
    }
    if (row.childNodes.length) card.appendChild(row);
    return card;
  }

  // Vial ids this device has already sent a request for this session, so re-rendering
  // results (every keystroke) doesn't invite sending the same request twice. Not
  // persisted -- GET /requests (once the notification center reads it) is the real
  // record of what's pending, this is only to stop an accidental double-click.
  var requestedThisSession = {};

  function requestDialog(vial, owner){
    $("dlgTitle").textContent = "Ask " + owner.name + " about " + vial.name;
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note",
      "The vial stays in " + owner.name + "'s freezer until they hand it over — this just lets them know you're after it."));
    var note = document.createElement("textarea");
    note.rows = 3;
    note.placeholder = "Add a note (optional) — what it's for, when you need it…";
    body.appendChild(note);
    var foot = clear($("dlgFoot"));
    var send = el("button", "primary", "Send request");
    send.onclick = async function(){
      send.disabled = true;
      try {
        await workerFetch("/requests", {
          method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() },
          body: JSON.stringify({ toUser: owner.name, itemName: vial.name, vialId: vial.id, note: note.value.trim() })
        });
        requestedThisSession[vial.id] = true;
        $("dlg").close();
        renderResults();
        showBanner("Asked " + esc(owner.name) + " about <b>" + esc(vial.name) + "</b>.");
      } catch(err){
        showBanner("Couldn't send that request: " + esc(err.message));
      }
      send.disabled = false;
    };
    foot.appendChild(send);
    $("dlg").showModal();
  }

  function renderResults(){
    var box = clear($("results"));
    var q = {
      query: filter.query, unitId: filter.unitId,
      passageKind: filter.passageKind, passageMin: filter.passageMin, passageMax: filter.passageMax,
      includeUnknownPassage: filter.includeUnknownPassage,
      frozenFrom: filter.frozenFrom, frozenTo: filter.frozenTo, includeUndated: filter.includeUndated
    };

    // Admin has no boxes of their own to search -- every result comes from a member's
    // own file, always, on every screen this whole app draws for them.
    if (isAdminUser()){
      if (!labCache.members){
        box.appendChild(el("div", "empty", "Loading the lab…"));
        return;
      }
      var labHits = [];
      labCache.members.slice().sort().forEach(function(name){
        var ownerState = labCache.data[name];
        if (!ownerState) return;
        E.search(ownerState, q).forEach(function(r){ labHits.push({ r: r, owner: { name: name, state: ownerState } }); });
      });
      box.appendChild(el("p", "note", labHits.length + (labHits.length === 1 ? " vial" : " vials") +
        (filter.query ? " match “" + filter.query + "”, lab-wide" : " in range, lab-wide")));
      if (!labHits.length){
        box.appendChild(el("div", "empty", "Nothing here. Try fewer words, or widen a slider."));
        return;
      }
      labHits.slice(0, 200).forEach(function(h){ box.appendChild(resultCard(h.r, h.owner, true)); });
      if (labHits.length > 200) box.appendChild(el("p", "note", "…and " + (labHits.length - 200) + " more. Narrow it down."));
      return;
    }

    var hits = E.search(state, q);

    // Own boxes always come first -- lab-mates' results are a second pass, appended
    // after every one of this account's own, never interleaved with them.
    var labHits = [];
    if (filter.searchInLab && labCache.members && filter.query){
      labCache.members.forEach(function(name){
        var ownerState = labCache.data[name];
        if (!ownerState) return;
        E.search(ownerState, q).forEach(function(r){ labHits.push({ r: r, owner: { name: name, state: ownerState } }); });
      });
    }

    var head = el("p", "note");
    var headBits = [hits.length + (hits.length === 1 ? " vial" : " vials") +
      (filter.query ? " match “" + filter.query + "”" : " in range")];
    if (filter.searchInLab && labHits.length){
      headBits.push(labHits.length + " more in the lab");
    } else if (filter.searchInLab && labCache.loading){
      headBits.push("checking the lab…");
    }
    head.textContent = headBits.join(" · ");
    box.appendChild(head);

    if (!hits.length && !labHits.length){
      box.appendChild(el("div", "empty", state.vials.length
        ? "Nothing here. Try fewer words, or widen a slider."
        : "Nothing imported yet — Settings → Import a spreadsheet."));
      return;
    }
    hits.slice(0, 200).forEach(function(r){ box.appendChild(resultCard(r)); });
    if (hits.length > 200) box.appendChild(el("p", "note", "…and " + (hits.length - 200) + " more. Narrow it down."));
    labHits.slice(0, 50).forEach(function(h){ box.appendChild(resultCard(h.r, h.owner)); });
    if (labHits.length > 50) box.appendChild(el("p", "note", "…and " + (labHits.length - 50) + " more in the lab. Narrow it down."));
  }

  function takeVial(v){
    var out = E.withdraw(state, v.id, {
      date: new Date().toISOString().slice(0, 10), by: getDevice(), purpose: "thaw",
      ids: ["w-" + Date.now().toString(36)]
    });
    if (out.warnings.length){ showBanner(esc(out.warnings[0])); return; }
    lastWithdrawal = out.state.withdrawals[out.state.withdrawals.length - 1].id;
    state = out.state;
    markDirty("Take out " + v.name);
    renderAll();
    showBanner("Took <b>" + esc(v.name) + "</b> from " + esc(out.freed[0].path) + ".",
      [{ label:"Undo", onClick: function(){ undoTake(lastWithdrawal); } }]);
  }

  function undoTake(id){
    var back = E.undoWithdrawal(state, id);
    if (!back.ok){ showBanner(esc(back.reason)); return; }
    state = back.state;
    markDirty("Put back " + back.vial.name);
    hideBanner();
    renderAll();
  }

  function showInBox(v){
    if (!v.location) return;
    boxView.unitId = v.location.unitId;
    boxView.boxId = v.location.boxId;
    boxView.highlight = [v.location.position];
    go("boxes");
  }

  // =====================================================================
  // Freeze
  // =====================================================================

  var freeze = { name:"", count:1, unitId:null, boxId:null, plan:null };

  function renderFreezeFacets(){
    var box = clear($("fzFacets"));
    var name = freeze.name.trim();
    if (!name){ $("fzLine").textContent = ""; return; }
    var f = E.classify(name, state.rules);
    [["origin","Origin"],["koox","Edit"],["resistance","Resistance"],["caspex","CASPEX"],["guide","Guide"]]
      .forEach(function(pair){
        var key = pair[0], v = f[key];
        if (v === null){
          var gap = el("button", "chip gap", pair[1] + ": no rule");
          gap.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
          box.appendChild(gap);
        } else if (v !== "-"){
          box.appendChild(el("span", "chip on", v));
        }
      });

    // What matters for where it goes is the CELL, not the line: KO, OX and CASPEX of
    // one cell all share a row, and a different cell never joins them.
    var origin = f.origin || E.NO_ORIGIN;
    var rows = [], boxes = {}, slots = 0;
    E.eachBox(state, function(box){
      E.rowsOf(state, box.id, state.rules).forEach(function(r){
        if (!r.counts[origin]) return;
        rows.push(box.name + " " + r.label);
        boxes[box.name] = true;
        slots += r.counts[origin];
      });
    });
    var lineId = E.lineIdFor(name, state.rules);
    var existing = E.vialsOfLine(state, lineId).length;
    if (slots){
      // Naming ten rows is not information, it is a wall. Say how much and where in
      // the coarse sense; Boxes is one tap away for the detail.
      var boxCount = Object.keys(boxes).length;
      var where = rows.length <= 3
        ? "row" + (rows.length === 1 ? " " : "s ") + rows.join(", ")
        : rows.length + " rows across " + boxCount + " box" + (boxCount === 1 ? "" : "es");
      $("fzLine").textContent = origin + " already has " + slots + " vial" + (slots === 1 ? "" : "s") +
        " in " + where +
        (existing ? " — " + existing + " of them this exact line." : ", but none of this exact line.");
    } else {
      $("fzLine").textContent = origin === E.NO_ORIGIN
        ? "No origin rule covers this name yet, so it will start a row of its own."
        : "Nothing of " + origin + " is stored yet — this starts a row of its own.";
    }
  }

  function renderFreezePlan(){
    var card = clear($("fzPlanCard"));
    var name = freeze.name.trim();
    if (!name){
      card.appendChild(el("p", "note", "Type what you're freezing and this will say which box to put it in."));
      freeze.plan = null;
      return;
    }
    var plan = E.suggestPlacement(state, {
      name: name, count: freeze.count,
      unitId: freeze.unitId || state.settings.defaultUnitId,
      boxId: freeze.boxId || null
    });
    freeze.plan = plan;

    if (!plan.ok){
      var bad = el("p", "note", plan.reason);
      bad.style.color = "var(--bad)";
      card.appendChild(bad);
      return;
    }

    var head = el("div");
    head.style.fontWeight = "650";
    head.style.fontSize = "14px";
    head.textContent = "Put these in " + plan.summary;
    card.appendChild(head);
    card.appendChild(el("p", "note", plan.reason));

    plan.segments.forEach(function(seg){
      card.appendChild(el("div", "occ", seg.path));
      card.appendChild(boxGrid(seg.boxId, { target: seg.positions }));
    });

    var row = el("div", "row tight");
    var override = el("button", null, freeze.boxId ? "Choose a different box" : "Put it somewhere else");
    override.onclick = pickBox;
    row.appendChild(override);
    if (freeze.boxId){
      var auto = el("button", null, "Let it choose");
      auto.onclick = function(){ freeze.boxId = null; renderFreezePlan(); renderFreezeGuard(); };
      row.appendChild(auto);
    }
    card.appendChild(row);
  }

  function pickBox(){
    var body = clear($("dlgBody"));
    $("dlgTitle").textContent = "Which box?";
    E.eachBox(state, function(box, rack, unit){
      var occ = E.occupancy(state, box.id);
      var b = el("button", null, "");
      b.style.width = "100%";
      b.style.textAlign = "left";
      b.style.marginBottom = "6px";
      b.textContent = unit.name + " → " + rack.name + " → " + box.name + "  (" + occ.free + " free)";
      b.disabled = occ.free < freeze.count;
      b.onclick = function(){ freeze.boxId = box.id; $("dlg").close(); renderFreezePlan(); renderFreezeGuard(); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function doFreeze(){
    if (!canWrite()){ showBanner("Read-only — add a GitHub token under Settings → Connect first."); return; }
    var name = freeze.name.trim();
    if (!name){ showBanner("Give it a name first."); return; }
    if (!freeze.plan || !freeze.plan.ok){ showBanner("There's nowhere to put these yet."); return; }

    var ids = [];
    var stamp = Date.now().toString(36);
    for (var i = 0; i < freeze.count; i++) ids.push("v-" + stamp + "-" + i);
    var dateInput = $("fzDate").value;
    var out = E.applyPlacement(state, freeze.plan, {
      name: name,
      passage: $("fzPassage").value.trim(),
      frozenOn: dateInput,
      notes: $("fzNotes").value.trim()
    }, { ids: ids, now: new Date().toISOString(), by: getDevice() });

    var errors = E.errorsOnly(E.validate(out.state));
    if (errors.length){ showBanner("Not doing that: " + esc(errors[0].message)); return; }

    state = out.state;
    markDirty("Freeze " + freeze.count + " × " + name);
    showBanner("Put " + out.vials.length + " × <b>" + esc(name) + "</b> in " + esc(freeze.plan.summary) + ".");
    freeze.boxId = null;
    renderAll();
  }

  // =====================================================================
  // Boxes
  // =====================================================================

  var boxView = { unitId:null, boxId:null, highlight:[], owner:null };

  function boxGrid(boxId, opts){
    var o = opts || {};
    var occ = E.occupancy(state, boxId);
    var wrap = el("div");
    if (!occ) return wrap;
    var cols = occ.box.cols, rows = occ.box.rows;
    var grid = el("div", "gridwrap");
    grid.style.gridTemplateColumns = "auto repeat(" + cols + ", minmax(26px, 1fr))";
    grid.appendChild(el("div"));
    for (var c = 0; c < cols; c++) grid.appendChild(el("div", "axis", String(c + 1)));

    for (var r = 0; r < rows; r++){
      grid.appendChild(el("div", "axis r", occ.box.scheme === "linear" ? "" : E.rowLabel(r)));
      for (var c2 = 0; c2 < cols; c2++){
        var slot = occ.slots[r * cols + c2];
        var cell = el("div", "slot" + (slot.vial ? " taken" : ""));
        if (slot.vial){
          // Not `o`: that is the options object above, and `var` is function-scoped,
          // so reusing the name here silently emptied it for every later slot --
          // which killed the highlighting on the freeze proposal.
          var cellOrigin = originOf(slot.vial);
          cell.style.background = tintFor(cellOrigin);
          cell.title = slot.position + " · " + slot.vial.name + " (" + cellOrigin + ")";
          cell.textContent = shortOrigin(cellOrigin);
        } else {
          cell.title = slot.position + " · empty";
          cell.textContent = "";
        }
        if (o.target && o.target.indexOf(slot.position) !== -1) cell.className += " target";
        if (o.highlight && o.highlight.indexOf(slot.position) !== -1) cell.className += " hit";
        if (!o.static){
          (function(s){ cell.onclick = function(){ slotDialog(boxId, s); }; })(slot);
        }
        grid.appendChild(cell);
      }
    }
    wrap.appendChild(grid);
    return wrap;
  }

  // Editing a vial. Everything the sheet carried is editable here, plus the five
  // derived facets: each shows what the rules read, and typing over one pins it by
  // hand so classify() will not touch it again.
  function editVial(vial){
    $("dlgTitle").textContent = "Edit " + vial.name;
    var body = clear($("dlgBody"));

    function field(label, node, hint){
      var f = el("div", "field");
      f.appendChild(el("label", null, label));
      f.appendChild(node);
      if (hint) f.appendChild(el("div", "sub", hint));
      body.appendChild(f);
      return node;
    }

    var name = document.createElement("input");
    name.value = vial.name || "";
    name.autocomplete = "off";
    field("Name", name, "Everything below that isn't pinned is worked out from this.");

    var facetBox = el("div");
    body.appendChild(el("label", null, "Cell details"));
    body.appendChild(facetBox);
    var facetInputs = {};
    function paintFacets(){
      clear(facetBox);
      var derived = E.classify(name.value.trim(), state.rules);
      E.FACETS.forEach(function(f){
        var pinned = vial.facetsSetByHand && vial.facetsSetByHand[f] !== undefined;
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, f));
        grow.appendChild(el("div", "sub", derived[f] === null
          ? "no rule covers this name"
          : "rules read: " + derived[f]));
        row.appendChild(grow);
        var inp = facetInputs[f] || document.createElement("input");
        facetInputs[f] = inp;
        inp.style.width = "9em";
        inp.autocomplete = "off";
        if (inp.value === undefined || inp.dataset.init !== "1"){
          inp.value = pinned ? vial.facetsSetByHand[f] : "";
          inp.dataset.init = "1";
        }
        inp.placeholder = derived[f] === null ? "—" : derived[f];
        row.appendChild(inp);
        facetBox.appendChild(row);
      });
    }
    paintFacets();
    name.oninput = paintFacets;

    var passage = document.createElement("input");
    passage.value = vial.passage || "";
    passage.placeholder = "p12, p+3 or p?";
    passage.autocomplete = "off";
    field("Passage", passage, "p12 counts from the line's origin; p+3 counts from the last thaw. p? means unknown.");

    var date = document.createElement("input");
    date.type = "date";
    if (vial.frozenOn) date.value = vial.frozenOn;
    field("Date frozen", date, vial.frozenRaw
      ? "The sheet says " + vial.frozenRaw + (vial.frozenOn ? "" : ", which could be read two ways.")
      : "The sheet had nothing here.");

    var notes = document.createElement("input");
    notes.value = vial.notes || "";
    notes.placeholder = "myco -";
    notes.autocomplete = "off";
    field("Notes", notes, "myco -, chip- and to-do become searchable tags.");

    body.appendChild(el("p", "note", "In " + E.locationPath(state, vial.location) +
      (vial.importedFrom ? " · from " + vial.importedFrom : "")));

    var foot = clear($("dlgFoot"));
    var save = el("button", "primary", "Save");
    save.disabled = !canWrite();
    save.onclick = function(){
      var v = E.indexById(state.vials)[vial.id];
      if (!v) return;
      var newName = name.value.trim();
      if (!newName){ showBanner("A vial needs a name."); return; }

      var pinned = {};
      var derived = E.classify(newName, state.rules);
      E.FACETS.forEach(function(f){
        var typed = facetInputs[f].value.trim();
        if (typed && typed !== derived[f]) pinned[f] = typed;
      });

      var before = JSON.parse(JSON.stringify(v));
      v.name = newName;
      v.lineId = E.lineIdFor(newName, state.rules);
      if (Object.keys(pinned).length) v.facetsSetByHand = pinned; else delete v.facetsSetByHand;

      var p = E.parsePassage(passage.value);
      v.passage = p.raw; v.passageNumber = p.number; v.passageKind = p.kind;

      if (date.value){
        var parsed = E.parseDate(date.value);
        if (!parsed.iso){ showBanner("That date can't be read."); return; }
        v.frozenOn = parsed.iso;
      } else {
        v.frozenOn = null;
      }

      v.notes = notes.value.trim();
      v.flags = E.flagsFrom(v.notes, state.settings.customFlags);

      var errors = E.errorsOnly(E.validate(state));
      if (errors.length){
        Object.keys(before).forEach(function(k){ v[k] = before[k]; });
        showBanner("Not saving that: " + esc(errors[0].message));
        return;
      }
      $("dlg").close();
      markDirty("Edit " + newName);
      renderAll();
    };
    foot.appendChild(save);
    $("dlg").showModal();
  }

  // A row importSheet() couldn't place at all (see reviewQueue()'s ambiguousImport) has
  // no location to show, so it needs its own dialog rather than editVial()'s (which
  // assumes a vial is already somewhere). Resolving it is E.resolveImportRow()'s job --
  // this is just the box/position picker for it.
  function resolveAmbiguousImport(vial){
    $("dlgTitle").textContent = "Where does this belong?";
    var body = clear($("dlgBody"));
    var raw = vial.importRaw || {};

    var name = document.createElement("input");
    name.value = raw.name || (/^Unreadable row/.test(vial.name) ? "" : vial.name) || "";
    name.autocomplete = "off";
    var nameField = el("div", "field");
    nameField.appendChild(el("label", null, "Name"));
    nameField.appendChild(name);
    body.appendChild(nameField);

    var boxSel = document.createElement("select");
    var boxes = [];
    E.eachBox(state, function(b, rack, unit){ boxes.push({ id: b.id, label: unit.name + " → " + rack.name + " → " + b.name, box: b }); });
    boxes.forEach(function(b){
      var o = document.createElement("option");
      o.value = b.id; o.textContent = b.label;
      boxSel.appendChild(o);
    });
    var boxField = el("div", "field");
    boxField.appendChild(el("label", null, "Box"));
    boxField.appendChild(boxSel);
    body.appendChild(boxField);

    var posInput = document.createElement("input");
    posInput.placeholder = "A1";
    posInput.autocomplete = "off";
    posInput.value = raw.position && /^[A-Za-z]+\s*\d+$/.test(raw.position) ? raw.position : "";
    var posField = el("div", "field");
    posField.appendChild(el("label", null, "Position"));
    posField.appendChild(posInput);
    body.appendChild(posField);

    body.appendChild(el("p", "note", "From the sheet: name " + (raw.name ? "\"" + raw.name + "\"" : "(blank)") +
      ", position " + (raw.position ? "\"" + raw.position + "\"" : "(blank)") + (raw.box ? " in " + raw.box : "") + "."));

    var msg = el("p", "note");
    body.appendChild(msg);

    var foot = clear($("dlgFoot"));
    var save = el("button", "primary", "Save");
    save.disabled = !canWrite() || !boxes.length;
    if (!boxes.length) msg.textContent = "There is nowhere to put it yet -- add a box first.";
    save.onclick = function(){
      var res = E.resolveImportRow(state, vial.id, { name: name.value, boxId: boxSel.value, position: posInput.value.trim() });
      if (!res.ok){ msg.textContent = res.reason; msg.style.color = "var(--bad)"; return; }
      state = res.state;
      $("dlg").close();
      markDirty("Fill in an import row");
      renderAll();
    };
    foot.appendChild(save);
    $("dlg").showModal();
  }

  function slotDialog(boxId, slot){
    var occ = E.occupancy(state, boxId);
    $("dlgTitle").textContent = occ.box.name + " · " + slot.position;
    var body = clear($("dlgBody"));
    var foot = clear($("dlgFoot"));

    if (!slot.vial){
      body.appendChild(el("p", "note", "This slot is empty."));
      var f = el("button", "primary", "Freeze into this slot");
      f.disabled = !canWrite();
      f.onclick = function(){
        freeze.boxId = boxId; $("dlg").close(); go("freeze");
        $("fzName").focus(); renderFreezePlan();
      };
      foot.appendChild(f);
      $("dlg").showModal();
      return;
    }

    var v = slot.vial;
    body.appendChild(el("div", "nm", v.name));
    var chips = el("div", "chips");
    chips.style.margin = "8px 0";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    body.appendChild(chips);
    body.appendChild(el("p", "note", vialMeta(v)));
    if (v.notes) body.appendChild(el("p", "note", "Notes: " + v.notes));
