    if (freeze.kind !== "Cell"){ $("fzLine").textContent = ""; return; }
    if (!name){ $("fzLine").textContent = ""; return; }
    var f = E.classify(name, state.rules);
    [["origin","Origin"],["koox","Edit"],["resistance","Resistance"],["caspex","CASPEX"],["guide","Guide"]]
      .forEach(function(pair){
        var key = pair[0], v = f[key];
        if (v === null){
          var gap = el("button", "chip gap", pair[1] + ": no rule");
          gap.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
          box.appendChild(gap);
        } else if (v !== "-"){
          box.appendChild(el("span", "chip on", v));
        }
      });

    // What matters for where it goes is the CELL, not the line: KO, OX and CASPEX of
    // one cell all share a row, and a different cell never joins them.
    var origin = f.origin || E.NO_ORIGIN;
    var rows = [], boxes = {}, slots = 0;
    E.eachBox(state, function(box){
      E.rowsOf(state, box.id, state.rules).forEach(function(r){
        if (!r.counts[origin]) return;
        rows.push(box.name + " " + r.label);
        boxes[box.name] = true;
        slots += r.counts[origin];
      });
    });
    var lineId = E.lineIdFor(name, state.rules);
    var existing = E.vialsOfLine(state, lineId).length;
    if (slots){
      // Naming ten rows is not information, it is a wall. Say how much and where in
      // the coarse sense; Boxes is one tap away for the detail.
      var boxCount = Object.keys(boxes).length;
      var where = rows.length <= 3
        ? "row" + (rows.length === 1 ? " " : "s ") + rows.join(", ")
        : rows.length + " rows across " + boxCount + " box" + (boxCount === 1 ? "" : "es");
      $("fzLine").textContent = origin + " already has " + slots + " vial" + (slots === 1 ? "" : "s") +
        " in " + where +
        (existing ? " — " + existing + " of them this exact line." : ", but none of this exact line.");
    } else {
      $("fzLine").textContent = origin === E.NO_ORIGIN
        ? "No origin rule covers this name yet, so it will start a row of its own."
        : "Nothing of " + origin + " is stored yet — this starts a row of its own.";
    }
  }

  function renderFreezePlan(){
    var card = clear($("fzPlanCard"));
    var name = freeze.name.trim();
    if (!name){
      card.appendChild(el("p", "note", "Type what you're adding and this will say which box to put it in."));
      freeze.plan = null;
      return;
    }
    var plan = E.suggestPlacement(state, {
      name: name, count: freeze.count,
      unitId: freeze.unitId || state.settings.defaultUnitId,
      boxId: freeze.boxId || null
    });
    freeze.plan = plan;

    if (!plan.ok){
      var bad = el("p", "note", plan.reason);
      bad.style.color = "var(--bad)";
      card.appendChild(bad);
      return;
    }

    var head = el("div");
    head.style.fontWeight = "650";
    head.style.fontSize = "14px";
    head.textContent = "Put these in " + plan.summary;
    card.appendChild(head);
    card.appendChild(el("p", "note", plan.reason));

    plan.segments.forEach(function(seg){
      card.appendChild(el("div", "occ", seg.path));
      card.appendChild(boxGrid(seg.boxId, { target: seg.positions }));
    });

    var row = el("div", "row tight");
    var override = el("button", null, freeze.boxId ? "Choose a different box" : "Put it somewhere else");
    override.onclick = pickBox;
    row.appendChild(override);
    if (freeze.boxId){
      var auto = el("button", null, "Let it choose");
      auto.onclick = function(){ freeze.boxId = null; renderFreezePlan(); renderFreezeGuard(); };
      row.appendChild(auto);
    }
    card.appendChild(row);
  }

  function pickBox(){
    var body = clear($("dlgBody"));
    $("dlgTitle").textContent = "Which box?";
    E.eachBox(state, function(box, rack, unit){
      var occ = E.occupancy(state, box.id);
      var b = el("button", null, "");
      b.style.width = "100%";
      b.style.textAlign = "left";
      b.style.marginBottom = "6px";
      b.textContent = unit.name + " → " + rack.name + " → " + box.name + "  (" + occ.free + " free)";
      b.disabled = occ.free < freeze.count;
      b.onclick = function(){ freeze.boxId = box.id; $("dlg").close(); renderFreezePlan(); renderFreezeGuard(); };
      body.appendChild(b);
    });
    clear($("dlgFoot"));
    $("dlg").showModal();
  }

  function doFreeze(){
    if (!canWrite()){ showBanner("Read-only — add a GitHub token under Settings → Connect first."); return; }
    var name = freeze.name.trim();
    if (!name){ showBanner("Give it a name first."); return; }
    if (!freeze.plan || !freeze.plan.ok){ showBanner("There's nowhere to put these yet."); return; }

    var ids = [];
    var stamp = Date.now().toString(36);
    for (var i = 0; i < freeze.count; i++) ids.push("v-" + stamp + "-" + i);
    var dateInput = $("fzDate").value;
    var customFacets = freeze.collectCustomFacets ? freeze.collectCustomFacets() : {};
    var out = E.applyPlacement(state, freeze.plan, {
      name: name,
      passage: $("fzPassage").value.trim(),
      frozenOn: dateInput,
      notes: $("fzNotes").value.trim(),
      kind: freeze.kind,
      customFacets: customFacets
    }, { ids: ids, now: new Date().toISOString(), by: getDevice() });

    var errors = E.errorsOnly(E.validate(out.state));
    if (errors.length){ showBanner("Not doing that: " + esc(errors[0].message)); return; }

    state = out.state;
    if (freeze.kind !== "Cell") rememberNewAttributes(freeze.kind, customFacets);
    markDirty("Add " + freeze.count + " × " + name);
    showBanner("Put " + out.vials.length + " × <b>" + esc(name) + "</b> in " + esc(freeze.plan.summary) + ".");
    freeze.boxId = null;
    freeze.customFacets = {};
    $("fzCustomFacets").dataset.kind = ""; // force a fresh, empty table on the next render
    renderAll();
  }

  // =====================================================================
  // Boxes
  // =====================================================================

  var boxView = { unitId:null, boxId:null, highlight:[], owner:null, rackPath:[] };

  function boxGrid(boxId, opts){
    var o = opts || {};
    var occ = E.occupancy(state, boxId);
    var wrap = el("div");
    if (!occ) return wrap;
    var cols = occ.box.cols, rows = occ.box.rows;
    var grid = el("div", "gridwrap");
    grid.style.gridTemplateColumns = "auto repeat(" + cols + ", minmax(26px, 1fr))";
    grid.appendChild(el("div"));
    for (var c = 0; c < cols; c++) grid.appendChild(el("div", "axis", String(c + 1)));

    for (var r = 0; r < rows; r++){
      grid.appendChild(el("div", "axis r", occ.box.scheme === "linear" ? "" : E.rowLabel(r)));
      for (var c2 = 0; c2 < cols; c2++){
        var slot = occ.slots[r * cols + c2];
        var cell = el("div", "slot" + (slot.vial ? " taken" : ""));
        if (slot.vial){
          // Not `o`: that is the options object above, and `var` is function-scoped,
          // so reusing the name here silently emptied it for every later slot --
          // which killed the highlighting on the freeze proposal.
          var cellOrigin = originOf(slot.vial);
          cell.style.background = tintFor(cellOrigin);
          cell.title = slot.position + " · " + slot.vial.name + " (" + cellOrigin + ")";
          cell.textContent = shortOrigin(cellOrigin);
        } else {
          cell.title = slot.position + " · empty";
          cell.textContent = "";
        }
        if (o.target && o.target.indexOf(slot.position) !== -1) cell.className += " target";
        if (o.highlight && o.highlight.indexOf(slot.position) !== -1) cell.className += " hit";
        if (!o.static){
          (function(s){ cell.onclick = function(){ slotDialog(boxId, s); }; })(slot);
        }
        grid.appendChild(cell);
      }
    }
    wrap.appendChild(grid);
    return wrap;
  }

  // Editing a vial. Everything the sheet carried is editable here, plus the five
  // derived facets: each shows what the rules read, and typing over one pins it by
  // hand so classify() will not touch it again.
  function editVial(vial){
    $("dlgTitle").textContent = "Edit " + vial.name;
    var body = clear($("dlgBody"));

    function field(label, node, hint){
      var f = el("div", "field");
      f.appendChild(el("label", null, label));
      f.appendChild(node);
      if (hint) f.appendChild(el("div", "sub", hint));
      body.appendChild(f);
      return node;
    }

    var name = document.createElement("input");
    name.value = vial.name || "";
    name.autocomplete = "off";
    field("Name", name, "Everything below that isn't pinned is worked out from this.");

    // Umut asked for this explicitly: existing vials get no retroactive type, but he
    // wants to set one himself, by hand, as he goes -- this select is that "by hand".
    // Not shown until the lab-wide type list has actually loaded, since offering only
    // "Cell" while the real list is still in flight would look like a real choice.
    var currentKind = vial.kind || "Cell";
    var typeSel = document.createElement("select");
    if (typesCache){
      typeNames().forEach(function(n){
        var o = document.createElement("option");
        o.value = n; o.textContent = n; o.selected = n === currentKind;
        typeSel.appendChild(o);
      });
      if (typeNames().indexOf(currentKind) === -1){
        var o2 = document.createElement("option");
        o2.value = currentKind; o2.textContent = currentKind + " (no longer in the type list)"; o2.selected = true;
        typeSel.appendChild(o2);
      }
      field("Type", typeSel, "Nothing is ever assigned automatically -- pick one, or leave it as Cell.");
    } else {
      ensureTypesCache();
    }

    var facetBox = el("div");
    var facetLabel = el("label", null, "Cell details");
    body.appendChild(facetLabel);
    body.appendChild(facetBox);
    var facetInputs = {};
    var customFacetsCollector = null;
    // For a non-Cell kind, the facet table only rebuilds when the TYPE actually
    // changes (tracked via facetBox.dataset.customKind), never on a name keystroke --
    // unlike Cell's facets, a Plasmid/Protein/etc.'s attribute table has nothing to do
    // with the typed name, and rebuilding it on every keystroke elsewhere in this
    // dialog would wipe out whatever the user is mid-typing here.
    function paintFacets(){
      var kind = typeSel && typeSel.value ? typeSel.value : "Cell";
      if (kind !== "Cell"){
        if (facetBox.dataset.customKind === kind && customFacetsCollector) return;
        clear(facetBox);
        facetLabel.textContent = kind + " details";
        customFacetsCollector = buildAttributeTable(facetBox, kind, vial.kind === kind ? (vial.customFacets || {}) : {});
        facetBox.dataset.customKind = kind;
        return;
      }
      clear(facetBox);
      facetBox.dataset.customKind = "";
      customFacetsCollector = null;
      facetLabel.textContent = "Cell details";
      var derived = E.classify(name.value.trim(), state.rules);
      E.FACETS.forEach(function(f){
        var pinned = vial.facetsSetByHand && vial.facetsSetByHand[f] !== undefined;
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, f));
        grow.appendChild(el("div", "sub", derived[f] === null
          ? "no rule covers this name"
          : "rules read: " + derived[f]));
        row.appendChild(grow);
        var inp = facetInputs[f] || document.createElement("input");
        facetInputs[f] = inp;
        inp.style.width = "9em";
        inp.autocomplete = "off";
        if (inp.value === undefined || inp.dataset.init !== "1"){
          inp.value = pinned ? vial.facetsSetByHand[f] : "";
          inp.dataset.init = "1";
        }
        inp.placeholder = derived[f] === null ? "—" : derived[f];
        row.appendChild(inp);
        facetBox.appendChild(row);
      });
    }
    paintFacets();
    name.oninput = paintFacets;
    typeSel.onchange = paintFacets;

    var passage = document.createElement("input");
    passage.value = vial.passage || "";
    passage.placeholder = "p12, p+3 or p?";
    passage.autocomplete = "off";
    field("Passage", passage, "p12 counts from the line's origin; p+3 counts from the last thaw. p? means unknown.");

    var date = document.createElement("input");
    date.type = "date";
    if (vial.frozenOn) date.value = vial.frozenOn;
    field("Date frozen", date, vial.dateUnknown
      ? "Marked Unknown in Review -- picking a date here replaces that."
      : vial.frozenRaw
      ? "The sheet says " + vial.frozenRaw + (vial.frozenOn ? "" : ", which could be read two ways.")
      : "The sheet had nothing here.");

    var notes = document.createElement("input");
    notes.value = vial.notes || "";
    notes.placeholder = "myco -";
    notes.autocomplete = "off";
    field("Notes", notes, "myco -, chip- and to-do become searchable tags.");

    body.appendChild(el("p", "note", "In " + E.locationPath(state, vial.location) +
      (vial.importedFrom ? " · from " + vial.importedFrom : "")));

    var foot = clear($("dlgFoot"));
    var save = el("button", "primary", "Save");
    save.disabled = !canWrite();
    save.onclick = function(){
      var v = E.indexById(state.vials)[vial.id];
      if (!v) return;
      var newName = name.value.trim();
      if (!newName){ showBanner("A vial needs a name."); return; }

      var before = JSON.parse(JSON.stringify(v));
      v.name = newName;
      v.lineId = E.lineIdFor(newName, state.rules);

      // If the lab-wide type list never finished loading, the Type field was never
      // shown -- leave whatever kind/customFacets/facetsSetByHand the vial already had
      // entirely alone, rather than guessing from a facet panel that painted in Cell
      // mode by default and may not reflect the vial's real (unloaded) type.
      if (!typesCache){
        /* kind, customFacets and facetsSetByHand are untouched */
      } else if (typeSel.value === "Cell" || !typeSel.value){
        var pinned = {};
        var derived = E.classify(newName, state.rules);
        E.FACETS.forEach(function(f){
          var typed = facetInputs[f] ? facetInputs[f].value.trim() : "";
          if (typed && typed !== derived[f]) pinned[f] = typed;
        });
        if (Object.keys(pinned).length) v.facetsSetByHand = pinned; else delete v.facetsSetByHand;
        delete v.kind;
        delete v.customFacets;
      } else {
        v.kind = typeSel.value;
        var customFacets = customFacetsCollector ? customFacetsCollector() : {};
        if (Object.keys(customFacets).length) v.customFacets = customFacets; else delete v.customFacets;
        delete v.facetsSetByHand;
        rememberNewAttributes(v.kind, customFacets);
      }

      var p = E.parsePassage(passage.value);
      v.passage = p.raw; v.passageNumber = p.number; v.passageKind = p.kind;

      if (date.value){
        var parsed = E.parseDate(date.value);
        if (!parsed.iso){ showBanner("That date can't be read."); return; }
        v.frozenOn = parsed.iso;
        delete v.dateUnknown;
      } else {
        v.frozenOn = null;
      }

      v.notes = notes.value.trim();
      v.flags = E.flagsFrom(v.notes, state.settings.customFlags);

      var errors = E.errorsOnly(E.validate(state));
      if (errors.length){
        Object.keys(before).forEach(function(k){ v[k] = before[k]; });
        showBanner("Not saving that: " + esc(errors[0].message));
        return;
      }
      $("dlg").close();
      markDirty("Edit " + newName);
      renderAll();
    };
    foot.appendChild(save);
    $("dlg").showModal();
  }

  // A row importSheet() couldn't place at all (see reviewQueue()'s ambiguousImport) has
  // no location to show, so it needs its own dialog rather than editVial()'s (which
  // assumes a vial is already somewhere). Resolving it is E.resolveImportRow()'s job --
  // this is just the box/position picker for it.
  function resolveAmbiguousImport(vial){
    $("dlgTitle").textContent = "Where does this belong?";
    var body = clear($("dlgBody"));
    var raw = vial.importRaw || {};

    var name = document.createElement("input");
    name.value = raw.name || (/^Unreadable row/.test(vial.name) ? "" : vial.name) || "";
    name.autocomplete = "off";
    var nameField = el("div", "field");
    nameField.appendChild(el("label", null, "Name"));
    nameField.appendChild(name);
    body.appendChild(nameField);

    var boxSel = document.createElement("select");
    var boxes = [];
    E.eachBox(state, function(b, rack, unit){ boxes.push({ id: b.id, label: unit.name + " → " + rack.name + " → " + b.name, box: b }); });
    boxes.forEach(function(b){
      var o = document.createElement("option");
      o.value = b.id; o.textContent = b.label;
      boxSel.appendChild(o);
    });
    var boxField = el("div", "field");
    boxField.appendChild(el("label", null, "Box"));
    boxField.appendChild(boxSel);
    body.appendChild(boxField);

    var posInput = document.createElement("input");
    posInput.placeholder = "A1";
    posInput.autocomplete = "off";
    posInput.value = raw.position && /^[A-Za-z]+\s*\d+$/.test(raw.position) ? raw.position : "";
    var posField = el("div", "field");
    posField.appendChild(el("label", null, "Position"));
    posField.appendChild(posInput);
    body.appendChild(posField);

    body.appendChild(el("p", "note", "From the sheet: name " + (raw.name ? "\"" + raw.name + "\"" : "(blank)") +
      ", position " + (raw.position ? "\"" + raw.position + "\"" : "(blank)") + (raw.box ? " in " + raw.box : "") + "."));

    var msg = el("p", "note");
    body.appendChild(msg);

    var foot = clear($("dlgFoot"));
    var save = el("button", "primary", "Save");
    save.disabled = !canWrite() || !boxes.length;
    if (!boxes.length) msg.textContent = "There is nowhere to put it yet -- add a box first.";
    save.onclick = function(){
      var res = E.resolveImportRow(state, vial.id, { name: name.value, boxId: boxSel.value, position: posInput.value.trim() });
      if (!res.ok){ msg.textContent = res.reason; msg.style.color = "var(--bad)"; return; }
      state = res.state;
      $("dlg").close();
      markDirty("Fill in an import row");
      renderAll();
    };
    foot.appendChild(save);
    $("dlg").showModal();
  }

  function slotDialog(boxId, slot){
    var occ = E.occupancy(state, boxId);
    $("dlgTitle").textContent = occ.box.name + " · " + slot.position;
    var body = clear($("dlgBody"));
    var foot = clear($("dlgFoot"));

    if (!slot.vial){
      body.appendChild(el("p", "note", "This slot is empty."));
      var f = el("button", "primary", "Add into this slot");
      f.disabled = !canWrite();
      f.onclick = function(){
        freeze.boxId = boxId; $("dlg").close(); go("freeze");
        $("fzName").focus(); renderFreezePlan();
      };
      foot.appendChild(f);
      $("dlg").showModal();
      return;
    }

    var v = slot.vial;
    body.appendChild(el("div", "nm", v.name));
    var chips = el("div", "chips");
    chips.style.margin = "8px 0";
    facetChips(v).forEach(function(c){ chips.appendChild(el("span", "chip", c)); });
    (v.flags || []).forEach(function(fl){ chips.appendChild(el("span", "chip on", fl)); });
    body.appendChild(chips);
    body.appendChild(el("p", "note", vialMeta(v)));
    if (v.notes) body.appendChild(el("p", "note", "Notes: " + v.notes));
    if (v.importedFrom) body.appendChild(el("p", "note", "From " + v.importedFrom));

    var edit = el("button", null, "Edit");
    edit.disabled = !canWrite();
    edit.onclick = function(){ $("dlg").close(); editVial(v); };
    foot.appendChild(edit);
    var take = el("button", "primary", "Took it");
    take.disabled = !canWrite();
    take.onclick = function(){ $("dlg").close(); takeVial(v); };
    foot.appendChild(take);
    $("dlg").showModal();
  }

  // Admin picks a member from a third select before Unit/Box -- the same two selects a
  // member uses for their own boxes, just fed by that member's real state instead. The
  // box grid renders `static` (see boxGrid()), so no cell opens the slot dialog and
  // nothing here can ever write anywhere.
  function renderBoxes(){
    $("bxOwnerField").hidden = !canSeeWholeLab();
    if (!canSeeWholeLab()){ renderBoxesBody(false); return; }

    if (!labCache.members){
      clear($("bxGrid")).appendChild(el("div", "empty", "Loading the lab…"));
      clear($("bxLines"));
      ensureLabCache().then(renderBoxes);
      return;
    }
    var names = labCache.members.slice().sort();
    if (!names.length){
      clear($("bxGrid")).appendChild(el("div", "empty", "No member has any boxes yet."));
      clear($("bxLines"));
      return;
    }
    if (!boxView.owner || names.indexOf(boxView.owner) === -1) boxView.owner = names[0];
    var os = clear($("bxOwner"));
    names.forEach(function(name){
      var o = document.createElement("option");
      o.value = name; o.textContent = name; o.selected = name === boxView.owner;
      os.appendChild(o);
    });

    var real = state;
    ADMIN_MERGED = true;
    state = labCache.data[boxView.owner] || E.blankState();
    try { renderBoxesBody(true); } finally { state = real; ADMIN_MERGED = false; }
  }

  // The everyday version of "set up storage" -- just a name, a box defaulting to
  // 9×9 (Rename/Resize on Settings → Storage already handle changing that after).
  // Available to any member, same permission level as everything else on this screen;
  // hidden entirely for admin's read-only merged view, which has no inventory of its
  // own to add to.
  //
  // A box, and only a box. The freezer itself is the lab's: adding or removing one is
  // admin's, from Admin → Structure. A member who could add a freezer here was adding
  // it to everybody's tree, which is not theirs to do -- so the button is gone rather
  // than merely disabled.
  function renderBoxesQuickAdd(readOnly){
    var c = $("bxQuickAdd");
    c.hidden = !!readOnly;
    if (readOnly) return;
    clear(c);
    var hasUnits = !!(state.storage.units || []).length;
    var addBox = el("button", null, "Add a box");
    addBox.disabled = !canWrite() || !hasUnits;
    addBox.onclick = function(){ addBoxDialog(); };
    var row = el("div", "row tight");
    row.appendChild(addBox);
    c.appendChild(row);
    if (!hasUnits){
      c.appendChild(el("p", "note",
        "There's no freezer or tank set up yet — a box always lives inside one. " +
        "Ask an admin to add it from Admin → Structure."));
    }
  }

  function renderBoxesBody(readOnly){
    renderBoxesQuickAdd(readOnly);
    var units = state.storage.units || [];
    if (!units.length){
      clear($("bxGrid")).appendChild(el("div", "empty",
        readOnly ? "No freezer set up yet." : "No freezer set up yet — ask an admin to add one."));
      clear($("bxLines"));
      return;
    }
    if (!boxView.unitId || !E.findUnit(state, boxView.unitId)) boxView.unitId = units[0].id;

    var us = clear($("bxUnit"));
    units.forEach(function(u){
      var o = document.createElement("option");
      o.value = u.id; o.textContent = u.name; o.selected = u.id === boxView.unitId;
      us.appendChild(o);
    });

    // A drill-down breadcrumb, one <select> per level of the unit's subdivision tree
    // (unit -> rack -> box today; a shelf -> rack -> box unit gets an extra select),
    // ending in the box picker. If boxView.boxId already names a real box here --
    // e.g. jumped to from a search result -- its own real chain wins over whatever
    // was last picked in this breadcrumb, so the levels always agree with the box.
    var unit = E.findUnit(state, boxView.unitId);
    var jumpedTo = boxView.boxId ? E.findBox(state, boxView.boxId) : null;
    if (jumpedTo && jumpedTo.unit.id === boxView.unitId) boxView.rackPath = jumpedTo.chain.map(function(r){ return r.id; });
    if (!Array.isArray(boxView.rackPath)) boxView.rackPath = [];

    var pathBox = clear($("bxPath"));
    var levelRacks = unit.racks || [];
    var depth = 0, chosenLeaf = null;
    while (levelRacks.length){
      var selectedId = boxView.rackPath[depth];
      if (!levelRacks.some(function(r){ return r.id === selectedId; })) selectedId = levelRacks[0].id;
      boxView.rackPath[depth] = selectedId;
      boxView.rackPath.length = depth + 1;

      var lsel = document.createElement("select");
      levelRacks.forEach(function(r){
        var o = document.createElement("option");
        o.value = r.id; o.textContent = r.name; o.selected = r.id === selectedId;
        lsel.appendChild(o);
      });
      (function(d, sel){
        sel.onchange = function(){
          boxView.rackPath[d] = sel.value;
          boxView.rackPath.length = d + 1;
          boxView.boxId = null;
          renderBoxes();
        };
      })(depth, lsel);
      var lf = el("div", "field");
      lf.appendChild(el("label", null, (unit.childLabel || "Rack") + (depth ? " " + (depth + 1) : "")));
      lf.appendChild(lsel);
      pathBox.appendChild(lf);

      var chosenRack = levelRacks.filter(function(r){ return r.id === selectedId; })[0];
      if (chosenRack.racks && chosenRack.racks.length){ levelRacks = chosenRack.racks; depth++; }
      else { chosenLeaf = chosenRack; break; }
    }

    var bs = document.createElement("select");
    var first = null;
    (chosenLeaf ? (chosenLeaf.boxes || []) : []).forEach(function(box){
      if (!first) first = box.id;
      var occ = E.occupancy(state, box.id);
      var o = document.createElement("option");
      o.value = box.id;
      o.textContent = box.name + " — " + occ.used + "/" + occ.capacity;
      bs.appendChild(o);
    });
    if (!boxView.boxId || !E.findBox(state, boxView.boxId) ||
        E.findBox(state, boxView.boxId).unit.id !== boxView.unitId) boxView.boxId = first;
    bs.value = boxView.boxId;
    bs.onchange = function(){ boxView.boxId = bs.value; renderBoxes(); };
    var bf = el("div", "field"); bf.appendChild(el("label", null, "Box")); bf.appendChild(bs);
    pathBox.appendChild(bf);

    var g = clear($("bxGrid"));
    if (!boxView.boxId){ g.appendChild(el("div", "empty", "This unit has no boxes yet.")); return; }
    g.appendChild(boxGrid(boxView.boxId, { highlight: boxView.highlight, static: !!readOnly }));

    var occ = E.occupancy(state, boxView.boxId);
    $("bxOcc").textContent = occ.used + " of " + occ.capacity + " slots full · " + occ.free + " free";
    $("bxBar").style.width = (occ.capacity ? (occ.used / occ.capacity * 100) : 0) + "%";

    // What is actually in this box, so the colours mean something.
    var lines = clear($("bxLines"));
    lines.appendChild(el("h3", null, "In this box"));
    var byOrigin = {};
    occ.slots.forEach(function(s){
      if (!s.vial) return;
      var o = originOf(s.vial);
      if (!byOrigin[o]) byOrigin[o] = { n: 0, rows: {}, lines: {} };
      var g = byOrigin[o];
      g.n++;
      g.rows[s.position.replace(/\d+$/, "")] = true;
      var k = s.vial.lineId || s.vial.name;
      if (!g.lines[k]) g.lines[k] = { name: s.vial.name, n: 0, positions: [] };
      g.lines[k].n++;
      g.lines[k].positions.push(s.position);
    });
    var origins = Object.keys(byOrigin).sort(function(a, b){ return byOrigin[b].n - byOrigin[a].n; });
    if (!origins.length){ lines.appendChild(el("div", "empty", "Empty.")); return; }
    origins.forEach(function(o){
      var g = byOrigin[o];
      var head = el("div", "item");
      var dot = el("div");
      dot.style.cssText = "width:14px;height:14px;border-radius:4px;flex:0 0 auto;margin-top:3px;background:" + tintFor(o);
      head.appendChild(dot);
      var grow = el("div", "grow");
      var title = el("div", null, o);
      title.style.fontWeight = "650";
      grow.appendChild(title);
      var rowNames = Object.keys(g.rows).sort();
      grow.appendChild(el("div", "sub", g.n + " vial" + (g.n === 1 ? "" : "s") + " · row" +
        (rowNames.length === 1 ? " " : "s ") + rowNames.join(", ")));
      Object.keys(g.lines).sort(function(a, b){ return g.lines[b].n - g.lines[a].n; }).forEach(function(k){
        var l = g.lines[k];
        grow.appendChild(el("div", "sub", "· " + l.name + " — " + l.positions.join(", ")));
      });
      head.appendChild(grow);
      lines.appendChild(head);
    });
  }

  // =====================================================================
  // Review -- the queues the import left behind
  // =====================================================================

  // Admin sees every member's review queue merged onto this one screen, but never acts
  // on it here -- that would mean writing to someone else's file through a screen that
  // was never built to know whose file it is. So each member's own real `state` is
  // swapped in just long enough to build their section with the exact same code path a
  // member sees for their own queue (their own rules, correctly), then swapped back --
  // ADMIN_MERGED (checked by every button below) makes every one of those buttons
  // disabled while it's true, so nothing rendered during the swap can ever fire.
  function renderReview(){
    var box = clear($("reviewBody"));
    if (canSeeWholeLab()){
      renderMergedByOwner(box, renderReview, function(container){
        var q = E.reviewQueue(state);
        if (!q.total) return false;
        renderReviewBody(container);
        return true;
      }, "Nothing to review, lab-wide.");
      return;
    }
    renderReviewBody(box);
  }

  function renderReviewBody(box){
    var q = E.reviewQueue(state);

    if (!q.total){
      box.appendChild(el("div", "empty", "Nothing to review. Everything the import wasn't sure about has been answered."));
      return;
    }

    // ---- rows an import couldn't place at all ----
    if (q.ambiguousImport.length){
      var ic = el("div", "card");
      ic.appendChild(el("h3", null, "Rows we weren't sure about (" + q.ambiguousImport.length + ")"));
      ic.appendChild(el("p", "note",
        "No name, or no position that fits inside its box — rather than guess, these came in with " +
        "no location. They won't show up in Find until fixed here."));
      q.ambiguousImport.slice(0, 60).forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        var raw = v.importRaw || {};
        grow.appendChild(el("div", "sub",
          "sheet row " + (raw.row || "?") + ": name " + (raw.name ? "\"" + raw.name + "\"" : "(blank)") +
          ", position " + (raw.position ? "\"" + raw.position + "\"" : "(blank)") +
          (raw.box ? " in " + raw.box : "")));
        row.appendChild(grow);
        var fix = el("button", null, "Fix");
        fix.disabled = !canWrite() || ADMIN_MERGED;
        fix.onclick = function(){ resolveAmbiguousImport(v); };
        row.appendChild(fix);
        ic.appendChild(row);
      });
      if (q.ambiguousImport.length > 60) ic.appendChild(el("p", "note", "…and " + (q.ambiguousImport.length - 60) + " more."));
      box.appendChild(ic);
    }

    // ---- dates ----
    if (q.dates.length){
      var c = el("div", "card");
      c.appendChild(el("h3", null, "Dates to confirm (" + q.dates.length + ")"));
      c.appendChild(el("p", "note",
        "This column was typed day-month-year, but the spreadsheet read whatever it could as " +
        "month-day and converted it — so these have their day and month the wrong way round. " +
        "Nothing was changed automatically. Until a date is confirmed the vial stays out of the " +
        "date slider, but it is still findable by name."));

      var swappable = q.dates.filter(function(d){ return d.date.proposed; });
      if (swappable.length){
        var all = el("button", "primary", "Accept the swap for all " + swappable.length);
        all.disabled = !canWrite() || ADMIN_MERGED;
        all.onclick = function(){
          var next = state;
          swappable.forEach(function(d){
            var r = E.confirmDate(next, d.vial.id, d.date.proposed);
            if (r.ok) next = r.state;
          });
          state = next;
          markDirty("Confirm " + swappable.length + " dates");
          renderAll();
        };
        c.appendChild(all);
      }

      q.dates.slice(0, 40).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.vial.name));
        var sub = d.vial.frozenRaw
          ? "sheet says " + d.vial.frozenRaw + (d.date.asWritten ? " (reads as " + prettyDate(d.date.asWritten) + ")" : "")
          : "no date at all";
        grow.appendChild(el("div", "sub", sub + " · " + E.locationPath(state, d.vial.location)));
        row.appendChild(grow);

        if (d.date.proposed){
          var b = el("button", null, prettyDate(d.date.proposed));
          b.disabled = !canWrite() || ADMIN_MERGED;
          b.onclick = function(){
            var r = E.confirmDate(state, d.vial.id, d.date.proposed);
            if (!r.ok){ showBanner(esc(r.reason)); return; }
            state = r.state; markDirty("Confirm a date"); renderAll();
          };
          row.appendChild(b);
        } else {
          var t = el("button", null, "Type it");
          t.disabled = !canWrite() || ADMIN_MERGED;
          t.onclick = function(){ askDate(d.vial); };
          row.appendChild(t);
        }
        // A permanent "nobody knows" -- passage's "p?" for a date. Records the answer
        // once so this row stops coming back to Review every time it runs.
        var unk = el("button", null, "Unknown");
        unk.disabled = !canWrite() || ADMIN_MERGED;
        unk.onclick = function(){
          var r = E.markDateUnknown(state, d.vial.id);
          if (!r.ok){ showBanner(esc(r.reason)); return; }
          state = r.state; markDirty("Mark a date Unknown"); renderAll();
        };
        row.appendChild(unk);
        c.appendChild(row);
      });
      if (q.dates.length > 40) c.appendChild(el("p", "note", "…and " + (q.dates.length - 40) + " more."));
      box.appendChild(c);
    }

    // ---- facets ----
    if (q.facets.length){
      var fc = el("div", "card");
      fc.appendChild(el("h3", null, "Facets the rules read differently (" + q.facets.length + ")"));
      fc.appendChild(el("p", "note",
        "The spreadsheet's own formulas had five bugs. These are the rows where the corrected " +
        "rules disagree with what the sheet wrote. Nothing here needs doing — it's shown so the " +
        "change isn't silent. Dismissing accepts the new reading."));
      q.facets.slice(0, 60).forEach(function(d){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, d.name));
        var bits = Object.keys(d.changed).map(function(f){
          return f + ": " + d.changed[f].sheet + " → " + d.changed[f].now;
        });
        grow.appendChild(el("div", "sub", bits.join(" · ")));
        row.appendChild(grow);
        fc.appendChild(row);
      });
      if (q.facets.length > 60) fc.appendChild(el("p", "note", "…and " + (q.facets.length - 60) + " more."));
      var dismiss = el("button", null, "Accept all of these");
      dismiss.disabled = !canWrite() || ADMIN_MERGED;
      dismiss.onclick = function(){
        state.vials.forEach(function(v){ delete v.facetsFromSheet; });
        markDirty("Accept the corrected facets");
        renderAll();
      };
      fc.appendChild(dismiss);
      box.appendChild(fc);
    }

    // ---- gaps ----
    if (q.gaps.length){
      var gc = el("div", "card");
      gc.appendChild(el("h3", null, "Names no rule covers (" + q.gaps.length + ")"));
      gc.appendChild(el("p", "note",
        "The sheet wrote #N/A for these, which reads like a value but isn't one. Add a rule and " +
        "they fill themselves in — that's what Settings → Rules is for."));
      var byName = {};
      q.gaps.forEach(function(g){ byName[g.name] = (byName[g.name] || 0) + 1; });
      Object.keys(byName).sort().forEach(function(n){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", byName[n] + " vial" + (byName[n] === 1 ? "" : "s")));
        row.appendChild(grow);
        gc.appendChild(row);
      });
      var add = el("button", "primary", "Add a rule");
      add.disabled = ADMIN_MERGED;
      add.onclick = function(){ go("settings"); $("rulesCard").scrollIntoView({ behavior:"smooth" }); };
      gc.appendChild(add);
      box.appendChild(gc);
    }

    // ---- vials with no passage recorded ----
    if (q.unknownPassage.length){
      var uc = el("div", "card");
      uc.appendChild(el("h3", null, "Passage not recorded (" + q.unknownPassage.length + ")"));
      uc.appendChild(el("p", "note",
        "The sheet says p? for these. They are still findable by name, and the passage slider " +
        "keeps them behind its \u201cinclude unknown\u201d toggle rather than dropping them. " +
        "Fill one in whenever you happen to know it."));
      var byName = {};
      q.unknownPassage.forEach(function(v){
        if (!byName[v.name]) byName[v.name] = [];
        byName[v.name].push(v);
      });
      Object.keys(byName).sort().slice(0, 60).forEach(function(n){
        var list = byName[n];
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, n));
        grow.appendChild(el("div", "sub", list.length + " vial" + (list.length === 1 ? "" : "s") +
          " · " + list.map(function(v){ return E.locationPath(state, v.location).split(" → ").slice(-2).join(" "); }).join(", ")));
        row.appendChild(grow);
        var b = el("button", null, list.length === 1 ? "Fill in" : "Fill in first");
        b.disabled = !canWrite() || ADMIN_MERGED;
        b.onclick = function(){ editVial(list[0]); };
        row.appendChild(b);
        uc.appendChild(row);
      });
      if (Object.keys(byName).length > 60) uc.appendChild(el("p", "note", "…and more."));
      box.appendChild(uc);
    }

    // ---- rows holding more than one kind of cell ----
    if (q.rows.length){
      var rc = el("div", "card");
      rc.appendChild(el("h3", null, "Rows holding two kinds of cell (" + q.rows.length + ")"));
      rc.appendChild(el("p", "note",
        "A row is meant to hold one kind of cell — that is how the freezer is laid out, and it is " +
        "what the app follows when it proposes a place. These rows do not. Most of them are rows " +
        "carrying vials no origin rule covers yet, so adding the rule fixes the row too."));
      q.rows.forEach(function(m){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, m.box + " row " + m.label));
        grow.appendChild(el("div", "sub", m.origins.map(function(o){
          return o + " × " + m.counts[o];
        }).join("  ·  ")));
        row.appendChild(grow);
        var b = el("button", null, "Show");
        b.disabled = ADMIN_MERGED;
        b.onclick = function(){
          boxView.unitId = E.findBox(state, m.boxId).unit.id;
          boxView.boxId = m.boxId;
          boxView.highlight = [];
          go("boxes");
        };
        row.appendChild(b);
        rc.appendChild(row);
      });
      box.appendChild(rc);
    }

    // ---- implausible passages ----
    if (q.passages.length){
      var pc = el("div", "card");
      pc.appendChild(el("h3", null, "Passages that can't be right (" + q.passages.length + ")"));
      pc.appendChild(el("p", "note",
        "A passage in the tens of thousands is a date serial that landed in the wrong column. " +
        "One of these is enough to stretch the passage slider until it's useless."));
      q.passages.forEach(function(v){
        var row = el("div", "item");
        var grow = el("div", "grow");
        grow.appendChild(el("div", null, v.name));
        grow.appendChild(el("div", "sub", v.passage + " · " + E.locationPath(state, v.location)));
        row.appendChild(grow);
        var b = el("button", null, "Fix");
        b.disabled = !canWrite() || ADMIN_MERGED;
        b.onclick = function(){ editVial(v); };
        row.appendChild(b);
        pc.appendChild(row);
      });
      box.appendChild(pc);
    }
  }

  function askDate(vial){
    $("dlgTitle").textContent = "When was " + vial.name + " frozen?";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", vial.frozenRaw ? "The sheet says: " + vial.frozenRaw : "The sheet had nothing here."));
    var inp = document.createElement("input");
    inp.type = "date";
    body.appendChild(inp);
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    ok.onclick = function(){
      if (!inp.value) return;
      var r = E.confirmDate(state, vial.id, inp.value);
      if (!r.ok){ showBanner(esc(r.reason)); return; }
      state = r.state; $("dlg").close(); markDirty("Set a date"); renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  // =====================================================================
  // Log
  // =====================================================================

  function renderLog(){
    var box = clear($("logBody"));
    var stock = clear($("stockBody"));
    if (canSeeWholeLab()){
      renderMergedByOwner(box, renderLog, function(section){
        if (!(state.withdrawals || []).length) return false;
        renderLogBody(section);
        return true;
      }, "Nothing has been taken out, lab-wide.");
      renderMergedByOwner(stock, renderLog, function(section){
        var counts = E.stockCounts(state).filter(function(c){ return c.stored > 0; });
        if (!counts.length) return false;
        renderStockBody(section, counts);
        return true;
      }, "Nothing stored, lab-wide.");
      return;
    }
    renderLogBody(box);
    stock.appendChild(el("h3", null, "How much is left"));
    renderStockBody(stock, E.stockCounts(state).filter(function(c){ return c.stored > 0; }));
  }

  function renderLogBody(box){
    var log = (state.withdrawals || []).slice().reverse();

  // =====================================================================
  // Settings
  // =====================================================================

  // Builds the login/connect UI into whichever container asks for it -- the mandatory
  // login gate (#gateBody, shown before anyone is identified) and Settings' own
  // Connect card (#connectCard, for managing the connection once already in) render the
  // exact same thing, so there is exactly one place that knows how to log in or out.
  function renderConnect(container){
    var c = clear(container);
    c.appendChild(el("h3", null, "Connect"));

    // ---- log in (worker auth) ----
    var wu = getWorkerUser();
    if (wu){
      c.appendChild(el("p", "note",
        "Logged in as " + esc(wu.name) + (wu.role === "admin" ? " (admin)" : "") + ". Changes go through " +
        esc(getWorkerUrl()) + "."));
      var lo = el("button", "danger", "Log out");
      lo.id = "workerLogoutBtn";
      lo.onclick = async function(){
        lo.disabled = true;
        await workerLogout();
        afterAuthChange();
      };
      c.appendChild(lo);
    } else {
      c.appendChild(el("p", "note",
        "Log in with the name and password an admin set up for you. This is the lab-wide way in — " +
        "your own boxes, kept separate from everyone else's."));
      // A real <form> boundary -- without one, Safari's passkey/password heuristic treats
      // unrelated fields elsewhere on the page (like the plain search box) as part of this
      // "login form" too, since it has nothing else to scope to.
      var wform = document.createElement("form");
      wform.autocomplete = "off";
      var wurl = document.createElement("input");
      wurl.placeholder = "Worker address (https://…workers.dev)";
      // When the page is being served BY the backend, the answer is this address, and
      // it is offered even if an older one is still saved on this device. That is not a
      // hypothetical: changing the lab's Cloudflare subdomain changes this host, and
      // every device that had typed the old one in would otherwise be left logging in
      // against a name that no longer resolves. Logging in stores whatever is here.
      wurl.value = servedByWorker() ? location.origin : (getWorkerUrl() || "");
      wurl.autocomplete = "off";
      var wname = document.createElement("input");
      wname.placeholder = "Name"; wname.style.marginTop = "8px"; wname.autocomplete = "off";
      var wpass = document.createElement("input");
      // Deliberately "off", not "current-password" -- everyone in the lab logs in
      // through this one shared form/origin, so iCloud Keychain / Safari's password
      // manager was offering whichever account it had saved (not necessarily the one
      // being typed), which is actively wrong here rather than a convenience.
      wpass.type = "password"; wpass.placeholder = "Password"; wpass.autocomplete = "off";
      wpass.style.marginTop = "8px";
      wform.appendChild(wurl); wform.appendChild(wname); wform.appendChild(wpass);
      var wgo = el("button", "primary", "Log in");
      wgo.type = "button";
      wgo.id = "workerLoginBtn";
      wgo.style.marginTop = "8px";
      wgo.onclick = async function(){
        if (!wurl.value.trim() || !wname.value.trim() || !wpass.value) return;
        wgo.disabled = true;
        try {
          await workerLogin(wurl.value.trim(), wname.value.trim(), wpass.value);
          // The instant the active account changes, drop whatever was on screen for the
          // previous one -- load() will fill this back in from this account's own data (or
          // leave it blank, for a fresh account) once the fetch resolves.
          state = E.blankState();
          hideBanner();
          await load();
          afterAuthChange();
        } catch(err){
          showBanner("Couldn't log in: " + esc(err.message));
        }
        wgo.disabled = false;
      };
      wform.appendChild(wgo);
      c.appendChild(wform);
    }

    // ---- GitHub token (the older, per-device way in) ----
    c.appendChild(el("h3", null, "GitHub token"));
    if (getToken()){
      c.appendChild(el("p", "note", "Connected as " + getDevice() + ". Changes are committed to " + REPO + "."));
      var out = el("button", "danger", "Forget the token on this device");
      out.onclick = function(){
        try { localStorage.removeItem(LS.token); } catch(e){}
        afterAuthChange();
      };
      c.appendChild(out);
    } else {
      c.appendChild(el("p", "note",
        "Paste a GitHub personal access token with Contents: Read and write for " +
        (REPO || "this repository") + ". It stays on this device, and it is this app's own — " +
        "nothing else on this host reads or writes it."));
      var tform = document.createElement("form");
      tform.autocomplete = "off";
      var tok = document.createElement("input");
      tok.type = "password"; tok.placeholder = "github_pat_…"; tok.autocomplete = "off";
      var dev = document.createElement("input");
      dev.placeholder = "What is this device called?";
      dev.value = getDevice() === "unknown device" ? "" : getDevice();
      dev.style.marginTop = "8px"; dev.autocomplete = "off";
      tform.appendChild(tok); tform.appendChild(dev);
      c.appendChild(tform);
      var go2 = el("button", "primary", "Connect");
      go2.type = "button";
      go2.style.marginTop = "8px";
      go2.onclick = async function(){
        if (!tok.value.trim()) return;
        go2.disabled = true;
        try {
          var r = await fetch(API + "/contents/" + LEGACY_DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
            { headers: { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
                         "Authorization":"Bearer " + tok.value.trim() } });
          if (!r.ok && r.status !== 404) throw new Error("GitHub said " + r.status);
          localStorage.setItem(LS.token, tok.value.trim());
          localStorage.setItem(LS.device, dev.value.trim() || "a device");
          hideBanner();
          await load();
          afterAuthChange();
        } catch(err){
          showBanner("That token didn't work: " + esc(err.message));
        }
        go2.disabled = false;
      };
      c.appendChild(go2);
    }
  }

  // Light and dark were always here, but buried at the bottom of Connect, under the
  // worker URL and the GitHub token -- so nobody found them. Now its own card, first on
  // the Settings screen, because it is the one setting somebody changes for no reason at
  // all. It stays on the login gate too: choosing dark should not require logging in.
  // Per-device on purpose: it is how this phone looks, not a fact about the lab, so it
  // lives in localStorage and is never committed.
  function renderAppearance(target){
    var c = clear(target || $("appearanceCard"));
    c.appendChild(el("h3", null, "Appearance"));
    var seg = el("div", "seg");
    var current = (function(){ try { return localStorage.getItem(LS.theme) || "system"; } catch(e){ return "system"; } })();
    [{ id:"system", name:"System" }, { id:"light", name:"Light" }, { id:"dark", name:"Dark" }].forEach(function(opt){
      var b = el("button", current === opt.id ? "on" : null, opt.name);
      b.onclick = function(){
        if (opt.id === "system"){
          document.documentElement.removeAttribute("data-theme");
          try { localStorage.removeItem(LS.theme); } catch(e){}
        } else {
          document.documentElement.setAttribute("data-theme", opt.id);
          try { localStorage.setItem(LS.theme, opt.id); } catch(e){}
        }
        renderAppearance(target);
      };
      seg.appendChild(b);
    });
    c.appendChild(seg);
    c.appendChild(el("p", "note", current === "system"
      ? "Following this device — it turns dark when your phone or laptop does."
      : "Fixed to " + current + " on this device, whatever the system is set to."));
  }

  // Nothing about anyone's inventory ever renders before someone is identified -- either
  // a worker login or a legacy GitHub token, both of which canWrite() already recognizes.
  // Called after every login, logout, or token change, and once at boot.
  // Admin never has a Freeze tab -- they have no inventory of their own to freeze into
  // (see the "Admin" tab's "Manage a box" instead) -- and gets the Admin tab nobody else
  // does. Re-checked on every login/logout, since the same tab can move between a member
  // and an admin account over a session.
  function updateNavForRole(){
    var admin = isAdminUser();
    // Neither admin nor the PI has an inventory to add to; only admin gets the tools.
    $("navFreeze").hidden = !hasOwnInventory();
    $("navAdmin").hidden = !admin;
    if (!hasOwnInventory() && screen === "freeze") screen = "find";
  }

  function afterAuthChange(){
    var authed = canWrite();
    document.body.classList.toggle("gated", !authed);
    updateNavForRole();
    if (!authed){
      renderConnect($("gateBody"));
      // Appended, not replacing: renderConnect owns the rest of the gate.
      renderAppearance($("gateAppearance"));
      setStatus("Read-only", "");
      return;
    }
    setStatus("Ready", "");
    go(screen);
  }

  function renderSettings(){
    renderAppearance();
    renderConnect($("connectCard"));

    // The PI has no inventory of their own, so every card below this one -- storage,
    // rules, keywords, import, the integrity check -- is about a file that does not
    // exist for them. Connect is the whole of their Settings screen.
    ["storageCard", "rulesCard", "keywordsCard", "importCard", "checkCard"].forEach(function(id){
      clear($(id)).hidden = isPiUser();
    });
    if (isPiUser()) return;

    // ---- storage ----
    var s = clear($("storageCard"));
    s.appendChild(el("h3", null, "Storage"));
    s.appendChild(el("p", "note",
      "The freezers, racks and towers belong to the whole lab — admin lays them out in " +
      "Admin → Structure. What's below is your own boxes inside them; renaming or " +
      "resizing one changes it for everybody, because there is only one of it."));

    var GROUPING_OPTIONS = [
      { id:"category-row", name:"One row per cell", note:"The rule this app has always used: a row holds one cell, never two." },
      { id:"random", name:"No rule", note:"No grouping at all — a new freeze-down just takes the first free space." }
    ];
    var groupField = el("div", "field");
    groupField.appendChild(el("label", null, "How new freezes get grouped"));
    var groupSeg = el("div", "seg");
    var currentGrouping = E.groupingStrategyFor(state);
    GROUPING_OPTIONS.forEach(function(opt){
      var b = el("button", currentGrouping === opt.id ? "on" : null, opt.name);
      b.onclick = function(){
        state.settings.groupingStrategy = opt.id;
        markDirty("Switch grouping to " + opt.name.toLowerCase());
        renderAll();
      };
      groupSeg.appendChild(b);
    });
    groupField.appendChild(groupSeg);
    var currentGroupingOpt = GROUPING_OPTIONS.filter(function(o){ return o.id === currentGrouping; })[0];
    groupField.appendChild(el("p", "note", currentGroupingOpt ? currentGroupingOpt.note : ""));
    s.appendChild(groupField);
    (state.storage.units || []).forEach(function(unit){
      var head = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, unit.name));
      var sum = E.unitSummary(state, unit.id);
      grow.appendChild(el("div", "sub", sum.used + " of " + sum.capacity + " slots full · " +
        sum.boxes.length + " boxes · " + (unit.childLabel || "Rack") + "s"));
      head.appendChild(grow);
      s.appendChild(head);
      var me = (effectiveIdentity() || "").toLowerCase();
      E.leafRacks(state, unit.id).forEach(function(leaf){
        var pathName = leaf.chain.map(function(r){ return r.name; }).join(" → ");
        // Somebody else's box is theirs to rename; this screen is about your own.
        var mine = (leaf.rack.boxes || []).filter(function(b){ return !b.owner || b.owner.toLowerCase() === me; });
        mine.forEach(function(box){
          var occ = E.occupancy(state, box.id);
          var row = el("div", "item");
          var g2 = el("div", "grow");
          g2.appendChild(el("div", null, "　" + pathName + " → " + box.name));
          g2.appendChild(el("div", "sub", box.rows + " × " + box.cols + " · " + occ.used + "/" + occ.capacity));
          row.appendChild(g2);
          var ren = el("button", null, "Rename");
          ren.disabled = !canWrite();
          ren.onclick = function(){ renameBox(box); };
          row.appendChild(ren);
          var res = el("button", null, "Resize");
          res.disabled = !canWrite();
          res.onclick = function(){ resizeBox(box); };
          row.appendChild(res);
          s.appendChild(row);
        });
        if (!mine.length){
          var empty = el("div", "item");
          var others = (leaf.rack.boxes || []).length;

            (others ? others + " box" + (others === 1 ? "" : "es") + ", none of them yours" : "no boxes yet")));
          s.appendChild(empty);
        }
      });
    });
    s.appendChild(el("p", "note", "Adding a box or a freezer/tank moved to the Boxes tab — it's an everyday " +
      "action, not a settings change. Renaming and resizing stay here."));

    // ---- rules ----
    var r2 = clear($("rulesCard"));
    r2.appendChild(el("h3", null, "Rules"));
    r2.appendChild(el("p", "note",
      "In the spreadsheet, the cell name is the only thing typed — origin, KO/OX, resistance, " +
      "CASPEX and guide are all formulas over that one string. These are those formulas. " +
      "Adding a common label here is all it takes; nothing is built into the app."));
    E.FACETS.forEach(function(facet){
      var list = state.rules[facet] || [];
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, facet));
      grow.appendChild(el("div", "sub", list.length + " rule" + (list.length === 1 ? "" : "s") + ", tried in order"));
      row.appendChild(grow);
      var add = el("button", null, "Add");
      add.disabled = !canWrite();
      add.onclick = function(){ addRuleDialog(facet); };
      row.appendChild(add);
      r2.appendChild(row);

      // One row per rule rather than one grey line per facet: a rule that reads wrong
      // (or was typed wrong) has to be fixable and removable, not just addable. Both

      // ruleImpact().
      list.forEach(function(rule, index){
        var rr = el("div", "item");
        var rg = el("div", "grow");
        rg.appendChild(el("div", "sub mono", "　" + ruleText(rule)));
        rr.appendChild(rg);
        var edit = el("button", null, "Edit");
        edit.disabled = !canWrite();
        edit.onclick = function(){ editRuleDialog(facet, index); };
        rr.appendChild(edit);
        var del = el("button", "danger", "Delete");
        del.style.marginLeft = "6px";
        del.disabled = !canWrite();
        del.onclick = function(){ deleteRuleDialog(facet, index); };
        rr.appendChild(del);
        r2.appendChild(rr);
      });
    });

    // ---- keywords ----
    var k = clear($("keywordsCard"));
    k.appendChild(el("h3", null, "Keywords"));
    k.appendChild(el("p", "note",
      "A word or phrase in Notes becomes a searchable tag — built in for things like " +
      "\"myco -\" or \"to-do\". Add your own below; nothing here replaces the built-in ones."));
    E.FLAG_RULES.forEach(function(rule){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, rule.flag));
      grow.appendChild(el("div", "sub", "built in"));
      row.appendChild(grow);
      k.appendChild(row);
    });
    (state.settings.customFlags || []).forEach(function(c){
      var row = el("div", "item");
      var grow = el("div", "grow");
      grow.appendChild(el("div", null, c.flag));
      grow.appendChild(el("div", "sub mono", "\"" + c.match + "\""));
      row.appendChild(grow);
      k.appendChild(row);
    });
    var addKeyword = el("button", null, "Add a keyword");
    addKeyword.disabled = !canWrite();
    addKeyword.onclick = function(){ addKeywordDialog(); };
    k.appendChild(addKeyword);

    // ---- import ----
    var i = clear($("importCard"));
    i.appendChild(el("h3", null, "Import a spreadsheet"));
    i.appendChild(el("p", "note",
      "Reads an .xlsx in the browser. It shows what it found before anything is written, and it " +
      "replaces the whole inventory rather than merging — so use it to start, not to top up."));
    var pick = el("button", null, "Choose a file");
    pick.disabled = !canWrite();
    pick.onclick = openImport;
    i.appendChild(pick);

    var dl = el("button", null, "Download the workbook");
    dl.style.marginTop = "8px";
    dl.onclick = async function(){
      var blob = new Blob([await workbookBytes()],
        { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cell-stocks.xlsx";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    };
    i.appendChild(dl);
    i.appendChild(el("p", "note",
      "The workbook is written from this inventory every time it's saved, so the two can't drift. " +
      "That also means editing it by hand is pointless — the next save overwrites it."));

    // ---- check ----
    var ch = clear($("checkCard"));
    ch.appendChild(el("h3", null, "Check it"));
    var problems = E.validate(state);
    var errs = problems.filter(function(p){ return p.level === "error"; });
    var line = el("p", "note");
    line.textContent = state.vials.length + " vials · " + state.lines.length + " lines · " +
      errs.length + " errors · " + (problems.length - errs.length) + " warnings";
    ch.appendChild(line);
    problems.slice(0, 30).forEach(function(p){
      ch.appendChild(el("div", "prob " + p.level, p.message));
    });
    if (problems.length > 30) ch.appendChild(el("p", "note", "…and " + (problems.length - 30) + " more."));
    if (!problems.length) ch.appendChild(el("p", "note", "Nothing wrong: no slot holds two vials, every position is inside its box."));
  }

  function renameBox(box){
    $("dlgTitle").textContent = "Rename " + box.name;
    var body = clear($("dlgBody"));
    var inp = document.createElement("input");
    inp.value = box.name;
    inp.autocomplete = "off";
    body.appendChild(inp);
    var foot = clear($("dlgFoot"));
    var msg = el("p", "note"); body.appendChild(msg);
    var ok = el("button", "primary", "Save");
    ok.onclick = async function(){
      if (!inp.value.trim()) return;
      ok.disabled = true;
      try {
        await editLabBox(box.id, function(b){ b.name = inp.value.trim(); }, "Rename a box");
        $("dlg").close(); renderAll();
      } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function resizeBox(box){
    $("dlgTitle").textContent = "Resize " + box.name;
    var body = clear($("dlgBody"));
    var rows = document.createElement("input"); rows.type = "number"; rows.min = 1; rows.value = box.rows;
    var cols = document.createElement("input"); cols.type = "number"; cols.min = 1; cols.value = box.cols;
    var g = el("div", "two");
    var f1 = el("div", "field"); f1.appendChild(el("label", null, "Rows")); f1.appendChild(rows);
    var f2 = el("div", "field"); f2.appendChild(el("label", null, "Columns")); f2.appendChild(cols);
    g.appendChild(f1); g.appendChild(f2);
    body.appendChild(g);
    var msg = el("p", "note");
    body.appendChild(msg);
    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save");
    ok.onclick = async function(){
      var can = E.canResizeBox(state, box.id, Number(rows.value), Number(cols.value));
      if (!can.ok){ msg.textContent = can.reason; msg.style.color = "var(--bad)"; return; }
      ok.disabled = true;
      try {
        await editLabBox(box.id, function(b){ b.rows = Number(rows.value); b.cols = Number(cols.value); }, "Resize a box");
        $("dlg").close(); renderAll();
      } catch(err){ msg.textContent = "Couldn't save that: " + err.message; msg.style.color = "var(--bad)"; }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  // Name-only, on purpose -- this is the everyday action (Boxes tab), not a settings
  // change. A box defaults to 9×9; Settings → Storage's own Rename/Resize buttons
  // already handle changing that afterwards, so there is nothing to ask up front.
  function addBoxDialog(){
    $("dlgTitle").textContent = "Add a box";
    var body = clear($("dlgBody"));
    var unit = document.createElement("select");
    // Every rack that can actually hold a box today, whatever unit and however
    // deeply nested it is -- see E.leafRacks.
    E.leafRacks(state).forEach(function(leaf){
      var o = document.createElement("option");
      o.value = leaf.unit.id + "|" + leaf.rack.id;
      o.textContent = leaf.unit.name + " → " + leaf.chain.map(function(r){ return r.name; }).join(" → ");
      unit.appendChild(o);
    });
    var name = document.createElement("input"); name.placeholder = "Box 7"; name.autocomplete = "off";
    var fields = [["Name", name]];
    // Only worth asking "where" when there's an actual choice -- one rack in one unit
    // (the common case just after adding a first freezer) needs no picker at all.
    if (unit.options.length > 1) fields.unshift(["Where", unit]);
    fields.forEach(function(p){
      var f = el("div", "field");
      f.appendChild(el("label", null, p[0]));
      f.appendChild(p[1]);
      body.appendChild(f);
    });
    body.appendChild(el("p", "note", "Starts at 9×9 — resize it afterwards from Settings → Storage. " +
      "The freezer itself is shared by the whole lab; the box is yours."));
    var foot = clear($("dlgFoot"));
    var msg = el("p", "note"); body.appendChild(msg);
    var ok = el("button", "primary", "Add");
    ok.onclick = async function(){
      if (!name.value.trim() || !unit.value) return;
      ok.disabled = true;
      try {
        // The freezer is the lab's, so this lands in the shared file, not in this
        // account's own. Re-read it first: somebody else may have added a rack since
        // this screen was drawn, and this is last-write-wins like every file here.
        var fresh = await fetchLabStorage();
        var rackId = unit.value.split("|")[1];
        var rk = E.findRackNode(fresh, rackId);
        if (!rk){ msg.textContent = "That rack has just been removed — reopen this and pick another."; ok.disabled = false; return; }
        var id = "b-" + name.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        if (E.findBox(fresh, id)) id += "-" + Date.now().toString(36).slice(-4);
        rk.rack.boxes = rk.rack.boxes || [];
        // The box is this account's: placement and the everyday screens filter on it.
        rk.rack.boxes.push({ id:id, name:name.value.trim(), rows:9, cols:9, scheme:"grid",
                             note:"", archived:false, owner: (effectiveIdentity() || "").toLowerCase() });
        await commitLabStorage(fresh, "Add a box");
        $("dlg").close();
        showBanner("Added <b>" + esc(name.value.trim()) + "</b>.");
        renderAll();
      } catch(err){
        msg.textContent = "Couldn't save that: " + err.message;
        msg.style.color = "var(--bad)";
      }
      ok.disabled = false;
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  // How one rule reads, in one line -- the same wording in the Settings list and in
  // every confirm below, so a rule is recognisable wherever it is mentioned.
  function ruleText(rule){
    if (rule.extract) return "/" + rule.extract + "/" + (rule.value !== undefined ? " → " + rule.value : "");
    if (rule.match !== undefined) return rule.match + " → " + rule.value;
    return "else " + rule.value;
  }

  // What swapping `state.rules` for `trial` would actually do to this inventory: how many
  // vials read differently, how many of those are pinned by hand (and so do not move at
  // all -- facetsFor() never recomputes those), and whether it opens or closes gaps.
  // Every add/edit/delete below shows this before it is applied; nothing here writes.
  function ruleImpact(trial, facet){
    var before = E.classifyAll(state, state.rules);
    var after = E.classifyAll(state, trial);
    var changed = 0, pinned = 0;
    (state.vials || []).forEach(function(v){
      if (E.classify(v.name, trial)[facet] === E.classify(v.name, state.rules)[facet]) return;
      changed++;
      if (v.facetsSetByHand && v.facetsSetByHand[facet] !== undefined) pinned++;
    });
    return { changed: changed, pinned: pinned, gapsBefore: before.gaps.length, gapsAfter: after.gaps.length,
             total: (state.vials || []).length };
  }

  function impactSentence(imp){
    var bits = ["This changes " + imp.changed + " of " + imp.total + " vials"];
    if (imp.pinned) bits.push(imp.pinned + " of them are pinned by hand and stay as they are");
    var d = imp.gapsAfter - imp.gapsBefore;
    if (d > 0) bits.push("it opens " + d + " new gap" + (d === 1 ? "" : "s"));
    else if (d < 0) bits.push("it closes " + (-d) + " of the " + imp.gapsBefore + " gaps");
    return bits.join(" · ") + ".";
  }

  // Edits one existing rule in place, keeping its position in the list -- order matters,
  // rules are tried top to bottom. The fields follow the rule's own shape: a plain
  // "contains -> value" rule gets two text boxes, an extraction rule gets its pattern
  // (a real regular expression, labelled as one), a fallback gets just its value.
  function editRuleDialog(facet, index){
    var rule = (state.rules[facet] || [])[index];
    if (!rule) return;
    $("dlgTitle").textContent = "Edit a " + facet + " rule";
    var body = clear($("dlgBody"));
    var fields = [], inputs = {};
    function field(key, label, value, placeholder, mono){
      var input = document.createElement("input");
      input.value = value === undefined ? "" : value;
      input.placeholder = placeholder || "";
      input.autocomplete = "off";
      if (mono) input.className = "mono";
      inputs[key] = input;
      fields.push([label, input]);
    }
    if (rule.extract !== undefined){
      body.appendChild(el("p", "note",
        "This one is a pattern (a regular expression) matched against the name, not plain text. " +
        "The preview below is the safety net -- check it before saving."));
      field("extract", "Pattern", rule.extract, "(DS)?g\\\\d+", true);
      if (rule.value !== undefined) field("value", "then " + facet + " is", rule.value, "");
    } else if (rule.match !== undefined){
      field("match", "If the name contains", rule.match, "LCC");
      field("value", "then " + facet + " is", rule.value, "LnCap");
    } else {
      body.appendChild(el("p", "note",
        "This is the fallback: what " + facet + " becomes when no rule above it matched."));
      field("value", "Otherwise " + facet + " is", rule.value, "-");
    }
    fields.forEach(function(p){
      var f = el("div", "field");
      f.appendChild(el("label", null, p[0]));
      f.appendChild(p[1]);
      body.appendChild(f);
    });
    var preview = el("p", "note");
    body.appendChild(preview);

    function candidate(){
      var next = JSON.parse(JSON.stringify(rule));
      Object.keys(inputs).forEach(function(k){ next[k] = inputs[k].value; });
      return next;
    }
    function refresh(){
      var trial = JSON.parse(JSON.stringify(state.rules));
      trial[facet][index] = candidate();
      preview.textContent = impactSentence(ruleImpact(trial, facet));
    }
    Object.keys(inputs).forEach(function(k){ inputs[k].oninput = refresh; });
    refresh();

    var foot = clear($("dlgFoot"));
    var ok = el("button", "primary", "Save the rule");
    ok.onclick = function(){
      var next = candidate();
      var blank = Object.keys(inputs).some(function(k){ return !String(inputs[k].value).trim(); });
      if (blank){ showBanner("A rule can't have an empty field."); return; }
      Object.keys(inputs).forEach(function(k){ next[k] = String(inputs[k].value).trim(); });
      state.rules[facet][index] = next;
      $("dlg").close();
      markDirty("Edit a " + facet + " rule");
      renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function deleteRuleDialog(facet, index){
    var rule = (state.rules[facet] || [])[index];
    if (!rule) return;
    var trial = JSON.parse(JSON.stringify(state.rules));
    trial[facet].splice(index, 1);
    var imp = ruleImpact(trial, facet);
    $("dlgTitle").textContent = "Delete a " + facet + " rule";
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note", "Deleting: " + ruleText(rule)));
    body.appendChild(el("p", "note", impactSentence(imp)));
    var foot = clear($("dlgFoot"));
    var ok = el("button", "danger", "Delete it");
    ok.onclick = function(){
      state.rules[facet].splice(index, 1);
      $("dlg").close();
      markDirty("Delete a " + facet + " rule");
      renderAll();
    };
    foot.appendChild(ok);
    $("dlg").showModal();
  }

  function addRuleDialog(facet){
    $("dlgTitle").textContent = "A rule for " + facet;
    var body = clear($("dlgBody"));
    body.appendChild(el("p", "note",
      "If a name contains the text on the left, this facet becomes the value on the right. " +
      "Rules are tried in order and the new one goes first."));
    var match = document.createElement("input"); match.placeholder = "LCC"; match.autocomplete = "off";
    var value = document.createElement("input"); value.placeholder = "LCC"; value.autocomplete = "off";
    [["If the name contains", match], ["then " + facet + " is", value]].forEach(function(p){
      var f = el("div", "field");

    function refresh(){
