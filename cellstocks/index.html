<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable=no turns off pinch; touch-action below turns off the
     double-tap zoom, which iOS does NOT take the viewport's word for. Both are needed.
     Umut asked for no zoom at all: this is a grid of small cells you tap, and a stray
     double tap on one of them zoomed the page instead of opening the slot. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CAApp</title>
<script>
// The app has one address now, and it is not this one. It used to live at
// <account>.github.io/cagiral-schedule/cellstocks/, which put a person's name in front
// of everyone holding the link; it is served by its own Worker instead. This file is
// still published to GitHub Pages -- the whole repository is, and .nojekyll means there
// is no way to publish some of it and not the rest -- so the old address answers, and
// what it does is send you on. Anyone with the old bookmark, or the old icon on their
// home screen, lands in the right place instead of on a 404.
//
// First thing in <head>, before the manifest or a single byte of the app, so the old
// address never renders and never registers a service worker of its own.
(function(){
  if (!/\.github\.io$/i.test(location.hostname || "")) return;
  location.replace("https://cellstocks-worker.caalabworkersdev.workers.dev/");
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<style>
  /* The accent is cold cyan, for a freezer. The greys are the same neutral ramp the
     other apps on this host use, so nothing here looks foreign next to them. */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#d8dce1; --text:#1f2430; --muted:#6b7280;
    --accent:#0891b2; --accent-soft:#cffafe;
    --warn-bg:#fff7ed; --warn-border:#fde68a; --warn-text:#7c2d12;
    --ok:#15803d; --bad:#b91c1c; --guess:#a16207; --guess-bg:#fef9c3;
    --card:#ffffff; --slot:#eef1f5;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  /* Dark mode drops the cyan accent entirely -- gray/black/white only, per Umut's
     request ("akşamları da beyaz siyah ama mavi tamamen denklemden çıksın"). Light
     mode is untouched. */
  /* No double-tap zoom. iOS stopped honouring user-scalable=no years ago and only
     touch-action:manipulation actually removes the double-tap gesture; it keeps ordinary
     scrolling and tapping, and only drops the "wait, was that a double tap?" delay and
     the zoom that came with it. */
  html{ touch-action:manipulation; -webkit-text-size-adjust:100%; }

  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#14161a; --panel:#1c1f26; --border:#2c3038; --text:#e6e8eb; --muted:#9aa1ac;
      --accent:#6b7280; --accent-soft:#2c3038;
      --warn-bg:#2a2210; --warn-border:#5c4a16; --warn-text:#fcd9a8;
      --ok:#4ade80; --bad:#f87171; --guess:#fbbf24; --guess-bg:#3a2f0b;
      --card:#1c1f26; --slot:#232830;
    }
  }
  html[data-theme="dark"]{
    --bg:#14161a; --panel:#1c1f26; --border:#2c3038; --text:#e6e8eb; --muted:#9aa1ac;
    --accent:#6b7280; --accent-soft:#2c3038;
    --warn-bg:#2a2210; --warn-border:#5c4a16; --warn-text:#fcd9a8;
    --ok:#4ade80; --bad:#f87171; --guess:#fbbf24; --guess-bg:#3a2f0b;
    --card:#1c1f26; --slot:#232830;
  }

  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:contain; height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column; min-height:100%;
  }
  button{
    font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; color:var(--text);
  }
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.45; cursor:not-allowed}
  input,select,textarea{
    font:inherit; padding:7px 9px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); width:100%;
  }
  a{color:var(--accent)}

  header{
    display:flex; align-items:center; gap:8px; padding:calc(8px + var(--safe-t)) 12px 8px;
    background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  /* iOS translucency where the browser supports it; @supports keeps the solid
     var(--panel) fill (already set above) as the fallback everywhere else. */
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    header,nav{
      background:color-mix(in srgb, var(--panel) 82%, transparent);
      -webkit-backdrop-filter:saturate(180%) blur(14px);
      backdrop-filter:saturate(180%) blur(14px);
    }
  }
  header h1{font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em}
  .brand-mark{width:22px; height:22px; border-radius:6px; flex:0 0 auto}
  footer{
    padding:14px 12px calc(14px + var(--safe-b)); text-align:center; font-size:11.5px;
    color:var(--muted); border-top:1px solid var(--border);
  }
  #status{font-size:12px; color:var(--muted); margin-left:auto; text-align:right}
  #status.saving{color:var(--accent)} #status.saved{color:var(--ok)} #status.error{color:var(--bad)}

  .banner{
    padding:9px 12px; font-size:13px; background:var(--warn-bg); color:var(--warn-text);
    border-bottom:1px solid var(--warn-border); display:none; line-height:1.5;
  }
  .banner.show{display:block}
  .banner button{margin-left:8px; padding:3px 9px; font-size:12px}
  .banner code{background:rgba(0,0,0,.08); padding:1px 4px; border-radius:4px}

  main{flex:1; padding:12px; padding-bottom:calc(74px + var(--safe-b)); max-width:760px; width:100%; margin:0 auto}
  .screen{display:none} .screen.active{display:block}

  /* Logging in is mandatory: nothing about anyone's inventory renders until someone is
     identified. See afterAuthChange() -- this class is the only thing that toggles it. */
  .gate{display:none}
  body.gated main, body.gated nav{display:none}
  body.gated .gate{display:block; padding:12px; max-width:520px; width:100%; margin:0 auto}

  nav{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--panel);
    border-top:1px solid var(--border); padding-bottom:var(--safe-b); z-index:20;
  }
  nav button{
    flex:1; border:0; border-radius:0; background:none; padding:9px 2px 10px; position:relative;
    font-size:10.5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  /* Without this, `nav button{display:flex}` above always wins over the browser's own
     [hidden]{display:none} default (an author rule beats a UA one regardless of
     specificity) -- so a hidden nav button, like #navAdmin for anyone who isn't admin,
     silently stayed visible. */
  nav button[hidden]{display:none}
  nav button .ic{font-size:17px; line-height:1}
  nav button.on{color:var(--accent); font-weight:650}
  nav button .dot{
    position:absolute; top:6px; left:50%; transform:translateX(9px);
    min-width:15px; height:15px; padding:0 4px; border-radius:99px; background:var(--accent);
    color:#fff; font-size:9.5px; line-height:15px; font-weight:700;
  }

  h2{font-size:16px; margin:0 0 10px; font-weight:650}
  h3{font-size:13px; margin:18px 0 8px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  p.note{font-size:12.5px; color:var(--muted); line-height:1.55; margin:8px 0}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .row.tight{gap:6px; margin-top:6px}
  .row > button{flex:1; min-width:110px}
  .field{margin-top:10px}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

  /* One vial is the common case, so the field starts at 1 and the two buttons do the
     rest. They are 44px so a thumb hits them, and the number stays typeable for the
     rare "I froze twelve". */
  .stepper{display:flex; align-items:stretch; gap:6px}
  .stepper button{
    flex:0 0 44px; width:44px; font-size:19px; line-height:1; font-weight:600;
    padding:0; display:flex; align-items:center; justify-content:center;
  }
  .stepper input{
    flex:1; min-width:0; text-align:center; font-variant-numeric:tabular-nums;
    font-size:16px; font-weight:600;
  }
  /* The spinners duplicate the buttons and shrink the tap target. */
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .stepper input[type=number]{-moz-appearance:textfield; appearance:textfield}

  /* ---- chips ---- */
  .chips{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
  .chip{
    font-size:11px; padding:2px 8px; border-radius:99px; background:var(--slot);
    border:1px solid var(--border); color:var(--muted); white-space:nowrap;
  }
  .chip.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:650}
  .chip.guess{background:var(--guess-bg); color:var(--guess); border-color:var(--guess)}
  .chip.gap{background:var(--warn-bg); color:var(--warn-text); border-color:var(--warn-border); font-weight:650}
  button.chip{cursor:pointer; padding:3px 9px}

  /* ---- search ---- */
  #q{font-size:16px; padding:10px 12px}
  .filters{margin-top:12px}
  .flt{margin-top:14px}
  .flt .hd{display:flex; align-items:baseline; gap:8px; font-size:12px; margin-bottom:2px}
  .flt .hd b{font-size:12px; font-weight:650}
  .flt .hd .val{color:var(--accent); font-weight:650; margin-left:auto; font-variant-numeric:tabular-nums}
  .flt .sub{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5}

  /* Two range inputs stacked into one dual-handle slider. The track is drawn by the
     divs; the inputs are transparent and only their thumbs take pointer events, so
     whichever handle is nearer the touch is the one that moves. */
  .dual{position:relative; height:30px; margin-top:6px}
  .dual .track,.dual .fill{position:absolute; top:13px; height:4px; border-radius:99px}
  .dual .track{left:0; right:0; background:var(--border)}
  .dual .fill{background:var(--accent)}
  .dual input[type=range]{
    position:absolute; left:0; top:0; width:100%; height:30px; margin:0; padding:0;
    -webkit-appearance:none; appearance:none; background:none; pointer-events:none;
  }
  .dual input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; pointer-events:auto; width:22px; height:22px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); cursor:grab;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .dual input[type=range]::-moz-range-thumb{
    pointer-events:auto; width:20px; height:20px; border-radius:50%;
    background:var(--panel); border:2px solid var(--accent); cursor:grab;
  }
  .dual input[type=range]::-moz-range-track{background:none; border:0}

  /* The storage tree: one row per folder, indented by depth, with the whole lab open
     at once. A box row is draggable and a leaf rack is a drop target (desktop only). */
  .tree{display:flex; flex-direction:column; gap:2px; margin-top:8px}
  .treeRow{display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:8px}
  .treeRow:hover{background:var(--panel)}
  .treeRow.dropTarget{outline:2px dashed var(--accent); outline-offset:-2px; background:var(--accent-soft)}
  .treeBody{display:flex; align-items:center; gap:6px; cursor:pointer; min-width:0}
  .treeName{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .treeBody .sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nodeIcon{width:1.2em; height:1.2em; object-fit:contain; flex:0 0 auto; text-align:center; line-height:1.2}
  .twisty{flex:0 0 auto; width:22px; padding:0; border:0; background:none; color:var(--muted); font-size:12px}
  .twisty:disabled{opacity:.35}
  .structRowEdit{flex:0 0 auto; padding:2px 8px}
  .iconPreview{display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .iconPalette{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px}
  .iconChoice{padding:4px 8px; font-size:16px; line-height:1}

  /* Scrolls sideways rather than clipping: the Admin strip has more tabs than fit on a
     phone, and `overflow:hidden` hard-cut the last one ("Handoff") with nothing to say it
     was there. flex-shrink:0 + nowrap stops a button ever being squeezed below its own
     label; flex-grow:1 still lets the two- and three-button segments elsewhere (theme,
     grouping, the Find filters) fill the width exactly as they did before. */
  .seg{
    display:flex; gap:0; border:1px solid var(--border); border-radius:8px;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .seg::-webkit-scrollbar{display:none}
  .seg button{
    flex:1 0 auto; white-space:nowrap;
    border:0; border-radius:0; font-size:12px; padding:6px 10px; background:var(--panel);
    border-right:1px solid var(--border); color:var(--muted);
  }
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent-soft); color:var(--accent); font-weight:650}

  .toggle{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:8px}
  /* An iOS-style pill switch, drawn entirely from the checkbox itself -- no extra
     markup, so every existing <label class="toggle"><input type=checkbox> keeps
     working unchanged. */
  .toggle input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:38px; height:23px; min-width:38px;
    border-radius:99px; background:var(--border); border:none; position:relative;
    cursor:pointer; transition:background-color .15s ease;
  }
  .toggle input[type=checkbox]::before{
    content:""; position:absolute; top:2px; left:2px; width:19px; height:19px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .15s ease;
  }
  .toggle input[type=checkbox]:checked{background:var(--ok)}
  .toggle input[type=checkbox]:checked::before{transform:translateX(15px)}

  /* ---- results ---- */
  .res{
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:12px; padding:11px 12px; margin-bottom:9px;
  }
  .res .nm{font-weight:650; font-size:14px; line-height:1.35; word-break:break-word}
  .res .where{font-size:13px; margin-top:5px; font-weight:600}
  .res .where .pos{
    background:var(--accent-soft); color:var(--accent); border-radius:6px;
    padding:1px 7px; font-weight:700; margin-left:4px;
  }
  .res .meta{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5}
  .res .miss{font-size:11.5px; color:var(--guess); margin-top:4px}
  .res.gone{border-left-color:var(--muted); opacity:.72}

  /* ---- box grid ---- */
  .boxgrid{display:grid; gap:3px; margin-top:10px; overflow-x:auto}
  .slot{
    aspect-ratio:1; border-radius:5px; background:var(--slot); border:1px solid transparent;
    font-size:9px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer; overflow:hidden; min-width:26px;
  }
  .slot.taken{border-color:rgba(0,0,0,.10); color:#10151c; font-weight:650}
  .slot.target{outline:2.5px solid var(--accent); outline-offset:-1px; background:var(--accent-soft)}
  .slot.hit{outline:2.5px solid var(--bad); outline-offset:-1px}
  .gridwrap{display:grid; gap:3px; align-items:center}
  .axis{font-size:9.5px; color:var(--muted); text-align:center}
  .axis.r{text-align:right; padding-right:3px}

  .occ{font-size:12px; color:var(--muted); margin-top:8px}
  .bar{height:5px; border-radius:99px; background:var(--border); margin-top:6px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent)}

  /* ---- lists ---- */
  .item{
    display:flex; gap:10px; align-items:flex-start; padding:9px 0;
    border-bottom:1px solid var(--border); font-size:13px;
  }
  .item:last-child{border-bottom:0}
  .item .grow{flex:1; min-width:0}
  .item .sub{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.5}
  .item button{padding:4px 9px; font-size:11.5px; white-space:nowrap}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px}
  .strike{text-decoration:line-through; color:var(--muted)}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:26px 10px; line-height:1.6}
  .prob{font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); line-height:1.5}
  .prob.error{color:var(--bad)} .prob.warning{color:var(--guess)}

  dialog{
    border:1px solid var(--border); border-radius:16px; padding:0; background:var(--panel);
    color:var(--text); max-width:520px; width:calc(100% - 24px); max-height:84vh;
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg-head{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border)}
  .dlg-head h3{margin:0; text-transform:none; letter-spacing:0; font-size:14px; color:var(--text)}
  .dlg-body{padding:14px; overflow:auto; max-height:60vh}
  .dlg-foot{padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
  .dlg-foot button{flex:1; min-width:100px}
  .refresh { background:none; border:0; font-size:1.1rem; line-height:1; padding:.2rem .4rem;
    color:inherit; opacity:.65; cursor:pointer; }
  .refresh:hover { opacity:1; }
  .refresh[disabled] { opacity:.25; cursor:default; }
  .refresh.spin { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <img src="icon-192.png" alt="" class="brand-mark">
  <h1>CAApp</h1>
  <span id="status">Loading…</span>
  <!-- Asked for by name: "en azindan bir yenile/update tusu eklesek". Safe to press at
       any moment now -- work this device has not committed is merged with what comes
       back, never replaced by it. -->
  <button id="refresh" class="refresh" title="Take another look at the freezer" aria-label="Refresh">↻</button>
</header>
<div class="banner" id="banner"></div>

<div class="gate" id="authGate">
  <h2>Log in</h2>
  <p class="note">CAApp is lab-wide now — nothing shows until you're identified, so no
    one sees anyone's boxes by just opening the page.</p>
  <div class="card" id="gateBody"></div>
  <div class="card" id="gateAppearance"></div>
</div>

<main>
  <section class="screen active" id="s-find">
    <input id="q" type="search" placeholder="hela p12 caspex g5.1 …" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="filters" id="filters"></div>
    <div id="results"></div>
  </section>

  <section class="screen" id="s-freeze">
    <h2>Add</h2>
    <div class="card">
      <div class="field">
        <label for="fzType">Type</label>
        <select id="fzType"></select>
      </div>
      <div class="field">
        <label for="fzName" id="fzNameLabel">What are you freezing?</label>
        <input id="fzName" placeholder="DuDtxR CASPEX g5.1" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="chips" id="fzFacets" style="margin-top:9px"></div>
      <div id="fzCustomFacets"></div>
      <p class="note" id="fzLine"></p>
      <div class="two">
        <div class="field">
          <label for="fzCount">How many vials?</label>
          <div class="stepper">
            <button type="button" id="fzMinus" aria-label="One fewer vial">−</button>
            <input id="fzCount" type="number" min="1" max="81" step="1" value="1" inputmode="numeric">
            <button type="button" id="fzPlus" aria-label="One more vial">+</button>
          </div>
        </div>
        <div class="field"><label for="fzUnit">Where</label><select id="fzUnit"></select></div>
      </div>
    </div>
    <div class="card" id="fzPlanCard"></div>
    <div class="card">
      <div class="two">
        <div class="field"><label for="fzPassage">Passage</label><input id="fzPassage" placeholder="p12 or p+3" autocomplete="off"></div>
        <div class="field"><label for="fzDate">Date frozen</label><input id="fzDate" type="date"></div>
      </div>
      <div class="field"><label for="fzNotes">Notes</label><input id="fzNotes" placeholder="myco -" autocomplete="off"></div>
      <div class="row"><button class="primary" id="fzGo">Put them in</button></div>
      <p class="note" id="fzWhyNot"></p>
    </div>
  </section>

  <section class="screen" id="s-boxes">
    <h2>Boxes</h2>
    <div class="card" id="bxQuickAdd" hidden></div>
    <div class="card">
      <div class="field" id="bxOwnerField" hidden><label for="bxOwner">Whose</label><select id="bxOwner"></select></div>
      <div class="field"><label for="bxUnit">Where</label><select id="bxUnit"></select></div>
      <div id="bxPath"></div>
      <div class="note" id="bxWhere"></div>
      <div id="bxGrid"></div>
      <div class="occ" id="bxOcc"></div>
      <div class="bar"><i id="bxBar"></i></div>
    </div>

<script src="xlsx.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  "use strict";
  var E = window.CellStocksEngine;
  var X = window.XlsxLite;

  // This app's own storage, all of it. Nothing here is shared with anything else on
  // the host: its own token, its own device name, its own theme, its own offline
  // copy. That costs pasting a token once more on each device, and buys the app
  // being genuinely separate rather than separate-looking.
  var LS = { token:"cst_token", device:"cst_device", theme:"cst_theme", cachePrefix:"cst_cache:", cfg:"cst_cfg",
             workerUrl:"cst_worker_url", workerToken:"cst_worker_token", workerUser:"cst_worker_user" };
  var LEGACY_DATA_PATH = "cellstocks/cellstocks.json";
  var LEGACY_XLSX_PATH = "cellstocks/cell-stocks.xlsx";
  var DATA_PREFIX = "cellstocks/data/";
  // The lab's own structure -- one freezer tree shared by everyone, admin-writable
  // only, and deliberately outside DATA_PREFIX so it can never collide with a member
  // named "_storage" (the worker's name rule allows an underscore).
  var LAB_STORAGE_PATH = "cellstocks/lab-storage.json";
  // The classification rules are the lab's too, at Umut's word: every account used to
  // keep its own copy and they had drifted apart, so the same cell name read differently
  // depending on whose screen you were on. One file, one answer.
  var LAB_RULES_PATH = "cellstocks/lab-rules.json";
  // Uploaded folder icons: committed under the repo path, displayed relative to the
  // app (which is served from /cellstocks/), and stored in the JSON as a bare file
  // name so neither path is baked into the data.
  var ICON_PREFIX = "cellstocks/icons/";
  var ICON_SRC_PREFIX = "icons/";
  // Who the nightly layout export is mailed to. Lab-wide, admin-only, and a committed
  // file rather than a Worker setting, because the thing that sends the mail reads the
  // repository and never logs in.
  var RECIPIENTS_PATH = "cellstocks/exports/recipients.json";

  // Where the inventory is read from. On <owner>.github.io it is read straight out of
  // the address, which is how this app has always found its own repository. Served from
  // anywhere else -- its own Cloudflare address, which is the point of not having a
  // GitHub username in the URL -- there is nothing in the address to read, so the lab's
  // repository is named here instead. Either is overridden by an explicit cst_cfg, which
  // is what Settings → Connect writes and what a different lab would set.
  var DEFAULT_REPO = { owner: "ucagiral", repo: "cagiral-schedule", branch: "main" };

  function resolveConfig(){
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(LS.cfg) || "null"); } catch(e){}
    if (stored && stored.owner && stored.repo) return stored;
    var host = location.hostname || "";
    var m = host.match(/^([^.]+)\.github\.io$/i);
    var seg = location.pathname.split("/").filter(Boolean);
    if (m) return { owner: m[1], repo: seg.length ? seg[0] : (m[1] + ".github.io"), branch: "main" };
    return { owner: DEFAULT_REPO.owner, repo: DEFAULT_REPO.repo, branch: DEFAULT_REPO.branch };
  }
  var CFG = resolveConfig();
  var REPO = CFG.owner ? CFG.owner + "/" + CFG.repo : null;
  var API = REPO ? "https://api.github.com/repos/" + REPO : null;

  function getToken(){ try { return localStorage.getItem(LS.token) || null; } catch(e){ return null; } }
  function getDevice(){ try { return localStorage.getItem(LS.device) || "unknown device"; } catch(e){ return "unknown device"; } }

  // ---- worker auth (lab-wide login) -----------------------------------------------
  // Additive, alongside the GitHub-token flow above: whichever is present makes
  // canWrite() true. Reads never need the worker (the repo is public, so an
  // unauthenticated raw fetch always works) -- only a write needs an opinion about who
  // is allowed to make it, so only save() and the login/logout calls below ever talk
  // to the worker. See cellstocks-worker/README.md for what it does and why.
  // Where the backend is. Stored per device, because it is a device setting and always
  // has been -- but when the app is being served BY that backend (its own Worker
  // address, which is now the normal way in), the answer is simply "here". Typing the
  // URL into the login gate stops being a step, and the whole class of "the lab changed
  // its Cloudflare subdomain and everyone's saved URL went dead" stops existing.
  //
  // Only the GitHub Pages copy still has to be told, since there the page and the
  // backend genuinely are two different hosts.
  function servedByWorker(){ return !/\.github\.io$/i.test(location.hostname || ""); }
  function getWorkerUrl(){
    try {
      var stored = localStorage.getItem(LS.workerUrl);
      if (stored) return stored;
    } catch(e){}
    return servedByWorker() ? location.origin : null;
  }
  function getWorkerToken(){ try { return localStorage.getItem(LS.workerToken) || null; } catch(e){ return null; } }
  function getWorkerUser(){ try { return JSON.parse(localStorage.getItem(LS.workerUser) || "null"); } catch(e){ return null; } }
  function workerBase(url){ return String(url || "").replace(/\/+$/, ""); }

  // ---- admin ------------------------------------------------------------------------
  // Admin never impersonates a member to see or change their boxes (that mechanism --
  // "act as", pointing this account's own screens at someone else's file -- is gone).
  // Admin sees every member's inventory merged, read-only, on Find/Boxes/Review/Log
  // (see renderMergedByOwner() and each screen's own admin branch), and makes any actual
  // change through the admin-only "Manage a box" tool, which always writes to the real
  // member's own file directly. effectiveIdentity() is just whoever is logged in --
  // admin's own file, which normally has nothing in it, same as anyone else's.
  function isAdminUser(){ var wu = getWorkerUser(); return !!wu && wu.role === "admin"; }
  // The PI reads the lab and writes none of it: no inventory of their own (so no Add tab
  // and nothing to save), no admin tools, but every screen that shows other people's
  // boxes shows them the whole lab -- the same merged, read-only path admin already uses
  // (see ADMIN_MERGED and ensureLabCache). The Worker enforces the "writes nothing" half
  // independently in canWrite(), rather than trusting this file.
  function isPiUser(){ var wu = getWorkerUser(); return !!wu && wu.role === "pi"; }
  function canSeeWholeLab(){ return isAdminUser() || isPiUser(); }
  function hasOwnInventory(){ return !isAdminUser() && !isPiUser(); }
  function effectiveIdentity(){
    var u = getWorkerUser();
    return u ? u.name : null;
  }

  function dataPath(){
    var name = effectiveIdentity();
    return name ? DATA_PREFIX + name.toLowerCase() + ".json" : LEGACY_DATA_PATH;
  }
  function xlsxPath(){
    var name = effectiveIdentity();
    return name ? DATA_PREFIX + name.toLowerCase() + ".xlsx" : LEGACY_XLSX_PATH;
  }

  async function workerFetch(path, opts){
    var url = workerBase(getWorkerUrl()) + path;
    var headers = Object.assign({ "Content-Type":"application/json" }, (opts && opts.headers) || {});
    var r = await fetch(url, Object.assign({}, opts || {}, { headers: headers }));
    var body = {};
    try { body = await r.json(); } catch(e){}
    if (!r.ok){
      var err = new Error(body.error || ("Worker said " + r.status));
      err.status = r.status;
      throw err;
    }
    return body;
  }

  async function workerLogin(url, name, password){
    var base = workerBase(url);
    var res = await fetch(base + "/login", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:name, password:password })
    });
    var body = {};
    try { body = await res.json(); } catch(e){}
    if (!res.ok) throw new Error(body.error || ("Worker said " + res.status));
    try {
      localStorage.setItem(LS.workerUrl, base);
      localStorage.setItem(LS.workerToken, body.token);
      localStorage.setItem(LS.workerUser, JSON.stringify(body.user));
    } catch(e){}
  }

  async function workerLogout(){
    var token = getWorkerToken();
    if (token){
      try { await workerFetch("/logout", { method:"POST", headers:{ Authorization:"Bearer " + token } }); } catch(e){}
    }
    try { localStorage.removeItem(LS.workerToken); localStorage.removeItem(LS.workerUser); } catch(e){}
    // Nothing about the account that was just logged out should linger on screen while this
    // device sits read-only waiting for the next login.
    state = E.blankState();
  }

  async function workerCommit(files, message){
    return workerFetch("/commit", {
      method:"POST",
      headers:{ Authorization:"Bearer " + getWorkerToken() },
      body: JSON.stringify({ files:files, message:message })
    });
  }

  function canWrite(){ return !!(getWorkerToken() && getWorkerUrl()) || !!(getToken() && API); }

  // A brand-new worker login with nothing imported yet. Scoped to worker auth only --
  // the classic GitHub-token flow already has its own long-standing empty-state message
  // (Settings -> Stock: "Nothing imported yet"), so this isn't shown twice. Never true for
  // admin: their own file is normally empty by design (they have no inventory of their
  // own -- see the Admin tab's "Manage a box" instead), not a fresh account to prompt an
  // import into.
  function isFreshAccount(){
    if (!hasOwnInventory() || !effectiveIdentity()) return false;
    if ((state.vials || []).length) return false;
    // The freezer belongs to the whole lab now, so somebody else's boxes standing in
    // the shared tree say nothing about whether this account has anything of its own.
    var me = String(effectiveIdentity()).toLowerCase();
    var mine = 0;
    E.eachBox(state, function(box){ if ((box.owner || "").toLowerCase() === me) mine++; });
    return !mine;
  }
  function ghHeaders(){
    var h = { "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
    var t = getToken();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }
  function rawURL(path){
    return "https://raw.githubusercontent.com/" + REPO + "/" + (CFG.branch||"main") + "/" + path + "?t=" + Date.now();
  }

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function esc(s){
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); return node; }
  function setStatus(text, cls){ $("status").textContent = text; $("status").className = cls || ""; }

  var bannerTimer = null;
  function showBanner(html, actions){
    var b = $("banner");
    b.innerHTML = html;
    (actions||[]).forEach(function(a){
      var btn = el("button", null, a.label);
      btn.onclick = a.onClick;
      b.appendChild(btn);
    });
    b.classList.add("show");
    clearTimeout(bannerTimer);
    if (!actions || !actions.length) bannerTimer = setTimeout(hideBanner, 9000);
  }
  function hideBanner(){ $("banner").classList.remove("show"); }

  // Shared wording for a genuine field-level conflict mergeInventories reports (see
  // engine.js): two sessions edited the SAME field of the SAME vial, to two different
  // things, since they last agreed with the server. Local always wins that tie (same
  // direction the whole-vial rule already took before field-level merging existed), so
  // this is never a blocker -- just the one place it has to be said out loud rather than
  // resolved silently. Shared by save() and load()'s dirty-reopen branch so the wording
  // lives in exactly one place.
  function describeConflicts(conflicts){
    if (!conflicts || !conflicts.length) return null;
    var first = conflicts[0];
    var fieldNames = first.fields.map(function(f){ return f.field; }).join(" and ");
    var verb = first.fields.length > 1 ? "were" : "was";
    var html = esc(first.name) + ": " + fieldNames + " " + verb + " edited on both sides — kept yours, not theirs.";
    if (conflicts.length > 1){
      html += " (and " + (conflicts.length - 1) + " more vial(s) — see console)";
    }
    return { html: html };
  }

  // labCache.failed is populated by ensureLabCache() (called from inside this file's own
  // dependentFiles()) -- read it, and only it, right after a commit that went through
  // dependentFiles(), before the caller resets it below. A member it lists was never
  // actually checked, so their workbook may now be stale; the structural change itself
  // still went through, because refusing to rename a tank over someone else's workbook
  // being unreachable would be a worse trade than saying so and moving on.
  function workbookRefreshCaveat(){
    if (!labCache.failed || !labCache.failed.length) return "";
    return " (couldn't reach GitHub to check " +
      (labCache.failed.length === 1 ? esc(labCache.failed[0]) + "'s workbook" :
       labCache.failed.length + " members' workbooks") +
      " just now — it'll catch up next time the tree or rules change.)";
  }

  // commitLabStorage()/commitLabRules() are called from a dozen small dialogs
  // (addBoxDialog, rename/move/delete, handoff, the rules editor...), each of which shows
  // its own "done" banner immediately after awaiting the commit -- on the same single
  // #banner element this uses. A caveat shown synchronously here would just be overwritten
  // a line later by whichever of those runs next. Deferred one tick, it always shows
  // *after* that banner instead, so the rarer, more important message is the one left on
  // screen rather than the routine one silently winning the race.
  function showWorkbookRefreshCaveatIfAny(){
    var caveat = workbookRefreshCaveat();
    if (!caveat) return;
    setTimeout(function(){
      showBanner("Saved." + caveat, [{ label:"Got it", onClick: hideBanner }]);
    }, 0);
  }

  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str), out = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }
  function base64ToUtf8(b64){
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function bytesToBase64(bytes){
    var out = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }

  // =====================================================================
  // State
  // =====================================================================

  var state = E.blankState();
  var dirty = false;
  // The last copy of this account's own file this device is actually known to have read
  // from the server -- mergeInventories' three-way ancestor. Kept alongside `state` in the
  // cache (see cacheSave/cacheLoad) so it survives a reload, and refreshed every time
  // fetchOwnFileText() succeeds, in both load() and save().
  var syncedState = null;
  var lastWithdrawal = null;     // for the 10-second undo in the status line

  // Set for the exact duration of building one member's section inside a merged,
  // admin-only view of Find/Boxes/Review/Log (see renderMergedByOwner below) -- every
  // button these screens create checks it, so nothing rendered while it's true can ever
  // trigger a write. It is always false again before control returns to the browser's
  // event loop, so a click can never observe it true.
  var ADMIN_MERGED = false;

  // Builds Review's or Log's whole screen for admin: every member with something to
  // show gets a heading and their own section, built by swapping the real, module-level
  // `state` to that member's own real data for exactly as long as perOwnerFn runs --
  // never a synthetic combined state, so each member's own rules and ids are used
  // correctly. perOwnerFn(container) returns true if it drew anything.
  function renderMergedByOwner(container, rerenderFn, perOwnerFn, emptyMessage){
    if (!labCache.members){
      container.appendChild(el("div", "empty", "Loading the lab…"));
      ensureLabCache().then(rerenderFn);
      return;
    }
    var real = state;
    ADMIN_MERGED = true;
    var any = false;
    labCache.members.slice().sort().forEach(function(name){
      var s = labCache.data[name];
      if (!s) return;
      state = s;
      var section = el("div");
      var wrote;
      try { wrote = perOwnerFn(section); } finally { state = real; }
      if (wrote){
        any = true;
        var head = el("div", null, name);
        head.style.cssText = "font-weight:700;font-size:15px;margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--border);";
        container.appendChild(head);
        container.appendChild(section);
      }
    });
    ADMIN_MERGED = false;
    if (!any) container.appendChild(el("div", "empty", emptyMessage));
  }

  // One device can log into more than one worker account over time (an admin trying out a
  // teammate's login, a shared lab laptop). The offline cache has to be keyed per account, or a
  // network hiccup after switching accounts would silently hand back whoever logged in earlier.
  function cacheKey(){
    var name = effectiveIdentity();
    return LS.cachePrefix + (name ? name.toLowerCase() : "legacy");
  }
  // `dirty` travels with the cached copy. It used to live only in memory, and that is how
  // two vials were lost: they were entered, the save was refused, the app was closed, and
  // on the next open cacheLoad() restored them into `state` -- then load() replaced the
  // whole thing with the committed copy and cacheSave() wrote that over the cache too.
  // Nothing said anything. A copy that has never been committed has to be recognisable as
  // one after the app has been closed, or it is not really kept on the device at all.
  function cacheSave(){
    try { localStorage.setItem(cacheKey(), JSON.stringify({ at: Date.now(), state: state, dirty: dirty, synced: syncedState })); } catch(e){}
  }
  function cacheLoad(){
    try {
      var c = JSON.parse(localStorage.getItem(cacheKey()) || "null");
      if (c && c.state){
        state = E.mergeDefaults(c.state); dirty = !!c.dirty;
        syncedState = c.synced ? E.mergeDefaults(c.synced) : null;
        return c.at;
      }
    } catch(e){}
    return null;
  }

  // The account's own file, straight from GitHub -- shared by load() (always) and save()
  // (right before every commit, see below). Extracted so both read it the exact same way
  // rather than save() growing a second, maybe-diverging copy of this branching.
  async function fetchOwnFileText(){
    var text = null;
    // A worker login never needs the token-authenticated read below -- the repo is
    // public, so an unauthenticated raw fetch of the account's own data path always
    // works. Only save() ever talks to the worker.
    if (getToken()){
      var r = await fetch(API + "/contents/" + LEGACY_DATA_PATH + "?ref=" + encodeURIComponent(CFG.branch||"main"),
                          { headers: ghHeaders(), cache:"no-store" });
      if (r.status === 404) text = null;
      else if (!r.ok) throw new Error("GitHub said " + r.status);
      else { var j = await r.json(); text = base64ToUtf8(j.content || ""); }
    } else {
      var resp = await fetch(rawURL(dataPath()), { cache:"no-store" });
      text = resp.ok ? await resp.text() : null;
    }
    return text;
  }

  async function load(){
    if (!REPO){
      setStatus("Open from GitHub Pages", "error");
      showBanner("This app works out which repository it belongs to from its own address, so it has to be " +
                 "opened from GitHub Pages rather than from a file on disk.");
      return;
    }
    try {
      var text = await fetchOwnFileText();
      // A miss (404, or no token/legacy file yet) means this account has nothing saved yet --
      // that must render as a blank inventory, never as whatever the previously-active account
      // (or a stale in-memory state left over from before a worker login/logout) happened to be.
      var own = (text !== null && text !== undefined) ? E.mergeDefaults(JSON.parse(text)) : E.blankState();
      // The ancestor for the dirty-merge below, if this reopen turns out to be a dirty
      // one: this device's last known-synced copy from BEFORE this app-open (set by
      // cacheLoad() at boot, or by an earlier load()/save() in this same tab) -- captured
      // here because the very next line overwrites syncedState with what was just
      // fetched, which is the ancestor for the NEXT save, not for reconciling edits made
      // before this fetch happened.
      var priorSynced = syncedState;
      // This is now the last copy we know for a fact the server actually holds --
      // save()'s ancestor for the next reconciliation, whichever branch below runs.
      syncedState = own;
      // Whether this account has a committed inventory file at all, which is not the
      // same question as whether it is supposed to have one: admin has no inventory by
      // role, yet cellstocks/data/admin.json exists from before that rule and carries a
      // generated workbook that still has to be kept in step with the shared tree.
      ownFileExists = (text !== null && text !== undefined);
      // The freezer and the rules are the lab's, not this account's: both come from
      // their own files and are hydrated onto state.storage and state.rules so every
      // screen keeps reading them exactly where it always did. slim() takes them back
      // off again before this account's file is saved.
      await ensureLabFiles();
      // Work this device never managed to commit is not overwritten by what is on the
      // server -- it is merged with it, by vial id, keeping both sides. Ids are minted
      // per device and never reused, so a union cannot invent or lose a tube; a slot two
      // devices both claimed comes back as a validate() error rather than one silently
      // winning. The freezer tree and the rules always come from the shared files: they
      // are the lab's, not this device's, and they were never the unsaved part.
      if (dirty){
        var merged = E.mergeInventories(own, state, priorSynced);
        state = hydrate(merged.state, effectiveIdentity());
        cacheSave();
        setStatus("Not saved yet", "error");
        if (merged.conflicts && merged.conflicts.length){
          console.warn("cell stocks: field-level merge conflicts", merged.conflicts);
        }
        if (merged.kept || (merged.conflicts && merged.conflicts.length)){
          var cd = describeConflicts(merged.conflicts);
          showBanner((merged.kept ? merged.kept + " change(s) on this device had not been saved. They are still here" +
                       (merged.added ? ", alongside " + merged.added + " from elsewhere" : "") +
                       " — saving again now." : "") +
                     (cd ? (merged.kept ? " " : "") + cd.html : ""),
                     [{ label:"Save now", onClick: function(){ save("Save work this device had kept"); } }]);
        }
        // Retried on its own as well as offered, because the reason it failed the first
        // time (a branch that had moved, a phone that woke with no signal) is usually
        // gone by the time the app is opened again.
        save("Save work this device had kept");
        renderAll();
        return;
      }
      state = hydrate(own, effectiveIdentity());
      cacheSave();
      setStatus(canWrite() ? "Ready" : "Read-only", "");
      if (!canWrite()){
        showBanner("Read-only: nothing can be frozen or taken out until this device is connected. " +
                   "Log in, or add a GitHub token, under Settings → Connect.");
      } else if (isFreshAccount()){
        // A worker login with no file yet (text stayed null, a 404) or one that loaded
        // an empty inventory look the same to whoever is looking at the screen -- both
        // just mean "nothing here to import into yet". importSheet() builds its own
        // boxes straight from the spreadsheet's own box column (see engine.js), so
        // there is nothing to set up by hand first unless someone wants to.
        var idName = effectiveIdentity();
        showBanner("Welcome" + (idName ? ", " + esc(idName) : "") + " — nothing imported yet.",
          [{ label:"Import a spreadsheet", onClick: function(){ hideBanner(); go("settings"); openImport(); } }]);
      }
    } catch(err){
      var at = cacheLoad();
      setStatus("Offline", "error");
      showBanner("Couldn't reach GitHub — showing the last copy this device downloaded" +
                 (at ? " (" + esc(new Date(at).toLocaleString()) + ")" : "") +
                 ". Nothing can be saved until it's back.");
    }
    renderAll();
  }

  // =====================================================================
  // Saving -- the JSON and the workbook, in ONE commit
  //
  // The .xlsx is generated from the JSON every time, so the two can never drift.
  // That is also why this uses the git data API rather than the contents API: two
  // files have to land together, or there is a moment where the workbook describes
  // an inventory that no longer exists.
  // =====================================================================

  async function gh(path, opts){
    var r = await fetch(API + path, Object.assign({ headers: ghHeaders() }, opts || {}));
    if (!r.ok){
      var body = "";
      try { body = (await r.json()).message || ""; } catch(e){}
      var err = new Error("GitHub " + r.status + (body ? ": " + body : ""));
      err.status = r.status;
      throw err;
    }
    return r.json();
  }

  async function commitFiles(files, message){
    var branch = CFG.branch || "main";
    var ref = await gh("/git/ref/heads/" + branch);
    var baseSha = ref.object.sha;
    var baseCommit = await gh("/git/commits/" + baseSha);
    var tree = [];
    for (var i = 0; i < files.length; i++){
      var f = files[i];
      var blob = await gh("/git/blobs", { method:"POST",
        body: JSON.stringify(f.base64 ? { content:f.base64, encoding:"base64" } : { content:f.text, encoding:"utf-8" }) });
      tree.push({ path:f.path, mode:"100644", type:"blob", sha:blob.sha });
    }
    var newTree = await gh("/git/trees", { method:"POST",
      body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree: tree }) });
    var commit = await gh("/git/commits", { method:"POST",
      body: JSON.stringify({ message: message, tree: newTree.sha, parents: [baseSha] }) });
    await gh("/git/refs/heads/" + branch, { method:"PATCH", body: JSON.stringify({ sha: commit.sha }) });
    return commit.sha;
  }

  // Deflated, not stored: the same workbook is eight times larger uncompressed and
  // it is uploaded on every save.
  function workbookBytes(){ return X.writeWorkbookAsync(E.vialsToSheets(state)); }

  var saveTimer = null;
  // ---- the lab's shared structure ----
  //
  // One file for the whole lab (LAB_STORAGE_PATH), read by everyone straight from
  // GitHub like every other read in this app, written only by admin through the
  // worker. Held here so a save can put it back on the state after a reload and so
  // the Structure screen has something to edit.
  var labStorage = E.blankStorage();
  var labRules = E.mergeRulesDefaults(null);
  // Whether the lab's structure has been read this session at all. It has to be tracked
  // rather than inferred from labStorage being empty, because **empty is a real answer**:
  // an admin who has just deleted the last freezer has an empty tree, and treating that
  // as "not loaded yet" sends the app back to raw.githubusercontent -- which serves the
  // previous version for a while after a commit. That is what made deleted freezers keep
  // coming back: delete the last one, the tree reads as empty, the app "reloads" it from
  // a stale copy, both freezers are on screen again, and the next delete writes one of
  // them back. Five rounds of it are in this file's git history.
  var labStorageLoaded = false;
  var labRulesLoaded = false;
  // Who the daily mail goes to and when. Cached for the same reason the tree is: after a
  // commit, what we just wrote is the freshest copy there is, and re-reading it from
  // raw.githubusercontent gets the PREVIOUS version for a while afterwards. Umut hit
  // exactly that -- he removed an address and set the time, and the next save merged his
  // change onto the stale copy and wrote his old time back. Same bug as the freezers that
  // kept coming back; same fix.
  var mailSettings = null;
  var ownFileExists = false;

  async function fetchLabStorage(){
    try {
      var resp = await fetch(rawURL(LAB_STORAGE_PATH), { cache:"no-store" });
      if (!resp.ok) return E.blankStorage();
      return E.mergeStorageDefaults(JSON.parse(await resp.text()));
    } catch(err){
      // A lab with no structure file yet is a lab with no freezers yet, not an error:
      // admin adds the first one from the Structure screen.
      return E.blankStorage();
    }
  }

  async function fetchLabRules(){
    try {
      var resp = await fetch(rawURL(LAB_RULES_PATH), { cache:"no-store" });
      if (!resp.ok) return E.mergeRulesDefaults(null);
      return E.mergeRulesDefaults(JSON.parse(await resp.text()));
    } catch(err){
      // A lab with no rules file yet reads names with the built-in defaults, which is
      // what every account started from anyway.
      return E.mergeRulesDefaults(null);
    }
  }

  // Both shared files, in one place, so no caller has to remember there are two.
  async function ensureLabFiles(){
    if (!labStorageLoaded){ labStorage = await fetchLabStorage(); labStorageLoaded = true; }
    if (!labRulesLoaded){ labRules = await fetchLabRules(); labRulesLoaded = true; }
  }

  // A member's own file plus everything the lab shares. Every screen expects a state to
  // be all three put together.
  function hydrate(own, name){
    return E.hydrateRules(E.hydrateStorage(own, labStorage, name), labRules);
  }

  // The workbook spells a location out by name -- the vials sheet reads "-80 °C Freezer",
  // "Rack 1", "DUZENLE", "A1", and there is a whole `storage` sheet describing the tree.
  // So renaming a freezer, a rack or a box on the Structure screen makes every member's
  // .xlsx wrong even though not one vial moved, and even for a member who owns nothing in
  // the branch that was renamed. The workbook is generated from the inventory, so it has
  // to travel in the same commit as the change that invalidates it; committing the tree
  // alone left the repository inconsistent, which is what the CI workbook check caught.
  function sheetsText(hydrated){
    return JSON.stringify(E.vialsToSheets(hydrated).map(function(sh){ return [sh.name, sh.rows]; }));
  }

  // Everything else in the repository that this change to the tree makes wrong: each
  // affected member's workbook, and each affected member's own .json when the vials in
  // it remember a route that has just changed.
  //
  // Both travel in the SAME commit as the tree. A vial stores its whole path -- Umut's
  // call -- so a move or a rename leaves every vial under it describing a shelf that no
  // longer exists; doing that in a follow-up commit means any failure in between leaves
  // the repository in exactly the half-finished state validate() complains about.
  async function dependentFiles(nextStorage, nextRules){
    // Every member's workbook carries a storage sheet describing the WHOLE shared tree,
    // so a rename, a new box, or an import adding several at once can leave anybody's
    // already-committed workbook wrong -- not just the boxes that moved, and not only
    // when admin is the one making the change. "Who's affected" is always everyone in
    // the lab; it was once "everyone, but only if I'm admin", which is how a member
    // adding their own box (an everyday action, per the worker's own canWrite comment)
    // silently left every other member's workbook stale.
    if (!labCache.members) await ensureLabCache();
    var admin = isAdminUser();
    var me = (effectiveIdentity() || "").toLowerCase();
    var owners = (labCache.members || []).slice();
    // labCache.members is everyone *else* (ensureLabCache excludes the caller's own
    // name), so the caller's own file is added back explicitly. Admin has no inventory
    // by role, but cellstocks/data/admin.json exists from before that rule and still
    // needs refreshing if it is there -- hasOwnInventory() alone would miss it.
    var meHasFile = admin ? ownFileExists : hasOwnInventory();
    if (me && meHasFile && owners.indexOf(me) === -1) owners.push(me);
    var files = [];
    for (var i = 0; i < owners.length; i++){
      var name = owners[i];
      var own = (name === me) ? state : labCache.data[name];
      if (!own) continue;
      var after = E.hydrateRules(E.hydrateStorage(own, nextStorage, name), nextRules);
      var fixed = E.refreshPaths(after);
      after = fixed.state;
      // Only a rename or move can leave another vial's stored route naming a shelf that
      // no longer exists, and only admin's Structure screen can rename or move an
      // existing node -- a member adding a box or importing a sheet never touches one,
      // so there is nothing for either to fix in someone else's file. Writing another
      // member's .json is also not something the worker's canWrite() allows a member to
      // do at all; this mirrors that boundary rather than relying on it to reject a
      // write that should never have been attempted.
      if (fixed.touched && (name === me || admin)){
        files.push({ path: DATA_PREFIX + name + ".json", content: E.serialise(after) });
        if (name === me) state = after;
      }
      // The vials sheet spells every facet out, so a rule change rewrites a workbook
      // exactly as surely as a rename does -- and has to travel in the same commit.
      if (sheetsText(hydrate(own, name)) === sheetsText(after)) continue;
      var bytes = await X.writeWorkbookAsync(E.vialsToSheets(after));
      files.push({ path: DATA_PREFIX + name + ".xlsx", content: bytesToBase64(bytes), base64: true });
    }
    return files;
  }

  // The structure is not part of anybody's inventory, so it commits on its own -- plus
  // whatever the change makes stale in a member's files (see above).
  async function commitLabStorage(next, message){
    var files = [{ path: LAB_STORAGE_PATH, content: E.serialiseStorage(next) }]
      .concat(await dependentFiles(next, labRules));
    await workerCommit(files, message || "Update the lab's storage structure");
    labStorage = E.mergeStorageDefaults(next);
    labStorageLoaded = true;   // what was just written is the freshest copy there is
    // Every member's cached copy is now stale, including this session's own state.
    state = hydrate(state, effectiveIdentity());
    showWorkbookRefreshCaveatIfAny();
    labCache.members = null; labCache.data = {}; labCache.failed = [];
  }

  // The rules are shared, so editing one is a change to the whole lab's reading of every
  // name -- and every affected workbook goes in the same commit, the same as a rename.
  // A member may do this: adding the label for a cell everyone works with is exactly the
  // kind of thing Umut wanted shared rather than kept in one person's copy.
  async function commitLabRules(next, message){
    var files = [{ path: LAB_RULES_PATH, content: E.serialiseRules(next) }]
      .concat(await dependentFiles(labStorage, next));
    await workerCommit(files, message || "Update the lab's rules");
    labRules = E.mergeRulesDefaults(next);
    labRulesLoaded = true;
    state = hydrate(state, effectiveIdentity());
    showWorkbookRefreshCaveatIfAny();
    labCache.members = null; labCache.data = {}; labCache.failed = [];
  }

  // A box lives in the lab's shared file, so editing one is a read-modify-write of that
  // file rather than an edit to this account's own state. Re-reads first for the same
  // reason addBoxDialog does: somebody else may have touched the structure since this
  // screen was drawn.
  async function editLabBox(boxId, mutate, message){
    var fresh = await fetchLabStorage();
    var found = E.findBox(fresh, boxId);
    if (!found) throw new Error("that box is no longer in the lab's structure");
    mutate(found.box);
    await commitLabStorage(fresh, message);
  }

  function markDirty(message){
    dirty = true;
    cacheSave();
    renderNavBadge();
    if (!canWrite()){ setStatus("Not saved — read-only", "error"); return; }
    setStatus("Saving…", "saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ save(message || "Update cell stocks"); }, 900);
  }

  // Two edits close enough together used to start two overlapping save()s: the debounce
  // in markDirty only ever cancels a still-PENDING timer, not a save that already fired
  // and is mid-flight (a real cost on a slow phone connection, exactly what this app runs
  // on) -- a second edit 900ms later starts a second commit before the first's has
  // landed. Both eventually succeed (the worker's own retry sees to that), which is why
  // the inventory itself came through this correct every time it was checked -- but each
  // one reconciles against a server snapshot the OTHER is about to invalidate, so either
  // can lose its race against the other and surface "someone else saved first" for a
  // save that was never really about anyone but this same device. So at most one save()
  // actually talks to the network at a time; a call that arrives while one is already
  // running is remembered rather than launched, and runs once the current one is done --
  // covering every edit made in the meantime, including its own, since save() always
  // serialises whatever `state` currently holds rather than a snapshot taken at call time.
  var saveInFlight = false;
  var savePending = null;
  async function save(message){
    if (!canWrite()) return;
    clearTimeout(saveTimer);
    if (saveInFlight){
      savePending = message || savePending || "Update cell stocks";
      return;
    }
    saveInFlight = true;
    // A test-only counter, nothing else reads it: peak concurrency is otherwise
    // unobservable from outside, since two overlapping doSave() calls could each still
    // land a perfectly valid commit on their own -- the risk is in what they reconcile
    // against mid-flight, not in whether either one, alone, succeeds.
    try {
      window.__cstConcurrentSaves = (window.__cstConcurrentSaves || 0) + 1;
      window.__cstMaxConcurrentSaves = Math.max(window.__cstMaxConcurrentSaves || 0, window.__cstConcurrentSaves);
    } catch(e){ /* no window, or a security error -- fine either way */ }
    try {
      await doSave(message);
    } finally {
      saveInFlight = false;
      try { window.__cstConcurrentSaves = Math.max(0, (window.__cstConcurrentSaves || 1) - 1); } catch(e){}
      if (savePending !== null){
        var next = savePending;
        savePending = null;
        save(next);
      }
    }
  }

  async function doSave(message){
    // Reconcile with whatever is on the server right now before committing anything.
    // Without this, save() just serialised whatever this session's `state` happened to
    // hold -- fine for the tab that made the edit, but any tab/device whose own view
    // predates a change committed elsewhere (a suspended background tab, a second phone,
    // even the same tab between the visibilitychange refresh firing and it landing)
    // would silently overwrite that change the next time IT saved anything, however
    // unrelated -- an "Accept all" on Review's facet-drift list reported fixed, then
    // reappearing, was exactly this. mergeInventories already does the union; what it
    // needs here is syncedState as the three-way ancestor, or "local differs from
    // remote" reads as "this device edited it" for every vial the session is merely
    // carrying forward unchanged, not only the ones it actually touched.
    try {
      var remoteText = await fetchOwnFileText();
      if (remoteText !== null && remoteText !== undefined){
        var remote = E.mergeDefaults(JSON.parse(remoteText));
        var reconciled = E.mergeInventories(remote, state, syncedState);
        state = hydrate(reconciled.state, effectiveIdentity());
        // What we just read is now the freshest thing this device knows the server to
        // hold -- the ancestor for the next save, whether this one goes on to succeed
        // or not (a failed commit still means this read genuinely happened).
        syncedState = remote;
        cacheSave();
        // A genuine same-field, same-vial conflict: never blocks the save (this session's
        // edit always wins the tie, same direction the merge already took before it could
        // tell fields apart), but never silent either. console.warn carries the full
        // detail in case a later, unrelated banner overwrites this one before it's read.
        if (reconciled.conflicts && reconciled.conflicts.length){
          console.warn("cell stocks: field-level merge conflicts", reconciled.conflicts);
          var cd = describeConflicts(reconciled.conflicts);
          showBanner(cd.html, [{ label:"Got it", onClick: hideBanner }]);
        }
      }
    } catch(e){ /* offline, or the read failed -- fall back to committing this session's own copy */ }

    // Never commit a state that would put two vials in one slot. This is the one
    // invariant the whole app exists to hold, so it blocks the save rather than
    // showing a badge.
    var errors = E.errorsOnly(E.validate(state));
    if (errors.length){
      setStatus("Not saved", "error");
      // A vial whose box was deleted blocks every save, including the one that would fix
      // it, so the message has to say where the way out is instead of only what is wrong.
      var stuck = errors.filter(function(e){ return e.code === "unknown-box"; }).length;
      showBanner("Refusing to save, because the inventory would be wrong: " + esc(errors[0].message) +
                 (errors.length > 1 ? " (and " + (errors.length - 1) + " more — see Settings → Check it)" : "") +
                 (stuck ? " — the box was deleted from the freezer. Open <b>Review</b> to take " +
                          (stuck > 1 ? "those " + stuck + " vials" : "that vial") + " out and unblock saving." : ""));
      return;
    }

    setStatus("Saving…", "saving");
    try {
      state._meta = { savedBy: getDevice(), savedAt: new Date().toISOString() };
      var xlsxB64 = bytesToBase64(await workbookBytes());
      if (getWorkerUser()){
        await workerCommit([
          { path: dataPath(), content: E.serialise(state) },
          { path: xlsxPath(), content: xlsxB64, base64: true }
        ], message + " from " + getDevice());
      } else {
        await commitFiles([
          { path: LEGACY_DATA_PATH, text: E.serialise(state) },
          { path: LEGACY_XLSX_PATH, base64: xlsxB64 }
        ], message + " from " + getDevice());
      }
      dirty = false;
      cacheSave();
      setStatus("Saved", "saved");
      setTimeout(function(){ if ($("status").textContent === "Saved") setStatus("Ready", ""); }, 2500);
    } catch(err){
      setStatus("Not saved", "error");
      if (getWorkerUser() && (err.status === 401 || err.status === 403)){
        showBanner("The worker refused the write (" + err.status + "): " + esc(err.message) +
                   ". Try logging in again under Settings → Connect.");
      } else if (err.status === 401 || err.status === 403){
        showBanner("GitHub refused the write (" + err.status + "). The token may have expired, or it may not " +
                   "have <code>Contents: Read and write</code> for this repository.");
      } else if (err.status === 409 || err.status === 422){
        showBanner("Someone else saved first. Reload to take their copy — your change is still on this device.",
                   [{ label:"Reload theirs", onClick: function(){ location.reload(); } }]);
      } else {
        showBanner("Couldn't save: " + esc(err.message) + " Your change is kept on this device.");
      }
    }
  }

  // =====================================================================
  // Colour per line, hashed from the name -- the same trick the schedule app uses
  // for groups, so there is no palette to keep in sync with anything.
  // =====================================================================
  function hueFor(text){
    var h = 0, s = String(text || "");
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function tintFor(text){ return "hsl(" + hueFor(text) + " 62% 78%)"; }

  // Boxes are coloured by CELL, not by line. A row holds one kind of cell, so this
  // makes each row read as a single band and a stray vial obvious at a glance --
  // which is the whole reason the freezer is laid out that way.
  function originOf(vial){ return E.originOfVial(vial, state.rules); }
  function shortOrigin(o){
    if (o === E.NO_ORIGIN) return "?";
    var t = String(o).replace(/[^A-Za-z0-9]/g, "").slice(0, 3);
    return t || "?";
  }

  // =====================================================================
  // Find
  // =====================================================================

  var filter = {
    query: "", passageKind: "any", passageMin: null, passageMax: null,
    includeUnknownPassage: true, frozenFrom: null, frozenTo: null, includeUndated: true,
    unitId: null,
    // What the handles were bounded by last time. Without this, freezing a vial dated
    // today leaves the ceiling where it was and the new vial is silently filtered out
    // of the very search you would run to check it landed.
    bounds: null,
    searchInLab: false
  };

  // ---- search in lab: every other visible member's own inventory, read the same way
  // this account's own is (GitHub Contents API listing + a raw fetch per file), never
  // through the worker. Fetched once per session on first toggle-on and cached --
  // re-fetching on every keystroke would burn through GitHub's unauthenticated rate
  // limit for no reason, and a lab roster doesn't change mid-search.

  // The item type list (Cell, Plasmid, RNA...) is lab-wide, shared across every
  // account. Refreshed (not just fetched once) after adding a type or an attribute
  // name, since those changes should show up on this same device without a re-login.
  var typesCache = null;
  async function ensureTypesCache(){
    if (typesCache || !getWorkerUser()) return;
    try { typesCache = await workerFetch("/types", { headers:{ Authorization:"Bearer " + getWorkerToken() } }); }
    catch(e){ /* offline or not reachable yet -- callers fall back to just "Cell" */ }
  }
  function typeNames(){
    return (typesCache && typesCache.types && typesCache.types.map(function(t){ return t.name; })) || ["Cell"];
  }
  // Attribute names a type has been given before, lab-wide -- autocomplete suggestions
  // only, never a value and never shared with a different type (see cellstocks-worker's
  // config:types comment: two types independently ending up with the same attribute
  // name is fine and is not deduplicated across them).
  function attributesForType(typeName){
    var t = typesCache && typesCache.types && typesCache.types.filter(function(x){ return x.name === typeName; })[0];
    return (t && t.attributes) || [];
  }

  // Builds a dynamically-growing 2-column attribute/value table into `container`, for
  // one item type, seeded from `initial` ({ name: value }, e.g. a vial's existing
  // customFacets). Always ends with exactly one trailing blank row; typing into that
  // last row grows the table by one more, exactly like a spreadsheet -- Umut's own
  // description of how this should work. Returns a function that reads back the
  // current { name: value } map, blank rows dropped. New rows are appended, not
  // re-rendered from scratch, so typing in one row never steals focus from another
  // mid-keystroke.
  function buildAttributeTable(container, typeName, initial){
    clear(container);
    var rows = [];
    var datalist = document.createElement("datalist");
    datalist.id = "attrNames-" + Math.random().toString(36).slice(2);
    attributesForType(typeName).forEach(function(n){
      var o = document.createElement("option"); o.value = n; datalist.appendChild(o);
    });
    container.appendChild(datalist);

    function addRow(row){
      var index = rows.length;
      rows.push(row);
      var rowEl = el("div", "two");
      var nameInput = document.createElement("input");
      nameInput.placeholder = "attribute"; nameInput.value = row.name; nameInput.autocomplete = "off";
      nameInput.setAttribute("list", datalist.id);
      var valueInput = document.createElement("input");
      valueInput.placeholder = "value"; valueInput.value = row.value; valueInput.autocomplete = "off";
      function sync(){
        row.name = nameInput.value; row.value = valueInput.value;
        if (index === rows.length - 1 && (row.name.trim() || row.value.trim())) addRow({ name:"", value:"" });
      }
      nameInput.oninput = sync; valueInput.oninput = sync;
      rowEl.appendChild(nameInput); rowEl.appendChild(valueInput);
      container.appendChild(rowEl);
    }
    Object.keys(initial || {}).forEach(function(k){ addRow({ name:k, value: initial[k] }); });
    addRow({ name:"", value:"" });

    return function collect(){
      var out = {};
      rows.forEach(function(row){ if (row.name.trim()) out[row.name.trim()] = row.value.trim(); });
      return out;
    };
  }

  // Any new attribute name typed for a type is remembered lab-wide for next time --
  // fire-and-forget, additive on the worker (see routeAddType), refreshing typesCache
  // so this same device's own suggestions are current without a re-login.
  function rememberNewAttributes(typeName, facets){
    var known = attributesForType(typeName);
    Object.keys(facets || {}).forEach(function(name){
      if (known.indexOf(name) !== -1) return;
      workerFetch("/types", { method:"POST", headers:{ Authorization:"Bearer " + getWorkerToken() },
        body: JSON.stringify({ attribute:{ type:typeName, name:name } }) })
        .then(function(cfg){ typesCache = cfg; })
        .catch(function(){});
    });
  }

  var labCache = { members: null, data: {}, promise: null, failed: [] };

  // A plain fetch() has no built-in timeout -- a stalled connection (a flaky network,
  // a proxy or firewall that swallows the request rather than refusing it) leaves the
  // promise pending forever, and everything awaiting it along with it. ensureLabCache()
  // below is exactly that: the one place this app makes an unauthenticated request
  // straight to api.github.com/raw.githubusercontent.com with no server of its own to
  // blame if it hangs, so it is the one place a hang has no other guard against it.
  function fetchWithTimeout(url, ms){
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, ms);
    return fetch(url, ctrl ? { signal: ctrl.signal } : undefined).finally(function(){ clearTimeout(timer); });
  }

  // renderFilters(), renderBoxesBody() and renderMergedByOwner() all call this and then
  // re-render once it resolves -- and any of them can run again (another click, another
  // renderAll()) while the first call is still in flight. A caller-counted "loading"
  // flag used to guard only the real fetch, not the function itself: a second call made
  // while one was already running fell through to a bare `return`, which -- being an
  // async function -- still resolves its own promise on the next microtask. Every
  // caller's `.then(rerender)` fired from that, rerendering, which called this again,
  // which resolved trivially again -- a self-sustaining microtask loop pegging the CPU
  // at 100% with no network involved at all once it starts. Real regression: reproduced
  // locally by clicking two different screens while a slow admin login was still
  // resolving. The fix is for every caller to share the exact same in-flight promise
  // (cached in labCache.promise) instead of each one starting its own trivial retry.
  function ensureLabCache(){
    if (labCache.members) return Promise.resolve();
    if (labCache.promise) return labCache.promise;
    if (!REPO) return Promise.resolve();
    labCache.promise = (async function(){
      try {
        var idName = effectiveIdentity();
        var selfName = idName ? idName.toLowerCase() : null;
        var listing = await fetchWithTimeout("https://api.github.com/repos/" + REPO + "/contents/" + DATA_PREFIX.replace(/\/$/, ""), 10000)
          .then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
        var names = (Array.isArray(listing) ? listing : [])
          .map(function(entry){ return entry.name || ""; })
          .filter(function(n){ return /\.json$/.test(n); })
          .map(function(n){ return n.replace(/\.json$/, ""); })
          // Excludes whoever's file is already the "own" view -- the real logged-in
          // account -- and, structurally, any hidden admin account, which has no
          // cellstocks/data/*.json of its own to begin with (so for admin, nothing is
          // excluded here at all: every real member comes back).
          .filter(function(n){ return n !== selfName; });
        labCache.members = names;
        // A member's file holds only their vials now, so each one is hydrated with the
        // lab's shared structure and rules before anything renders it -- otherwise every
        // merged view would show vials with no box, no path and no occupancy.
        await ensureLabFiles();
        // A file that could not be read is remembered as such. It used to be swallowed
        // here and the member simply had no entry -- which every reader then took to mean
        // "no vials", because an absent entry and an empty one look identical. That is not
        // cosmetic: deleting a box counts the lab's vials out of exactly this cache, so a
        // member whose file failed to load counted as zero, the delete withdrew nothing,
        // and their vials were left pointing at a box that no longer existed -- which then
        // blocked every save that account tried to make. A file committed minutes earlier
        // is the likeliest one to fail, because raw.githubusercontent serves the previous
        // version (or none at all) for a while after a commit.
        //
        // 30s rather than fetchWithTimeout's usual budget elsewhere: this fetch is also
        // what dependentFiles() now depends on to know whose workbook a structural change
        // touches (see engine.js/dependentFiles), and a real phone connection genuinely
        // needs more than 10s for a file the size the largest member's now is (400+ KB) --
        // 10s was timing this out mid-transfer, not because nothing was coming back, which
        // silently dropped that member from every workbook-regenerating commit until CI
        // caught it hours later.
        labCache.failed = [];
        await Promise.all(names.map(function(name){
          return fetchWithTimeout(rawURL(DATA_PREFIX + name + ".json"), 30000)
            .then(function(r){ return r.ok ? r.text() : null; })
            .then(function(text){
              if (text) labCache.data[name] = hydrate(E.mergeDefaults(JSON.parse(text)), name);
              else labCache.failed.push(name);
            })
            .catch(function(){ labCache.failed.push(name); });
        }));
      } finally {
        labCache.promise = null;
      }
    })();
    return labCache.promise;
  }

  // The date slider is never remembered across a render -- every fresh look at Find
  // starts fully open, "All time" to the newest date there is, exactly the way Umut
  // asked: a lab-mate's vial (found via search-in-lab) must never be invisible just
  // because the slider was computed before anyone knew that date existed. Only the
  // passage slider still "follows" the data the way it always did -- that part was
  // never the complaint.
  function followExtents(x){
    var b = filter.bounds;
    if (b){
      ["absolute", "relative"].forEach(function(kind){
        if (filter.passageKind !== kind) return;
        if (filter.passageMin === b["min_" + kind]) filter.passageMin = x.passage[kind].min;
        if (filter.passageMax === b["max_" + kind]) filter.passageMax = x.passage[kind].max;
      });
    }
    filter.bounds = {
      min_absolute: x.passage.absolute.min, max_absolute: x.passage.absolute.max,
      min_relative: x.passage.relative.min, max_relative: x.passage.relative.max
    };
  }

  // Own data's extents, merged with every lab-mate's when "search in lab" is on --
  // otherwise the slider is computed from a range that never knew a lab-mate's older
  // or newer vial existed, and silently clips it out of the very search meant to find
  // it. Pure recombination of E.searchExtents() per state; no engine.js change needed.
  function combinedSearchExtents(){
    var x = E.searchExtents(state);
    if (!(filter.searchInLab || canSeeWholeLab()) || !labCache.members) return x;
    labCache.members.forEach(function(name){
      var other = labCache.data[name];
      if (!other) return;
      var ox = E.searchExtents(other);
      if (ox.frozen.min && (!x.frozen.min || ox.frozen.min < x.frozen.min)) x.frozen.min = ox.frozen.min;
