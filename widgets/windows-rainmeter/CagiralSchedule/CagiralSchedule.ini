; Cagiral Schedule — today, as a Rainmeter desktop skin.
;
; Install: https://www.rainmeter.net (free). Copy this whole "CagiralSchedule" folder into
; Documents\Rainmeter\Skins\, then Rainmeter's tray icon -> Manage -> Skins tab -> refresh
; the list -> select CagiralSchedule\CagiralSchedule.ini -> Load.
;
; MeasureFetch pulls claudeAgent.json straight from the public repo (no auth needed, the
; same read-only path any device without a save token already uses). MeasureParse is a Lua
; Script measure that decodes it (@Resources\Scripts\json.lua, a vendored MIT decoder --
; Lua 5.1, Rainmeter's bundled interpreter, has no native JSON support) and filters to
; today (@Resources\Scripts\parse.lua). MeterList just displays whatever text parse.lua
; produced -- no per-row colour here, since Rainmeter has no native way to colour
; individual lines of one dynamic-length String meter without a separate meter per row,
; which isn't practical for a list whose length changes day to day. Status is shown with a
; symbol prefix instead (see parse.lua) rather than colour.
;
; To change the refresh interval, edit UpdateRate below. To reposition/resize, edit
; [MeterBackground] and [MeterList]'s X/Y/W and the FontSize on MeterList.

[Rainmeter]
Update=60000
AccurateText=1

[Metadata]
Name=Cagiral Schedule
Author=Umut Cagiral
Information=Today's schedule, read live from github.com/ucagiral/cagiral-schedule
Version=1.0
License=Same license as the parent repository

[Variables]
AccentColor=37,99,235,255
MutedColor=154,161,172,255
BgColor=28,31,38,225

[MeasureFetch]
Measure=WebParser
URL=https://raw.githubusercontent.com/ucagiral/cagiral-schedule/main/claudeAgent.json
; Rainmeter's documented pattern for capturing an entire raw response as one string.
RegExp=(?siU)^(.*)$
StringIndex=1
UpdateRate=300
; "Update" (bare, no parens) tells Rainmeter to run MeasureParse's normal update cycle,
; which is what actually invokes the Lua Update() function below -- not a direct call to
; a same-named Lua function, which is a different (and here, unneeded) CommandMeasure form.
FinishAction=[!CommandMeasure MeasureParse "Update"]

[MeasureParse]
Measure=Script
ScriptFile=#@#Scripts\parse.lua
UpdateDivider=-1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,280,420,10 | Fill Color #BgColor# | StrokeWidth 0
UpdateDivider=-1

[MeterHeader]
Meter=String
MeterStyle=StyleBase
X=16
Y=14
FontSize=13
FontWeight=650
Text=Today
FontColor=255,255,255,255

[MeterList]
Meter=String
MeterStyle=StyleBase
X=16
Y=38
W=248
H=370
FontSize=11
LineSpacing=4
ClipString=1
Text=[MeasureParse]
FontColor=225,227,230,255

[StyleBase]
FontFace=Segoe UI
AntiAlias=1
StringAlign=Left
StringStyle=Normal
